(function(){
 const seen={};
 for(let k=0;k<LIB.length;k++){
  const r=LIB[k];
  if(!r.s||typeof r.i!=='number'||!r.w||!r.lv) throw new Error('lib broken @'+k);
  if(seen[r.s]) throw new Error('lib dup @'+k);
  seen[r.s]=1;
  if(r.s.length<4||r.s.length>12) throw new Error('lib len @'+k);
  if(r.i<0||r.i>=r.s.length) throw new Error('lib idx @'+k);
  if(!PAIRS[r.s[r.i]]||PAIRS[r.s[r.i]].indexOf(r.w)<0) throw new Error('lib pair @'+k+' '+r.s+' '+r.s[r.i]+'->'+r.w);
  for(let j=0;j<r.s.length;j++){ if(j!==r.i&&r.s[j]===r.w) throw new Error('lib twin @'+k); }
 }
})();
const NEED=15, TOTAL_TIME=60, WRONG_PEN=5;

/* ---- RNG（LCG 家族模板） ---- */
let RS=1;
function srand(seed){ RS=(seed>>>0)||1; }
function rnd(){ RS=(Math.imul(RS,1103515245)+12345)>>>0; return (RS>>>9)/8388608; }

/* ---- 状态 ---- */

const cv=$('cv'), ctx=cv.getContext('2d');
let S=null, G=null, flashT=0, flashMsg='', shakeT=0, circT=0, sndOn=false, AC=null;
let HIT={cells:[]};

function tierOf(st){ return st<3?1:(st<6?2:3); }
function pickIdx(t){
 let pool=LIB.map((_,k)=>k).filter(k=>!G.used.has(k)&&k!==G.idx&&LIB[k].lv===t);
 if(pool.length===0) pool=LIB.map((_,k)=>k).filter(k=>!G.used.has(k)&&k!==G.idx);
 if(pool.length===0) return -1;                    /* 穷尽交 deal 处理（clear 后重用须标 reused） */
 return pool[Math.floor(rnd()*pool.length)];
}
function deal(){
 const t=tierOf(S.streak);
 let nx=pickIdx(t);
 if(nx<0){ G.used.clear(); nx=pickIdx(t); G.reused=true; }   /* 全库尽重用=不计分（正常局不可达兜底） */
 else{ G.reused=G.used.has(nx); }
 G.idx=nx; G.used.add(nx); G.reveal=false; G.hitCell=-1;
}
function startRound(){ killFlash();

 G={idx:-1,used:new Set(),reveal:false,hitCell:-1,reused:false};
 deal(); updHUD();
}
function newGame(){ startRound(); }

/* ---- 音效（默认静音） ---- */
function ensureAC(){ if(!sndOn) return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function tone(f,t0,d,type,vol){ if(!AC) return; try{
 const o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'sine'; o.frequency.value=f;
 g.gain.setValueAtTime(0,AC.currentTime+t0);
 g.gain.linearRampToValueAtTime(vol||.12,AC.currentTime+t0+.012);
 g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t0+d);
 o.connect(g).connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d+.05);
}catch(e){} }
function snd(k){ if(!sndOn||!AC) return;
 if(k==='ok'){ tone(660,0,.09,'triangle',.14); tone(880,.07,.12,'triangle',.12); }
 else if(k==='sel'){ tone(520,0,.05,'square',.06); }
 else if(k==='win'){ tone(523,0,.14,'triangle',.14); tone(659,.12,.14,'triangle',.14); tone(784,.24,.22,'triangle',.15); }
 else if(k==='drum'){ tone(120,0,.16,'sine',.22); tone(78,.02,.2,'sine',.18); }
 else if(k==='tick'){ tone(940,0,.04,'square',.05); }
}

/* ---- 提示条 ---- */
let flashTimer=null;
function flash(m){ flashMsg=m; $('flashbar').textContent=m; $('flashbar').classList.add('show');
 flashT=1.6; if(flashTimer) clearTimeout(flashTimer);
 flashTimer=setTimeout(()=>{ $('flashbar').classList.remove('show'); flashTimer=null; },1600); }
function killFlash(){ if(flashTimer){ clearTimeout(flashTimer); flashTimer=null; } $('flashbar').classList.remove('show'); }

/* ---- 判定 ---- */
function pick(i){
 if(S.phase!=='play'||!G||G.reveal) return false;
 if(G.hitCell>=0) return false;                 /* 拿获展示期拒点 */
 if(i<0||i>=LIB[G.idx].s.length) return false;
 if(i===LIB[G.idx].i){                      /* 拿获真凶 */
  G.hitCell=i;
  S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak);
  const base=100+50*(LIB[G.idx].lv-1);
  const gain=Math.floor(base*(1+.5*Math.min(S.streak-1,6)));
  if(!G.reused) S.score+=gain;               /* 重用旧案不计分 */
  S.got++; circT=.5; snd('ok');
  flash(G.reused?('重温旧案 · 不计分'):('拿获归案 · +'+gain));
  if(S.got>=NEED){ S.bonus=500; S.score+=500; winGame(); updHUD(); return true; }
  setTimeout(()=>{ if(S&&G&&G.reveal===false&&G.hitCell===i&&S.got<NEED&&(S.phase==='play'||S.phase==='pause')){ deal(); } },600);
  updHUD(); return true;
 } else {                                    /* 点错：断连 −5s 揭正句 */
  S.streak=0; S.time=Math.max(0,S.time-WRONG_PEN); S.penN++;
  G.reveal=true; snd('drum'); shakeT=.45;
  const r=LIB[G.idx];
  flash('真凶是「'+r.s[r.i]+'」· −'+WRONG_PEN+'s');
  setTimeout(()=>{ if(S&&G&&G.reveal&&(S.phase==='play'||S.phase==='pause')){ deal(); } },1600);
  updHUD(); return true;
 }
}
function winGame(){ S.phase='win'; saveBestNow();
 $('overttl').textContent='神 捕';
 $('overscore').textContent=S.score;
 $('overstat').textContent='十五案归案 · 奖励 +'+(S.bonus||0)+' · 最长连 ×'+S.maxStreak;
 updHUD(); $('overlay').classList.remove('hide'); snd('win');
}
function gameOver(){ S.phase='over'; saveBestNow();
 $('overttl').textContent='收 工';
 $('overscore').textContent=S.score;
 $('overstat').textContent='拿获 '+S.got+'/'+NEED+' · 最长连 ×'+S.maxStreak;
 updHUD(); $('overlay').classList.remove('hide');
}
function saveBestNow(){ if(S&&S.score>S.best){ S.best=S.score; try{localStorage.setItem('g76_best',String(S.score));}catch(e){} } }
function onHidden(){ if(S&&(S.phase==='play')){ S.phase='pause'; $('pauselay').classList.remove('hide'); } saveBestNow(); }

/* ---- HUD ---- */
function updHUD(){
 $('scv').textContent=S.score; $('stv').textContent=S.streak;
 $('tmv').textContent=Math.ceil(S.time);
 const box=$('cubes');
 while(box.childElementCount>NEED) box.removeChild(box.lastChild);
 while(box.childElementCount<NEED){ const d=document.createElement('div'); d.className='cube'; box.appendChild(d); }
 const kids=box.children;
 for(let k=0;k<kids.length;k++) kids[k].className='cube'+(k<S.got?' on':'');
}

/* ---- 绘制 ---- */
function layout(){
 const r=LIB[G.idx], len=r.s.length;
 const cols=len<=6?len:Math.ceil(len/2);
 const cw=44, gap=8, rows=Math.ceil(len/cols);
 const totalW=cols*cw+(cols-1)*gap;
 const x0=(390-totalW)/2, y0=352-(rows*(cw+gap)-gap)/2+120;
 const cells=[]; let n=0;
 for(let row=0;row<rows;row++){
  const inRow=Math.min(cols,len-n);
  const rw=inRow*cw+(inRow-1)*gap;
  const rx=(390-rw)/2;
  for(let c=0;c<inRow;c++){ cells.push({x:rx+c*(cw+gap),y:y0+row*(cw+gap)}); n++; }
 }
 return {cells,cols,rows};
}
function draw(){
 ctx.clearRect(0,0,390,780);
 const shake=shakeT>0?(Math.sin(shakeT*60)*4*shakeT/.45):0;
 /* 底纹 */
 ctx.fillStyle='#221a11'; ctx.fillRect(0,0,390,780);
 ctx.strokeStyle='rgba(233,221,192,.04)'; ctx.lineWidth=1;
 for(let y=40;y<780;y+=46){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(390,y); ctx.stroke(); }
 if(!S||S.phase==='menu'){ drawMenuIdle(); return; }
 const r=LIB[G.idx];
 const {cells}=layout();
 /* 公文戳 */
 ctx.save(); ctx.translate(64,120); ctx.rotate(-.06);
 ctx.strokeStyle='rgba(192,57,43,.75)'; ctx.lineWidth=2; ctx.strokeRect(-42,-18,84,36);
 ctx.fillStyle='#c0392b'; ctx.font='800 13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
 ctx.fillText('第 '+(S.got+1)+' 案',0,1); ctx.restore();
 /* 告示纸卡（盖字格区） */
 const L=layout(); const maxY=Math.max.apply(null,L.cells.map(c=>c.y));
 const minY=L.cells[0].y;
 const cardY=minY-52, cardH=(maxY-minY)+44+52+26;
 ctx.save(); ctx.translate(shake,0);
 ctx.fillStyle='#e9ddc0';
 ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=14; ctx.shadowOffsetY=5;
 roundRect(20,cardY,350,cardH,10); ctx.fill();
 ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
 ctx.strokeStyle='#b39d72'; ctx.lineWidth=1.5; roundRect(20,cardY,350,cardH,10); ctx.stroke();
 ctx.strokeStyle='rgba(179,157,114,.4)'; ctx.lineWidth=.8; roundRect(26,cardY+6,338,cardH-12,7); ctx.stroke();
 /* 告示头行 */
 ctx.fillStyle='#7a6c52'; ctx.font='700 11px system-ui'; ctx.textAlign='center';
 ctx.fillText('缉 拿 错 字 逃 犯 · 归 案 有 赏',195,minY-30);
 /* 字格 */
 ctx.textAlign='center'; ctx.textBaseline='middle';
 for(let k=0;k<r.s.length;k++){
  const c=cells[k];
  const ch=r.s[k];
  const isCulprit=(k===r.i);
  const shown=G.reveal?ch:(isCulprit?r.w:ch);      /* 揭底=正句 */
  /* 格底 */
  ctx.fillStyle='rgba(44,36,24,.06)';
  roundRect(c.x+2,c.y+2,cw0,cw0,6); ctx.fill();
  ctx.strokeStyle='rgba(44,36,24,.16)'; ctx.lineWidth=1; roundRect(c.x+2,c.y+2,cw0,cw0,6); ctx.stroke();
  /* 字 */
  ctx.fillStyle='#2c2418'; ctx.font='800 26px system-ui';
  ctx.fillText(shown,c.x+2+cw0/2,c.y+2+cw0/2+1);
  /* 拿获朱圈 */
  if(isCulprit&&G.hitCell===r.i&&!G.reveal){
   ctx.save(); ctx.strokeStyle='rgba(192,57,43,.95)';
   ctx.lineWidth=3.5; ctx.beginPath();
   ctx.arc(c.x+2+cw0/2,c.y+2+cw0/2,25,0,Math.PI*2); ctx.stroke();
   ctx.fillStyle='#c0392b'; ctx.font='800 11px system-ui';
   ctx.fillText('拿获',c.x+2+cw0/2,c.y+2+cw0/2-32); ctx.restore();
  }
  /* 揭底：真凶位朱点标 */
  if(isCulprit&&G.reveal){
   ctx.strokeStyle='#c0392b'; ctx.lineWidth=3;
   ctx.beginPath(); ctx.arc(c.x+2+cw0/2,c.y+2+cw0/2,25,0,Math.PI*2); ctx.stroke();
   ctx.fillStyle='#c0392b'; ctx.font='800 11px system-ui';
   ctx.fillText('真凶',c.x+2+cw0/2,c.y+2+cw0/2-32);
  }
 }
 /* 案情脚注 */
 ctx.fillStyle='#9c8a6a'; ctx.font='600 10.5px system-ui'; ctx.textAlign='center';
 ctx.fillText('点选句中的错字 · 点错 −5s',195,cardY+cardH-13);
 ctx.restore();
 /* 连击章 */
 if(S.streak>1){ ctx.save(); ctx.translate(322,300); ctx.rotate(.1);
  ctx.strokeStyle='rgba(192,57,43,.85)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#c0392b'; ctx.font='800 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('连×'+S.streak,0,1); ctx.restore(); }
 HIT.cells=cells;
}
const cw0=44;
function drawMenuIdle(){
 ctx.fillStyle='rgba(233,221,192,.45)'; ctx.font='600 15px system-ui'; ctx.textAlign='center';
 ctx.fillText('火眼金睛 · 缉拿文墨逃犯', 195, 620);
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
 ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- 输入 ---- */
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(!S||S.phase!=='play'||!G||G.reveal) return;
 const r=cv.getBoundingClientRect();
 const x=(e.clientX-r.left)*(390/r.width), y=(e.clientY-r.top)*(780/r.height);
 for(let i=0;i<HIT.cells.length;i++){ const o=HIT.cells[i];
  if(x>=o.x&&x<=o.x+cw0+4&&y>=o.y&&y<=o.y+cw0+4){ pick(i); return; } }
});

/* ---- 主循环 ---- */
let lastT=0;
function loop(ts){
 const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
 if(S){
  if(S.phase==='play'&&G){
   S.time-=dt;
   if(S.time<=0){ S.time=0; gameOver(); }
   else if(Math.ceil(S.time)!==S._lt){ S._lt=Math.ceil(S.time); if(S.time<=10) snd('tick'); updHUD(); }
  }
  if(shakeT>0) shakeT-=dt;
  if(circT>0) circT-=dt;
  if(flashT>0) flashT-=dt;
  draw();
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- 按钮 ---- */
$('btn-go').addEventListener('click',()=>{ ensureAC(); $('menu').classList.add('hide'); startRound(); });
$('btn-again').addEventListener('click',()=>{ $('overlay').classList.add('hide'); ensureAC(); startRound(); });
$('btn-snd').addEventListener('click',()=>{ sndOn=!sndOn; ensureAC(); $('btn-snd').textContent=sndOn?'🔊':'🔇'; });
$('btn-pause').addEventListener('click',()=>{ if(S&&S.phase==='play'){S.phase='pause';$('pauselay').classList.remove('hide');} });
$('btn-resume').addEventListener('click',()=>{ if(S&&S.phase==='pause'){S.phase='play';$('pauselay').classList.add('hide');} });
$('btn-home').addEventListener('click',()=>{ $('pauselay').classList.add('hide'); $('menu').classList.remove('hide');
 if(S) saveBestNow(); if(S) S.phase='menu'; if(S&&G) G=null; $('mbest').textContent=S&&S.best>0?'★ 最高断案 '+S.best:''; });
document.addEventListener('visibilitychange',onHidden);
window.addEventListener('pagehide',()=>saveBestNow());

/* ---- 初始化 ---- */
(function(){
 const b=+(localStorage.getItem('g76_best')||0);
 if(b>0) $('mbest').textContent='★ 最高断案 '+b;
 S={phase:'menu',time:TOTAL_TIME,score:0,streak:0,maxStreak:0,got:0,bonus:0,penN:0,best:b,_lt:TOTAL_TIME};
 G=null; updHUD(); draw();
})();
