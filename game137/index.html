<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>叶子戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#141210;overflow:hidden;font-family:"Songti SC","STSong","SimSun",serif;user-select:none}
#app{position:relative;width:390px;height:844px;margin:0 auto;background:linear-gradient(180deg,#26211b 0%,#2d2620 64px,#1b1713 64px)}
#hud{position:absolute;top:0;left:0;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#e5d8b4;z-index:5}
#hInfo{font-size:19px;letter-spacing:1px}
#hSub{font-size:13px;color:#a9986f}
#cv{position:absolute;top:64px;left:0}
.btnrow{position:absolute;bottom:0;left:0;width:100%;height:64px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.hbtn{min-width:72px;padding:8px 12px;border:1px solid #6b5a44;border-radius:8px;background:#382f24;color:#d6c294;font-size:14px;text-align:center;cursor:pointer}
#bDraw{min-width:110px;background:#4c3d2c;border-color:#8a7350;color:#ffe2ac;font-size:16px}
.lay{position:absolute;inset:0;background:rgba(16,13,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.hide{display:none!important}
.mt{font-size:34px;color:#e5d8b4;letter-spacing:6px;margin-bottom:6px}
.msub{font-size:13px;color:#9c8b66;margin-bottom:26px;letter-spacing:2px}
.mbtn{width:200px;padding:12px 0;margin:7px 0;border:1px solid #776244;border-radius:10px;background:#382f24;color:#dcc898;font-size:17px;text-align:center;cursor:pointer;letter-spacing:3px}
.ot{font-size:30px;color:#e5d8b4;letter-spacing:4px;margin-bottom:12px}
.os{font-size:24px;color:#ffce6a;margin-bottom:8px}
.osub{font-size:14px;color:#9c8b66;margin-bottom:20px}
#lvbar{position:absolute;left:50%;transform:translateX(-50%);bottom:80px;width:342px;background:#2a231c;border:1px solid #6b5a44;border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;z-index:22}
.lvcell{height:44px;border:1px solid #57462f;border-radius:6px;background:#382f24;color:#d6c294;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lvcell.lock{color:#57462f;border-color:#382f24}
.flash{position:absolute;top:180px;left:50%;transform:translateX(-50%);padding:8px 18px;background:#443626;color:#ffe2ac;border-radius:8px;font-size:15px;z-index:15;pointer-events:none;transition:opacity .3s}
#pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.pcell{width:80px;text-align:center}
.pv{width:56px;height:72px;margin:0 auto 6px;border-radius:6px;border:2px solid #6b5a44;background:#241e18;display:flex;align-items:center;justify-content:center;font-size:26px;color:#57462f}
.pcell.on .pv{color:#e5d8b4;background:#3a3125;border-color:#a08a5c}
.pn{font-size:12px;color:#a9986f}
.tutbox{width:318px;background:#241d15;border:1px solid #6b5a44;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.tutl{font-size:13.5px;color:#c9b78c;line-height:1.65;margin:7px 0;text-align:left}
.tk{display:inline-block;min-width:34px;margin-right:8px;padding:1px 7px;border:1px solid #776244;border-radius:6px;background:#382f24;color:#ffe2ac;font-size:12.5px;letter-spacing:2px}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><div id="hInfo">叶子戏</div><div id="hSub"></div></div>
  <canvas id="cv" width="390" height="780"></canvas>
  <div class="btnrow">
    <div class="hbtn" id="bDraw">翻 笺</div>
    <div class="hbtn" id="bUndo">悔 手</div>
    <div class="hbtn" id="bHint">灯下读书</div>
    <div class="hbtn" id="bTrophy">函匣</div>
    <div class="hbtn" id="pausebtn">暂停</div>
  </div>
  <div class="lay hide" id="menu">
    <div class="mt">叶 子 戏</div>
    <div class="msub">唐人书斋 · 青史黄叶归函</div>
    <div class="mbtn" id="mGo">开局</div>
    <div class="mbtn" id="mLvs">选局</div>
    <div class="mbtn" id="mTrophy">函匣</div>
  </div>
  <div class="lay hide" id="over">
    <div class="ot" id="oTitle">四函归满</div>
    <div class="os" id="oStars"></div>
    <div class="osub" id="oSub"></div>
    <div class="mbtn hide" id="bNext">下一局</div>
    <div class="mbtn" id="bAgain">再战</div>
    <div class="mbtn" id="bHome">回斋</div>
  </div>
  <div class="lay hide" id="pause">
    <div class="ot">搁 卷</div>
    <div class="mbtn" id="pRes">续战</div>
    <div class="mbtn" id="pRestart">重排此局</div>
    <div class="mbtn" id="pMute">声音</div>
    <div class="mbtn" id="pHome">回斋</div>
  </div>
  <div class="lay hide" id="trophy">
    <div class="ot">函 匣</div>
    <div class="pgrid" id="pgrid"></div>
    <div class="mbtn" id="pBack">收起</div>
  </div>
  <div class="lay hide" id="tutlay" style="z-index:30">
    <div class="ot">叶 笺 指 南</div>
    <div class="tutbox">
      <div class="tutl"><span class="tk">目标</span>把 52 张叶笺按花色 A→K 收满右上四个函匣（♠♥♦♣ 各一函）。</div>
      <div class="tutl"><span class="tk">操作</span>点一张亮牌选中（金边）→ 合法落点现绿框，再点落点即移；双击列尾牌或展笺顶牌可直接归函；点左上叶笺匣翻新牌。</div>
      <div class="tutl"><span class="tk">按键</span>空格=翻笺 · U=悔手 · H=灯下读书（可行之步皆亮）。</div>
      <div class="tutl"><span class="tk">卡局</span>此局无路可走时不判负——暂停 →「重排此局」同局重来。</div>
    </div>
    <div class="mbtn" id="tutGo">开 始</div>
  </div>
  <div id="lvbar" class="hide"></div>
  <div class="flash" id="flash" style="opacity:0"></div>
</div>

  for(i=0;i<waste.length;i++)wa.push([waste[i][0],waste[i][1]]);
  return {t:t,f:found.slice(),st:st,w:wa,sc:S.score,mv:S.moves};
}
function restore(s){
  tab=[];for(var i=0;i<COLS;i++){var cc=[];for(var c=0;c<s.t[i].length;c++)cc.push([s.t[i][c][0],s.t[i][c][1],s.t[i][c][2]]);tab.push(cc)}
  found=s.f.slice();stock=[];waste=[];
  for(i=0;i<s.st.length;i++)stock.push([s.st[i][0],s.st[i][1]]);
  for(i=0;i<s.w.length;i++)waste.push([s.w[i][0],s.w[i][1]]);
  S.score=s.sc;S.moves=s.mv;
}
function doDraw(){
  if(!stock.length&&!waste.length)return false;
  undoStack.push(snapAll());          /* draw 可撤销（SPEC §1.8 无限撤销） */
  if(undoStack.length>400)undoStack.shift();
  if(stock.length)waste.push(stock.pop());
  else{
    stock=waste.slice().reverse();   /* waste 逆转回 stock（与 py 同式·保序循环） */
    waste=[];
  }
  S.moves++;updHUD();return true;
}
function doMove(src,idx,dst){
  /* src/dst：{k:'t',c}/{k:'w'}/{k:'f',s}；返回 true=成 */
  undoStack.push(snapAll());
  if(undoStack.length>400)undoStack.shift();
  var ok=_apply(src,idx,dst);
  if(!ok){undoStack.pop();return false}
  S.moves++;updHUD();return true;
}
function _apply(src,idx,dst){
  if(src.k==='t'){
    var col=tab[src.c];
    if(idx<0||idx>=col.length||!seqOk(col,idx))return false;
    var seg=col.slice(idx);
    if(dst.k==='t'){
      if(!canTab(seg[0],tab[dst.c]))return false;
      var dc=tab[dst.c];
      for(var i=0;i<seg.length;i++)dc.push(seg[i]);
      col.length=idx;
    }else if(dst.k==='f'){
      if(seg.length!==1||!canFound(seg[0]))return false;
      found[seg[0][0]]=seg[0][1];
      col.length=idx;
      S.score+=10;suitDone(seg[0][0]);
    }else return false;
    if(col.length&&!col[col.length-1][2]){col[col.length-1][2]=1;S.score+=5}
    return true;
  }
  if(src.k==='w'){
    if(!waste.length)return false;
    var card=waste[waste.length-1];
    if(dst.k==='t'){
      if(!canTab(card,tab[dst.c]))return false;
      var w0=waste.pop();tab[dst.c].push([w0[0],w0[1],1]);
    }else if(dst.k==='f'){
      if(!canFound(card))return false;
      found[card[0]]=card[1];waste.pop();S.score+=10;suitDone(card[0]);
    }else return false;
    return true;
  }
  if(src.k==='f'){
    var su=src.s;
    if(found[su]===0||dst.k!=='t')return false;
    var fc=[su,found[su],1];
    if(!canTab(fc,tab[dst.c]))return false;
    found[su]--;tab[dst.c].push(fc);S.score-=10;
    return true;
  }
  return false;
}
function doUndo(){
  if(!undoStack.length)return;
  restore(undoStack.pop());
  S.from=null;updHUD();
}
function won(){return found[0]===13&&found[1]===13&&found[2]===13&&found[3]===13}
function checkWin(){
  if(won()&&S.over===0){
    var par=LVDATA[S.lv-1].par;
    if(S.moves<=Math.floor(par*1.2))S.score+=200;
    S.over=1;S.result=[1,S.score,S.moves];
    S.ph='over';showOver();saveMain();tone(660,.2);
  }
}

/* ==== 星级/援手/存档 ==== */
function starsOf(){
  var par=LVDATA[S.lv-1].par;
  if(S.moves<=Math.floor(par*1.2))return 3;
  if(S.moves<=par*2)return 2;
  return 1;
}
function doHint(){

var AC=null;
function tone(fr,dur){
  if(!sndOn)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.value=fr;
    g.gain.setValueAtTime(0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ==== 渲染 ==== */
var ctx=document.getElementById('cv').getContext('2d');
function colX(c){return 8+c*53}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#1b1713';ctx.fillRect(0,0,390,780);
  if(S.ph==='menu'){return}
  var i,c;
  /* 上排槽：stock(0) waste(1) 空(2) f0-f3(3-6) */
  drawSlot(colX(0),TOP_Y,'stock');
  drawSlot(colX(1),TOP_Y,'waste');
  for(i=0;i<4;i++)drawSlot(colX(3+i),TOP_Y,'f',i);
  /* stock 叠（画 2 层底影示厚度） */
  if(stock.length){
    ctx.fillStyle='#2e3a30';
    roundRect(colX(0)+2,TOP_Y+2,CW,CH,5);ctx.fill();
    drawBack(colX(0),TOP_Y);
  }
  if(waste.length){
    var wn=Math.min(waste.length,3);
    for(i=wn;i>1;i--){
      ctx.fillStyle='#3a3226';
      roundRect(colX(1)-(i-1)*5,TOP_Y,CW,CH,5);ctx.fill();
    }
    drawFace(colX(1)-(wn-1)*5,TOP_Y,waste[waste.length-1],S.from&&S.from.k==='w');
  }
  /* 基础堆顶 */
  for(i=0;i<4;i++){
    var fx=colX(3+i);
    ctx.fillStyle='#241e16';
    roundRect(fx,TOP_Y,CW,CH,5);ctx.fill();
    ctx.strokeStyle='#6b5a44';ctx.lineWidth=1;
    roundRect(fx,TOP_Y,CW,CH,5);ctx.stroke();
    ctx.fillStyle='#57462f';ctx.font='13px serif';ctx.textAlign='center';
    ctx.fillText(SCHAR[i],fx+CW/2,TOP_Y+24);
    ctx.font='9px serif';ctx.fillText('函',fx+CW/2,TOP_Y+38);
    if(found[i]>0)drawFace(fx,TOP_Y,[i,found[i],1],false);
  }
  /* 列 */
  for(c=0;c<COLS;c++){
    var col=tab[c],x=colX(c);
    if(!col.length){drawSlot(x,TAB_Y,'t')}
    var up=0,dk=0,j;
    for(j=0;j<col.length;j++)col[j][2]?up++:dk++;
    var gapU=Math.min(22,up>1?(560-CH)/(up-1):22);
    var gapD=Math.min(12,gapU);
    var y=TAB_Y;
    for(j=0;j<col.length;j++){
      if(col[j][2]){
        drawFace(x,y,col[j],S.from&&S.from.k==='t'&&S.from.c===c&&j>=S.from.i);
      }else{
        drawBack(x,y);
      }
      y+=col[j][2]?gapU:gapD;
    }
    /* 选中段目标高亮 */
    if(S.from&&S.from.k==='t'&&S.from.c===c)drawGlow(x,TAB_Y,CW,Math.max(CH,y-TAB_Y));
  }
  if(S.from)drawTargets();   /* 合法落点绿框（SPEC §3 承诺） */
  if(S.hintT>0){S.hintT--;drawHints()}
}
function drawSlot(x,y,kind,i){
  ctx.fillStyle=UI.slotFill;
  roundRect(x,y,CW,CH,5);ctx.fill();
  ctx.strokeStyle=UI.slotEdge;ctx.lineWidth=1;
  roundRect(x,y,CW,CH,5);ctx.stroke();
  if(kind==='t'){
    ctx.strokeStyle='#3a3024';
    ctx.beginPath();ctx.moveTo(x+8,y+CH/2);ctx.lineTo(x+CW-8,y+CH/2);ctx.stroke();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawFace(x,y,card,sel){
  ctx.fillStyle=UI.cardFace;
  roundRect(x,y,CW,CH,5);ctx.fill();
  ctx.strokeStyle=sel?UI.goldSel:UI.cardEdge;ctx.lineWidth=sel?2:1;
  roundRect(x,y,CW,CH,5);ctx.stroke();
  var col=isRed(card[0])?UI.redInk:UI.blackInk;
  ctx.fillStyle=col;ctx.textAlign='left';
  ctx.font=(card[1]>=10?'13px':'15px')+' "Songti SC",serif';
  ctx.fillText(RNAME[card[1]-1],x+4,y+16);
  ctx.font='15px serif';ctx.fillText(SCHAR[card[0]],x+4,y+32);
  ctx.textAlign='right';
  ctx.font=(card[1]>=10?'11px':'12px')+' serif';
  ctx.fillText(RNAME[card[1]-1]+SCHAR[card[0]],x+CW-4,y+CH-6);
}
function drawBack(x,y){
  ctx.fillStyle=UI.cardBack;
  roundRect(x,y,CW,CH,5);ctx.fill();
  ctx.strokeStyle=UI.cardBackEdge;ctx.lineWidth=1;
  roundRect(x+3,y+3,CW-6,CH-6,3);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,240,.14)';
  ctx.beginPath();
  ctx.moveTo(x+8,y+CH-10);ctx.quadraticCurveTo(x+CW/2,y+8,x+CW-8,y+CH-10);
  ctx.stroke();
}
function drawGlow(x,y,w,h){
  ctx.strokeStyle=UI.goldDash;ctx.lineWidth=2;
  ctx.setLineDash([5,4]);
  roundRect(x-2,y-2,w+4,Math.min(h+4,586),6);ctx.stroke();
  ctx.setLineDash([]);
}
function colGap(c){
  var col=tab[c],up=0,k;
  for(k=0;k<col.length;k++)if(col[k][2])up++;
  return Math.min(22,up>1?(560-CH)/(up-1):22);   /* 亮牌叠距（与 draw/hitTest 同式） */
}
function colTopY(c){
  var col=tab[c],y=TAB_Y,k,g=colGap(c),gd=Math.min(12,g);
  for(k=0;k<col.length-1;k++)y+=col[k][2]?g:gd;
  return y;
}
function drawHints(){
  var mv=allMoves(),i;
  ctx.strokeStyle=UI.green;ctx.lineWidth=2;
  for(i=0;i<mv.length;i++){
    var m=mv[i],x,y2;
    if(m[0]==='t'){x=colX(m[1]);y2=colTopY(m[1])}
    else if(m[0]==='w'){x=colX(1);y2=TOP_Y}
    else{x=colX(3+m[4]);y2=TOP_Y}
    roundRect(x-1,y2-1,CW+2,CH+2,6);ctx.stroke();
  }
}
function drawTargets(){
  /* 当前选中源的全部合法落点：列顶绿框；可上函的函匣绿框 */
  var src=null;
  if(S.from&&S.from.k==='t'){var col=tab[S.from.c];if(S.from.i<col.length&&seqOk(col,S.from.i))src=col[S.from.i]}
  else if(S.from&&S.from.k==='w'&&waste.length)src=waste[waste.length-1];
  else if(S.from&&S.from.k==='f'&&found[S.from.s]>0)src=[S.from.s,found[S.from.s],1];
  if(!src)return;
  ctx.strokeStyle=UI.green;ctx.lineWidth=2;
  var d;
  for(d=0;d<COLS;d++){
    if(S.from.k==='t'&&d===S.from.c)continue;
    if(canTab(src,tab[d])){
      var y2=tab[d].length?colTopY(d):TAB_Y;
      roundRect(colX(d)-2,y2-2,CW+4,CH+4,6);ctx.stroke();
    }
  }
  var single=(S.from.k!=='t')||(tab[S.from.c].length-S.from.i===1);
  if(single&&S.from.k!=='f'&&canFound(src)){
    var su=src[0],fx=colX(3+su);
    roundRect(fx-2,TOP_Y-2,CW+4,CH+4,6);ctx.stroke();
  }
}
function allMoves(){
  var out=[],c,idx,d,col;
  for(c=0;c<COLS;c++){
    col=tab[c];
    for(idx=0;idx<col.length;idx++){
      if(seqOk(col,idx)){
        for(d=0;d<COLS;d++)if(d!==c&&canTab(col[idx],tab[d]))out.push(['t',c,idx,'t',d]);
        if(idx===col.length-1&&canFound(col[idx]))out.push(['t',c,idx,'f',col[idx][0]]);
      }
    }
  }
  if(waste.length){
    var wt=waste[waste.length-1];
    for(d=0;d<COLS;d++)if(canTab(wt,tab[d]))out.push(['w',-1,0,'t',d]);
    if(canFound(wt))out.push(['w',-1,0,'f',wt[0]]);
  }
  return out;
}

/* ==== HUD/主循环 ==== */
function updHUD(){

/* ==== 输入：点选两段式+双击自动上基础 ==== */
var appEl=document.getElementById('app');
function hitTest(px,py){
  if(py>=TOP_Y&&py<=TOP_Y+CH){
    var s=Math.floor((px-8)/53);
    /* 叠影顶牌左缘并入 waste 命中（与渲染 colX(1)-(min(wn,3)-1)*5 同源——waste≥2 顶牌左移 5-10px，防误触翻笺） */
    if(s===0&&waste.length>1&&px>=colX(1)-(Math.min(waste.length,3)-1)*5)return {k:'w'};
    if(s===0)return {k:'stock'};
    if(s===1)return waste.length?{k:'w'}:{k:'none'};
    if(s>=3&&s<7)return {k:'f',s:s-3};
    return {k:'none'};
  }
  if(py>=TAB_Y){
    var c=Math.floor((px-8)/53);
    if(c<0||c>=COLS)return {k:'none'};
    var col=tab[c],y=TAB_Y,j=-1,i2;
    var up=0,dk=0,kk;
    for(kk=0;kk<col.length;kk++)col[kk][2]?up++:dk++;
    var gapU=Math.min(22,up>1?(560-CH)/(up-1):22),gapD=Math.min(12,gapU);
    for(i2=0;i2<col.length;i2++){
      var span=col[i2][2]?gapU:gapD;
      var h2=(i2===col.length-1)?CH:span;   /* 中间张=可见条带到下张顶；末张=全牌高 */
      if(py>=y&&py<y+h2){j=i2;break}
      y+=span;
    }
    if(j<0)j=col.length-1;
    if(j>=0&&j<col.length&&col[j][2])return {k:'t',c:c,i:j};
    if(col.length)return {k:'none'};
    return {k:'tdrop',c:c};
  }
  return {k:'none'};
}
var lastTap={t:0,h:null};
function onTap(px,py){
  if(S.ph!=='play')return;
  var h=hitTest(px,py);
  var now=Date.now();
  var dbl=lastTap.h&&sameHit(lastTap.h,h)&&now-lastTap.t<350;
  lastTap={t:now,h:h};
  if(h.k==='stock'){doDraw();tone(520,.05);checkWin();return}
  if(h.k==='none'){S.from=null;return}   /* 点空白=取消已选 */
  if(dbl&&h.k==='t'){
    var col=tab[h.c];
    if(h.i===col.length-1&&canFound(col[h.i])){
      if(doMove({k:'t',c:h.c},h.i,{k:'f',s:col[h.i][0]})){tone(620,.08);S.from=null;checkWin()}
      return;
    }
    /* 双击不可上函：退化为选中（连续两击同张=「落牌后立刻再拿」自然节奏，不吞点击） */
    S.from={k:'t',c:h.c,i:h.i};tone(440,.04);return;
  }
  if(dbl&&h.k==='w'){
    if(canFound(waste[waste.length-1])){
      if(doMove({k:'w'},0,{k:'f',s:waste[waste.length-1][0]})){tone(620,.08);S.from=null;checkWin()}
    }else{
      S.from={k:'w'};tone(440,.04);
    }
    return;
  }
  if(!S.from){
    if(h.k==='t'){S.from={k:'t',c:h.c,i:h.i};tone(440,.04)}
    else if(h.k==='w'){S.from={k:'w'};tone(440,.04)}
    else if(h.k==='f'&&found[h.s]>0){S.from={k:'f',s:h.s};tone(440,.04)}
    return;
  }
  /* 已选源 → 目标 */
  var dst=null;
  if(h.k==='t')dst={k:'t',c:h.c};
  else if(h.k==='tdrop')dst={k:'t',c:h.c};
  else if(h.k==='f')dst={k:'f',s:h.s};
  if(!dst){S.from=null;return}
  if(dst.k==='t'&&S.from.k==='t'&&dst.c===S.from.c){S.from=null;return}
  var idx=S.from.k==='t'?S.from.i:(S.from.k==='w'?0:0);
  if(doMove(S.from,idx,dst)){tone(560,.06);S.from=null;checkWin()}
  else{S.from=null;tone(200,.08)}
}
function sameHit(a,b){
  if(a.k!==b.k)return false;
  if(a.k==='t')return a.c===b.c&&a.i===b.i;   /* 同列同张才算双击 */
  if(a.k==='f')return a.s===b.s;
  return true;
}
appEl.addEventListener('pointerdown',function(e){
  if(S.tut)return;                 /* 引导期拦截：输入入口最前面，不触 rnd/步数 */
  if(S.ph!=='play')return;
  if(e.target.closest('.btnrow'))return;
  var r=document.getElementById('cv').getBoundingClientRect();
  onTap((e.clientX-r.left)*390/r.width,(e.clientY-r.top)*780/r.height);
});
window.addEventListener('keydown',function(e){
  if(S.tut){                       /* 引导期：空格/回车/Esc 关引导，其余键吞掉 */
    if(e.key===' '||e.key==='Enter'||e.key==='Escape')closeTut();
    if(e.key===' ')e.preventDefault();
    return;
  }
  if(e.key===' '){if(S.ph==='play'){doDraw();checkWin()}e.preventDefault()}
  if(e.key==='u'||e.key==='U'){if(S.ph==='play')doUndo()}
  if(e.key==='h'||e.key==='H'){doHint()}
  if(e.key.indexOf('Arrow')===0)e.preventDefault();
});

  bar.innerHTML='';
  for(var i=1;i<=24;i++){
    (function(n){
      var c=document.createElement('div');
      c.className='lvcell'+(n>unlocked?' lock':'');
      c.textContent=n;
      if(n<=unlocked)c.onclick=function(){newGame(n);tone(440,.05);maybeTut()};
      bar.appendChild(c);
    })(i);
  }
  bar.classList.toggle('hide');
};
document.getElementById('tutGo').onclick=closeTut;
document.getElementById('tutlay').addEventListener('pointerdown',function(e){
  e.stopPropagation();      /* 任意点可关；阻断冒泡防关闭点击漏进 canvas 坐标换算 */
  closeTut();
});
document.getElementById('mTrophy').onclick=showTrophy;
document.getElementById('bTrophy').onclick=showTrophy;
function showTrophy(){
  if(S.ph==='play'&&S.over===0)return;
  var g=document.getElementById('pgrid');
  g.innerHTML='';
  var names=['黑桃函','红心函','方片函','梅花函'];
  for(var i=0;i<4;i++){
    var d=document.createElement('div');
    d.className='pcell'+(suitSeen[i]?' on':'');
    d.innerHTML='<div class="pv">'+(suitSeen[i]?SCHAR[i]:'?')+'</div><div class="pn">'+names[i]+'</div>';
    g.appendChild(d);
  }
  document.getElementById('trophy').classList.remove('hide');
}
document.getElementById('pBack').onclick=function(){document.getElementById('trophy').classList.add('hide')};
document.getElementById('bDraw').onclick=function(){if(S.ph==='play'){doDraw();checkWin()}};
document.getElementById('bUndo').onclick=function(){if(S.ph==='play')doUndo()};
document.getElementById('bHint').onclick=doHint;
document.getElementById('pausebtn').onclick=function(){
  if(S.ph!=='play')return;
  S.ph='pause';
  document.getElementById('pause').classList.remove('hide');
};
document.getElementById('pRes').onclick=function(){
  if(S.ph!=='pause')return;
  S.ph='play';
  document.getElementById('pause').classList.add('hide');
};
document.getElementById('pRestart').onclick=function(){
  if(S.ph!=='pause')return;
  newGame(S.lv);flashMsg('重排此局 · 同局再来');
};
document.getElementById('pHome').onclick=home;
document.getElementById('pMute').onclick=function(){
  sndOn=sndOn?0:1;saveMain();
  this.textContent=sndOn?'声音':'静音';
};
document.getElementById('bAgain').onclick=function(){newGame(S.lv)};
document.getElementById('bNext').onclick=function(){if(S.lv<24)newGame(S.lv+1)};
document.getElementById('bHome').onclick=home;

/* 开局 */
loadSave();
home();   /* boot 即显菜单（g135 教训） */
requestAnimationFrame(loop);

</script>
