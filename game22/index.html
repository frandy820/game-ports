<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16322a">
<title>叠翠楼 · 离线版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='4' width='40' height='40' rx='9' fill='%2316322a'/%3E%3Crect x='14' y='26' width='20' height='6' fill='%234a8a6a'/%3E%3Crect x='16' y='18' width='16' height='6' fill='%2368a884'/%3E%3Crect x='18' y='10' width='12' height='6' fill='%238fd0a8'/%3E%3C/svg%3E">
<style>
  :root{
    --panel:rgba(14,30,26,.92); --line:rgba(148,200,178,.25);
    --ink:#e9f2e6; --dim:#a8bfa8; --gold:#ffd97e; --red:#ff6b7d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:#16322a;color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
  #cv{position:absolute;inset:0;width:100%;height:100%}

  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;z-index:6;
    display:flex;align-items:flex-start;justify-content:center;pointer-events:none}
  #score{font-size:44px;font-weight:800;color:#f4f8e8;letter-spacing:.04em;
    text-shadow:0 2px 4px rgba(10,20,16,.9), 0 3px 0 rgba(20,40,30,.5), 0 6px 18px rgba(0,0,0,.45);
    font-variant-numeric:tabular-nums;transition:transform .12s}
  #score.pop{transform:scale(1.18)}
  #combo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;text-align:center;
    font-size:14px;font-weight:800;color:#ffd97e;letter-spacing:.1em;opacity:0;transition:opacity .25s;
    text-shadow:0 2px 10px rgba(255,217,126,.5);pointer-events:none;z-index:6}
  #combo.show{opacity:1}
  #btn-snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:7;
    width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--panel);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.32);pointer-events:auto}
  #btn-snd:active{transform:translateY(2px)}
  #btn-snd.off{opacity:.55}
  footer{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);
    text-align:center;font-size:10.5px;font-weight:600;color:rgba(233,242,230,.75);
    letter-spacing:.05em;pointer-events:none;z-index:3;text-shadow:0 1px 3px rgba(10,20,16,.8)}

  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,20,16,.5);z-index:20;backdrop-filter:blur(1.5px)}
  .layer[hidden]{display:none}
  .lpanel{display:flex;flex-direction:column;gap:13px;width:min(86vw,340px);
    background:rgba(18,36,30,.97);border:1px solid rgba(148,200,178,.4);border-radius:18px;padding:24px 26px;
    box-shadow:0 14px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06)}
  .lt{font-size:17px;font-weight:800;color:var(--gold);letter-spacing:.08em;text-align:center}
  .ld{font-size:14px;color:#d4e2d0;line-height:1.9;text-align:center}
  .ld b{color:#ffe9b8}
  .ld .no{color:var(--red);font-weight:700}
  .layer button{padding:11px 0;font-size:15px;font-weight:700;color:#14261e;background:var(--gold);
    border:none;border-radius:12px;cursor:pointer}
  .layer button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  #menu .bestrow,#end .bestrow{font-size:13px;color:var(--dim);text-align:center}
  #menu .bestrow b,#end .bestrow b{color:var(--ink)}
  #end .big{font-size:42px;font-weight:800;color:#f4f8e8;text-align:center;
    text-shadow:0 4px 22px rgba(143,208,168,.35);font-variant-numeric:tabular-nums}
  #end .stats{display:flex;justify-content:center;gap:30px;font-size:13px;color:var(--dim)}
  #end .stats b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
  .rec{display:none;margin:0 auto;width:max-content;padding:4px 14px;border-radius:99px;
    font-size:12px;color:#ffd97e;font-weight:700;letter-spacing:.1em;
    background:rgba(255,217,126,.14);border:1px solid rgba(255,217,126,.45)}
  .rec.show{display:block;animation:rpop .6s ease both}
  @keyframes rpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="hud"><div id="score">0</div></div>
  <div id="combo">完美 ×3</div>
  <button id="btn-snd" aria-label="声音开关"></button>
  <footer>叠翠楼 · 完全离线 · 一层一层把楼叠上云</footer>

  <div id="menu" class="layer">
    <div class="lpanel">
      <div class="lt">叠翠楼</div>
      <div class="ld">楼板左右滑动，<b>轻点定格</b>。<br>
        对齐下层便稳稳落住，歪了就被<b>裁去边角</b>；<br>
        <span class="no">完全落空即楼塌</span>。完美对齐连击涨分，楼越叠越高。</div>
      <div class="bestrow">最高 <b id="menu-best">0</b> 层</div>
      <button id="menu-ok">起楼</button>
    </div>
  </div>

  <div id="end" class="layer" hidden>
    <div class="lpanel">
      <div class="lt">楼塌</div>
      <div class="big" id="end-score">0</div>
      <div class="rec" id="end-rec">★ 新纪录 ★</div>
      <div class="stats"><span>楼高<br><b id="end-h">0</b> 层</span><span>完美<br><b id="end-p">0</b> 次</span></div>
      <div class="bestrow">历史最高 <b id="end-best">0</b> 层</div>
      <button id="end-ok">再起一座</button>
      <button id="end-menu" class="ghost">回山脚</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  function mulberry(seed) { var t = seed >>> 0; return function () { t += 0x6D2B79F5; var r2 = Math.imul(t ^ (t >>> 15), 1 | t); r2 ^= r2 + Math.imul(r2 ^ (r2 >>> 7), 61 | r2); return ((r2 ^ (r2 >>> 14)) >>> 0) / 4294967296; }; }

  var safeStorage = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var SFX = (function () {
    var ctx = null, on = safeStorage.get('mq_g22_sound', false);
    function ac() {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(type, f0, f1, t, vol, when) {
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain();
      var t0 = c.currentTime + (when || 0);
      o.type = type; o.frequency.setValueAtTime(f0, t0);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + t);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + t + .02);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + t + .04);
    }
    return {
      unlock: function () { ac(); },
      drop: function () { if (!on) return; tone('triangle', 190, 150, .07, .07); },
      perfect: function (n) { if (!on) return; tone('sine', 640 + Math.min(n, 16) * 26, 0, .12, .08); tone('sine', 960 + Math.min(n, 16) * 39, 0, .1, .05, .05); },
      crack: function () { if (!on) return; tone('square', 120, 60, .14, .06); },
      fall: function () { if (!on) return; tone('sine', 260, 60, .6, .11); },
      get on() { return on; },
      toggle: function () { on = !on; safeStorage.set('mq_g22_sound', on); return on; }
    };
  })();

  /* ═══ 数值 ═══ */
  var W = 375, H = 812;
  var H_LAY = 34, W0 = 176, PERFECT_EPS = 3, MIN_W = 8;
  var SPD0 = 178, SPD_STEP = 3, SPD_MAX = 320;
  var PERFECT_REGROW = 10;
  var TAP_LOCK = false;   /* dev step 模式屏蔽输入 */

  function spdOf(n) { return Math.min(SPD_MAX, SPD0 + SPD_STEP * n); }
  /* 层色：HSL 沿高度递减（青绿150→玉90→暖木25 封底，「叠翠」向暖收） */
  function hueOf(n) { return Math.max(25, 150 - n * 5); }
  function hsl(h, s, l) { return 'hsl(' + Math.round(h) + ',' + Math.round(s) + '%,' + Math.round(l) + '%)'; }

  /* ═══ 状态 ═══ */
  var S = {
    mode: 'menu',        /* menu|play|dead */
    running: false, seed: 1,
    layers: [],          /* {n, x, y, w, hue, perfect} 已落层（含基座） */
    cur: null,           /* {x, w, y, vx, dir, n} 滑动中的层 */
    score: 0, perfects: 0, combo: 0, maxCombo: 0,
    camY: 0,             /* 塔顶基准：顶层 y 目标屏幕位置 = BASE_LINE
                            实际用 offset：drawY = y - camShift */
    debris: [],          /* {x,y,w,vx,vy,rot,vr,t,hue} */
    t: 0, raf: 0, lastT: 0, deadWait: 0
  };
  var BASE_Y = H - 190;   /* 顶层落点屏幕 y（相机跟随用锚） */

  var el = {
    cv: document.getElementById('cv'), score: document.getElementById('score'),
    combo: document.getElementById('combo'),
    menu: document.getElementById('menu'), menuOk: document.getElementById('menu-ok'),
    menuBest: document.getElementById('menu-best'),
    end: document.getElementById('end'), endScore: document.getElementById('end-score'),
    endH: document.getElementById('end-h'), endP: document.getElementById('end-p'),
    endBest: document.getElementById('end-best'), endRec: document.getElementById('end-rec'),
    endOk: document.getElementById('end-ok'), endMenu: document.getElementById('end-menu'),
    btnSnd: document.getElementById('btn-snd')
  };
  var ctx2d = el.cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  el.cv.width = W * DPR; el.cv.height = H * DPR;
  ctx2d.scale(DPR, DPR);

  function topLayer() { return S.layers[S.layers.length - 1]; }
  function camShift() {
    /* 塔高超过屏高 60% 后整体下移：顶层 y 世界坐标 < BASE_Y 之下越多，shift 越大 */
    var topY = topLayer().y;
    var shift = 0;
    if (topY < BASE_Y) shift = BASE_Y - topY;
    return shift;
  }

  function startRun(seed) {
    S.seed = (seed == null ? (Math.random() * 1e9 | 0) : seed) >>> 0;
    var rnd = mulberry(S.seed);
    S.layers = [];
    /* 基座 4 层（等宽居中） */
    for (var b = 0; b < 4; b++) {
      S.layers.push({ n: b, x: (W - W0) / 2, y: BASE_Y + (4 - 1 - b) * H_LAY, w: W0, hue: hueOf(b), perfect: false });
    }
    S.score = 0; S.perfects = 0; S.combo = 0; S.maxCombo = 0;
    S.debris = []; S.t = 0; S.deadWait = 0;
    spawnNext(rnd() < .5 ? 1 : -1);
    S.mode = 'play'; S.running = true;
    el.menu.hidden = true; el.end.hidden = true;
    updateHUD(); render();
    S.raf = requestAnimationFrame(loop);
  }

  function spawnNext(dir) {
    var top = topLayer();
    var n = S.layers.length;
    var fromLeft = dir === 1;
    S.cur = {
      n: n, w: top.w,
      y: top.y - H_LAY,
      x: fromLeft ? -top.w - 6 : W + 6,
      vx: (fromLeft ? 1 : -1) * spdOf(n - 4),
      dir: fromLeft ? 1 : -1
    };
  }

  function tap() {
    if (S.mode !== 'play' || !S.cur) return false;
    var c = S.cur, top = topLayer();
    var off = c.x - top.x;   /* 偏移（正=右偏） */
    var overlap = Math.min(c.x + c.w, top.x + top.w) - Math.max(c.x, top.x);
    if (overlap <= 0) { die(); return true; }
    var perfect = Math.abs(off) <= PERFECT_EPS;
    var nx, nw;
    if (perfect) {
      nx = top.x; nw = Math.min(W0, top.w + PERFECT_REGROW);
      S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      S.perfects++;
      S.score += 1 + S.combo;
      SFX.perfect(S.combo);
      pulseAt(nx + nw / 2, c.y);
    } else {
      if (off > 0) { nx = c.x; } else { nx = top.x; }
      nw = overlap;
      if (nw < MIN_W) { die(); return true; }
      S.score += 1;
      S.combo = 0;
      SFX.drop();
      /* 碎块：被裁掉的突出部分 */
      var cutW = c.w - overlap;
      var cutX = off > 0 ? top.x + top.w : c.x;
      S.debris.push({ x: cutX, y: c.y, w: cutW, vx: (off > 0 ? 1 : -1) * 60, vy: -40, rot: 0, vr: (off > 0 ? 1 : -1) * 2.4, t: 0, hue: hueOf(c.n) });
    }
    S.layers.push({ n: c.n, x: nx, y: c.y, w: nw, hue: hueOf(c.n), perfect: perfect });
    S.cur = null;
    updateHUD();
    comboHUD();
    /* 下一层方向交替（seeded） */
    var rnd = mulberry(S.seed + c.n * 911);
    spawnNext(rnd() < .5 ? 1 : -1);
    return true;
  }

  function die() {
    S.mode = 'dead'; S.running = false;
    SFX.crack(); setTimeout(function () { if (SFX.on) SFX.fall(); }, 140);
    if (navigator.vibrate) { try { navigator.vibrate([40, 40, 80]); } catch (e) {} }
    cancelAnimationFrame(S.raf);
    /* 顶层碎落动画后弹终局（楼高在 pop 前缓存，防 off-by-one） */
    S.floorsAtDeath = S.layers.length - 4;
    var top = topLayer();
    S.debris.push({ x: top.x, y: top.y, w: top.w, vx: 0, vy: 40, rot: 0, vr: 1.6, t: 0, hue: top.hue });
    S.layers.pop();
    var deadLoop = function () {
      stepOnce(16.667);
      render();
      S.deadWait += 16.667;
      if (S.deadWait < 900) requestAnimationFrame(deadLoop);
      else showEnd();
    };
    requestAnimationFrame(deadLoop);
  }

  function showEnd() {
    var best = safeStorage.get('mq_g22_best', 0);
    var floors = S.floorsAtDeath != null ? S.floorsAtDeath : S.layers.length - 4;
    var rec = floors > best;
    if (rec) safeStorage.set('mq_g22_best', floors);
    el.endScore.textContent = floors;
    el.endH.textContent = floors;
    el.endP.textContent = S.perfects;
    el.endBest.textContent = rec ? floors : best;
    el.endRec.classList.toggle('show', rec);
    el.combo.classList.remove('show');
    el.end.hidden = false;
  }

  /* ═══ 物理 ═══ */
  function stepOnce(dt) {
    S.t += dt;
    if (S.mode === 'play' && S.cur) {
      var c = S.cur;
      c.x += c.vx * dt / 1000;
      /* 撞屏边折返（留 2px 余） */
      if (c.x < 2 && c.vx < 0) { c.x = 2; c.vx = -c.vx; }
      if (c.x + c.w > W - 2 && c.vx > 0) { c.x = W - 2 - c.w; c.vx = -c.vx; }
    }
    /* 碎块 */
    for (var i = S.debris.length - 1; i >= 0; i--) {
      var d = S.debris[i];
      d.t += dt;
      d.vy += 900 * dt / 1000;
      d.x += d.vx * dt / 1000;
      d.y += d.vy * dt / 1000;
      d.rot += d.vr * dt / 1000;
      if (d.y > H + 80) S.debris.splice(i, 1);
    }
  }

  var pulses = [];   /* {x,y,t} */
  function pulseAt(x, y) { pulses.push({ x: x, y: y, t: 0 }); }

  /* ═══ 渲染 ═══ */
  function render() {
    var shift = camShift();
    /* 背景 */
    var bg = ctx2d.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0f2620'); bg.addColorStop(.6, '#16322a'); bg.addColorStop(1, '#1d3f33');
    ctx2d.fillStyle = bg;
    ctx2d.fillRect(0, 0, W, H);
    hills(shift * .25);
    hills2(shift * .45);
    clouds(shift * .18);
    /* 楼层（从下往上画） */
    for (var i = 0; i < S.layers.length; i++) drawLayer(S.layers[i], shift, false);
    /* 滑动层（描边高亮） */
    if (S.cur && S.mode === 'play') drawLayer(S.cur, shift, true);
    /* 碎块 */
    for (var q = 0; q < S.debris.length; q++) drawDebris(S.debris[q], shift);
    /* 脉冲 */
    for (var p = pulses.length - 1; p >= 0; p--) {
      var pl = pulses[p];
      pl.t += 16.667;
      var k = pl.t / 420;
      if (k >= 1) { pulses.splice(p, 1); continue; }
      ctx2d.globalAlpha = (1 - k) * .7;
      ctx2d.strokeStyle = '#fff4d8';
      ctx2d.lineWidth = 2.5;
      ctx2d.strokeRect(pl.x - 14 - k * 22, pl.y - shift - k * 10, 28 + k * 44, H_LAY - 4);
      ctx2d.globalAlpha = 1;
    }
    /* 地面 */
    var gy = BASE_Y - shift + 4 * H_LAY + 2;
    if (gy < H + 10) {
      var gg = ctx2d.createLinearGradient(0, gy, 0, H);
      gg.addColorStop(0, '#243c2e'); gg.addColorStop(1, '#0d1f18');
      ctx2d.fillStyle = gg;
      ctx2d.fillRect(0, gy, W, H - gy + 20);
    }
  }
  function hills(shift) {
    ctx2d.fillStyle = 'rgba(8,22,17,.88)';
    ctx2d.beginPath();
    ctx2d.moveTo(0, H);
    var base = H - 140 + (shift % 200);
    for (var x = 0; x <= W; x += 94) {
      ctx2d.quadraticCurveTo(x + 24, base - 60, x + 47, base - 6);
      ctx2d.quadraticCurveTo(x + 70, base - 44, x + 94, base + 10);
    }
    ctx2d.lineTo(W, H); ctx2d.closePath(); ctx2d.fill();
  }
  function hills2(shift) {
    ctx2d.fillStyle = 'rgba(13,32,25,.82)';
    ctx2d.beginPath();
    ctx2d.moveTo(0, H);
    var base = H - 60 + (shift % 160);
    for (var x = -40; x <= W; x += 120) {
      ctx2d.quadraticCurveTo(x + 30, base - 44, x + 60, base - 10);
      ctx2d.quadraticCurveTo(x + 88, base - 30, x + 120, base + 6);
    }
    ctx2d.lineTo(W, H); ctx2d.closePath(); ctx2d.fill();
  }
  function clouds(shift) {
    ctx2d.fillStyle = 'rgba(233,242,230,.07)';
    var y1 = 120 + (shift % 90);
    ctx2d.beginPath();
    ctx2d.ellipse(70, y1, 58, 16, 0, 0, 7);
    ctx2d.ellipse(300, y1 + 60, 48, 13, 0, 0, 7);
    ctx2d.fill();
  }
  function drawLayer(L, shift, isCur) {
    var y = L.y - shift;
    if (y < -H_LAY - 10 || y > H + 10) return;
    var hue = L.hue != null ? L.hue : hueOf(L.n || 0);
    /* 主体（正面） */
    ctx2d.fillStyle = hsl(hue, 32, 38);
    ctx2d.fillRect(L.x, y, L.w, H_LAY - 2);
    /* 顶面亮条 */
    ctx2d.fillStyle = hsl(hue, 36, 52);
    ctx2d.fillRect(L.x, y, L.w, 6);
    /* 底部暗沿 */
    ctx2d.fillStyle = hsl(hue, 30, 26);
    ctx2d.fillRect(L.x, y + H_LAY - 7, L.w, 5);
    /* 侧沿伪立体 */
    ctx2d.fillStyle = hsl(hue, 28, 30);
    ctx2d.fillRect(L.x + L.w - 5, y, 5, H_LAY - 2);
    /* Perfect 层白线 */
    if (L.perfect) {
      ctx2d.fillStyle = 'rgba(255,244,216,.5)';
      ctx2d.fillRect(L.x + 1, y + H_LAY - 9, L.w - 2, 1.5);
    }
    if (isCur) {
      ctx2d.shadowColor = 'rgba(255,244,216,.8)';
      ctx2d.shadowBlur = 9;
      ctx2d.strokeStyle = 'rgba(255,248,228,.95)';
      ctx2d.lineWidth = 2.5;
      ctx2d.strokeRect(L.x + 1.25, y + 1.25, L.w - 2.5, H_LAY - 4.5);
      ctx2d.shadowBlur = 0;
      ctx2d.fillStyle = hsl(hue, 38, 62);
      ctx2d.fillRect(L.x + 2, y + 2, L.w - 4, 5);   /* 活动块顶亮条提档 */
    }
  }
  function drawDebris(d, shift) {
    ctx2d.save();
    ctx2d.translate(d.x + d.w / 2, d.y - shift + H_LAY / 2);
    ctx2d.rotate(d.rot);
    ctx2d.globalAlpha = Math.max(0, 1 - d.t / 900);
    ctx2d.fillStyle = hsl(d.hue, 30, 34);
    ctx2d.fillRect(-d.w / 2, -(H_LAY - 2) / 2, d.w, H_LAY - 2);
    ctx2d.fillStyle = hsl(d.hue, 36, 50);
    ctx2d.fillRect(-d.w / 2, -(H_LAY - 2) / 2, d.w, 5);
    ctx2d.globalAlpha = 1;
    ctx2d.restore();
  }

  function updateHUD() { el.score.textContent = S.layers.length - 4; }
  function comboHUD() {
    if (S.combo >= 2) {
      el.combo.textContent = '完美 ×' + S.combo;
      el.combo.classList.add('show');
    } else el.combo.classList.remove('show');
  }

  /* ═══ 主循环 ═══ */
  var lastRAF = 0;
  function loop(now) {
    if (!S.running) return;
    var dt = Math.min(34, now - (lastRAF || now));
    lastRAF = now;
    stepOnce(dt);
    render();
    if (S.running) S.raf = requestAnimationFrame(loop);
  }

  /* ═══ 输入 ═══ */
  window.addEventListener('pointerdown', function (e) {
    if (e.target && e.target.closest && e.target.closest('#btn-snd')) return;
    if (!el.menu.hidden || !el.end.hidden) return;
    if (TAP_LOCK) return;
    tap();
  }, { passive: true });
  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
      e.preventDefault();
      if (!TAP_LOCK && el.menu.hidden && el.end.hidden) tap();
    }
  });

  /* ── 声音开关（系列统一形态） ── */
  var SND_ON =
    '<svg width="20" height="20" viewBox="0 0 20 20">' +
    '<path d="M3 8 h3 l4 -3.4 v10.8 L6 12 H3z" fill="#8fd0a8"/>' +
    '<path d="M13 7 q2 3 0 6 M15.5 5 q3.2 5 0 10" stroke="#ffd97e" stroke-width="1.7" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  var SND_OFF =
    '<svg width="20" height="20" viewBox="0 0 20 20">' +
    '<path d="M3 8 h3 l4 -3.4 v10.8 L6 12 H3z" fill="#8d99b8"/>' +
    '<path d="M13 7.5 l5 5 M18 7.5 l-5 5" stroke="#ff8494" stroke-width="1.9" stroke-linecap="round"/>' +
    '</svg>';
  function sndIcon() {
    el.btnSnd.innerHTML = SFX.on ? SND_ON : SND_OFF;
    el.btnSnd.classList.toggle('off', !SFX.on);
  }
  el.btnSnd.addEventListener('click', function () { SFX.toggle(); sndIcon(); });

  function showMenu() {
    S.mode = 'menu'; S.running = false;
    el.end.hidden = true;
    el.combo.classList.remove('show');
    el.menuBest.textContent = safeStorage.get('mq_g22_best', 0);
    el.menu.hidden = false;
    S.layers = []; S.cur = null; S.debris = [];
    /* 预览塔 */
    for (var b = 0; b < 4; b++) S.layers.push({ n: b, x: (W - W0) / 2, y: BASE_Y + (4 - 1 - b) * H_LAY, w: W0, hue: hueOf(b), perfect: false });
    updateHUD(); render();
  }

  el.menuOk.addEventListener('click', function () { SFX.unlock(); startRun(); });
  el.endOk.addEventListener('click', function () { SFX.unlock(); startRun(); });
  el.endMenu.addEventListener('click', showMenu);

  /* ═══ dev 钩子 ═══ */
  

  /* ═══ 启动 ═══ */
  sndIcon();
  showMenu();
})();
</script>
</body>
</html>
