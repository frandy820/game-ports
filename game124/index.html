<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鞠门争筹 · 口袋游戏机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#171310;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:390px;height:100%;margin:0 auto;background:linear-gradient(180deg,#241c15 0%,#2d231a 46%,#1d1712 100%);overflow:hidden}
#cv{position:absolute;left:0;top:0;width:390px;height:844px;touch-action:none}
/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;width:100%;height:64px;padding:10px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
#hud .rt{display:flex;gap:8px;align-items:center}
.chip{background:rgba(0,0,0,.35);border:1px solid rgba(232,201,106,.25);border-radius:8px;padding:4px 9px;color:#e8dfcc;font-size:12px;letter-spacing:1px}
#roundC{color:#e8c96a;font-weight:600}
#muteBtn,#hintBtn{pointer-events:auto;cursor:pointer;touch-action:none}
#muteBtn.off{opacity:.5}
#hintBtn.used{opacity:.35;filter:saturate(.3)}
/* ---------- 底部操作区 ---------- */
#ctl{position:absolute;left:0;bottom:0;width:100%;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:5}
#powRow{display:flex;gap:10px;justify-content:center;touch-action:none}
.pbtn{flex:0 0 96px;height:44px;border-radius:10px;border:1px solid rgba(232,201,106,.3);background:rgba(0,0,0,.38);color:#cbbfa4;font-size:14px;letter-spacing:2px;cursor:pointer;touch-action:none;transition:transform .08s}
.pbtn:active{transform:scale(.95)}
.pbtn.cur{background:linear-gradient(180deg,#8a6a2f,#6d5122);border-color:#e8c96a;color:#f5e9c8;font-weight:600;box-shadow:0 0 12px rgba(232,201,106,.35)}
#fireBtn{height:52px;border-radius:12px;border:1px solid #e8c96a;background:linear-gradient(180deg,#a8412e,#7d2e20);color:#ffe9d2;font-size:17px;letter-spacing:6px;font-weight:600;cursor:pointer;touch-action:none;box-shadow:0 3px 14px rgba(168,65,46,.4)}
#fireBtn:active{transform:scale(.97)}
#fireBtn:disabled{opacity:.55}
/* ---------- 浮层 ---------- */
.lay{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(12,9,6,.78);backdrop-filter:blur(2px)}
.lay.hide{display:none}
.panel{width:292px;background:linear-gradient(180deg,#2b2218,#211a12);border:1px solid rgba(232,201,106,.4);border-radius:14px;padding:22px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h2{color:#e8c96a;font-size:21px;letter-spacing:5px;margin-bottom:8px}
.panel .sub{color:#b3a686;font-size:13px;line-height:1.7;margin-bottom:14px}
.panel .stars{font-size:26px;letter-spacing:6px;margin-bottom:10px;color:#e8c96a;text-shadow:0 0 10px rgba(232,201,106,.5)}
.panel button{margin-top:8px;width:100%;height:46px;border-radius:10px;border:1px solid #e8c96a;background:linear-gradient(180deg,#8a6a2f,#6d5122);color:#f5e9c8;font-size:15px;letter-spacing:4px;cursor:pointer;touch-action:none}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#f0e6cd;font-size:14px;letter-spacing:2px;padding:9px 18px;border-radius:9px;border:1px solid rgba(232,201,106,.35);z-index:8;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<canvas id="cv" width="390" height="844"></canvas>
<div id="hud">
  <div class="rt"><div class="chip">筹 <span id="goalC">0</span>/5</div><div class="chip" id="roundC">第 1 轮 / 5</div></div>
  <div class="rt">
    <div class="chip" id="hintBtn">密报 ×2</div>
    <div class="chip" id="muteBtn">♪</div>
  </div>
</div>
<div id="ctl">
  <div id="powRow">
    <button class="pbtn" data-p="0">轻 推</button>
    <button class="pbtn cur" data-p="1">中 踢</button>
    <button class="pbtn" data-p="2">满 力</button>
  </div>
  <button id="fireBtn">起 脚</button>
</div>
<div id="toast"></div>
<div class="lay" id="menu">
  <div class="panel">
    <h2>鞠门争筹</h2>
    <div class="sub">宋人蹴鞠点彩门<br>五轮起脚，方向与力度由你<br>门将会读你的心——别总打一点</div>
    <div class="sub" id="menuBest" style="color:#8d8168;font-size:12px"></div>
    <button id="startBtn">开 踢</button>
  </div>
</div>
<div class="lay hide" id="over">
  <div class="panel">
    <h2 id="overTitle">五轮战罢</h2>
    <div class="stars" id="overStars"></div>
    <div class="sub" id="overSub"></div>
    <button id="againBtn">再 战</button>
  </div>
</div>
<script>
'use strict';
/* ================= 常量（SPEC §10 冻结表） ================= */
var P_SCATTER=[0.05,0.10,0.18];
var P_POST=[0.00,0.07,0.20];
var SAVE={0:[1.00,1.00,0.85],1:[0.35,0.15,0.05]};
var PW=['轻','中','满'];
var U=4294967296;
var K_SAVE='g124_save';

/* ================= LCG：splitmix32（g123 同款） ================= */
function mkSm32(seed){var s=seed>>>0;return function(){s=(s+0x9e3779b9)>>>0;var z=s;z=Math.imul(z^(z>>>16),0x21f0aaad)>>>0;z=Math.imul(z^(z>>>5),0x735a2d97)>>>0;return (z^(z>>>15))>>>0;};}
function sm32once(x){var s=x>>>0;s=(s+0x9e3779b9)>>>0;var z=s;z=Math.imul(z^(z>>>16),0x21f0aaad)>>>0;z=Math.imul(z^(z>>>5),0x735a2d97)>>>0;return (z^(z>>>15))>>>0;}

/* ================= 判定核心（与 gentab124.py 同构） ================= */
function neighbors(z){var x=z%3,y=(z/3)|0,r=[],i,nx,ny,D=[[0,-1],[1,0],[0,1],[-1,0]];
  for(i=0;i<4;i++){nx=x+D[i][0];ny=y+D[i][1];if(nx>=0&&nx<3&&ny>=0&&ny<3)r.push(ny*3+nx);}return r;}
function bd(a,b){return Math.max(Math.abs(a%3-b%3),Math.abs(((a/3)|0)-((b/3)|0)));}
function keeperPick(mode,k,aimsHist,gnext){
  if(mode===0)return gnext()%9;
  if(mode===1)return 3+gnext()%6;
  if(mode===2){if(!aimsHist.length)return 7;var best=-1,bz=7,z,c,i;
    for(z=0;z<9;z++){c=0;for(i=0;i<aimsHist.length;i++)if(aimsHist[i]===z)c++;
      if(c>best){best=c;bz=z;}}return bz;}
  if(mode===3)return aimsHist.length?aimsHist[aimsHist.length-1]:6;
  if(mode===4)return [6,7,8,1,0][k];
  if(!aimsHist.length)return 8;
  var w=[0,0,0,0,0,0,0,0,0];if(aimsHist.length>=2)w[aimsHist[aimsHist.length-2]]+=2;
  w[aimsHist[aimsHist.length-1]]+=3;var bw=-1,bz2=8;for(z=0;z<9;z++)if(w[z]>bw){bw=w[z];bz2=z;}return bz2;}
function playRound(aim,P,G,next){ /* 返 {res:'goal'|'save'|'post', Z:z} */
  var r1=next()/U,z=aim;
  if(r1<P_SCATTER[P]){var nb=neighbors(z);z=nb[next()%nb.length];}
  var Z=z;
  if(((Z/3)|0)===0){var r3=next()/U;if(r3<P_POST[P])return {res:'post',Z:Z};}
  var d=bd(G,Z),ps=(d>=2)?0:SAVE[d][P],r4=next()/U;
  return {res:(r4<ps)?'save':'goal',Z:Z};}
function modeSeq(seed){var k,r=[];for(k=0;k<5;k++)r.push(sm32once(((seed*31+k*999331)>>>0))%6);return r;}

/* ================= 状态 ================= */
var S={phase:'menu',seed:0,k:0,goals:0,hints:2,sel:-1,P:1,
  aims:[],gs:[],G:7,modes:[0,0,0,0,0],
  anim:null, /* {t,kind:'fly'|'res',z,Z,fromX,fromY,res} */
  gapT:0,shakeT:0,hintShow:0,winT:0,finalStars:0,
  best:null,played:0,won:0,mute:false};
var MN=null,MG=null; /* 主流/门将流 */

/* ================= DOM ================= */
function $(id){return document.getElementById(id);}
function q(sa){return document.querySelectorAll(sa);}
var cv,ctx;

/* ================= 音效（WebAudio 合成） ================= */
var AC=null;
function ensureAC(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,dur,type,vol){if(S.mute||!AC)return;try{
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol||.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}}
function sndKick(){tone(160,60,.14,'square',.15);}
function sndGoal(){tone(523,784,.16,'triangle',.2);setTimeout(function(){tone(784,1046,.22,'triangle',.16);},110);}
function sndSave(){tone(220,110,.2,'sawtooth',.14);}
function sndPost(){tone(1200,300,.28,'square',.12);}
function sndClick(){tone(660,660,.05,'sine',.08);}

/* ================= 存档 ================= */
function starOf(goals,hints){var cs=goals>=5?3:goals>=4?2:goals>=3?1:0;if(cs===0)return 0;
  var hs=hints<=0?3:hints<=1?2:1;return Math.min(cs,hs);}
function saveAll(){try{localStorage.setItem(K_SAVE,JSON.stringify({v:1,best:S.best,played:S.played,won:S.won,mute:S.mute}));}catch(e){}}
function loadSave(){var raw=null;try{raw=localStorage.getItem(K_SAVE);}catch(e){return;}
  if(!raw)return;var d;try{d=JSON.parse(raw);}catch(e){return;}
  if(!d||d.v!==1)return;
  if(d.best!==null&&d.best!==undefined){if(!Array.isArray(d.best)||d.best.length!==2)return;
    if(typeof d.best[0]!=='number'||typeof d.best[1]!=='number')return;
    if(!isFinite(d.best[0])||!isFinite(d.best[1]))return; /* NaN/Infinity 整档拒 */
    if(d.best[0]<0||d.best[0]>5||d.best[1]<0||d.best[1]>3)return;}
  if(typeof d.played!=='number'||typeof d.won!=='number')return;
  if(!isFinite(d.played)||!isFinite(d.won))return; /* NaN/Infinity 整档拒 */
  if(d.played<0||d.won<0||d.won>d.played||d.played%1!==0||d.won%1!==0)return; /* 非整拒（防 won>played 毒丸档） */
  if(d.mute!==undefined&&typeof d.mute!=='boolean')return; /* 非法 mute 整档拒（赋值前） */
  S.best=(d.best===null||d.best===undefined)?null:[d.best[0],d.best[1]];
  S.played=d.played;
  S.won=d.won;
  if(typeof d.mute==='boolean')S.mute=d.mute;}

/* ================= 流程 ================= */
function newGame(seed){S.seed=(seed===undefined||seed===null)?((Date.now()>>>0)%1000000+1):seed;
  MN=mkSm32(S.seed);MG=mkSm32((S.seed+777777)>>>0);
  S.modes=modeSeq(S.seed);
  S.phase='play';S.k=0;S.goals=0;S.hints=2;S.sel=-1;S.P=1;S.aims=[];S.gs=[];S.anim=null;S.gapT=0;S.hintShow=0;S.winT=0;
  enterRound();
  $('menu').classList.add('hide');$('over').classList.add('hide');updHUD();}
function enterRound(){ /* 门将本轮扑位先定（密报可读） */
  S.G=keeperPick(S.modes[S.k],S.k,S.aims,MG);
  S.anim=null;S.hintShow=0;}
function updHUD(){$('goalC').textContent=S.goals;
  $('roundC').textContent='第 '+(S.k+1)+' 轮 / 5';
  var hb=$('hintBtn');hb.textContent='密报 ×'+S.hints;if(S.hints<=0)hb.classList.add('used');else hb.classList.remove('used');
  $('muteBtn').textContent=S.mute?'✕':'♪';$('muteBtn').classList.toggle('off',S.mute);
  var pb=q('.pbtn'),i;for(i=0;i<pb.length;i++)pb[i].classList.toggle('cur',+pb[i].dataset.p===S.P);
  $('fireBtn').disabled=(S.phase!=='play'||!!S.anim||S.gapT>0);
  if(S.phase==='menu'&&S.best)$('menuBest').textContent='最佳战绩：'+S.best[0]+' 筹 · '+'★☆☆☆'.slice(0,S.best[1])||'';}
function toastMsg(t){var el=$('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(toastMsg._t);toastMsg._t=setTimeout(function(){el.classList.remove('show');},1400);}
function fire(){if(S.phase!=='play')return;
  if(S.sel<0){toastMsg('先在门内择一落点');return;}
  if(S.anim||S.gapT>0)return;
  ensureAC();sndKick();
  var aim=S.sel,P=S.P;
  S.anim={t:0,kind:'fly',aim:aim,P:P,fromX:195,fromY:770};
  updHUD();}
function resolveShot(){ /* anim.kind 'fly' 完成后：判定+演出 */
  var a=S.anim,aim=a.aim,P=a.P;
  var r=playRound(aim,P,S.G,MN);
  S.aims.push(aim);S.gs.push(S.G);
  S.anim={t:0,kind:'res',Z:r.Z,res:r.res,G:S.G};
  if(r.res==='goal'){S.goals++;sndGoal();}
  else if(r.res==='save'){sndSave();}
  else{sndPost();S.shakeT=.5;}
  updHUD();}
function endRound(){S.k++;
  if(S.k>=5){finishGame();return;}
  enterRound();updHUD();}
function finishGame(){S.phase='over';S.played++;
  var st=starOf(S.goals,S.hints);S.finalStars=st;
  if(st>=1)S.won++;
  if(!S.best||S.goals>S.best[0]||(S.goals===S.best[0]&&st>S.best[1]))S.best=[S.goals,st];
  saveAll();
  $('overTitle').textContent=S.goals>=5?'五球全中':(S.goals>=3?'战罢收筹':'门神当道');
  var stars='';var i;for(i=0;i<3;i++)stars+=i<st?'★':'☆';
  $('overStars').textContent=stars;
  $('overSub').innerHTML='五轮 '+S.goals+' 筹'+(S.hints<2?'（密报 ×'+(2-S.hints)+'）':'')+'<br>'+
    (st>=3?'满筹封侯，鞠圣之名传彩楼':st>=2?'四筹之功，可入鞠社':st>=1?'三筹立身，再来':'换个打法：别让门神猜中你');
  $('over').classList.remove('hide');
  S.winT=0;updHUD();}

/* ================= 绘制 ================= */
var G={ox:30,oy:190,gw:330,gh:270}; /* 门框区 */
function cellRect(z){var cw=G.gw/3,ch=G.gh/3,x=z%3,y=(z/3)|0;
  return {x:G.ox+x*cw,y:G.oy+y*ch,w:cw,h:ch};}
var FONT='"PingFang SC","Microsoft YaHei",system-ui,sans-serif';
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBall(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='#7a5230';ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.fill();
  ctx.strokeStyle='#4a2f18';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.stroke();
  var i;for(i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,0,r,r*Math.abs(Math.cos(i*Math.PI/4+.3)),i*Math.PI/4,0,6.2832);ctx.stroke();}
  ctx.fillStyle='#93683e';ctx.beginPath();ctx.arc(-r*.28,-r*.3,r*.34,0,6.2832);ctx.fill();
  ctx.restore();}
function drawKeeper(gx,gy,pose){ /* pose 0待机 1扑救伸展 */
  ctx.save();ctx.translate(gx,gy);
  var s=pose?1.25:1;
  /* 襕衫身 */
  ctx.fillStyle=pose?'#8a4a3a':'#6e4038';
  rr(-13*s,-16,26*s,34,7*s);ctx.fill();
  ctx.strokeStyle='#e8c96a';ctx.lineWidth=1.2;rr(-13*s,-16,26*s,34,7*s);ctx.stroke();
  /* 交领 */
  ctx.strokeStyle='#caa46a';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-6,-15);ctx.lineTo(0,-4);ctx.lineTo(6,-15);ctx.stroke();
  /* 头 */
  ctx.fillStyle='#e8ceaa';ctx.beginPath();ctx.arc(0,-24,8,0,6.2832);ctx.fill();
  /* 幞头 */
  ctx.fillStyle='#3a2c22';rr(-9,-32,18,6,2);ctx.fill();
  /* 臂 */
  ctx.strokeStyle='#6e4038';ctx.lineWidth=5;ctx.lineCap='round';
  if(pose){ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(-30*s,-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(12,-10);ctx.lineTo(28*s,-18);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(-22,2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(12,-10);ctx.lineTo(22,2);ctx.stroke();}
  /* 腿 */
  ctx.strokeStyle='#3d3129';ctx.lineWidth=5;
  if(pose){ctx.beginPath();ctx.moveTo(-6,16);ctx.lineTo(-16*s,34);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,16);ctx.lineTo(14*s,32);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(-6,17);ctx.lineTo(-7,34);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(7,34);ctx.stroke();}
  ctx.restore();}
function drawGate(){var i;
  /* 夜场地面 */
  var gr=ctx.createRadialGradient(195,640,40,195,640,420);
  gr.addColorStop(0,'rgba(232,201,106,.14)');gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(0,330,390,420);
  /* 网底 */
  ctx.fillStyle='#1a140e';ctx.fillRect(G.ox,G.oy,G.gw,G.gh);
  /* 网格线（3×3） */
  ctx.strokeStyle='rgba(203,191,164,.16)';ctx.lineWidth=1;
  for(i=1;i<3;i++){ctx.beginPath();ctx.moveTo(G.ox+i*G.gw/3,G.oy);ctx.lineTo(G.ox+i*G.gw/3,G.oy+G.gh);ctx.stroke();
    ctx.beginPath();ctx.moveTo(G.ox,G.oy+i*G.gh/3);ctx.lineTo(G.ox+G.gw,G.oy+i*G.gh/3);ctx.stroke();}
  /* 网纹（斜织细线） */
  ctx.strokeStyle='rgba(203,191,164,.07)';
  for(i=-G.gh;i<G.gw;i+=18){ctx.beginPath();ctx.moveTo(G.ox+i,G.oy);ctx.lineTo(G.ox+i+G.gh,G.oy+G.gh);ctx.stroke();}
  /* 密报高亮：门将本轮真实扑位 */
  if(S.hintShow>0&&S.phase==='play'){var hr=cellRect(S.G);
    ctx.fillStyle='rgba(232,201,106,'+(.18+.1*Math.sin(S.hintShow*9))+')';
    ctx.fillRect(hr.x+3,hr.y+3,hr.w-6,hr.h-6);
    ctx.strokeStyle='#e8c96a';ctx.lineWidth=2;ctx.strokeRect(hr.x+3,hr.y+3,hr.w-6,hr.h-6);}
  /* 选中落点标记 */
  if(S.sel>=0&&S.phase==='play'&&!S.anim){var cr=cellRect(S.sel);
    ctx.strokeStyle='rgba(168,214,177,.9)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(cr.x+cr.w/2,cr.y+cr.h/2,10,0,6.2832);ctx.stroke();
    ctx.fillStyle='rgba(168,214,177,.5)';ctx.beginPath();ctx.arc(cr.x+cr.w/2,cr.y+cr.h/2,4,0,6.2832);ctx.fill();}
  /* 彩柱 */
  ctx.fillStyle='#8a3b2c';ctx.fillRect(G.ox-12,G.oy-8,12,G.gh+16);ctx.fillRect(G.ox+G.gw,G.oy-8,12,G.gh+16);
  /* 横梁 */
  ctx.fillStyle='#8a3b2c';ctx.fillRect(G.ox-12,G.oy-14,G.gw+24,12);
  ctx.fillStyle='#c9a15a';ctx.fillRect(G.ox-12,G.oy-14,G.gw+24,4);
  /* 柱顶金线脚（横梁之后画，防遮） */
  ctx.fillStyle='#c9a15a';ctx.fillRect(G.ox-12,G.oy-4,12,5);ctx.fillRect(G.ox+G.gw,G.oy-4,12,5);
  /* 柱上彩带 */
  var cs=['#a8412e','#c9a15a','#5a7a5e','#7a5a8a'];
  for(i=0;i<4;i++){ctx.fillStyle=cs[i];ctx.fillRect(G.ox-12,G.oy+8+i*66,12,22);ctx.fillRect(G.ox+G.gw,G.oy+8+i*66,12,22);}
  /* 门楣旗 */
  ctx.fillStyle='#c9a15a';ctx.fillRect(165,G.oy-44,60,26);
  ctx.fillStyle='#7d2e20';ctx.font='13px '+FONT;ctx.textAlign='center';ctx.fillText('鞠 门',195,G.oy-26);}
function keeperPos(){ /* 待机居中；res 演出三态均向本轮扑位 G 滑移公开（SPEC §1/§3；fly 期不预移=不泄露） */
  if(S.anim&&S.anim.kind==='res'){
    var cr=cellRect(S.anim.G),c0=cellRect(7),p=Math.min(1,S.anim.t/.22);
    var tx=cr.x+cr.w/2,ty=cr.y+cr.h/2-14,sx=c0.x+c0.w/2,sy=c0.y+c0.h/2-14;
    return {x:sx+(tx-sx)*p,y:sy+(ty-sy)*p,pose:S.anim.res==='save'?1:0};}
  var c0=cellRect(7);return {x:c0.x+c0.w/2,y:c0.y+c0.h/2-14,pose:0};}
function drawScoreSticks(){ /* 左上筹签：5 根竹筹，进一朱染 */
  var i;for(i=0;i<5;i++){var x=22,y=560+i*34;
    ctx.fillStyle=i<S.goals?'#a8412e':'#5a4a36';rr(x,y,10,26,3);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=1;rr(x,y,10,26,3);ctx.stroke();
    if(i<S.goals){ctx.fillStyle='#e8c96a';ctx.fillRect(x+2,y+4,6,2);}}
  ctx.fillStyle='rgba(232,201,106,.75)';ctx.font='11px '+FONT;ctx.textAlign='center';
  ctx.fillText('筹',27,716);}
function drawGroundBall(){ /* 待射门前的球（底部起脚点） */
  if(S.phase!=='play')return;
  if(S.anim&&S.anim.kind==='fly')return;
  drawBall(195,770,17,(S.anim?0:(performance.now()/900)%6.28));}
function drawFly(t){ /* 飞行演出：起脚点→落区，弧线 */
  var a=S.anim,cr=cellRect(a.Z!==undefined?a.Z:a.aim);
  var tx=cr.x+cr.w/2,ty=cr.y+cr.h/2;
  var p=Math.min(1,t/.5);
  var x=a.fromX+(tx-a.fromX)*p;
  var y=a.fromY+(ty-a.fromY)*p-Math.sin(p*Math.PI)*90*(a.P===0?1.5:a.P===2?.6:1);
  drawBall(x,y,17,p*7);}
function drawRes(t){var a=S.anim,cr=cellRect(a.Z),cx=cr.x+cr.w/2,cy=cr.y+cr.h/2;
  if(a.res==='goal'){ /* 网窝鼓动+金光 */
    ctx.strokeStyle='rgba(232,201,106,'+(0.7*(1-t))+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,18+t*30,0,6.2832);ctx.stroke();
    ctx.strokeStyle='rgba(232,201,106,'+(0.45*(1-t))+')';
    ctx.beginPath();ctx.arc(cx,cy,10+t*44,0,6.2832);ctx.stroke();
    drawBall(cx,cy+t*8,17,0);
    ctx.fillStyle='rgba(232,201,106,.95)';ctx.font='600 17px '+FONT;ctx.textAlign='center';
    ctx.fillText('筹 +1',cx,cr.y-14);}
  else if(a.res==='save'){drawBall(cx+ t*70,cy+t*46,17,t*3);}
  else{ /* post：横梁弹飞 */
    drawBall(cx+(t*140-20),G.oy-40-t*120,17,t*8);}
  /* 门将扑向 */
  }
function draw(t){ctx.clearRect(0,0,390,844);
  /* 背景夜幕 */
  var bg=ctx.createLinearGradient(0,0,0,844);
  bg.addColorStop(0,'#151109');bg.addColorStop(.4,'#241c15');bg.addColorStop(1,'#1a140f');
  ctx.fillStyle=bg;ctx.fillRect(0,0,390,844);
  /* 远处灯楼剪影 */
  ctx.fillStyle='rgba(0,0,0,.25)';
  ctx.fillRect(10,120,50,90);ctx.fillRect(320,110,60,100);ctx.fillRect(90,140,40,70);
  ctx.fillStyle='rgba(232,201,106,.12)';
  ctx.fillRect(24,138,8,8);ctx.fillRect(40,138,8,8);ctx.fillRect(334,128,8,8);ctx.fillRect(352,128,8,8);
  /* 地面 */
  ctx.fillStyle='#211912';ctx.fillRect(0,620,390,224);
  ctx.strokeStyle='rgba(232,201,106,.06)';ctx.lineWidth=1;
  var i;for(i=0;i<9;i++){ctx.beginPath();ctx.moveTo(0,640+i*24);ctx.lineTo(390,640+i*24);ctx.stroke();}
  /* 震屏 */
  ctx.save();
  if(S.shakeT>0){var sh=S.shakeT*8;ctx.translate(Math.sin(t*70)*sh,Math.cos(t*60)*sh*.6);}
  drawGate();
  var kp=keeperPos();drawKeeper(kp.x,kp.y,kp.pose);
  drawScoreSticks();
  ctx.restore();
  drawGroundBall();
  if(S.anim&&S.anim.kind==='fly')drawFly(S.anim.t);
  if(S.anim&&S.anim.kind==='res')drawRes(S.anim.t);
  /* 演出提示字 */
  if(S.anim&&S.anim.kind==='res'&&S.anim.t<.9){
    ctx.font='600 21px '+FONT;ctx.textAlign='center';
    if(S.anim.res==='goal'){ctx.fillStyle='rgba(232,201,106,'+(1-S.anim.t)+')';ctx.fillText('应弦入网',195,150);}
    else if(S.anim.res==='save'){ctx.fillStyle='rgba(200,190,170,'+(1-S.anim.t)+')';ctx.fillText('门神扑出',195,150);}
    else{ctx.fillStyle='rgba(220,150,120,'+(1-S.anim.t)+')';ctx.fillText('击楣而飞',195,150);}}
  /* 密报提示 */
  if(S.hintShow>0){ctx.fillStyle='rgba(232,201,106,.9)';ctx.font='12px '+FONT;ctx.textAlign='center';
    ctx.fillText('密报：门神将扑此格',195,G.oy+G.gh+24);}}

/* ================= 主循环 ================= */
var LAST=0;
function loop(ts){var dt=Math.min(.05,(ts-LAST)/1000||0);LAST=ts;
  if(S.anim){S.anim.t+=dt;
    if(S.anim.kind==='fly'&&S.anim.t>=.5)resolveShot();
    else if(S.anim.kind==='res'){
      if(S.anim.t>=1.1){S.anim=null;S.gapT=.2;}}}
  if(!S.anim&&S.gapT>0&&S.phase==='play'){ /* 轮间 0.2s 间锁（SPEC §5/§10） */
    S.gapT-=dt;if(S.gapT<=0){S.gapT=0;endRound();}}
  if(S.shakeT>0)S.shakeT=Math.max(0,S.shakeT-dt);
  if(S.hintShow>0){S.hintShow-=dt;if(S.hintShow<=0){S.hintShow=0;}}
  draw(ts/1000);
  requestAnimationFrame(loop);}
function wake(){ensureAC();}

/* ================= 输入 ================= */
function bindEvents(){
  cv.addEventListener('pointerdown',function(e){wake();
    if(S.phase!=='play'||S.anim||S.gapT>0)return;
    var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*390/r.width,y=(e.clientY-r.top)*844/r.height;
    if(x>G.ox+4&&x<G.ox+G.gw-4&&y>G.oy+4&&y<G.oy+G.gh-4){
      var zx=Math.min(2,Math.max(0,((x-G.ox)/(G.gw/3))|0));
      var zy=Math.min(2,Math.max(0,((y-G.oy)/(G.gh/3))|0));
      S.sel=zy*3+zx;sndClick();}});
  cv.addEventListener('pointercancel',function(){/* 清态不动作 */});
  var pb=q('.pbtn'),i;
  for(i=0;i<pb.length;i++)pb[i].addEventListener('pointerdown',function(e){wake();
    if(S.phase!=='play'||S.anim||S.gapT>0)return;S.P=+this.dataset.p;sndClick();updHUD();});
  $('fireBtn').addEventListener('pointerdown',function(e){wake();fire();});
  $('hintBtn').addEventListener('pointerdown',function(e){wake();
    if(S.phase!=='play'||S.anim||S.gapT>0)return;
    if(S.hints<=0){toastMsg('密报已用尽');return;}
    S.hints--;S.hintShow=2;updHUD();sndClick();});
  $('muteBtn').addEventListener('pointerdown',function(e){wake();S.mute=!S.mute;saveAll();updHUD();});
  $('startBtn').addEventListener('pointerdown',function(){wake();ensureAC();newGame();});
  $('againBtn').addEventListener('pointerdown',function(){wake();ensureAC();newGame();});
  document.addEventListener('visibilitychange',function(){if(document.hidden)saveAll();});
  window.addEventListener('pointerup',function(){/* 演出锁兜底：无拖拽态可挂 */});
  window.addEventListener('blur',function(){saveAll();});}

/* ================= boot ================= */
function boot(){cv=$('cv');ctx=cv.getContext('2d');
  loadSave();bindEvents();updHUD();
  if(S.phase==='menu'){$('menu').classList.remove('hide');}
  requestAnimationFrame(loop);}
boot();

</script>
<script src="../shell.js" defer></script>
</body>
