<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6ead6">
<title>灶糖 · 离线版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='4' y='4' width='40' height='40' rx='9' fill='%23f6ead6'/%3E%3Ccircle cx='19' cy='22' r='9' fill='%23e05a4e'/%3E%3Ccircle cx='31' cy='28' r='9' fill='%2358b878'/%3E%3C/svg%3E">
<style>
  :root{
    --bg1:#f6ead6; --bg2:#e8d4b8; --txt:#3a2c20; --sub:#8a7458;
    --brick:#c9553f; --gold:#c07820; --line:rgba(120,88,50,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:linear-gradient(180deg,var(--bg1) 0%,#f0e0c6 55%,var(--bg2) 100%);color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    overflow:hidden;position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
  #bgc{position:absolute;inset:0;width:375px;height:812px}

  #hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:14px;right:60px;z-index:6;
    display:flex;align-items:center;gap:10px;pointer-events:none}
  #title{font-size:20px;font-weight:800;color:#fff;letter-spacing:.1em;
    padding:2px 10px;border:1px solid #8a4a34;border-radius:6px;
    background:linear-gradient(180deg,#d4654e,#b84834);
    box-shadow:inset 0 1px 0 rgba(255,235,220,.35), 0 1px 3px rgba(90,40,20,.35)}
  #badge{font-size:11px;font-weight:800;color:#fff8ec;background:#a04a2c;padding:2px 8px;
    border-radius:5px;letter-spacing:.14em;box-shadow:0 1px 0 rgba(90,40,20,.4)}
  #btn-home{margin-left:auto;pointer-events:auto;width:36px;height:36px;border:1px solid #b09468;border-radius:10px;
    background:#f4e6cc;color:#8a6a42;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(120,80,40,.25)}
  #btn-home:active{transform:translateY(1px);box-shadow:none}
  #btn-snd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:40;
    width:36px;height:36px;border:1px solid #b09468;border-radius:10px;background:#f4e6cc;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(120,80,40,.25);pointer-events:auto}
  #btn-snd.off{opacity:.55}

  #qbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:16px;right:16px;z-index:6;
    display:flex;align-items:center;gap:12px}
  #scorewrap{display:flex;flex-direction:column;gap:1px}
  #score{font-size:27px;font-weight:800;color:#4a3222;font-variant-numeric:tabular-nums;line-height:1}
  #scorelab{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.16em}
  #combo{display:none;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:800;
    color:#b8482a;letter-spacing:.1em;background:rgba(224,90,78,.13);border:1px solid rgba(224,90,78,.5)}
  #combo.show{display:block}
  #combo.pop{animation:cpop .35s ease}
  @keyframes cpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
  #progressw{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  #proglab{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.1em}
  #progbar{width:110px;height:7px;border-radius:4px;background:rgba(120,88,50,.18);overflow:hidden}
  #progfill{height:100%;width:0%;background:linear-gradient(90deg,#58b878,#e09040);border-radius:4px;transition:width .2s linear}
  #progfill.hot{background:linear-gradient(90deg,#e09040,#d44834)}

  /* 珠：外层 .zr 只管定位，内层 .zd 只管形态动画（game14/39/40 教训） */
  .zr{position:absolute;left:0;top:0;width:26px;height:26px;will-change:transform;transition:transform .16s linear}
  .zd{position:absolute;inset:0;border-radius:50%;
    box-shadow:0 2px 3px rgba(90,50,20,.35), inset -2px -3px 5px rgba(60,20,5,.28);
    border:1.2px solid rgba(255,250,240,.35)}
  .zd::before{content:"";position:absolute;left:4px;top:3px;width:7px;height:5px;border-radius:50%;
    background:rgba(255,255,255,.85);filter:blur(.4px);transform:rotate(-24deg)}
  .zd::after{content:"";position:absolute;right:3px;bottom:3px;width:5px;height:3px;border-radius:50%;
    background:rgba(255,235,210,.35);filter:blur(.8px)}
  .c1{background:radial-gradient(circle at 36% 32%, #f09488, #e05a4e 55%, #a03428 100%)}
  .c2{background:radial-gradient(circle at 36% 32%, #fad890, #f2a028 55%, #b05a14 100%)}
  .c3{background:radial-gradient(circle at 36% 32%, #9ce0ae, #58b878 55%, #2a7848 100%)}
  .c4{background:radial-gradient(circle at 36% 32%, #94e0da, #44b4c4 55%, #1e7284 100%)}
  .c5{background:radial-gradient(circle at 36% 32%, #9cb4f0, #5a82d8 55%, #2c4890 100%)}
  .c6{background:radial-gradient(circle at 36% 32%, #f2e9d6, #dcccac 55%, #9a8c66 100%);
    border:1.4px solid rgba(96,74,48,.85)}
  .zd.sm{width:24px;height:24px}
  .zd.sm::before{width:6px;height:4px;left:3.5px;top:2.5px}
  .zd.born{animation:dborn .2s ease-out}
  @keyframes dborn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .zd.poppy{animation:dpop .27s ease forwards}
  @keyframes dpop{0%{transform:scale(1);filter:brightness(1.5);opacity:1}
    55%{transform:scale(1.35);filter:brightness(2);opacity:1}
    100%{transform:scale(1.55);opacity:0;filter:brightness(2.4)}}
  .zd.swaproll{animation:sroll .24s ease}
  @keyframes sroll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.82)}100%{transform:rotate(360deg) scale(1)}}
  .zd.intopot{animation:ipot .34s ease-in forwards}
  @keyframes ipot{0%{transform:scale(1);opacity:1}
    100%{transform:scale(.2) translateY(14px);opacity:0;filter:brightness(1.6)}}
  .zd.jumpup{animation:jup .8s cubic-bezier(.3,.5,.6,1) forwards}
  @keyframes jup{0%{transform:translateY(0) scale(.5);opacity:0}
    20%{opacity:1;transform:translateY(-46px) scale(1)}
    100%{transform:translateY(-140px) scale(.9);opacity:0}}

  #curb{position:absolute;left:174.5px;top:684px;width:26px;height:26px;z-index:8}
  #curb .zd{animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  #nextw{position:absolute;left:108px;top:726px;width:44px;height:44px;z-index:8;border-radius:50%;
    border:1.5px dashed rgba(160,110,60,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
  #nextw:active{background:rgba(200,150,90,.12)}
  #nextw .zd{position:relative}
  #nextlab{position:absolute;left:108px;top:772px;width:44px;text-align:center;font-size:9.5px;
    color:var(--sub);letter-spacing:.14em;font-weight:700;z-index:8}
  #aimc{position:absolute;left:0;top:96px;width:375px;height:620px;z-index:5;pointer-events:none}

  #flash{position:absolute;left:0;right:0;top:270px;text-align:center;font-size:26px;font-weight:800;
    color:#b8482a;letter-spacing:.1em;z-index:15;opacity:0;pointer-events:none;
    text-shadow:0 2px 10px rgba(255,244,226,.9)}
  #flash.show{animation:flashy 1s ease forwards}
  @keyframes flashy{0%{opacity:0;transform:translateY(10px) scale(.85)}
    18%{opacity:1;transform:translateY(0) scale(1.06)}
    30%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

  .crumb{position:absolute;width:6px;height:6px;pointer-events:none;z-index:14;
    animation:crany .95s ease-out forwards}
  @keyframes crany{0%{transform:translate(0,0) scale(1) rotate(0);opacity:1}
    80%{opacity:.85}
    100%{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(160deg);opacity:0}}
  .ps{position:absolute;font-size:17px;font-weight:800;color:#e07820;pointer-events:none;z-index:15;
    text-shadow:0 1px 3px rgba(255,248,232,.9);animation:psfloat .9s ease-out forwards;white-space:nowrap}
  @keyframes psfloat{0%{transform:translateY(0);opacity:0}18%{opacity:1}
    100%{transform:translateY(-34px);opacity:0}}
  .spark{position:absolute;width:10px;height:10px;pointer-events:none;z-index:14;
    background:radial-gradient(circle, #fff8e0 0%, rgba(255,220,140,.9) 60%, transparent 70%);
    filter:brightness(1.15);
    animation:spany .5s ease-out forwards}
  @keyframes spany{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.2);opacity:0}}

  #t-reset{position:absolute;right:14px;top:722px;width:52px;height:52px;z-index:8;
    border:1px solid #b09468;border-radius:12px;background:#f4e6cc;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 7px rgba(120,80,40,.3);color:#8a6a42;font-size:11.5px;font-weight:700;letter-spacing:.05em}
  #t-reset:active{transform:translateY(2px);box-shadow:none}
  #t-reset svg{display:block;margin-bottom:2px}

  footer{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
    text-align:center;font-size:10.5px;font-weight:600;color:rgba(110,84,54,.85);letter-spacing:.05em;
    pointer-events:none;z-index:30}

  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(64,44,26,.5);z-index:20;backdrop-filter:blur(2px)}
  .layer[hidden]{display:none}
  .lpanel{display:flex;flex-direction:column;gap:13px;width:min(86vw,340px);
    background:#f8ecd6;border:1px solid #c8a878;border-radius:18px;padding:24px 26px;
    box-shadow:0 14px 40px rgba(90,50,20,.45), inset 0 1px 0 rgba(255,250,238,.7)}
  .lt{font-size:18px;font-weight:800;color:#5a3a22;letter-spacing:.14em;text-align:center}
  .ld{font-size:13.5px;color:#8a6a48;line-height:1.9;text-align:center}
  .ld b{color:#5a3a22}
  .layer button{padding:11px 0;font-size:15px;font-weight:700;color:#fff8ec;background:#c05a38;
    border:none;border-radius:12px;cursor:pointer;box-shadow:0 3px 0 rgba(120,50,26,.55);letter-spacing:.1em}
  .layer button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(120,50,26,.55)}
  .layer button.ghost{background:transparent;color:#8a6a48;border:1px solid #c8a878;box-shadow:none}
  #menu .demo{display:flex;justify-content:center;gap:9px;margin:2px 0 4px}
  #menu .demo .zd{position:relative;inset:auto}
  #menu .bestrow{font-size:12px;color:var(--sub);text-align:center;line-height:1.8}
  #menu .bestrow b{color:#8a5a2c;font-variant-numeric:tabular-nums}
  #end .big{font-size:44px;font-weight:800;color:#4a3222;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #end .stats{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--sub);
    line-height:1.55;margin-top:3px}
  #end .stats b{color:#5a3a22;font-size:17px;font-variant-numeric:tabular-nums}
  #end .bestrow{font-size:12px;color:var(--sub);text-align:center;margin-top:2px}
  #end .bestrow b{color:#b06a1e;font-variant-numeric:tabular-nums}
  .rec{display:none;margin:0 auto;width:max-content;padding:4px 14px;border-radius:99px;
    font-size:12px;color:#b8482a;font-weight:700;letter-spacing:.1em;
    background:rgba(224,90,78,.12);border:1px solid rgba(224,90,78,.5)}
  .rec.show{display:block;animation:rpop .6s ease both, rglow 1.9s ease-in-out .6s infinite}
  @keyframes rpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes rglow{0%,100%{box-shadow:0 0 0 0 rgba(224,90,78,0)}50%{box-shadow:0 0 12px 2px rgba(224,90,78,.35)}}

  /* 蒸汽循环 */
  .steam{position:absolute;border-radius:50%;background:radial-gradient(circle, rgba(255,253,246,.85) 0%, rgba(255,252,244,0) 70%);
    pointer-events:none;z-index:3;animation:sty 2.6s ease-out infinite}
  @keyframes sty{0%{transform:translateY(0) scale(.5);opacity:0}
    18%{opacity:.9}
    100%{transform:translateY(-46px) scale(1.3);opacity:0}}
</style>
</head>
<body>

<canvas id="aimc" width="375" height="620"></canvas>
<div id="bubs" style="position:absolute;left:0;top:0;right:0;bottom:0;z-index:2"></div>

  <div id="badge">灶 L1</div>

</button>

<footer>灶糖 · 完全离线 · 三连同味即爆</footer>

  <div class="lpanel">

<script>
(function () {
  'use strict';

  function mulberry(seed) { var t = seed >>> 0; return function () { t += 0x6D2B79F5; var r2 = Math.imul(t ^ (t >>> 15), 1 | t); r2 ^= r2 + Math.imul(r2 ^ (r2 >>> 7), 61 | r2); return ((r2 ^ (r2 >>> 14)) >>> 0) / 4294967296; }; }

  var safeStorage = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var SFX = (function () {
    var ctx = null, on = safeStorage.get('mq_g41_sound', false);
    function ac() {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(type, f0, f1, t, vol, when) {
      if (!on) return;
      var c = ac(); if (!c) return;
      var o = c.createOscillator(), g = c.createGain();
      var t0 = c.currentTime + (when || 0);
      o.type = type; o.frequency.setValueAtTime(f0, t0);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + t);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + t + .02);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + t + .04);
    }
    return {
      unlock: function () { ac(); },
      toggle: function () { on = !on; safeStorage.set('mq_g41_sound', on); return on; },
      isOn: function () { return on; },
      shot: function () { tone('triangle', 420, 200, .08, .05); },
      hit: function () { tone('sine', 260, null, .05, .05); tone('square', 700, null, .016, .018); },
      blip: function () { tone('sine', 680, null, .05, .04); },

  async function winLevel() {
    if (S.mode !== 'play') return;
    S.mode = 'won';
    S.lock = true;
    var bonus = 200 + 50 * S.level;
    S.score += bonus;
    SFX.win();
    flashMsg('清锅出糖 +' + bonus);
    celebrate();
    renderHUD();
    await sleep(1150);
    S.level++;
    startLevel(false);
  }
  function celebrate() {
    for (var i = 0; i < 3; i++) {
      (function (j) {
        setTimeout(function () {
          var o = document.createElement('div');
          o.className = 'zr';
          o.style.transition = 'none';
          var b = document.createElement('div');
          b.className = 'zd c' + (1 + j) + ' jumpup';
          o.appendChild(b);
          setTf(o, 150 + j * 37, 470);
          el.fx.appendChild(o);
          setTimeout(function () { o.remove(); }, 1000);
        }, j * 90);
      })(i);
    }
  }
  function endGame(title) {
    if (S.mode === 'end') { /* potDeath 已置 end */ }
    var best = safeStorage.get('mq_g41_best', null);
    var rec = best == null || S.score > best;
    if (rec) safeStorage.set('mq_g41_best', S.score);
    el.endTitle.textContent = title || '熬糊一锅';
    el.endScore.textContent = S.score;
    el.endLv.textContent = 'L' + S.level;
    el.endMax.textContent = S.maxPop;
    el.endTotal.textContent = S.totalPopped;
    el.endBest.textContent = rec ? S.score : best;
    el.endRec.classList.toggle('show', rec);
    setTimeout(function () { if (S.mode === 'end' || S.mode === 'won') el.end.hidden = false; }, 640);
    return true;
  }
  function showMenu() {
    S.mode = 'menu'; S.lock = true;
    el.end.hidden = true;
    var b = safeStorage.get('mq_g41_best', null);
    el.menuBest.textContent = b == null ? '—' : b;
    el.menu.hidden = false;
    clearAim();
  }

  /* ── 输入 ── */
  function updateAim(px, py) {
    var dx = px - CX, dy = py - CY;
    if (Math.hypot(dx, dy) < 26) return;
    S.aimAng = clampAim(dx, dy);
    drawAim(S.aimAng);
  }
  document.addEventListener('pointerdown', function (ev) {
    if (S.mode !== 'play' || S.lock) return;
    var t = ev.target;
    if (t.closest && (t.closest('button') || t.closest('.layer') || t.closest('#nextw'))) return;
    if (ev.clientY > 688) return;
    S.aiming = true;
    updateAim(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointermove', function (ev) {
    if (S.aiming && S.mode === 'play') updateAim(ev.clientX, ev.clientY);
  });
  document.addEventListener('pointerup', function () {
    if (!S.aiming) return;
    S.aiming = false;
    clearAim();
    if (S.mode === 'play' && !S.lock) fire(S.aimAng);
  });
  el.nextw.addEventListener('pointerdown', function (ev) {
    ev.stopPropagation();
    if (S.mode !== 'play' || S.lock) return;
    var t = S.cur; S.cur = S.next; S.next = t;
    SFX.blip();
    renderCannon(true);
  });
  el.tReset.addEventListener('pointerdown', function (ev) {
    ev.stopPropagation();
    if (S.mode !== 'play' || S.lock) return;
    startGame();
  });
  el.btnHome.addEventListener('click', function () { if (S.mode !== 'menu') showMenu(); });
  el.menuGo.addEventListener('click', function () { SFX.unlock(); startGame(); });
  el.endOk.addEventListener('click', function () { startGame(); });
  el.endMenu.addEventListener('click', showMenu);

  /* ── 静态底 ── */
  (function drawBG() {
    var g = el.bgc.getContext('2d');
    var rr = mulberry(20260907);
    /* 灶砖纹淡格 */
    g.strokeStyle = 'rgba(150,90,50,.07)'; g.lineWidth = 1;
    for (var y = 96; y < 812; y += 44) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(375, y); g.stroke();
    }
    for (var x = 0; x < 375; x += 52) {
      var off = (((y - 96) / 44) | 0) % 2 ? 26 : 0;
      g.beginPath(); g.moveTo(x + off, 96); g.lineTo(x + off, 812); g.stroke();
    }
    /* 木梁影（顶部横梁） */
    var bg1 = g.createLinearGradient(0, 88, 0, 116);
    bg1.addColorStop(0, 'rgba(110,70,36,.18)'); bg1.addColorStop(1, 'rgba(110,70,36,0)');
    g.fillStyle = bg1; g.fillRect(0, 88, 375, 28);
    /* 糖粉微点 */
    for (var i = 0; i < 40; i++) {
      var sx = rr() * 375, sy = 100 + rr() * 600, a = .12 + rr() * .3;
      g.beginPath(); g.arc(sx, sy, .7 + rr() * 1.1, 0, 7);
      g.fillStyle = 'rgba(255,252,240,' + a.toFixed(2) + ')'; g.fill();
    }
    /* 底部灶台横带 */
    g.fillStyle = 'rgba(140,84,44,.14)'; g.fillRect(0, 648, 375, 4);
    var bg2 = g.createLinearGradient(0, 648, 0, 690);
    bg2.addColorStop(0, 'rgba(140,84,44,.1)'); bg2.addColorStop(1, 'rgba(140,84,44,0)');
    g.fillStyle = bg2; g.fillRect(0, 652, 375, 38);
  })();

  /* 蒸汽（DOM 循环动画） */
  (function makeSteam() {
    for (var i = 0; i < 3; i++) {
      var st = document.createElement('div');
      st.className = 'steam';
      var sz = 18 + i * 6;
      st.style.cssText += 'width:' + sz + 'px;height:' + sz + 'px;left:' + (176 + i * 9) + 'px;top:' + (468 - i * 6) + 'px;animation-delay:' + (i * .85) + 's';
      document.body.appendChild(st);
    }
  })();

  /* ── 声音开关（系列统一形态） ── */
  var SND_ON =
    '<svg width="20" height="20" viewBox="0 0 20 20">' +
    '<path d="M3 8 h3 l4 -3.4 v10.8 L6 12 H3z" fill="#c07820"/>' +
    '<path d="M13 7 q2 3 0 6 M15.5 5 q3.2 5 0 10" stroke="#8a6a34" stroke-width="1.7" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  var SND_OFF =
    '<svg width="20" height="20" viewBox="0 0 20 20">' +
    '<path d="M3 8 h3 l4 -3.4 v10.8 L6 12 H3z" fill="#8a7458"/>' +
    '<path d="M13 7.5 l5 5 M18 7.5 l-5 5" stroke="#c9553f" stroke-width="1.9" stroke-linecap="round"/>' +
    '</svg>';
  function sndIcon() {
    el.btnSnd.innerHTML = SFX.isOn() ? SND_ON : SND_OFF;
    el.btnSnd.classList.toggle('off', !SFX.isOn());
  }
  el.btnSnd.addEventListener('click', function () { SFX.toggle(); sndIcon(); });

  

  /* ═══ 启动 ═══ */
  sndIcon();
  showMenu();
  startLoop();
})();
</script>
</body>
</html>
