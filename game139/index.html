#app{position:relative;width:390px;height:844px;margin:0 auto;background:linear-gradient(180deg,#0b0e1e 0%,#141026 40%,#1a1430 100%)}

.mtitle{font-size:34px;color:#dfe8f8;letter-spacing:12px;margin:6px 0 2px;text-indent:12px}
.msub{font-size:12px;color:#8a94b8;letter-spacing:3px;margin-bottom:26px}
.mbtn{min-width:200px;padding:11px 0;margin:7px;border:1px solid #5a679a;border-radius:10px;background:#1e2540;color:#cfd8e8;font-size:16px;text-align:center;cursor:pointer;letter-spacing:6px;text-indent:6px}
.mbtn:active{background:#2c3560}
.mbtn.hide{display:none}
.mnote{font-size:10px;color:#5a6488;margin-top:14px;letter-spacing:1px}
.otitle{font-size:26px;color:#9fe8dc;margin-bottom:8px;letter-spacing:8px;text-indent:8px}
.otitle.bad{color:#e88a7a}
.ostat{font-size:14px;color:#cfd8e8;margin:4px;letter-spacing:2px}
.stars{font-size:26px;color:#ffd97a;letter-spacing:6px;margin:8px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,86px);gap:8px;margin:14px 0}
.lvwrap{width:330px;max-height:430px;overflow-y:auto}
.lvrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lvcell{width:58px;height:46px;border:1px solid #4a5578;border-radius:8px;background:#1c2238;color:#cfd8e8;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lvcell.lock{opacity:.35}
.hide{display:none!important}
</style>

      if(typeof d.unlocked==='number'&&isFinite(d.unlocked)&&d.unlocked%1===0)unlocked=Math.min(24,Math.max(1,d.unlocked));
      if(d.best&&typeof d.best==='object'&&!Array.isArray(d.best)){
        for(var k in d.best){
          var v=d.best[k],kk=parseInt(k,10);
          if(kk>=1&&kk<=24&&Array.isArray(v)&&v.length===2&&
             typeof v[0]==='number'&&isFinite(v[0])&&typeof v[1]==='number'&&isFinite(v[1])&&v[1]%1===0)
            best[kk]=[v[0],v[1]];
        }
      }
      if(d.snd===0)sndOn=0;
    }
  }catch(e){}
}

/* ============ 内核（与 sim139.py 逐行同构） ============ */
function terrainY(terr,x){
  if(x<=terr[0][0])return terr[0][1];
  if(x>=terr[terr.length-1][0])return terr[terr.length-1][1];
  for(var i=0;i<terr.length-1;i++){
    var x0=terr[i][0],y0=terr[i][1],x1=terr[i+1][0],y1=terr[i+1][1];
    if(x0<=x&&x<=x1){
      if(x1===x0)return Math.min(y0,y1);
      return y0+(y1-y0)*(x-x0)/(x1-x0);
    }
  }
  return terr[terr.length-1][1];
}
function newGame(lv){
  L=LVDATA[lv-1];
  if(!L)return;
  S.lv=lv;S.x=L.sx;S.y=L.sy;S.vx=L.svx;S.vy=L.svy;S.ri=L.sri;
  S.fuel=L.fuel;S.fuel0=L.fuel;
  S.ph='play';S.frames=0;S.score=0;S.stars=0;S.over=0;
  S.inL=0;S.inR=0;S.inT=0;S.shake=0;S.winT=0;S.parts=[];
  makeStars(L.seed);
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('dead').classList.add('hide');
  document.getElementById('pause').classList.add('hide');
  document.getElementById('lvbar').classList.add('hide');
  document.getElementById('help').classList.add('hide');
  updHUD();
}
function step(rot,thr){
  if(S.ph!=='play')return S.over;
  if(rot<0)S.ri=(S.ri+RI_N-ROT_SPD)%RI_N;
  else if(rot>0)S.ri=(S.ri+ROT_SPD)%RI_N;
  if(thr&&S.fuel>0){
    S.vx+=TX[S.ri];S.vy+=TY[S.ri];
    S.fuel-=FUEL_BURN;
    if(S.fuel<0)S.fuel=0;
  }
  S.vx+=L.wind;S.vy+=L.grav;
  S.x+=S.vx;S.y+=S.vy;
  S.frames++;
  if(S.y<TOP_Y)S.y=TOP_Y;
  if(S.x<-6||S.x>396){doDead('撞 崖 而 毁');return 2}
  var ty=terrainY(L.terr,S.x);
  if(S.y+LAND_R>=ty){
    if(L.px0<=S.x&&S.x<=L.px1&&Math.abs(S.vx)<=VDX&&Math.abs(S.vy)<=VDY){doWin();return 1}
    doDead(Math.abs(S.vx)>VDX||Math.abs(S.vy)>VDY?'落 速 过 疾 · 舟 毁':'触 坡 而 毁');return 2;
  }
  if(S.frames>3600){doDead('寒 空 久 悬 · 灯 油渐尽');return 2}
  return 0;
}
function doWin(){
  S.ph='over';S.over=1;
  var r=S.fuel/S.fuel0;
  S.stars=r>=0.55?3:(r>=0.30?2:1);
  var bon=(L.px1-L.px0)<40?60:((L.px1-L.px0)<56?30:0);
  S.score=100+Math.round(r*100)+bon;
  if(S.lv+1>unlocked&&S.lv<24)unlocked=S.lv+1;
  var pb=best[S.lv];
  if(!pb||S.score>pb[0]||(S.score===pb[0]&&S.stars>pb[1]))best[S.lv]=[S.score,S.stars];
  saveMain();
  S.winT=1;
  document.getElementById('oStars').textContent='★'.repeat(S.stars)+'☆'.repeat(3-S.stars);
  document.getElementById('oScore').textContent='泊岸 · '+S.score+' 分 · 余油 '+Math.round(r*100)+'%';
  var b=best[S.lv];
  document.getElementById('oBest').textContent='此夜最好：'+b[0]+' 分';
  document.getElementById('bNext').classList.toggle('hide',S.lv>=24);
  document.getElementById('over').classList.remove('hide');
  tone(523,.1);setTimeout(function(){tone(659,.1)},120);setTimeout(function(){tone(784,.2)},240);
}
function doDead(why){
  S.ph='dead';S.over=2;S.shake=18;
  spawnDebris();
  document.getElementById('dInfo').textContent=why+' · '+S.frames+' 息';
  document.getElementById('dead').classList.remove('hide');
  tone(140,.3);setTimeout(function(){tone(96,.35)},140);
}
function decide(){
  /* optimal 控制律（与 sim139.decide 同构，减速包线式）：
     brake(h)=√(1.2²+2(TH−g)h)——当前高度全力刹恰落地 1.2；贴线即全力刹；
     水平=速度跟踪钳±0.75；档位距离=垂向1.0+横向0.35；紧急高坠速边转边喷 */
  var xT=(L.px0+L.px1)/2;
  var dx=xT-S.x;
  var vwx=dx*0.02;
  if(vwx>0.75)vwx=0.75;else if(vwx<-0.75)vwx=-0.75;
  var h=terrainY(L.terr,S.x)-S.y;
  var brake=Math.sqrt(1.44+2*(TH-L.grav)*h);
  if(brake>2.2)brake=2.2;
  var tY;
  if(S.vy<brake)tY=0;
  else tY=-TH;
  if(tY<-TH)tY=-TH;else if(tY>TH)tY=TH;
  var tX=(vwx-S.vx)*0.08;
  if(tX>TH)tX=TH;else if(tX<-TH)tX=-TH;
  if(tY===0&&Math.abs(tX)<0.01)return [0,0];
  var bestK=-1,bestD=Math.abs(tX)*0.35+Math.abs(tY);
  for(var k=0;k<RI_N;k++){
    var d=Math.abs(TX[k]-tX)*0.35+Math.abs(TY[k]-tY);
    if(d<bestD){bestD=d;bestK=k}
  }
  if(bestK<0)return [0,0];
  var diff=(bestK-S.ri)%RI_N;
  if(diff<0)diff+=RI_N;   /* js % 保号——先归正再折叠（py % 恒非负同构） */
  if(diff>RI_N/2)diff-=RI_N;
  if(diff!==0){
    if(S.vy>1.2)return [diff>0?1:-1,1];
    return [diff>0?1:-1,0];
  }
  return [0,1];
}

/* ============ 音效 ============ */
var AC=null;
function ensureAC(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d){
  if(!sndOn)return;
  ensureAC();
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(.09,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);
  o.start();o.stop(AC.currentTime+d);
}
var lastFlame=0;
function flameTone(){
  if(!sndOn)return;
  ensureAC();if(!AC)return;
  if(Date.now()-lastFlame<180)return;
  lastFlame=Date.now();
  var o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=90;o.type='square';
  g.gain.setValueAtTime(.035,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.22);
  o.connect(g);g.connect(AC.destination);
  o.start();o.stop(AC.currentTime+.22);
}
document.addEventListener('pointerdown',function wake(){ensureAC()},{once:true});

/* ============ 渲染 ============ */
var cv,ctx;
function makeStars(seed){
  stars=[];
  var r=new LCG(seed*7+5);
  for(var i=0;i<70;i++)stars.push([r.n()%390,(r.n()%640)+8,(r.n()%2)+1]);
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,390,780);
  /* 夜空底 */
  var g=ctx.createLinearGradient(0,0,0,780);
  g.addColorStop(0,'#0b0e1e');g.addColorStop(.6,'#141026');g.addColorStop(1,'#1a1430');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
  /* 星点 */
  ctx.fillStyle='rgba(220,228,255,.85)';
  for(var i=0;i<stars.length;i++){
    ctx.globalAlpha=stars[i][2]*0.35;
    ctx.fillRect(stars[i][0],stars[i][1],stars[i][2],stars[i][2]);
  }
  ctx.globalAlpha=1;
  /* 冷月 */
  ctx.fillStyle='rgba(226,233,248,.10)';ctx.beginPath();ctx.arc(300,170,84,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(226,233,248,.16)';ctx.beginPath();ctx.arc(300,170,64,0,6.283);ctx.fill();
  ctx.fillStyle='#dde6f6';ctx.beginPath();ctx.arc(300,170,46,0,6.283);ctx.fill();
  ctx.fillStyle='rgba(180,192,220,.5)';
  ctx.beginPath();ctx.arc(284,158,9,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(316,184,6,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(296,190,4,0,6.283);ctx.fill();
  if(S.ph!=='play'&&S.ph!=='pause'&&S.ph!=='over'&&S.ph!=='dead')return;
  if(!L)return;
  /* 地形 */
  ctx.fillStyle='#221c30';
  ctx.beginPath();
  ctx.moveTo(L.terr[0][0],L.terr[0][1]);
  for(var t=1;t<L.terr.length;t++)ctx.lineTo(L.terr[t][0],L.terr[t][1]);
  ctx.lineTo(390,780);ctx.lineTo(0,780);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#5a4f78';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(L.terr[0][0],L.terr[0][1]);
  for(t=1;t<L.terr.length;t++)ctx.lineTo(L.terr[t][0],L.terr[t][1]);
  ctx.stroke();
  /* 埠头（冷玉发光条+灯笼） */
  var py=terrainY(L.terr,(L.px0+L.px1)/2);
  ctx.fillStyle='rgba(159,232,220,.18)';
  rr(L.px0-3,py-8,L.px1-L.px0+6,10,4);ctx.fill();
  ctx.fillStyle='#9fe8dc';
  rr(L.px0,py-4,L.px1-L.px0,3,2);ctx.fill();
  ctx.fillStyle='#e86a5a';
  ctx.beginPath();ctx.arc(L.px0+4,py-10,3,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(L.px1-4,py-10,3,0,6.283);ctx.fill();
  /* 月舟（震屏偏移） */
  var ox=0,oy=0;
  if(S.shake>0){ox=(Math.random()*8-4);oy=(Math.random()*8-4)}
  var cx=S.x+ox,cy=S.y+oy;
  var th=2*Math.PI*S.ri/RI_N;   /* 仅渲染三角变换（推力物理走 TX/TY 表） */
  var nx=Math.sin(th),ny=-Math.cos(th);   /* 舷向单位向量 */
  /* 焰 */
  if(S.inT&&S.fuel>0&&S.ph==='play'){
    /* 焰从舟尾（-舷向）喷出：基座=舟尾±垂直向，尖端=沿 -舷向 (7+fl) */
    var fl=10+Math.random()*7;
    ctx.fillStyle='rgba(255,150,60,.85)';
    ctx.beginPath();
    ctx.moveTo(cx-nx*7-ny*3.4,cy-ny*7+nx*3.4);
    ctx.lineTo(cx-nx*7+ny*3.4,cy-ny*7-nx*3.4);
    ctx.lineTo(cx-nx*(7+fl),cy-ny*(7+fl));
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,230,140,.9)';
    ctx.beginPath();
    ctx.moveTo(cx-nx*6.5-ny*1.8,cy-ny*6.5+nx*1.8);
    ctx.lineTo(cx-nx*6.5+ny*1.8,cy-ny*6.5-nx*1.8);
    ctx.lineTo(cx-nx*(6.5+fl*0.55),cy-ny*(6.5+fl*0.55));
    ctx.closePath();ctx.fill();
  }
  /* 舟体三角（舷向为上） */
  drawShip(cx,cy,nx,ny);
  /* 粒子 */
  for(var p=S.parts.length-1;p>=0;p--){
    var pt=S.parts[p];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.06;pt.life--;
    if(pt.life<=0){S.parts.splice(p,1);continue}
    ctx.globalAlpha=pt.life/pt.max;
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x,pt.y,pt.sz,pt.sz);
  }
  ctx.globalAlpha=1;
  /* 泊岸光环 */
  if(S.ph==='over'&&S.winT>0){
    ctx.strokeStyle='rgba(159,232,220,'+(S.winT*0.5)+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,30+(1-S.winT)*46,0,6.283);ctx.stroke();
  }
}
function drawShip(cx,cy,nx,ny){
  /* 舷向 (nx,ny) 为舟「上」向；舷身宽 8 长 14 */
  var px=-ny,py2=nx;   /* 垂直舷向 */
  ctx.fillStyle='#e8e4d8';
  ctx.strokeStyle='#8a8678';ctx.lineWidth=1;
  var hx=cx+nx*7,hy=cy+ny*7;
  var bxl=cx-nx*6+px*5,byl=cy-ny*6+py2*5;
  var bxr=cx-nx*6-px*5,byr=cy-ny*6-py2*5;
  ctx.beginPath();
  ctx.moveTo(hx,hy);ctx.lineTo(bxl,byl);ctx.lineTo(bxr,byr);ctx.closePath();
  ctx.fill();ctx.stroke();
  /* 舷窗 */
  ctx.fillStyle='#9fd8e8';
  ctx.beginPath();ctx.arc(cx+nx*1.5,cy+ny*1.5,2.2,0,6.283);ctx.fill();
}
function spawnDebris(){
  for(var i=0;i<26;i++){
    var a=Math.random()*6.283,sp=1+Math.random()*3;
    S.parts.push({x:S.x,y:S.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
                  life:30+Math.random()*40,max:60,sz:2+Math.random()*3,
                  col:Math.random()<0.5?'#e8e4d8':'#f0a05a'});
  }
}
function updHUD(){
  document.getElementById('hInfo').textContent='第 '+S.lv+' 夜 · '+S.score+' 分';
  var hok=Math.abs(S.vx)<=VDX,vok=Math.abs(S.vy)<=VDY;
  var cls=(hok&&vok)?'ok':'bad';
  var fv=S.vy>=0?'+':'−';
  document.getElementById('hSpd').innerHTML='H '+(S.vx>=0?'+':'−')+Math.abs(S.vx).toFixed(2)+' · V '+fv+Math.abs(S.vy).toFixed(2);
  document.getElementById('hSpd').className=cls;
  document.getElementById('fuelBar').style.width=(S.fuel0>0?Math.max(0,S.fuel/S.fuel0*100):0)+'%';
  document.getElementById('bT').classList.toggle('dis',S.fuel<=0);
}

/* ============ 输入 ============ */
function bindHold(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();el.classList.add('on');fn(1);ensureAC()});
  var off=function(){el.classList.remove('on');fn(0)};
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}
function mainLoop(){
  if(S.ph==='play'){
    var rot=(S.inR?1:0)-(S.inL?1:0);
    step(rot,S.inT?1:0);
    if(S.inT&&S.fuel>0){
      flameTone();
      /* 焰粒子（纯视觉——不参与物理） */
      if(S.frames%3===0){
        var th=2*Math.PI*S.ri/RI_N,nx=Math.sin(th),ny=-Math.cos(th);
        S.parts.push({x:S.x-nx*8,y:S.y-ny*8,vx:-nx*1.2+(Math.random()-0.5),vy:-ny*1.2+(Math.random()-0.5),
                      life:14,max:14,sz:2,col:'#f0b060'});
      }
    }
    updHUD();
  }
  if(S.shake>0)S.shake--;
  if(S.winT>0)S.winT=Math.max(0,S.winT-0.012);
  draw();
  requestAnimationFrame(mainLoop);
}
bindHold('bL',function(v){S.inL=v});
bindHold('bR',function(v){S.inR=v});
bindHold('bT',function(v){S.inT=v});
window.addEventListener('keydown',function(e){
  if(S.ph!=='play')return;
  if(e.key==='ArrowLeft')S.inL=1;
  else if(e.key==='ArrowRight')S.inR=1;
  else if(e.key==='ArrowUp')S.inT=1;
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft')S.inL=0;
  else if(e.key==='ArrowRight')S.inR=0;
  else if(e.key==='ArrowUp')S.inT=0;
});
