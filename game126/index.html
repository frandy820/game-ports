  if(typeof b==='number'&&isFinite(b)&&b%1===0&&b>=0&&b<=99999999)S.best=b;else bad=true;
  if(Array.isArray(st)&&st.length===24&&st.every(function(x){return typeof x==='number'&&isFinite(x)&&x%1===0&&x>=0&&x<=3}))S.stars=st;else bad=true;
  if(typeof un==='number'&&isFinite(un)&&un%1===0&&un>=1&&un<=24)S.unlocked=un;else bad=true;
  if(bad)saveMain()}
/* ---- 对局 ---- */
function vOf(lv){return LVLS[String(lv)].v}
function qOf(lv){return LVLS[String(lv)].quota}
function newGame(){
  S.lgx=(typeof S.testSeed==='number'&&S.testSeed>0)?S.testSeed:(Date.now()%M||1);
  var lv=S.lv,cfg=LVLS[String(lv)];
  S.pts=cfg.pts.map(function(p){return [p[0],p[1]]});
  S.cum=arc(S.pts);S.L=S.cum[S.cum.length-1];
  S.v=vOf(lv);S.quota=qOf(lv);S.n0=Math.floor(S.quota*0.32);S.nc=cfg.nc;
  S.r=new LCG(S.lgx);S.lastc=-1;S.beads=[];
  for(var i=0;i<S.n0;i++){
    if(S.lastc>=0&&S.r.u()<0.68){var c0=S.lastc}
    else{c0=Math.floor(S.r.u()*S.nc);S.lastc=c0}
    S.beads.push({c:c0,s:0})}
  alignHead((S.n0-1)*D);
  S.state='run';S.rk=0;S.animT=0;S.score=0;S.combo=0;S.maxcombo=0;S.maxhead=0;
  S.over=null;S.t=0;S.flies=[];S.parts=[];S.cd=0;S.dangerT=0;
  S.rr=new LCG(S.lgx*7+1);
  loadColors();
  S.phase='play';updHUD()}
function headS(){return S.beads.length?S.beads[S.beads.length-1].s:-1e9}
function alignHead(hs){var n=S.beads.length;for(var i=0;i<n;i++)S.beads[i].s=hs-(n-1-i)*D}
function colorset(){var cs={},r=[];for(var i=0;i<S.beads.length;i++)cs[S.beads[i].c]=1;
  for(var k in cs)r.push(+k);
  if(!r.length)for(var j=0;j<S.nc;j++)r.push(j);
  r.sort(function(a,b){return a-b});return r}
function loadColors(){var cs=colorset();
  S.loaded=cs.length?cs[Math.floor(S.rr.u()*cs.length)%cs.length]:0}
/* ---- 推进 ---- */
function step(dt){
  if(S.state==='anim'){S.animT-=dt;if(S.animT<=0)endRound();return}
  if(S.over)return;
  S.t+=dt;
  if(S.state==='retreat'){retreat(dt);return}
  var i;
  for(i=0;i<S.beads.length;i++)S.beads[i].s+=S.v*dt;
  var hs=headS();
  if(S.beads.length){S.maxhead=Math.max(S.maxhead,hs);
    if(hs/S.L>0.82){S.dangerT+=dt}else S.dangerT=0}
  if(S.beads.length&&hs>=S.L-F){S.over='lose';S.state='anim';S.animT=1.2;S.flies=[];return}
  if(S.beads.length*D+D>S.L){S.over='lose';S.state='anim';S.animT=1.2;S.flies=[];return}
  if(S.quota>0&&(!S.beads.length||S.beads[0].s>EN)){
    var c;
    if(S.lastc>=0&&S.r.u()<0.68){c=S.lastc}
    else{c=Math.floor(S.r.u()*S.nc);S.lastc=c}
    S.beads.unshift({c:c,s:S.beads.length?S.beads[0].s-D:0});
    S.quota--;updHUD()}
  if(S.quota===0&&!S.beads.length){S.over='win';S.state='anim';S.animT=1.4;S.flies=[]}}
function retreat(dt){
  var k=S.rk,tail=S.beads.slice(0,k),head=S.beads.slice(k);
  if(!tail.length||!head.length){S.state='run';return}
  var need=head[0].s-D-tail[tail.length-1].s;
  if(need<=0){seamCheck(k);return}
  var mv=Math.min(need,V_RET*dt);
  for(var i=0;i<tail.length;i++)tail[i].s+=mv;
  if(head[0].s-D-tail[tail.length-1].s<=0.01)seamCheck(k)}
function seamCheck(k){
  S.state='run';
  if(k<=0||k>=S.beads.length)return;
  var lo=k;
  while(lo-1>=0&&S.beads[lo-1].c===S.beads[k].c)lo--;
  var hi=k;
  while(hi+1<S.beads.length&&S.beads[hi+1].c===S.beads[k].c)hi++;
  if(hi-lo+1>=3){S.score+=25;blast(lo,hi)}else S.combo=0}
function blast(lo,hi){
  var m=hi-lo+1;
  S.combo++;S.maxcombo=Math.max(S.maxcombo,S.combo);
  var mul=Math.min(4,1+0.5*(S.combo-1));
  S.score+=Math.floor(60*m*mul);
  for(var i=lo;i<=hi;i++){var p=ptAt(S.beads[i].s);
    S.parts.push({x:p[0],y:p[1],c:S.beads[i].c,vx:(Math.random()*2-1)*90,vy:-60-Math.random()*90,life:0.55})}
  S.rk=lo;
  S.beads=S.beads.slice(0,lo).concat(S.beads.slice(hi+1));
  if(lo===0||lo>=S.beads.length){if(lo>=S.beads.length)S.combo=0;S.state='run';updHUD();return}
  S.state='retreat';updHUD()}
/* ---- 发射与插入 ---- */
function fire(){
  if(S.phase!=='play'||S.state!=='run'||S.cd>0||S.loaded<0||!S.beads.length)return false;
  var a=S.aim;
  if(!a)return false;
  S.flies.push({x:195,y:700,vx:Math.cos(a)*FIRE_V,vy:Math.sin(a)*FIRE_V,c:S.loaded});
  S.cd=CD_T;
  loadColors();
  return true}
function stepFly(dt){
  for(var i=S.flies.length-1;i>=0;i--){var f=S.flies[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.x<-30||f.x>420||f.y<-30||f.y>810){S.flies.splice(i,1);continue}
    var hit=(S.over||S.state!=='run')?-1:nearestBead(f.x,f.y);
    if(hit>=0){insertFly(hit,f);S.flies.splice(i,1)}}}
function nearestBead(x,y){var best=-1,bd=1e9;
  for(var i=0;i<S.beads.length;i++){var p=ptAt(S.beads[i].s),dx=x-p[0],dy=y-p[1],d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=i}}
  return (best>=0&&bd<=2*R_B-3)?best:-1}
function insertFly(j,f){
  var p=ptAt(S.beads[j].s),tg=tangAt(S.beads[j].s);
  var front=((f.x-p[0])*tg[0]+(f.y-p[1])*tg[1])>0;
  insert(j,f.c,front)}
function insert(j,col,front){
  S.beads.splice(front?j+1:j,0,{c:col,s:0});
  alignHead(headS());
  var i0=front?j+1:j;
  i0=Math.max(0,Math.min(i0,S.beads.length-1));
  var c=S.beads[i0].c,lo=i0;
  while(lo-1>=0&&S.beads[lo-1].c===c)lo--;
  var hi=i0;
  while(hi+1<S.beads.length&&S.beads[hi+1].c===c)hi++;
  if(hi-lo+1>=3)blast(lo,hi);else S.combo=0;
  updHUD()}
/* ---- 结算 ---- */
function starsOf(){if(S.over!=='win')return 0;
  var mh=S.maxhead/S.L;
  if(S.maxcombo>=5&&mh<0.70)return 3;
  if(mh<0.85)return 2;return 1}
function endRound(){
  S.phase='over';
  var st=starsOf();
  if(S.over==='win'){
    if(S.score>S.best)S.best=S.score;
    if(st>(S.stars[S.lv-1]||0))S.stars[S.lv-1]=st;
    if(S.lv>=S.unlocked&&S.lv<24)S.unlocked=S.lv+1}
  saveMain();
  $('oTitle').textContent=S.over==='win'?'廊 尽 璎 彩':'珠 落 香 炉';
  $('oInfo').textContent=(S.over==='win'?(st?'★'.repeat(st)+'  ':''):'')+'得分 '+S.score+'  连锁 '+S.maxcombo;
  $('over').classList.remove('hide')}
function updHUD(){$('hsc').textContent=''+S.score;$('hlv').textContent='第 '+S.lv+' 关';$('hq').textContent='串 '+S.quota}
/* ---- 绘制 ---- */
function draw(){
  ctx.clearRect(0,0,390,780);
  var g=ctx.createLinearGradient(0,0,0,780);
  g.addColorStop(0,'#2b2230');g.addColorStop(1,'#1d1720');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
  var hs=S.L?headS()/S.L:0,danger=S.L>0&&hs>0.82;
  if(danger&&!S.mute&&AC&&!S.over&&S.phase==='play'){var nw=performance.now();
    if(nw-(S.beat||0)>520){S.beat=nw;tone(72,0.1,'sine',0.06)}}
  ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#3a2f42';
  if(S.pts.length){
  ctx.beginPath();ctx.moveTo(S.pts[0][0],S.pts[0][1]);
  for(var i=1;i<S.pts.length;i++)ctx.lineTo(S.pts[i][0],S.pts[i][1]);
  ctx.stroke();
  if(danger){ctx.save();ctx.globalAlpha=0.35+0.3*Math.sin(S.t*9);
    ctx.strokeStyle='#c03a2a';ctx.lineWidth=6;
    ctx.beginPath();
    for(var i2=0;i2<S.pts.length-1;i2++){
      if(S.cum[i2+1]<hs*S.L-560)continue;
      ctx.moveTo(S.pts[i2][0],S.pts[i2][1]);ctx.lineTo(S.pts[i2+1][0],S.pts[i2+1][1])}
    ctx.stroke();ctx.restore()}
  /* 香炉 */
  var ep=S.pts[S.pts.length-1];
  ctx.save();ctx.translate(ep[0],ep[1]);
  ctx.fillStyle='#5c4526';ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fill();
  ctx.fillStyle='#3a2c18';ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fill();
  ctx.fillStyle=danger?'#e85540':'#a86a30';ctx.beginPath();ctx.arc(0,0,10+2*Math.sin(S.t*6),0,7);ctx.fill();
  ctx.restore();
  }
  /* 珠串 */
  for(var b=0;b<S.beads.length;b++){
    var p2=ptAt(S.beads[b].s),cl=COLORS[S.beads[b].c];
    if(p2[1]<-20||p2[1]>800)continue;
    ctx.fillStyle=cl[0];ctx.beginPath();ctx.arc(p2[0],p2[1],R_B,0,7);ctx.fill();
    ctx.fillStyle=cl[1];ctx.beginPath();ctx.arc(p2[0]-4,p2[1]-5,4.5,0,7);ctx.fill();
    ctx.strokeStyle=cl[2];ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p2[0],p2[1],R_B-0.8,0,7);ctx.stroke()}
  /* 粒子 */
  for(var q=0;q<S.parts.length;q++){var pt=S.parts[q];
    ctx.globalAlpha=Math.max(0,pt.life/0.55);
    ctx.fillStyle=COLORS[pt.c][1];
    ctx.beginPath();ctx.arc(pt.x,pt.y,5,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  /* 飞行珠 */
  for(var f2=0;f2<S.flies.length;f2++){var fb=S.flies[f2];
    ctx.fillStyle=COLORS[fb.c][0];ctx.beginPath();ctx.arc(fb.x,fb.y,R_B,0,7);ctx.fill();
    ctx.fillStyle=COLORS[fb.c][1];ctx.beginPath();ctx.arc(fb.x-4,fb.y-5,4.5,0,7);ctx.fill()}
  /* 炮台 */
  ctx.save();ctx.translate(195,700);
  ctx.fillStyle='#4a3a50';ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();
  ctx.strokeStyle='#7a6040';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.stroke();
  var aa=S.aim||-Math.PI/2;
  ctx.rotate(aa);
  ctx.fillStyle='#7a6040';ctx.fillRect(0,-8,40,16);
  ctx.restore();
  if(S.loaded>=0){ctx.fillStyle=COLORS[S.loaded][0];ctx.beginPath();ctx.arc(195,700,13,0,7);ctx.fill();
    ctx.fillStyle=COLORS[S.loaded][1];ctx.beginPath();ctx.arc(191,695,4,0,7);ctx.fill()}
  /* 危险提示 */
  if(danger&&S.beads.length){ctx.fillStyle='rgba(232,85,64,'+(0.5+0.4*Math.sin(S.t*9))+')';
    ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('珠临香炉！',195,110);ctx.textAlign='left'}}
/* ---- 循环 ---- */
var lastT=0,acc=0,INT=1/120;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT)lastT=ts;
  var dt=Math.min(0.1,(ts-lastT)/1000);lastT=ts;
  if(S.phase!=='play'){draw();return}
  acc+=dt;
  while(acc>=INT){S.cd=Math.max(0,S.cd-INT);step(INT);stepFly(INT);stepParts(INT);acc-=INT}
  draw()}
function stepParts(dt){for(var i=S.parts.length-1;i>=0;i--){var p=S.parts[i];
  p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=320*dt;
  if(p.life<=0)S.parts.splice(i,1)}}
requestAnimationFrame(loop);
/* ---- 输入 ---- */
function evPos(e){var r=cv.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top]}
function onDown(e){ensureAC();
  if(S.phase!=='play'||S.state!=='run')return;
  if(S.pd!==null)return;
  var p=evPos(e);S.pd=e.pointerId;S.aim=Math.atan2(p[1]-700,p[0]-195);
  try{cv.setPointerCapture(e.pointerId)}catch(_pe){}
  e.preventDefault()}
function onMove(e){
  if(S.pd!==e.pointerId)return;
  var p=evPos(e);S.aim=Math.atan2(p[1]-700,p[0]-195);e.preventDefault()}
function onUp(e){
  if(S.pd!==e.pointerId)return;S.pd=null;
  fire();e.preventDefault()}
function clearAim(){S.pd=null}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',clearAim);
window.addEventListener('blur',clearAim);
document.addEventListener('visibilitychange',function(){if(document.hidden){clearAim();if(S.phase==='play')saveMain()}});
/* ---- 音 ---- */
var AC=null;
function ensureAC(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,vol){if(S.mute||!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
var _blast=blast;
blast=function(lo,hi){_blast(lo,hi);
  tone(520+Math.min(6,S.combo)*70,0.22,'triangle',0.14)};
var _insert=insert;
insert=function(j,col,front){_insert(j,col,front);tone(300,0.07,'square',0.06)};
var _fire=fire;
fire=function(){var r=_fire();if(r)tone(200,0.06,'square',0.05);return r};
var _seam=seamCheck;
seamCheck=function(k){_seam(k);tone(760,0.05,'sine',0.06)};
/* ---- UI ---- */
$('startBtn').onclick=function(){ensureAC();newGame();$('menu').classList.add('hide')};
$('againBtn').onclick=function(){ensureAC();$('over').classList.add('hide');newGame()};
$('btnPse').onclick=function(){if(S.phase!=='play')return;S.phase='pause';$('pse').classList.remove('hide')};
$('resumeBtn').onclick=function(){$('pse').classList.add('hide');S.phase='play'};
$('btnSnd').onclick=function(){S.mute=!S.mute;$('btnSnd').textContent=S.mute?'✕':'♪'};
$('btnLv').onclick=toggleLv;$('lvTab').onclick=toggleLv;
function toggleLv(){var b=$('lvbar');b.classList.toggle('open');if(b.classList.contains('open'))buildLvBar()}
function buildLvBar(){var b=$('lvbar');b.innerHTML='';
  for(var i=1;i<=24;i++){(function(n){
    var d=document.createElement('div');
    d.className='lvCell'+(n===S.lv?' cur':'')+(n>S.unlocked?' lock':'');
    d.innerHTML=''+n+'<span class="st">'+(S.stars[n-1]?'★'.repeat(S.stars[n-1]):'·')+'</span>';
    d.onclick=function(){if(n>S.unlocked)return;S.lv=n;newGame();$('lvbar').classList.remove('open')};
    b.appendChild(d)})(i)}}
/* ---- boot ---- */
(function boot(){
  for(var i=0;i<24;i++)S.stars[i]=0;
  loadSave();
  $('mBst').textContent='最佳 '+S.best;
  draw()})();


</script>
<script src="../shell.js" defer></script>
