<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>引力合星 · 离线版</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#141a2a; --ink:#e8e4d8; --dim:#8d93a6;
    --gold:#f5a623; --line:#2a3450; --danger:#e05a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:manipulation}                            /* m3：非舞台区禁双击缩放（iOS） */
  /* 顶部信息区 */
  header{width:min(100vw,480px);padding:10px 14px 8px;display:flex;align-items:center;gap:12px}
  header .title{font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
  header .hud{flex:1;display:flex;gap:14px;align-items:baseline;justify-content:center}
  header .hud .score{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  header .hud .best{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #btn-sound{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--ink);font-size:18px;line-height:1;cursor:pointer;flex:none}
  #btn-sound.off{color:var(--dim)}
  /* 图鉴条 */
  #chain{width:min(100vw,480px);display:flex;justify-content:center;gap:7px;padding:2px 0 8px}
  #chain .dot{border-radius:50%;background:#1d2540;border:1px solid var(--line);flex:none}
  /* 舞台 */
  #stage{position:relative;width:min(100vw, calc((100vh - 118px) * 0.75), 480px);aspect-ratio:3/4;touch-action:none}
  @supports (width: 1dvh) { #stage{width:min(100vw, calc((100dvh - 118px) * 0.75), 480px)} }  /* m4：移动端地址栏 */
  canvas#game{width:100%;height:100%;display:block;border-radius:12px;background:#0d1322}
  /* 首屏提示层 */
  #hint-layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(11,15,26,.82);border-radius:12px;transition:opacity .5s;z-index:5;padding:24px;text-align:center}
  #hint-layer.gone{opacity:0;pointer-events:none}
  #hint-layer h2{font-size:26px;color:var(--gold);letter-spacing:.1em}
  #hint-layer p{font-size:14.5px;color:var(--ink);line-height:1.9;max-width:30ch}
  #hint-layer .gest{font-size:13px;color:var(--dim)}
  /* 飘字层 */
  #fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
  .float-txt{position:absolute;font-weight:700;color:var(--gold);font-size:20px;transform:translate(-50%,-50%);
    animation:floatUp .6s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  @keyframes floatUp{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
  /* 终局面板 */
  #gameover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:rgba(11,15,26,.9);border-radius:12px;z-index:6}
  #gameover[hidden]{display:none}
  #gameover .go-title{font-size:24px;font-weight:700;color:var(--danger);letter-spacing:.12em}
  #gameover .go-score{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
  #gameover .go-sub{font-size:13px;color:var(--dim)}
  #gameover .go-planet{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:14px;color:var(--ink)}
  #gameover .go-planet canvas{border-radius:50%}
  #btn-restart{margin-top:12px;padding:12px 44px;font-size:17px;font-weight:700;color:#111;background:var(--gold);
    border:none;border-radius:24px;cursor:pointer}
  footer{width:min(100vw,480px);padding:6px 14px;font-size:11.5px;color:var(--dim);text-align:center;letter-spacing:.03em}

  /* ═══ 排行榜 TOP10 ═══ */
  #btn-board{margin-left:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink);
    background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:9px;cursor:pointer}
  #btn-board:hover{border-color:var(--gold)}
  .board{width:min(86vw,330px);margin-top:10px}
  .board-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .board-h b{font-size:13.5px;color:var(--gold);letter-spacing:.14em}
  #btn-clear{font-size:11px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:7px;padding:2px 9px;cursor:pointer}
  #btn-clear:hover{color:var(--danger);border-color:var(--danger)}
  #btn-clear.arm{color:#fff;background:var(--danger);border-color:var(--danger)}
  .board-list{list-style:none;margin:0;padding:0;max-height:34vh;overflow-y:auto;text-align:left}
  .board-list li{display:flex;align-items:center;gap:8px;padding:3.5px 8px;font-size:13px;color:var(--ink);
    border-bottom:1px dashed rgba(0,0,0,.06)}
  .board-list li .rk{width:20px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 20px}
  .board-list li:nth-child(1) .rk{color:var(--gold);font-weight:800}
  .board-list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board-list li .sc{font-weight:700;font-variant-numeric:tabular-nums}
  .board-list li .lv{font-size:10.5px;color:var(--dim);flex:0 0 52px;text-align:right}
  .board-list li.fresh{background:rgba(255,213,94,.18);border-radius:6px}
  .board-empty{font-size:12px;color:var(--dim);text-align:center;padding:10px 0}
  .name-row{display:flex;gap:8px;width:min(86vw,330px);margin-top:12px}
  .name-row input{flex:1;min-width:0;padding:10px 12px;font-size:15px;color:var(--ink);text-align:center;
    background:rgba(255,255,255,.8);border:1px solid var(--gold);border-radius:10px;outline:none;letter-spacing:.06em}
  .name-row input:focus{box-shadow:0 0 0 2px rgba(255,213,94,.35)}
  .name-row button{padding:0 18px;font-size:14px;font-weight:700;color:#111;background:var(--gold);
    border:none;border-radius:10px;cursor:pointer}
  .name-row button:active{transform:scale(.95)}
  #board-mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(20,14,6,.55);backdrop-filter:blur(2px);z-index:8}
  #board-mask[hidden]{display:none}
  #board-card{display:flex;flex-direction:column;align-items:center;padding:20px 22px 16px;border-radius:16px;
    background:linear-gradient(165deg,#fdf6e8,#f3e6cd);border:1px solid var(--gold);
    box-shadow:0 10px 36px rgba(40,26,8,.35);animation:boardin .22s ease-out}
  @keyframes boardin{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
  #board-close{margin-top:12px;padding:9px 30px;font-size:14px;color:var(--dim);background:none;
    border:1px solid var(--line);border-radius:9px;cursor:pointer}
</style>
<!--PG-PWA-->
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1322">
<style>
#pg-back{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:99999;
  width:40px;height:40px;border-radius:50%;display:none;align-items:center;justify-content:center;
  background:rgba(13,19,34,.55);border:1px solid rgba(180,200,255,.25);color:#cfe0ff;font-size:19px;
  text-decoration:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);user-select:none;
  -webkit-tap-highlight-color:transparent}
#pg-back:active{transform:scale(.9)}
@media all and (display-mode:standalone){#pg-back{display:flex}}
</style>
</head>
<body>
<header>
  <span class="title">引力合星</span>
  <div class="hud">
    <span class="score" id="score">0</span>
    <span class="best" id="best">最高 0</span>
  </div>
  <button id="btn-sound" aria-label="音效开关">♪</button>
  <button id="btn-board" aria-label="排行榜">榜</button>
</header>
<div id="chain" aria-label="合成图鉴"></div>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="fx-layer"></div>
  <div id="hint-layer">
    <h2>引力合星</h2>
    <p>点击或拖动选定位置，松手投放星球。<b>两个相同的星球相碰会合成更大的星球</b>，堆过红色警戒线即结束。</p>
    <p class="gest">拖动瞄准 · 松手投放 · 无时间限制<br>刷新页面会开新局，最高分自动保留</p>
  </div>
  <div id="gameover" hidden>
    <div class="go-title">星海满仓</div>
    <div class="go-score" id="go-score">0</div>
    <div class="go-sub" id="go-best">最高纪录 0</div>
    <div class="go-planet" id="go-planet"></div>
    <div class="name-row" id="name-row" hidden>
      <input id="name-input" maxlength="10" placeholder="道号（10 字内）" autocomplete="off">
      <button id="btn-submit">记入排行</button>
    </div>
    <div class="board" id="board-over" hidden>
      <div class="board-h"><b>星海十杰</b><button id="btn-clear">清空榜单</button></div>
      <ol class="board-list" id="list-over"></ol>
    </div>
    <button id="btn-restart">再来一局</button>
  </div>
  <div id="board-mask" hidden>
    <div id="board-card">
      <div class="board" style="width:auto">
        <div class="board-h"><b>星海十杰</b><button id="btn-clear2">清空榜单</button></div>
        <ol class="board-list" id="list-modal"></ol>
      </div>
      <button id="board-close">关 闭</button>
    </div>
  </div>
</div>
<footer>离线可玩 · 纯本地运行 · 参考合成类玩法原创重实现</footer>

<script>
(function () {
  'use strict';
  if (typeof Matter === 'undefined') { document.title = '加载失败'; return; }
  var M = Matter, Engine = M.Engine, World = M.World, Bodies = M.Bodies, Body = M.Body, Events = M.Events;

  /* ═══════════ 1. CFG 配置区 ═══════════ */
  var W = 720, H = 960;                 // 逻辑坐标恒定（评审钉死：与设备无关）
  var LINE_Y = 180;                     // 危险线
  var PREVIEW_Y = 90;                   // 预览高度
  var DT = 1000 / 60, CLAMP = 33, MAX_STEPS = 5;
  var DROP_LOCK = 300;                  // 投放锁
  var MERGE_COOL = 400;                 // 合成冷却
  var DANGER_MS = 2000;                 // 压线判负累计
  var LEVELS = 11;
  var R = [16, 23, 31, 40, 50, 61, 73, 86, 100, 115, 131];   // 半径表
  var NAMES = ['陨石', '月球', '火星', '水星', '金星', '地球', '海王星', '天王星', '土星', '木星', '太阳'];
  var COLORS = ['#9e8f82', '#b8b5ad', '#c96a4a', '#c9a982', '#e8c06a', '#4f86c6',
                '#4666d1', '#7fd4d4', '#d9b877', '#c98850', '#f5a623'];
  // 投放序列：前10颗洗切袋，之后 1-4 级加权
  var START_BAG = [1, 1, 2, 2, 1, 1, 2, 2, 1, 2];
  var RAND_POOL = [1, 1, 1, 1, 1, 2, 2, 2, 3, 3, 4];        // 权重 5:3:2:1

  /* ═══════════ 2. safeStorage ═══════════ */
  var safeStorage = (function () {
    var mem = {}, ok = false;
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
    return {
      get: function (k, d) {
        try { if (ok) { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } } catch (e) {}
        return k in mem ? mem[k] : d;
      },
      set: function (k, v) {
        try { if (ok) { localStorage.setItem(k, JSON.stringify(v)); return; } } catch (e) {}
        mem[k] = v;
      }
    };
  })();

  /* ═══════════ 3. SFXKit（WebAudio 程序化音效，零音频资产） ═══════════ */
  var SFX = (function () {
    var ctx = null, muted = !!safeStorage.get('gxs_muted', true);
    function ensure() {
      if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
      if (ctx && ctx.state === 'suspended') { ctx.resume().catch(function () {}); }
      return !!ctx;
    }
    function tone(type, f0, f1, dur, vol) {
      if (muted || !ensure()) return;
      try {
        var t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
      } catch (e) {}
    }
    return {
      unlock: ensure,
      pop: function () { tone('square', 520, 300, 0.07, 0.10); },
      merge: function (lv) { var f = 280 + lv * 34; tone('sine', f, f * 1.5, 0.12, 0.14); tone('triangle', f * 2, f * 2.4, 0.08, 0.05); },
      over: function () { tone('sine', 392, 392, 0.16, 0.12); setTimeout(function () { tone('sine', 311, 311, 0.16, 0.12); }, 170); setTimeout(function () { tone('sine', 233, 180, 0.28, 0.12); }, 340); },
      toggle: function () { muted = !muted; safeStorage.set('gxs_muted', muted); return muted; },
      isMuted: function () { return muted; }
    };
  })();

  /* ═══════════ 4. DOM 引用 ═══════════ */
  var canvas = document.getElementById('game');
  var ctx2d = canvas.getContext('2d');
  var elScore = document.getElementById('score'), elBest = document.getElementById('best');
  var elHint = document.getElementById('hint-layer'), elFx = document.getElementById('fx-layer');
  var elOver = document.getElementById('gameover'), elGoScore = document.getElementById('go-score');
  var elGoBest = document.getElementById('go-best'), elGoPlanet = document.getElementById('go-planet');
  var btnSound = document.getElementById('btn-sound'), btnRestart = document.getElementById('btn-restart');
  var btnBoard = document.getElementById('btn-board'), boardMask = document.getElementById('board-mask');
  var elNameRow = document.getElementById('name-row'), nameInput = document.getElementById('name-input');
  var btnSubmit = document.getElementById('btn-submit'), btnClear = document.getElementById('btn-clear'), btnClear2 = document.getElementById('btn-clear2');
  var boardOver = document.getElementById('board-over'), listOver = document.getElementById('list-over'), listModal = document.getElementById('list-modal');
  var elChain = document.getElementById('chain');
  var stage = document.getElementById('stage');

  /* ═══════════ 5. Render：离屏 sprite + dpr 适配 + 星空背景 ═══════════ */
  var dpr = 1;
  var cssW = 0, cssH = 0, sx = 1, sy = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);   // m4：跨屏/缩放后重取
    var rect = stage.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    sx = canvas.width / W; sy = canvas.height / H;
  }
  window.addEventListener('resize', function () { resize(); });

  // 每级星球离屏预渲染（含特征细节，绘制零每帧开销）
  var sprites = [];
  function makeSprite(lv) {
    var r = R[lv - 1], pad = lv === 11 ? 26 : 8, size = (r + pad) * 2;
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var g = c.getContext('2d'); var cx = size / 2, cy = size / 2; var col = COLORS[lv - 1];
    // 太阳光晕
    if (lv === 11) {
      var halo = g.createRadialGradient(cx, cy, r * 0.6, cx, cy, r + 24);
      halo.addColorStop(0, 'rgba(245,166,35,.85)'); halo.addColorStop(1, 'rgba(245,166,35,0)');
      g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, r + 24, 0, 7); g.fill();
    }
    // 主体：径向渐变
    var grd = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
    grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.25, col); grd.addColorStop(1, shade(col, -0.45));
    g.fillStyle = grd; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
    // 特征
    g.save(); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.clip();
    if (lv === 1 || lv === 2 || lv === 4) {          // 坑
      g.fillStyle = 'rgba(0,0,0,.18)';
      [[-0.3, -0.1, 0.22], [0.25, 0.3, 0.16], [0.1, -0.35, 0.13]].forEach(function (p) {
        g.beginPath(); g.arc(cx + p[0] * r, cy + p[1] * r, p[2] * r, 0, 7); g.fill();
      });
    }
    if (lv === 3 || lv === 5) {                       // 暗斑/云纹
      g.fillStyle = lv === 3 ? 'rgba(80,30,20,.25)' : 'rgba(255,255,255,.22)';
      g.beginPath(); g.ellipse(cx - r * 0.15, cy + r * 0.2, r * 0.55, r * 0.28, -0.3, 0, 7); g.fill();
      g.beginPath(); g.ellipse(cx + r * 0.3, cy - r * 0.25, r * 0.3, r * 0.14, 0.4, 0, 7); g.fill();
    }
    if (lv === 6) {                                   // 地球：大陆+云
      g.fillStyle = 'rgba(86,168,96,.85)';
      g.beginPath(); g.ellipse(cx - r * 0.25, cy - r * 0.05, r * 0.42, r * 0.3, 0.5, 0, 7); g.fill();
      g.beginPath(); g.ellipse(cx + r * 0.35, cy + r * 0.3, r * 0.3, r * 0.2, -0.4, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.beginPath(); g.ellipse(cx + r * 0.1, cy - r * 0.45, r * 0.38, r * 0.12, 0.2, 0, 7); g.fill();
    }
    if (lv === 7 || lv === 8) {                       // 冰巨星横带
      g.fillStyle = 'rgba(255,255,255,.16)';
      g.beginPath(); g.ellipse(cx, cy - r * 0.3, r, r * 0.16, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(10,20,60,.22)';
      g.beginPath(); g.ellipse(cx, cy + r * 0.35, r, r * 0.2, 0, 0, 7); g.fill();
    }
    if (lv === 10) {                                  // 木星条纹
      g.globalAlpha = 0.3; g.fillStyle = '#7a4a28';
      for (var i = -2; i <= 2; i++) { g.fillRect(cx - r, cy + i * r * 0.3 - r * 0.06, r * 2, r * 0.13); }
      g.globalAlpha = 1;
      g.fillStyle = 'rgba(200,120,80,.8)';           // 大红斑
      g.beginPath(); g.ellipse(cx + r * 0.35, cy + r * 0.25, r * 0.18, r * 0.11, 0, 0, 7); g.fill();
    }
    g.restore();
    if (lv === 9) {                                   // 土星环
      g.strokeStyle = 'rgba(217,184,119,.85)'; g.lineWidth = r * 0.14;
      g.beginPath(); g.ellipse(cx, cy, r * 1.45, r * 0.5, -0.35, 0, 7); g.stroke();
    }
    // 高光
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(cx - r * 0.38, cy - r * 0.42, r * 0.22, r * 0.13, -0.7, 0, 7); g.fill();
    return { canvas: c, size: size };
  }
  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var f = 1 + k; r = Math.max(0, Math.min(255, r * f)); g = Math.max(0, Math.min(255, g * f)); b = Math.max(0, Math.min(255, b * f));
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }
  // 星空背景（一次性离屏）
  var bgCanvas = null;
  function makeBg() {
    bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
    var g = bgCanvas.getContext('2d');
    var grd = g.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0d1322'); grd.addColorStop(1, '#0a0e19');
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (var i = 0; i < 90; i++) {
      var x = (i * 137.5) % W, y = (i * 247.9) % H, s = (i % 3 === 0) ? 1.6 : 0.9;
      g.fillStyle = 'rgba(220,228,255,' + (0.12 + (i % 5) * 0.1) + ')';
      g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
    }
    return bgCanvas;
  }

  /* ═══════════ 6. VFX：波纹 + 弹跳 + 飘字 ═══════════ */
  var ripples = [];   // {x,y,t0}
  function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function floatText(x, y, txt) {
    var el = document.createElement('div');
    el.className = 'float-txt'; el.textContent = txt;
    el.style.left = (x / W * 100) + '%'; el.style.top = (y / H * 100) + '%';
    elFx.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 650);
  }

  /* ═══════════ 7. 物理桥 ═══════════ */
  var engine = Engine.create();
  engine.gravity.y = 1.1;
  var walls = [];
  function buildWalls() {
    walls = [
      Bodies.rectangle(-30, H / 2, 60, H * 2, { isStatic: true, label: 'wall' }),
      Bodies.rectangle(W + 30, H / 2, 60, H * 2, { isStatic: true, label: 'wall' }),
      Bodies.rectangle(W / 2, H + 30, W * 2, 60, { isStatic: true, label: 'floor' })
    ];
    World.add(engine.world, walls);
  }
  buildWalls();

  var pendingMerges = [];
  function handleCollide(ev) {
    for (var i = 0; i < ev.pairs.length; i++) {
      var a = ev.pairs[i].bodyA, b = ev.pairs[i].bodyB;
      var la = a.plugin && a.plugin.level, lb = b.plugin && b.plugin.level;
      if (!la || !lb) continue;
      if (la !== lb) continue;
      if (la >= LEVELS) continue;                        // 顶级对撞不合成（评审钉死）
      var now = performance.now();
      if ((a.plugin.coolUntil || 0) > now || (b.plugin.coolUntil || 0) > now) continue;
      a.plugin.coolUntil = b.plugin.coolUntil = now + MERGE_COOL;   // 双 body 冷却防重入

  }

  Events.on(engine, 'collisionStart', handleCollide);
  Events.on(engine, 'collisionActive', handleCollide);
  function consumeMerges() {
    var now = performance.now();
    while (pendingMerges.length) {
      var pair = pendingMerges.shift();
      var a = pair[0], b = pair[1];
      if (a.plugin.merged || b.plugin.merged) continue;
      a.plugin.merged = b.plugin.merged = true;
      var nx = (a.position.x + b.position.x) / 2, ny = (a.position.y + b.position.y) / 2;
      var vx = (a.velocity.x + b.velocity.x) / 2, vy = (a.velocity.y + b.velocity.y) / 2;
      World.remove(engine.world, a); World.remove(engine.world, b);
      var nb = spawnBall(a.plugin.level + 1, nx, ny, true);
      if (nb) { Body.setVelocity(nb, { x: vx, y: vy }); }
      dangerMs = 0;                                      // 合成清零压线计时（评审钉死）
      onMerge(a.plugin.level + 1, nx, ny);
    }
  }
  function spawnBall(level, x, y, fromMerge) {
    if (level < 1 || level > LEVELS) return null;
    var r = R[level - 1];
    x = Math.max(r + 2, Math.min(W - r - 2, x));
    y = Math.max(r + 2, Math.min(H - r - 2, y));
    var ball = Bodies.circle(x, y, r, {
      restitution: 0.12, friction: 0.25, frictionAir: 0.008, label: 'ball'
    });
    ball.plugin = { level: level, coolUntil: performance.now() + (fromMerge ? MERGE_COOL : 0), bornAt: performance.now(), merged: false };
    World.add(engine.world, ball);

  }
  function dynamicBalls() {
    return engine.world.bodies.filter(function (b) { return b.label === 'ball'; });
  }

  /* ═══════════ 8. 游戏状态机 ═══════════ */
  var state = 'READY';            // READY / PLAYING / OVER
  var score = 0, best = safeStorage.get('gxs_best', 0);
  var runTopLevel = 0;                                  // 本局最高合成（m1：随局维护）
  var topLevelRun = safeStorage.get('gxs_toplv', 0);   // 图鉴历史最高（跨局）
  var dangerMs = 0, lastDropAt = -1e9;
  var bagIdx = 0, bag = START_BAG.slice();
  var nextLevel = drawLevel();
  var curPreview = drawLevel();
  var aimX = W / 2, aiming = false;

  function drawLevel() {
    if (bagIdx < bag.length) { var v = bag[bagIdx]; bagIdx++; return v; }
    return RAND_POOL[(Math.random() * RAND_POOL.length) | 0];
  }
  function onMerge(newLevel, x, y) {
    var pts = newLevel * newLevel * 2;
    score += pts;
    if (score > best) { best = score; safeStorage.set('gxs_best', best); }
    if (newLevel > runTopLevel) runTopLevel = newLevel;
    if (newLevel > topLevelRun) { topLevelRun = newLevel; safeStorage.set('gxs_toplv', newLevel); }
    elScore.textContent = fmtNum(score); elBest.textContent = '最高 ' + fmtNum(best);
    updateChain2();
    floatText(x, y, '+' + pts);
    ripples.push({ x: x, y: y, t0: performance.now() });
    SFX.merge(newLevel);
  }
  function fmtNum(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n); }
  function updateChain2() {
    var html = '';
    for (var i = 1; i <= LEVELS; i++) {
      var on = i <= topLevelRun, d = (8 + i * 0.9).toFixed(1);   // m6：尺寸随等级递增，非仅色相
      html += '<span class="dot" style="width:' + d + 'px;height:' + d + 'px;' + (on ? 'background:' + COLORS[i - 1] + ';border-color:' + COLORS[i - 1] : '') + '"></span>';
    }
    elChain.innerHTML = html;
  }
  function dropBall() {
    if (state === 'OVER') return;
    var lv = curPreview;
    var r = R[lv - 1];
    var x = Math.max(r + 2, Math.min(W - r - 2, aimX));
    var ball = spawnBall(lv, x, PREVIEW_Y, false);
    if (!ball) return;
    curPreview = nextLevel; nextLevel = drawLevel();
    lastDropAt = performance.now();
    if (state === 'READY') { state = 'PLAYING'; dismissHint(); }
    SFX.pop();
  }
  /* ═══════════ 排行榜 TOP10（用户需求：进榜输名+清空榜单） ═══════════ */
  var TOP_KEY = 'gxs_top10';
  var top10 = loadTop();
  var lastEntry = null;                                  // 本局刚提交条目（高亮）
  function loadTop() {
    var a = safeStorage.get(TOP_KEY, []);
    if (!Array.isArray(a)) return [];
    return a.filter(function (e) { return e && isFinite(Number(e.score)) && Number(e.score) > 0; })
      .map(function (e) { return { name: String(e.name || '无名').slice(0, 10), score: Math.floor(Number(e.score)), lv: Math.max(0, Math.floor(Number(e.lv) || 0)), ts: Number(e.ts) || 0 }; })
      .sort(function (a, b) { return b.score - a.score; }).slice(0, 10);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function qualifies(s) { return top10.length < 10 || s > top10[top10.length - 1].score; }
  function submitScore() {
    if (elNameRow.hidden) return;
    var nm = (nameInput.value || '').trim().slice(0, 10) || '无名';
    lastEntry = { name: nm, score: score, lv: Math.max(runTopLevel, 0), ts: Date.now() };
    top10.push(lastEntry);
    top10.sort(function (a, b) { return b.score - a.score; });
    top10 = top10.slice(0, 10);
    safeStorage.set(TOP_KEY, top10);
    elNameRow.hidden = true;
    renderBoards();
    SFX.merge(6);
  }
  function renderBoards() {
    var html = top10.length ? top10.map(function (e, i) {
      return '<li class="' + (e === lastEntry ? 'fresh' : '') + '"><span class="rk">' + (i + 1) + '</span>' +
        '<span class="nm">' + esc(e.name) + '</span><span class="sc">' + fmtNum(e.score) + '</span>' +
        '<span class="lv">' + (e.lv ? NAMES[e.lv - 1] : '') + '</span></li>';
    }).join('') : '<div class="board-empty">虚位以待 · 打一局留下名号</div>';
    listOver.innerHTML = html; listModal.innerHTML = html;
    boardOver.hidden = false;                            // 空榜也显示「虚位以待」
  }
  function armClear(btn) {                                // 两步确认（免弹窗；3s 未确认自动复位）
    if (btn.classList.contains('arm')) {
      top10 = []; lastEntry = null;
      safeStorage.set(TOP_KEY, top10);
      renderBoards();
      disarm(btn);
    } else {
      btn.classList.add('arm'); btn.textContent = '确认清空？';
      setTimeout(function () { disarm(btn); }, 2600);
    }
  }
  function disarm(btn) { btn.classList.remove('arm'); btn.textContent = '清空榜单'; }
  btnSubmit.addEventListener('click', function () { submitScore(); btnSubmit.blur(); });
  nameInput.addEventListener('keydown', function (e) {    // 输入期隔离全局键（空格=投放/Enter=重启会误触）
    e.stopPropagation();
    if (e.key === 'Enter') { submitScore(); nameInput.blur(); }
  });
  btnBoard.addEventListener('click', function () { renderBoards(); boardMask.hidden = false; btnBoard.blur(); });
  document.getElementById('board-close').addEventListener('click', function () { boardMask.hidden = true; });
  btnClear.addEventListener('click', function () { armClear(btnClear); });
  btnClear2.addEventListener('click', function () { armClear(btnClear2); });

  function gameOver() {
    state = 'OVER';
    SFX.over();
    elGoScore.textContent = fmtNum(score);
    elGoBest.textContent = '最高纪录 ' + fmtNum(best);
    // 本局最高合成星球展示（评审钉死；m1：只取本局值——合成等级与场上现存取大）
    var fieldTop = 0;
    dynamicBalls().forEach(function (b) { if (b.plugin.level > fieldTop) fieldTop = b.plugin.level; });
    var show = Math.max(runTopLevel, fieldTop);
    elGoPlanet.innerHTML = '';
    if (show >= 1) {
      var sp = getSprite(show);
      var cv = document.createElement('canvas'); cv.width = sp.canvas.width; cv.height = sp.canvas.height;
      cv.getContext('2d').drawImage(sp.canvas, 0, 0);
      cv.style.width = '34px'; cv.style.height = '34px';
      var txt = document.createElement('span');
      txt.textContent = '本局最高合成：' + NAMES[show - 1];
      elGoPlanet.appendChild(cv); elGoPlanet.appendChild(txt);
    }
    /* 排行榜：进 TOP10 资格→名字输入；榜单始终展示 */
    lastEntry = null;
    renderBoards();
    elNameRow.hidden = !qualifies(score);
    if (!elNameRow.hidden) { nameInput.value = ''; }
    elOver.hidden = false;
  }
  function restart() {
    World.clear(engine.world, false);
    buildWalls();
    pendingMerges.length = 0;
    ripples.length = 0;                                 // m2：波纹残留
    lastDropAt = -1e9;                                  // m2：投放锁残留
    activePointer = null; aiming = false;               // m2：指针态残留
    score = 0; runTopLevel = 0; dangerMs = 0; state = 'PLAYING';
    lastEntry = null; renderBoards();                     // 高亮随局清除

  }
  function dismissHint() {
    if (!elHint.classList.contains('gone')) {

    }
  }
  function getSprite(lv) {
    if (!sprites[lv - 1]) sprites[lv - 1] = makeSprite(lv);

  /* ═══════════ 9. Input（Pointer Events 统一鼠标+触摸） ═══════════ */
  var activePointer = null;

  stage.addEventListener('pointercancel', function (e) {

  window.addEventListener('keydown', function (e) {
    if (e.repeat) { e.preventDefault(); return; }       // m9：按住空格不连发

    if (e.key === 'ArrowLeft') { aimX = Math.max(30, aimX - 28); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { aimX = Math.min(W - 30, aimX + 28); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {

    }
  });
  btnSound.addEventListener('click', function () {
    var m = SFX.toggle();

    btnSound.classList.toggle('off', m);

  });
  btnRestart.addEventListener('click', function () { this.blur(); restart(); });
  // M2 修复：窗口失焦/页面隐藏时复位指针态，防 activePointer 残留死锁输入
  window.addEventListener('blur', function () { activePointer = null; aiming = false; });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { activePointer = null; aiming = false; } });
  // 阻止双击缩放/长按菜单（E6）
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

  /* ═══════════ 10. 主循环（固定步长 accumulator，评审钉死） ═══════════ */
  var last = performance.now(), acc = 0, frozen = false;
  var stat = { frames: 0, dtSum: 0, dtMax: 0, dt95: 0, dts: [] };
  function frame(now) {
    var dt = Math.min(now - last, CLAMP);              // 后台切回 clamp（D1）
    last = now;
    stat.frames++; stat.dtSum += dt;
    if (dt > stat.dtMax) stat.dtMax = dt;
    stat.dts.push(dt); if (stat.dts.length > 300) stat.dts.shift();

    ctx2d.save();

    ctx2d.setLineDash([]);
    ctx2d.fillStyle = '#e05a4e';
    ctx2d.beginPath(); ctx2d.moveTo(0, LINE_Y - 9); ctx2d.lineTo(0, LINE_Y + 9); ctx2d.lineTo(16, LINE_Y); ctx2d.closePath(); ctx2d.fill();
    ctx2d.beginPath(); ctx2d.moveTo(W, LINE_Y - 9); ctx2d.lineTo(W, LINE_Y + 9); ctx2d.lineTo(W - 16, LINE_Y); ctx2d.closePath(); ctx2d.fill();
    ctx2d.restore();
    // 球体
    var balls = dynamicBalls();
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i], sp = getSprite(b.plugin.level);
      var age = now - (b.plugin.bornAt || 0);
      var scale = age < 180 ? 0.6 + 0.4 * easeOutBack(Math.min(1, age / 180)) : 1;
      var sz = sp.size * scale;
      ctx2d.drawImage(sp.canvas, b.position.x - sz / 2, b.position.y - sz / 2, sz, sz);
    }
    // 波纹
    var keep = [];
    for (var k = 0; k < ripples.length; k++) {
      var rp = ripples[k], t = (now - rp.t0) / 320;

        ctx2d.lineWidth = 3 * (1 - t) + 1;

      }
    }
    ripples = keep;
    // 预览（瞄准中或常态都显示当前球+投射虚线）
    if (state !== 'OVER') {
      var plv = curPreview, pr = R[plv - 1];
      var px = Math.max(pr + 2, Math.min(W - pr - 2, aimX));
      var py = PREVIEW_Y;
      var psp = getSprite(plv);
      ctx2d.globalAlpha = 0.55;
      ctx2d.drawImage(psp.canvas, px - psp.size / 2, py - psp.size / 2);
      ctx2d.globalAlpha = 1;
      ctx2d.strokeStyle = 'rgba(232,228,216,.25)'; ctx2d.lineWidth = 2; ctx2d.setLineDash([6, 10]);
      ctx2d.beginPath(); ctx2d.moveTo(px, py + pr + 4); ctx2d.lineTo(px, H - 8); ctx2d.stroke();
      ctx2d.setLineDash([]);
      // 下一颗（右上角小图）
      var nsp = getSprite(nextLevel), ns = 40;
      ctx2d.globalAlpha = 0.9;
      ctx2d.drawImage(nsp.canvas, W - ns - 12, 10, ns, ns);
      ctx2d.globalAlpha = 1;
      ctx2d.fillStyle = '#8d93a6'; ctx2d.font = '13px sans-serif'; ctx2d.textAlign = 'right';
      ctx2d.fillText('下一颗', W - 16, 64);
      ctx2d.textAlign = 'left';
    }
  }

  /* ═══════════ 11. 初始化 ═══════════ */
  function init() {
    resize();
    updateChain2();
    elScore.textContent = '0'; elBest.textContent = '最高 ' + fmtNum(best);
    if (safeStorage.get('gxs_hint', 0)) dismissHint();
    else setTimeout(dismissHint, 8000);                 // 兜底淡出
    if (SFX.isMuted()) { btnSound.textContent = '✕'; btnSound.classList.add('off'); }
    requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
  }
  init();

  

  /* ═══════════ 12. Debug 钩子（验收脚本专用） ═══════════ */
  window.__gravity = {
    spawn: function (level, x, y) { return spawnBall(level, x, y, true); },
    state: function () {
      return {
        state: state, score: score, best: best, balls: dynamicBalls().length,
        topLevel: topLevelRun, dangerMs: Math.round(dangerMs),
        curPreview: curPreview, nextLevel: nextLevel, aimX: Math.round(aimX),
        muted: SFX.isMuted(), hintGone: elHint.classList.contains('gone'), overHidden: elOver.hidden

    },
    stats: function () {
      var s = stat.dts.slice().sort(function (a, b) { return a - b; });
      return {
        frames: stat.frames, dtMax: Math.round(stat.dtMax),
        dt95: s.length ? Math.round(s[Math.floor(s.length * 0.95)]) : 0,
        avg: stat.frames ? Math.round(stat.dtSum / stat.frames) : 0

    },
    freeze: function () { frozen = true; },
    unfreeze: function () { frozen = false; },

})();

/* PG touch-bridge：PointerEvent 不派发环境的触屏兜底（原生 PE 正常时自动失效） */

      clientX: x, clientY: y, screenX: x, screenY: y,
      button: 0, buttons: type === 'pointerup' || type === 'pointercancel' ? 0 : 1,
      width: 1, height: 1, pressure: type === 'pointerdown' ? 0.5 : 0
    }));
  }
  function interactive(el){
    return !!(el && el.closest && el.closest('button, a, input, select, textarea, [role="button"], [contenteditable]'));
  }
  document.addEventListener('touchstart', function(e){
    if (window.__forceTouchBridge !== true && (performance.now() - lastNativePE) < 120) return;  // 原生PE已处理本手势
    if (bridgeOn === null) bridgeOn = true;
    if (!bridgeOn) return;
    if (interactive(e.target)) return;                 // 按钮走原生 click
    if (active) return;                                // 单指语义
    var t = e.changedTouches[0];
    active = { target: e.target };
    fire('pointerdown', t.clientX, t.clientY, e.target);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove', function(e){
    if (!active) return;
    var t = e.changedTouches[0];
    fire('pointermove', t.clientX, t.clientY, active.target);
    e.preventDefault();
  }, { passive: false });
  function end(e){
    if (!active) return;
    var t = e.changedTouches[0];
    fire(e.type === 'touchcancel' ? 'pointercancel' : 'pointerup', t.clientX, t.clientY, active.target);
    active = null;
    e.preventDefault();
  }
  document.addEventListener('touchend', end, { passive: false });
  document.addEventListener('touchcancel', end, { passive: false });
})();
</script>
</body>
