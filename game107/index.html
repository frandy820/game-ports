<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>当铺归票</title>
<style>
  html,body{margin:0;padding:0;background:#241a10;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  #cv{display:block;margin:0 auto}
  .lay{position:fixed;left:50%;transform:translateX(-50%);width:390px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:rgba(16,10,6,.92);z-index:5}
  .lay.hide{display:none}
  .lay h2{color:#f0e4c8;font-size:26px;letter-spacing:6px;margin:0 0 4px;font-weight:600}
  .lay .sub{color:#a89878;font-size:13px;letter-spacing:2px}
  .lay .best{color:#c9a44e;font-size:15px;letter-spacing:1px}
  .btn{background:#3a2a1a;border:1px solid #6a5232;color:#f0e4c8;font-size:16px;letter-spacing:3px;padding:12px 34px;border-radius:10px;cursor:pointer;font-family:inherit}
  .btn:active{background:#4a3624}
  .btn.gold{background:#5a4218;border-color:#c9a44e;color:#f8ecd0}
  .row{display:flex;gap:14px}
  #hud{position:fixed;left:50%;transform:translateX(-50%);width:390px;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;z-index:3;pointer-events:none}
  #hud.hide{display:none}
  #hud .tl{color:#f0e4c8;font-size:17px;letter-spacing:3px;font-weight:600}
  #hud .lv{color:#c9a44e;font-size:13px;letter-spacing:1px}
  #hud .r2{display:flex;gap:8px;pointer-events:auto}
  .ico{width:34px;height:34px;border-radius:8px;background:rgba(58,42,26,.7);border:1px solid #6a5232;color:#f0e4c8;font-size:15px;line-height:32px;text-align:center;cursor:pointer}
  #abtns{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:390px;display:none;justify-content:center;gap:14px;z-index:3}
  #abtns.on{display:flex}
  #abtns .btn{padding:10px 22px;font-size:15px}
  .flash{position:fixed;left:50%;transform:translateX(-50%);top:96px;color:#f8ecd0;font-size:15px;letter-spacing:2px;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="cv" width="390" height="844"></canvas>
<div id="hud" class="hide">
  <div><div class="tl">当铺归票</div><div class="lv" id="h-lv">步数 0 · 参考 0</div></div>
  <div class="r2"><div class="ico" id="btn-snd">♪̸</div><div class="ico" id="btn-pause">⏸</div></div>
</div>
<div id="abtns">
  <button class="btn" id="btn-undo">悔一步</button>
  <button class="btn" id="btn-auto" style="display:none">一键归档</button>
  <button class="btn gold" id="btn-new">换一局</button>
</div>
<div class="flash" id="flash"></div>

<div class="lay" id="menu">
  <h2>当 铺 归 票</h2>
  <div class="sub">打烊盘点 · 金玉衣器各归其架</div>
  <div class="best" id="m-best">—</div>
  <button class="btn gold" id="btn-go">开 柜</button>
  <div class="sub" style="font-size:11px;opacity:.7">点牌取票 · 再点归处 · 票封自拆</div>
</div>

<div class="lay hide" id="over">
  <h2 id="o-title">当铺打烊</h2>
  <div class="sub" id="o-sub">步数 0 · 参考 0</div>
  <div class="best" id="o-best">—</div>
  <div class="row">
    <button class="btn" id="btn-menu2">回铺</button>
    <button class="btn gold" id="btn-next">再开一局</button>
  </div>
</div>

<div class="lay hide" id="pause">
  <h2>歇 铺</h2>
  <div class="sub" id="p-sub">步数 0</div>
  <div class="row">
    <button class="btn" id="btn-restart">换一局</button>
    <button class="btn gold" id="btn-resume">续 铺</button>
  </div>
  <button class="btn" id="btn-menu">回铺门</button>
</div>

<script>
'use strict';
/* ============ 当铺归票 game107 · Klondike 盖牌版 × 老当铺赎当归档（SPEC v3） ============ */
var CFG = {
  W: 390, H: 844, HUD: 64,
  SLOT_W: 54, CARD_W: 50, CARD_H: 66, TOP_Y: 76, TAB_Y: 160,
  STACK: 20, STACK_BACK: 12, STACK_SM: 16, STACK_BACK_SM: 10, STACK_LIM: 12, GAP: 4,
  MOVE_T: 200, FLASH_T: 1600, FLIP_T: 600
};
/* 花色：0金 1玉 2衣 3器（暖组{0,2} 冷组{1,3}——交替色=异组） */
var SUIT = [
  { name: '金', color: '#c9a44e', dark: '#8a6a2a' },
  { name: '玉', color: '#7a9a6a', dark: '#4a6a3a' },
  { name: '衣', color: '#b05a4a', dark: '#7a3a2e' },
  { name: '器', color: '#5a7a9a', dark: '#3a546e' }
];
var RNAME = ['', '当', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖', '拾', '侍', '奉', '柜'];
function grp(su) { return (su === 0 || su === 2) ? 0 : 1; }
function canTab(c, top) { return grp(c[0]) !== grp(top[0]) && c[1] === top[1] - 1; }
/* 牌=[su,rk,up]（up=1 明区/0 盖区）；列内盖区全在头部 */
function openStart(t) {
  var i = 0;
  while (i < t.length && !t[i][2]) i++;
  return i;
}
function segStart(t) {
  var o = openStart(t);
  var s0 = t.length - 1;
  while (s0 > o && canTab(t[s0], t[s0 - 1])) s0--;
  return s0;
}

/* ============ RNG（家族 LCG；imul 32 位——与 python 逐位同构） ============ */
function LCG(seed) {
  var s = (seed >>> 0) || 1;
  this.r = function () { s = (Math.imul(s, 1103515245) + 12345) >>> 0; return (s >>> 16) & 0x7fff; };
}

/* ============ 生成器：终态打散构造制 v3（SPEC §2——与 sim107.scatter 同构） ============ */
/* A[su,col] 架顶→col 明区尾（can_tab/空列K）/ D[su,col] 架顶→col 盖区尾（无约束，col 无明区）
   B[su] 架顶→弃牌堆（≤24）/ C[i,s,j,ln] i 列明区段→j 列明区尾；两阶段（加权打散至架空 + C-only 洗列） */
function scatter(seed) {
  var rng = new LCG(seed);
  var fnd = [13, 13, 13, 13], tabs = [], waste = [], acts = [], i, su;
  for (i = 0; i < 7; i++) tabs.push([]);
  function cands() {
    var out = [], a, s, j;
    for (su = 0; su < 4; su++) {
      if (fnd[su] > 0) {
        var card = [su, fnd[su]];
        for (a = 0; a < 7; a++) {
          var t = tabs[a];
          if (!t.length) { if (card[1] === 13) out.push(['A', su, a]); }
          else if (t[t.length - 1][2]) { if (canTab(card, t[t.length - 1])) out.push(['A', su, a]); }
        }
        for (a = 0; a < 7; a++) {
          if (openStart(tabs[a]) === tabs[a].length) out.push(['D', su, a]);
        }
        if (waste.length < 24) out.push(['B', su]);
      }
    }
    for (a = 0; a < 7; a++) {
      var t2 = tabs[a];
      var o = openStart(t2);
      if (o >= t2.length) continue;
      var s0 = segStart(t2);
      for (s = s0; s < t2.length; s++) {
        for (j = 0; j < 7; j++) {
          if (j === a) continue;
          var tj = tabs[j];
          if (!tj.length) { if (t2[s][1] === 13) out.push(['C', a, s, j, t2.length - s]); }
          else if (tj[tj.length - 1][2] && canTab(t2[s], tj[tj.length - 1])) out.push(['C', a, s, j, t2.length - s]);
        }
      }
    }
    return out;
  }
  var steps = 0;
  while (fnd[0] > 0 || fnd[1] > 0 || fnd[2] > 0 || fnd[3] > 0) {
    var cs = cands();
    if (!cs.length || ++steps > 400) return null;   /* 枯竭/超限：调用方重摇 */
    var wts = [], k;
    for (k = 0; k < cs.length; k++) wts.push(cs[k][0] === 'A' ? 30 : cs[k][0] === 'D' ? 4 : cs[k][0] === 'B' ? 10 : 40);
    var tot = 0;
    for (k = 0; k < wts.length; k++) tot += wts[k];
    var v = rng.r() % tot;   /* js%float 与 python 同 IEEE 语义——逐位同构 */
    var acc = 0, c = cs[cs.length - 1];
    for (k = 0; k < cs.length; k++) { acc += wts[k]; if (v < acc) { c = cs[k]; break; } }
    if (c[0] === 'A') { fnd[c[1]]--; tabs[c[2]].push([c[1], fnd[c[1]] + 1, 1]); acts.push(c); }
    else if (c[0] === 'D') { fnd[c[1]]--; tabs[c[2]].push([c[1], fnd[c[1]] + 1, 0]); acts.push(c); }
    else if (c[0] === 'B') { fnd[c[1]]--; waste.push([c[1], fnd[c[1]] + 1]); acts.push(c); }
    else { var seg = tabs[c[1]].splice(c[2]); tabs[c[3]] = tabs[c[3]].concat(seg); acts.push(c); }
  }
  /* phase2: C-only 洗列（seed^0x27d4 派生 20-60 步） */
  var rng2 = new LCG((seed ^ 0x27d4) >>> 0);
  var wash = 20 + rng2.r() % 41, w2;
  for (w2 = 0; w2 < wash; w2++) {
    var cs2 = [], a2, s2, j2;
    for (a2 = 0; a2 < 7; a2++) {
      var t3 = tabs[a2];
      var o3 = openStart(t3);
      if (o3 >= t3.length) continue;
      var s03 = segStart(t3);
      for (s2 = s03; s2 < t3.length; s2++) {
        for (j2 = 0; j2 < 7; j2++) {
          if (j2 === a2) continue;
          var tj2 = tabs[j2];
          if (!tj2.length) { if (t3[s2][1] === 13) cs2.push(['C', a2, s2, j2, t3.length - s2]); }
          else if (tj2[tj2.length - 1][2] && canTab(t3[s2], tj2[tj2.length - 1])) cs2.push(['C', a2, s2, j2, t3.length - s2]);
        }
      }
    }
    if (!cs2.length) break;
    var c2 = cs2[rng2.r() % cs2.length];
    var seg2 = tabs[c2[1]].splice(c2[2]);
    tabs[c2[3]] = tabs[c2[3]].concat(seg2);
    acts.push(c2);
  }
  var stock = waste.slice().reverse();   /* stock[0]=顶=先抽 */
  return { tabs: tabs, stock: stock, acts: acts, ref: acts.length };
}
/* 回放自检（与 sim107.verify_scatter 同构——构造性可解证明，校验 up 标记） */
function verifyScatter(tabs, stock, acts) {
  var t = tabs.map(function (x) { return x.map(function (c) { return c.slice(); }); });
  var waste = stock.map(function (c) { return c.slice(); }).reverse();
  var fnd = [0, 0, 0, 0], k;
  for (k = acts.length - 1; k >= 0; k--) {
    var a = acts[k];
    if (a[0] === 'A' || a[0] === 'D') {
      var card = t[a[2]].pop();
      if (card[0] !== a[1] || card[1] !== fnd[a[1]] + 1 || card[2] !== (a[0] === 'A' ? 1 : 0)) return false;
      fnd[a[1]]++;
    } else if (a[0] === 'B') {
      var w = waste.pop();
      if (w[0] !== a[1] || w[1] !== fnd[a[1]] + 1) return false;
      fnd[a[1]]++;
    } else {
      var ln = a[4], j = a[3];
      var seg2 = t[j].splice(t[j].length - ln, ln);
      t[a[1]].splice.apply(t[a[1]], [a[2], 0].concat(seg2));
    }
  }
  return fnd[0] === 13 && fnd[1] === 13 && fnd[2] === 13 && fnd[3] === 13 &&
    t.every(function (x) { return !x.length; }) && !waste.length;
}

/* ============ 状态 ============ */
var S = {
  mode: 'menu', seed: 1,
  tabs: [], stock: [], waste: [], fnd: [0, 0, 0, 0],
  pos: 0, ref: 0,
  sel: null,            /* {src:'tab',col,idx} / {src:'waste'} */
  steps: 0, undo: [],
  anim: null, winT: 0, autoT: 0,
  shakeT: 0, shakeZone: -1, flashT: 0, flashTxt: '',
  flipFx: null,         /* {col,idx,t} 翻牌闪光 */
  dead: false, wins: 0, muted: true,
  ph: 0
};
var AC = null;
function ensureAC() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') { AC.resume().catch(function () {}); } }
var SND = {
  draw: function () { tone(560, .04, 'triangle', .05); },
  flip: function () { tone(660, .05, 'triangle', .06); setTimeout(function () { tone(880, .04, 'triangle', .04); }, 40); },
  place: function (rk) { tone(320 + rk * 24, .07, 'triangle', .09); },
  found: function (rk) { tone(440 + rk * 30, .1, 'sine', .1); setTimeout(function () { tone(660 + rk * 30, .12, 'sine', .07); }, 60); },
  win: function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, .18, 'triangle', .12); }, i * 110); }); },
  dead: function () { tone(98, .25, 'sine', .16); },
  shake: function () { tone(220, .05, 'square', .05); }
};
function tone(f, dur, type, vol) {
  if (S.muted || !AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { }
}

/* ============ DOM ============ */
var cv = document.getElementById('cv'), g = cv.getContext('2d');
var els = {};
['hud', 'h-lv', 'btn-snd', 'btn-pause', 'abtns', 'btn-undo', 'btn-auto', 'btn-new', 'flash', 'menu', 'm-best', 'btn-go', 'over', 'o-title', 'o-sub', 'o-best', 'btn-next', 'btn-menu2', 'pause', 'p-sub', 'btn-restart', 'btn-resume', 'btn-menu'].forEach(function (id) { els[id] = document.getElementById(id); });
function show(id, on) { els[id].classList[on ? 'remove' : 'add']('hide'); }
function flash(t) { S.flashTxt = t; S.flashT = CFG.FLASH_T; els['flash'].textContent = t; els['flash'].style.opacity = 1; }

/* ============ 布局 ============ */
function stockRect() { return { x: 12, y: CFG.TOP_Y, w: CFG.CARD_W, h: CFG.CARD_H }; }
function wasteRect() { return { x: 66, y: CFG.TOP_Y, w: CFG.CARD_W, h: CFG.CARD_H }; }
function fndRect(su) { return { x: 160 + su * CFG.SLOT_W, y: CFG.TOP_Y, w: CFG.CARD_W, h: CFG.CARD_H }; }
function tabX(col) { return 8 + col * (CFG.CARD_W + CFG.GAP); }
function tabY(col, idx) {
  /* 盖区小错位 12 / 明区 20（>12 张列收窄 10/16） */
  var t = S.tabs[col];
  var o = openStart(t);
  var sb = (t.length > CFG.STACK_LIM) ? CFG.STACK_BACK_SM : CFG.STACK_BACK;
  var so = (t.length > CFG.STACK_LIM) ? CFG.STACK_SM : CFG.STACK;
  return CFG.TAB_Y + Math.min(idx, o) * sb + Math.max(0, idx - o) * so;
}
function inRect(r, x, y, pad) { pad = pad || 0; return x >= r.x - pad && x <= r.x + r.w + pad && y >= r.y - pad && y <= r.y + r.h + pad; }

/* ============ 游戏流程 ============ */
function newDeal(seed) {
  var sd = seed >>> 0, r = null, guard = 0;
  while (!r && guard++ < 16) {
    r = scatter(sd);
    if (r && !verifyScatter(r.tabs, r.stock, r.acts)) r = null;   /* 回放自检失败即重摇（~4ms） */
    if (!r) sd = (sd + 0x9e37) >>> 0;
  }
  if (!r) r = scatter(700000) || { tabs: [[], [], [], [], [], [], []], stock: [], ref: 0 };   /* 兜底（概率~1e-32） */
  S.tabs = r.tabs; S.stock = r.stock; S.waste = []; S.pos = 0;
  S.fnd = [0, 0, 0, 0]; S.ref = r.ref;
  S.sel = null; S.steps = 0; S.undo = []; S.anim = null; S.dead = false;
  S.winT = 0; S.autoT = 0; S.flipFx = null;
  S.mode = 'play';
  autoFlip(true);
  flash('参考步 ' + S.ref);
  syncHud(); saveGame();
}
function syncHud() {
  els['h-lv'].textContent = '步数 ' + S.steps + ' · 参考 ' + S.ref;
  els['abtns'].classList[S.mode === 'play' ? 'add' : 'remove']('on');
  els['btn-auto'].style.display = (S.mode === 'play' && canAutoFinish()) ? '' : 'none';
}

/* ---- 合法性（正向规则，明区感知） ---- */
function segOf(col) { return segStart(S.tabs[col]); }
function openOf(col) { return openStart(S.tabs[col]); }
function wasteTop() { return S.waste.length ? S.waste[S.waste.length - 1] : null; }
function canFound(c) { return c[1] === S.fnd[c[0]] + 1; }
function tryMoveToTab(src) {
  /* 拿回专用：架顶→首个可放列（can_tab / 空列收K / 明区空有盖=不可） */
  for (var j = 0; j < 7; j++) {
    var t = S.tabs[j];
    if (!t.length) { if (src.card[1] === 13) return j; }
    else if (t[t.length - 1][2] && canTab(src.card, t[t.length - 1])) return j;
  }
  return -1;
}

/* ---- 自动翻牌：明区空+有盖 → 翻（免费；返回翻过的列数组，undo 记录用） ---- */
function autoFlip(silent) {
  var flipped = [], i;
  for (i = 0; i < 7; i++) {
    var t = S.tabs[i];
    var o = openStart(t);
    if (o > 0 && o === t.length) {
      t[o - 1][2] = 1;
      flipped.push(i);
      if (!silent) { SND.flip(); S.flipFx = { col: i, idx: o - 1, t: CFG.FLIP_T }; }
    }
  }
  return flipped;
}

/* ---- 移动执行 ---- */
function pushUndo(u) { S.undo.push(u); if (S.undo.length > 500) S.undo.shift(); }
function doMoveTab(fromCol, fromIdx, toCol, byAuto) {
  var seg = S.tabs[fromCol].splice(fromIdx);
  S.tabs[toCol] = S.tabs[toCol].concat(seg);
  var fl = autoFlip();
  pushUndo({ kind: 'mt', fc: fromCol, fi: fromIdx, tc: toCol, n: seg.length, fl: fl });
  S.steps++; SND.place(seg[0][1]);
  startAnim(byAuto ? 110 : CFG.MOVE_T);
  afterMove();
}
function doMoveWaste(toCol) {
  if (!S.waste.length) return false;
  var c = S.waste.pop();
  S.tabs[toCol].push([c[0], c[1], 1]);
  var fl = autoFlip();
  pushUndo({ kind: 'mw', tc: toCol, fl: fl });
  S.steps++; SND.place(c[1]);
  startAnim(CFG.MOVE_T);
  afterMove();
}
function doFound(from) {
  var c;
  if (from.kind === 'tab') {
    if (!S.tabs[from.col] || !S.tabs[from.col].length || !S.tabs[from.col][S.tabs[from.col].length - 1][2]) return false;
    if (from.idx !== undefined && from.idx !== S.tabs[from.col].length - 1) return false;   /* 段中间牌不可上架（SPEC：单张） */
    c = S.tabs[from.col].pop();
    var fl = autoFlip();
    pushUndo({ kind: 'ft', col: from.col, card: c, fl: fl });
  } else {
    if (!S.waste.length) return false;
    c = S.waste.pop();
    pushUndo({ kind: 'fw', card: c });
  }
  S.fnd[c[0]]++;
  S.steps++; SND.found(c[1]);
  startAnim(CFG.MOVE_T);
  afterMove();
}
function doTakeBack(su, dest) {
  /* 架顶拿回（tap 架区） */
  var tk = [su, S.fnd[su], 1];
  S.fnd[su]--;
  S.tabs[dest].push(tk);
  var fl = autoFlip();
  pushUndo({ kind: 'tf', su: su, tc: dest, card: tk, fl: fl });
  S.steps++; startAnim(CFG.MOVE_T); afterMove();
}
function doDraw() {
  if (S.pos < S.stock.length) {
    pushUndo({ kind: 'draw' });
    S.waste.push(S.stock[S.pos]); S.pos++;
    S.steps++; SND.draw();
  } else if (S.waste.length) {
    pushUndo({ kind: 'recycle', oldStock: S.stock.slice(), oldWaste: S.waste.slice() });
    S.stock = S.waste.slice().reverse(); S.waste = []; S.pos = 0;
    S.steps++; SND.draw();
  } else return false;
  startAnim(120);
  afterMove();
  return true;
}
function doUndo() {
  if (S.winT > 0 || S.autoT > 0) { flash(S.winT > 0 ? '已归齐 · 这就上账' : '归档中'); return; }
  if (S.mode !== 'play' || S.anim || !S.undo.length) return;
  var u = S.undo.pop(), i;
  if (u.kind === 'mt') { var seg = S.tabs[u.tc].splice(S.tabs[u.tc].length - u.n, u.n); S.tabs[u.fc].splice.apply(S.tabs[u.fc], [u.fi, 0].concat(seg)); }

    S.sel = null; S.undo = []; S.anim = null; S.dead = false; S.winT = 0; S.autoT = 0; S.flipFx = null;
    S.mode = 'play';
    flash('续上回的柜 · 参考步 ' + S.ref);
  } else newDeal((Date.now() & 0xffffffff) >>> 0);
  show('menu', false); show('hud', true);
  syncHud();
}
els['btn-next'].addEventListener('click', function () {
  ensureAC();
  newDeal((Date.now() & 0xffffffff) >>> 0);
  show('over', false); syncHud();
});
els['btn-new'].addEventListener('click', function () { ensureAC(); newDeal((Date.now() & 0xffffffff) >>> 0); show('over', false); syncHud(); });
els['btn-menu2'].addEventListener('click', function () { toMenu(); });
els['btn-menu'].addEventListener('click', function () { toMenu(); });
function toMenu() {
  S.mode = 'menu'; show('over', false); show('pause', false); show('hud', false);
  els['abtns'].classList.remove('on');
  try { S.wins = +(localStorage.getItem('g107_wins') || 0) || 0; } catch (e) { S.wins = 0; }
  els['m-best'].textContent = S.wins ? '已归档 ' + S.wins + ' 局' : '新开的当铺';
  show('menu', true);
}
els['btn-pause'].addEventListener('click', function () {
  if (S.mode !== 'play') return;
  S.mode = 'pause';
  els['p-sub'].textContent = '步数 ' + S.steps + ' · 架上 ' + (S.fnd[0] + S.fnd[1] + S.fnd[2] + S.fnd[3]) + '/52';
  show('pause', true); els['abtns'].classList.remove('on');
});
els['btn-resume'].addEventListener('click', function () {
  if (S.mode !== 'pause') return;
  S.mode = 'play'; show('pause', false); syncHud();
});
els['btn-restart'].addEventListener('click', function () {
  if (S.mode !== 'pause') return;
  show('pause', false);
  newDeal((Date.now() & 0xffffffff) >>> 0); syncHud();
});
els['btn-undo'].addEventListener('click', function () { ensureAC(); doUndo(); });
els['btn-auto'].addEventListener('click', function () { ensureAC(); startAuto(); });
els['btn-snd'].addEventListener('click', function () {
  S.muted = !S.muted;
  try { localStorage.setItem('g107_mute', S.muted ? '1' : '0'); } catch (e) { }
  els['btn-snd'].textContent = S.muted ? '♪̸' : '♪';
  if (!S.muted) { ensureAC(); SND.place(5); }
});
window.addEventListener('blur', function () { if (S.mode === 'play') { S.mode = 'pause'; els['p-sub'].textContent = '步数 ' + S.steps + ' · 架上 ' + (S.fnd[0] + S.fnd[1] + S.fnd[2] + S.fnd[3]) + '/52'; show('pause', true); els['abtns'].classList.remove('on'); } });
document.addEventListener('visibilitychange', function () { if (document.hidden && S.mode === 'play') { S.mode = 'pause'; els['p-sub'].textContent = '步数 ' + S.steps + ' · 架上 ' + (S.fnd[0] + S.fnd[1] + S.fnd[2] + S.fnd[3]) + '/52'; show('pause', true); els['abtns'].classList.remove('on'); } });

/* ============ boot ============ */
(function boot() {
  try {
    S.muted = (localStorage.getItem('g107_mute') || '1') === '1';
    S.wins = +(localStorage.getItem('g107_wins') || 0) || 0;
  } catch (e) { }
  els['btn-snd'].textContent = S.muted ? '♪̸' : '♪';
  els['m-best'].textContent = S.wins ? '已归档 ' + S.wins + ' 局' : '新开的当铺';
  requestAnimationFrame(loop);
})();


</script>
</body>
</html>
