// ============ 引擎（演出层与 bot 共享同一 stepFrame —— SPEC §2 单源铁律）============
var ROWS={}; // lv -> {NR,tarr,dira,carr,vsafe,obs,allow,visoff}
function expand(lv){
  if(ROWS[lv])return ROWS[lv];
  var d=LVDATA[lv-1],L=d.L,NR=Math.floor(L/ROWH),vmax=d.VMAX,r,seg,i,pos;
  var tarr=new Array(NR),dira=new Array(NR),carr=new Array(NR);
  for(r=0;r<NR;r++){tarr[r]=0;dira[r]=0;carr[r]=0;}
  pos=0;
  for(i=0;i<d.segs.length;i++){seg=d.segs[i];
    for(var k=0;k<seg.l;k++){if(pos>=NR)break;tarr[pos]=seg.t;if(seg.t===1){dira[pos]=seg.dir;carr[pos]=seg.C;}pos++;}}
  for(i=0;i<d.pots.length;i++){r=d.pots[i];if(r<NR)tarr[r]=2;}
  for(i=0;i<d.fens.length;i++){r=d.fens[i];if(r<NR)tarr[r]=3;}
  var vsafe=new Array(NR);
  for(r=0;r<NR;r++){var v=vmax*(1.0-carr[r]*VSF);if(tarr[r]===2)v=VC;if(v<VSAFE_MIN)v=VSAFE_MIN;vsafe[r]=v;}
  var obs=[];for(i=0;i<d.obs.length;i++){var o=d.obs[i];obs.push([o.r,o.u0,o.u1]);}
  // allow 倒推（sqrt IEEE 两侧一致）
  var allow=new Array(NR);allow[NR-1]=vsafe[NR-1];
  for(r=NR-2;r>=0;r--){var a=vsafe[r],nx=Math.sqrt(allow[r+1]*allow[r+1]+2*BRK*ROWH);if(nx<a)a=nx;allow[r]=a;}
  // visoff 纯渲染层（不进物理/对拍）
  var visoff=new Array(NR);var vo=0;
  for(r=0;r<NR;r++){vo+=dira[r]*carr[r]*12.0;vo-=vo*0.02;visoff[r]=vo;}
  ROWS[lv]={NR:NR,tarr:tarr,dira:dira,carr:carr,vsafe:vsafe,obs:obs,allow:allow,visoff:visoff,d:d};
  return ROWS[lv];
}
function mkSt(){return {v:VMIN,p:0.0,u:0.0,hits:0,f:0,over:0,rank:0,hs:{}};}
function rankNow(st,d){
  var n=1;
  for(var k=0;k<d.g.length;k++){var T=d.g[k],spd=d.L/(T-START),pk=spd*Math.max(0,st.f-START);if(pk>st.p)n++;}
  return n;
}
// inp=[mv,thr,brk]
function stepFrame(st,inp,ex,d){
  if(st.over)return;
  var mv=inp[0],thr=inp[1],brk=inp[2];
  var v=st.v;
  if(brk)v-=BRK;else if(thr)v+=ACC-DRG;else v-=DRG;
  if(v<VMIN)v=VMIN;if(v>d.VMAX)v=d.VMAX;
  st.v=v;
  var rOld=Math.floor(st.p/ROWH);
  st.p+=v;
  var rNew=Math.floor(st.p/ROWH);
  var r;
  for(r=rOld+1;r<=rNew;r++){
    if(r>=ex.NR)break;
    var t=ex.tarr[r];
    if(t===2){if(st.v>VC)st.v=VC+0.4;}
    else if(t===3){st.v+=2.2;if(st.v>d.VMAX)st.v=d.VMAX;}
  }
  r=rNew<ex.NR?rNew:ex.NR-1;
  if(ex.tarr[r]===1&&st.v>ex.vsafe[r])st.u-=ex.dira[r]*(st.v-ex.vsafe[r])*DRIFT_K;
  st.u+=mv*HSPD;
  if(st.u>UMAX||st.u<-UMAX){
    st.u=st.u>0?UMAX:-UMAX;st.v*=0.72;st.hits++;
    if(SND)SND.rail(st.f);
  }
  var ob=ex.obs;
  for(var i=0;i<ob.length;i++){
    var o=ob[i];
    if(o[0]===rNew&&!(o[0]+'|'+o[1]+'|'+o[2] in st.hs)&&o[1]<=st.u&&st.u<=o[2]){
      st.v*=0.55;st.hits++;st.hs[o[0]+'|'+o[1]+'|'+o[2]]=1;
      if(SND)SND.rock(st.f);
      break;
    }
  }
  st.f++;
  if(st.p>=d.L){
    st.rank=rankNow(st,d);
    if(st.rank===1)st.over=1;else{st.over=2;st.rank=0;}
  }else if(st.f>=d.tl){st.over=2;st.rank=0;}
}
function scoreOf(st,d){
  if(st.over!==1)return 0;
  var sc=3000-st.hits*150+Math.floor(Math.max(0,Math.floor(d.g[0]*1.5)-st.f)/10);
  return sc<100?100:sc;
}
function starsOf(st){return st.hits===0?3:(st.hits<=2?2:1);}

function decOpt(st,ex){
  var r=Math.floor(st.p/ROWH);if(r>=ex.NR)r=ex.NR-1;
  var vt=ex.allow[r]+1.5;
  var brk=st.v>vt+0.02,thr=!brk&&st.v<vt-0.02;
  var tgt=0.0;
  if(ex.tarr[r]===1)tgt=-ex.dira[r]*25.0;
  var best=null,bd=1e9,ob=ex.obs;
  for(var i=0;i<ob.length;i++){var o=ob[i],key=o[0]+'|'+o[1]+'|'+o[2];
    if(key in st.hs)continue;
    var dd=o[0]-r;
    if(dd>0&&dd<=60&&dd<bd){bd=dd;best=o;}}
  if(best!==null){
    var u0=best[1],u1=best[2];
    if(st.u<u0)tgt=u0-40.0;
    else if(st.u>u1)tgt=u1+40.0;
    else tgt=(u0+UMAX)>(UMAX-u1)?(u0-UMAX)/2.0:(u1+UMAX)/2.0;
  }
  if(tgt<-55)tgt=-55.0;if(tgt>55)tgt=55.0;
  var mv=0;if(tgt<st.u-0.5)mv=-1;else if(tgt>st.u+0.5)mv=1;
  return [mv,thr,brk];
}
function decH1(st,ex,rnd,bias){
  var r=Math.floor(st.p/ROWH);if(r>=ex.NR)r=ex.NR-1;
  var vt=ex.allow[r]+1.6;
  var brk=st.v>vt,thr=!brk&&st.v<vt-0.3;
  var tgt=0.0+bias;
  if(ex.tarr[r]===1)tgt=-ex.dira[r]*25.0+bias;
  var best=null,bd=1e9,ob=ex.obs;
  for(var i=0;i<ob.length;i++){var o=ob[i],key=o[0]+'|'+o[1]+'|'+o[2];
    if(key in st.hs)continue;
    var dd=o[0]-r;
    if(dd>0&&dd<=13&&dd<bd){bd=dd;best=o;}}
  if(best!==null){
    var u0=best[1],u1=best[2];
    if(st.u<u0)tgt=u0-40.0+bias;
    else if(st.u>u1)tgt=u1+40.0+bias;
    else tgt=(u0+UMAX)>(UMAX-u1)?(u0-UMAX)/2.0:(u1+UMAX)/2.0;
  }
  if(tgt<-55)tgt=-55.0;if(tgt>55)tgt=55.0;
  var mv=0;if(tgt<st.u-0.5)mv=-1;else if(tgt>st.u+0.5)mv=1;
  return [mv,thr,brk];
}
function botPlay(mode,lv,seed){
  var ex=expand(lv),d=ex.d,st=mkSt(),rnd=new Rcl(seed),bias=0.0,guard=0;
  while(!st.over&&guard<40000){
    var inp;
    if(mode==='optimal')inp=decOpt(st,ex);
    else if(mode==='human1'){
      var miss=rnd.u(100)<18;
      if(st.f%30===0)bias=rnd.u(100)<50?-22.0:22.0;
      inp=miss?[0,false,false]:decH1(st,ex,rnd,bias);
    }else{
      var q=rnd.u(100);
      if(q<25)inp=[-1,true,false];else if(q<50)inp=[1,true,false];
      else if(q<65)inp=[0,true,false];else if(q<75)inp=[0,false,true];
      else if(q<85)inp=[-1,false,false];else if(q<95)inp=[1,false,false];
      else inp=[0,false,false];
    }
    stepFrame(st,inp,ex,d);
    guard++;
  }
  return [st.over,scoreOf(st,d),st.hits,st.rank,st.f];
}

function loadSave(){

    if(typeof s!=='object'||s===null||Array.isArray(s))throw 0;
    if(!Number.isInteger(s.unlocked)||s.unlocked<1)throw 0;
    var b={};var bk=s.best||{};
    for(var k in bk){if(!Object.prototype.hasOwnProperty.call(bk,k))continue;
      var v=bk[k];
      if(!Array.isArray(v)||v.length!==2||!Number.isInteger(v[0])||!Number.isInteger(v[1]))throw 0;
      if(v[1]<1||v[1]>3)throw 0;b[+k]=v;}
    return {unlocked:s.unlocked,best:b};
  }catch(e){return {unlocked:1,best:{}};}
}

var S={ph:'menu',lv:1,st:null,ex:null,keys:{l:0,r:0,u:0,d:0}};
var $=function(id){return document.getElementById(id);};
function newGame(lv){
  S.lv=lv;S.ex=expand(lv);S.st=mkSt();
  S.keys={l:0,r:0,u:0,d:0};
  S.ph='play';
  $('menu').classList.add('hide');$('lvs').classList.add('hide');$('over').classList.add('hide');$('pause').classList.add('hide');
}
function playerInp(){
  var brk=S.keys.d===1,thr=!brk&&S.keys.u===1;
  var mv=0;if(S.keys.l===1)mv-=1;if(S.keys.r===1)mv+=1;
  return [mv,thr,brk];
}
function endGame(){
  var st=S.st,d=S.ex.d;
  S.ph='over';
  var win=st.over===1;
  if(win){
    var sc=scoreOf(st,d),stn=starsOf(st);
    var b=SAVE.best[S.lv];
    if(!b||sc>b[0]){SAVE.best[S.lv]=[sc,stn];}
    if(SAVE.unlocked<S.lv+1&&S.lv<24)SAVE.unlocked=S.lv+1;
    saveMain();
    $('otitle').textContent='夺 魁';
    $('stars').textContent=stn===3?'★ ★ ★':(stn===2?'★ ★ ☆':'★ ☆ ☆');
    $('osub').innerHTML='用时 '+(st.f/60).toFixed(1)+' 秒 · 碰撞 '+st.hits+' 次<br>得分 '+sc;
    $('bNext').style.display=S.lv<24?'':'none';
    SND.win();
  }else{
    $('otitle').textContent=st.f>=d.tl?'马 力 不 济':'与 魁 首 无 缘';
    $('stars').textContent='';
    $('osub').textContent=st.f>=d.tl?'时限内未能冲线。':'众骑先至，且再试身手。';
    $('bNext').style.display='none';
    SND.lose();
  }
  $('over').classList.remove('hide');
}
var last=0,acc=0;
function mainLoop(ts){
  requestAnimationFrame(mainLoop);
  if(!last)last=ts;
  var dt=ts-last;last=ts;
  if(dt>200)dt=200;
  acc+=dt;
  while(acc>=16.6667){
    acc-=16.6667;
    if(S.ph==='play'){
      var st=S.st,d=S.ex.d;
      var p0=st.p;
      stepFrame(st,playerInp(),S.ex,d);
      // 过帘音效（渲染层检测）
      if(S.ph==='play'){
        var rA=Math.floor(p0/ROWH),rB=Math.floor(st.p/ROWH);
        for(var r=rA+1;r<=rB;r++){if(r<S.ex.NR&&S.ex.tarr[r]===3){SND.boost();break;}}
      }
      if(st.over)endGame();
      else SND.hoof(st.v,st.f);
    }
  }
  if(S.ph!=='menu')draw();
}
requestAnimationFrame(mainLoop);

// ============ 渲染 ============
var HORSE_LEGS=0;
function draw(){
  var st=S.st,ex=S.ex,d=ex.d;
  if(!st){drawMenuBg();return;}
  HORSE_LEGS=(HORSE_LEGS+1)%4;
  var rNow=Math.floor(st.p/ROWH);
  // 夜空
  var g=ctx.createLinearGradient(0,0,0,780);
  g.addColorStop(0,'#18202c');g.addColorStop(0.6,'#20293a');g.addColorStop(1,'#1a222f');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
  // 月与星
  ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(322,54,22,0,7);ctx.fill();
  ctx.fillStyle='#c8d2dc';
  ctx.fillRect(40,40,2,2);ctx.fillRect(96,90,2,2);ctx.fillRect(180,30,2,2);ctx.fillRect(260,100,2,2);ctx.fillRect(140,140,2,2);
  // 赛道（逐 10 行条带，visoff 弯道形变）
  var r,yTop,px=st.p;
  var baseRow=Math.floor(px/ROWH);
  for(yTop=64;yTop<780;yTop+=10){
    r=baseRow+Math.floor((yTop-64)/ROWH)*1; // 行号随屏幕纵深递增
    var rr=baseRow+Math.floor((780-yTop)/ROWH);
    var vo=(rr<ex.NR&&rr>=0)?ex.visoff[rr]:ex.visoff[Math.max(0,Math.min(ex.NR-1,rr))];
    var cx=195+vo;
    var t=(rr>=0&&rr<ex.NR)?ex.tarr[rr]:0;
    ctx.fillStyle=t===2?'#2a2420':'#3d3630';
    ctx.fillRect(cx-80,yTop,160,10);
    // 中线灯带
    if((rr%4)===0){ctx.fillStyle='rgba(216,168,96,0.16)';ctx.fillRect(cx-2,yTop+2,4,6);}
    // 护栏+灯笼串
    ctx.fillStyle='#5a4a36';ctx.fillRect(cx-88,yTop,7,10);ctx.fillRect(cx+81,yTop,7,10);
    if((rr%8)===0){
      ctx.fillStyle='#c05040';ctx.beginPath();ctx.arc(cx-84,yTop+5,5,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(cx+84,yTop+5,5,0,7);ctx.fill();
      ctx.fillStyle='rgba(216,168,96,0.13)';ctx.beginPath();ctx.arc(cx-84,yTop+5,11,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(cx+84,yTop+5,11,0,7);ctx.fill();
    }
  }
  // 行件绘制（相对马的纵深）
  var i,o;
  for(i=0;i<ex.obs.length;i++){
    o=ex.obs[i];
    drawRowAt(o[0],function(yy,vo){drawRock(o[1],o[2],yy,vo);});
  }
  for(r=0;r<ex.NR;r++){
    if(ex.tarr[r]===2)drawRowAt(r,drawPot);
    else if(ex.tarr[r]===3)drawRowAt(r,drawFen);
  }
  // ghost 骑手
  var GHCOL=['#8a6a4a','#7a8494','#6a5a5a'];
  for(i=0;i<d.g.length;i++){
    var T=d.g[i],spd=d.L/(T-START),pk=spd*Math.max(0,st.f-START);
    var dP=pk-st.p;
    var yy=560-dP*1.0;
    if(yy>70&&yy<730){
      var gr=Math.floor(pk/ROWH);
      var gvo=(gr>=0&&gr<ex.NR)?ex.visoff[gr]:0;
      drawHorse(195+gvo+LANES[i],yy,GHCOL[i%3],false);
    }
  }
  // 冲线带
  var finY=560-(d.L-st.p);
  if(finY>60&&finY<740){
    var fvo=ex.visoff[Math.min(ex.NR-1,Math.floor(d.L/ROWH)-1)];
    ctx.fillStyle='#e8c96a';
    for(var sx=-76;sx<76;sx+=16){ctx.fillRect(195+fvo+sx,finY,8,4);ctx.fillRect(195+fvo+sx+8,finY+4,8,4);}
  }
  // 玩家马
  var myVo=ex.visoff[Math.max(0,Math.min(ex.NR-1,rNow))];
  drawHorse(195+myVo+st.u,560,'#181820',true);
  // 速度线
  if(st.v>10){
    ctx.strokeStyle='rgba(232,201,106,0.25)';ctx.lineWidth=2;
    for(i=0;i<5;i++){
      var ly=200+i*90,lx=195+myVo+(i%2?26:-26);
      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx,ly+30+st.v*2);ctx.stroke();
    }
  }
  // HUD
  var rk=rankNow(st,d);
  $('hrk').textContent='第'+rk+'名';
  $('hsp').style.width=Math.round((st.v-VMIN)/(d.VMAX-VMIN)*100)+'%';
  $('hpme').style.left=Math.round(st.p/d.L*62)+'px';
  var gBest=d.g[0],gSpd=d.L/(gBest-START),gPk=gSpd*Math.max(0,st.f-START);
  $('hpgh').style.left=Math.round(Math.min(1,gPk/d.L)*62)+'px';
  $('hht').textContent='碰 '+st.hits;
}
function drawRowAt(r,fn){
  var st=S.st;
  var yy=560-(r*ROWH+4-st.p);
  if(yy>60&&yy<750){
    var vo=S.ex.visoff[Math.max(0,Math.min(S.ex.NR-1,r))];
    fn(yy,vo);
  }
}
function drawRock(u0,u1,yy,vo){
  var cx=195+vo;
  ctx.fillStyle='#6a5236';ctx.fillRect(cx+u0,yy-14,u1-u0,18);
  ctx.fillStyle='#4a3a28';ctx.fillRect(cx+u0,yy-14,u1-u0,4);
  ctx.strokeStyle='#8a6a44';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(cx+u0,yy+4);ctx.lineTo(cx+u1,yy-14);ctx.stroke();
}
function drawPot(yy,vo){
  ctx.fillStyle='#241e18';ctx.fillRect(195+vo-80,yy-6,160,10);
  ctx.fillStyle='#181410';ctx.fillRect(195+vo-80,yy-3,160,4);
}
function drawFen(yy,vo){
  var cx=195+vo;
  ctx.fillStyle='rgba(232,201,106,0.22)';ctx.fillRect(cx-80,yy-22,160,32);
  ctx.fillStyle='#d8a860';
  ctx.beginPath();ctx.arc(cx-60,yy-8,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx,yy-12,7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(cx+60,yy-8,7,0,7);ctx.fill();
}
function drawHorse(x,y,col,isMe){
  ctx.save();ctx.translate(x,y);
  // 阴影
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,10,20,6,0,0,7);ctx.fill();
  // 腿（4 相摆动）
  var ph=[6,-6,4,-4][HORSE_LEGS];
  ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8,2);ctx.lineTo(-11,12+ph*0.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,2);ctx.lineTo(11,12-ph*0.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-5,3);ctx.lineTo(-3,13-ph*0.4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(3,13+ph*0.4);ctx.stroke();
  // 躯干（俯视：纵向长椭圆）
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(0,-2,11,20,0,0,7);ctx.fill();
  // 头颈
  ctx.beginPath();ctx.ellipse(0,-24,6,10,0,0,7);ctx.fill();
  // 鬃/尾
  ctx.fillStyle=isMe?'#3a3040':'#4a4448';
  ctx.beginPath();ctx.ellipse(0,-13,3.5,12,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,17,4,8,0,0,7);ctx.fill();
  if(isMe){
    // 红缨
    ctx.fillStyle='#c04040';ctx.beginPath();ctx.arc(0,-32,4,0,7);ctx.fill();
    ctx.fillStyle='rgba(232,201,106,0.5)';ctx.beginPath();ctx.arc(0,-32,7,0,7);ctx.fill();
  }else{
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(0,-2,11,20,0,0,7);ctx.stroke();
  }
  ctx.restore();
}
function drawMenuBg(){
  var g=ctx.createLinearGradient(0,0,0,780);
  g.addColorStop(0,'#18202c');g.addColorStop(1,'#20293a');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
  ctx.fillStyle='#e8e0c8';ctx.beginPath();ctx.arc(300,80,26,0,7);ctx.fill();
}

// ============ 选关 UI ============
function buildLvs(){
  var g=$('lvgrid');g.innerHTML='';
  for(var lv=1;lv<=24;lv++){
    var c=document.createElement('div');c.className='c'+(lv>SAVE.unlocked?' lock':'');
    var b=SAVE.best[lv];
    c.innerHTML=lv+(b?'<small>'+'★'.repeat(b[1])+'</small>':'');
    (function(l){c.onclick=function(){newGame(l);};})(lv);
    g.appendChild(c);
  }
}
function showMenu(){
  S.ph='menu';
  $('menu').classList.remove('hide');$('lvs').classList.add('hide');
  $('over').classList.add('hide');$('pause').classList.add('hide');
}

// ============ 输入 ============
var KEYMAP={ArrowLeft:'l',KeyX:'u',ArrowUp:'u',KeyZ:'d',ArrowDown:'d',ArrowRight:'r'};
document.addEventListener('keydown',function(e){
  if(S.ph!=='play')return;
  var k=KEYMAP[e.code];
  if(k){S.keys[k]=1;e.preventDefault();}
  if(e.code==='Escape'&&S.ph==='play'){S.ph='pause';$('pause').classList.remove('hide');}
});
document.addEventListener('keyup',function(e){
  var k=KEYMAP[e.code];
  if(k){S.keys[k]=0;e.preventDefault();}
});
function bindHold(id,key){
  var el=$(id);
  el.addEventListener('pointerdown',function(e){e.preventDefault();if(S.ph==='play'){S.keys[key]=1;el.classList.add('on');SND.ensureAC();}});
  var off=function(){S.keys[key]=0;el.classList.remove('on');};
  el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindHold('kL','l');bindHold('kR','r');bindHold('kU','u');bindHold('kD','d');
$('bGo').onclick=function(){SND.ensureAC();newGame(SAVE.unlocked>=24?24:Math.min(SAVE.unlocked,24));};
$('bLvs').onclick=function(){$('menu').classList.add('hide');buildLvs();$('lvs').classList.remove('hide');};
$('bBack').onclick=function(){$('lvs').classList.add('hide');$('menu').classList.remove('hide');};
$('bAgain').onclick=function(){newGame(S.lv);};
$('bNext').onclick=function(){if(S.lv<24)newGame(S.lv+1);};
$('bRes').onclick=function(){S.ph='play';$('pause').classList.add('hide');};
$('bQuit').onclick=function(){showMenu();};

// ============ boot ============
showMenu();

</script>
<script src="../shell.js" defer></script>
