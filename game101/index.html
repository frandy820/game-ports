<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>转碟艺人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#141009}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f0e6d2;
  -webkit-user-select:none;user-select:none;touch-action:none}
#app{position:relative;width:100%;max-width:520px;height:100%;margin:0 auto;overflow:hidden;
  --sab:env(safe-area-inset-bottom,0px);
  background:radial-gradient(120% 40% at 50% -4%,rgba(217,154,85,.10) 0%,rgba(217,154,85,0) 52%),#141009}
#cv{position:absolute;left:0;width:100%;height:calc(100% - 64px);display:block;top:64px;cursor:pointer;touch-action:none;
  top:calc(64px + env(safe-area-inset-top,0px));
  height:calc(100% - 64px - env(safe-area-inset-top,0px))}
#hud{position:absolute;top:0;left:0;right:0;min-height:64px;display:flex;align-items:center;
  padding:env(safe-area-inset-top,0px) 14px 0;z-index:22;
  background:linear-gradient(180deg,rgba(18,13,8,.95),rgba(18,13,8,.55) 78%,transparent);
  transition:opacity .35s}
#app.menu-on #hud{opacity:0;pointer-events:none}
.hud-score{min-width:0}
.hud-score b{display:block;font-size:21px;color:#d99a55;letter-spacing:.04em;text-shadow:0 0 14px rgba(217,154,85,.35)}
.hud-score i{font-style:normal;font-size:9.5px;color:#a89878;letter-spacing:.28em}
.hud-mid{flex:1;text-align:center;min-width:0;padding:0 8px}
.hud-mid b{font-size:15px;color:#f2c98a;font-weight:700;letter-spacing:.12em;white-space:nowrap;display:block}
.hud-mid i{font-style:normal;font-size:9px;color:#a89878;letter-spacing:.2em}
.hud-right{display:flex;align-items:center;gap:10px}
.hud-lives{display:flex;gap:4px;align-items:center}
.hud-lives span{width:16px;height:11px;border-radius:50%;border:1.5px solid #d8c088;background:linear-gradient(180deg,#f0e0b0,#c8a860)}
.hud-lives span.off{opacity:.18;border-color:#6a5c48;background:none}
#btn-snd,#btn-pause{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#d8cba8;font-size:15px;line-height:1;cursor:pointer;flex:none}
#btn-pause{font-size:13px}
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(8,5,3,.78);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.on{display:flex}
#menu{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(130% 55% at 50% -4%,#241a0e 0%,rgba(36,26,14,0) 58%),
  radial-gradient(120% 34% at 50% 106%,rgba(217,154,85,.22) 0%,rgba(217,154,85,0) 72%)}
#menu.on{display:flex}
#menu::after{content:'';position:absolute;left:10%;right:10%;bottom:calc(var(--sab,0px) + 42px);height:2px;
  background:linear-gradient(90deg,transparent,rgba(217,154,85,.8),transparent);box-shadow:0 0 24px 5px rgba(217,154,85,.3)}
.m-kicker{font-size:11.5px;letter-spacing:.42em;color:#a08c68;margin-bottom:14px;padding-left:.42em}
.m-title{font-size:38px;font-weight:800;letter-spacing:.14em;padding-left:.14em;
  background:linear-gradient(180deg,#f7e8ca,#d99a55 58%,#96601e);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 26px rgba(217,154,85,.22)}
.m-sub{margin-top:10px;font-size:11px;letter-spacing:.3em;color:#c4b08c;padding-left:.3em}
.m-go{margin-top:36px;width:150px;padding:13px 0;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(180deg,#eec27c,#a86e28);color:#241604;font-size:16.5px;font-weight:700;
  letter-spacing:.3em;padding-left:.3em;font-family:inherit;box-shadow:0 8px 26px rgba(217,154,85,.3)}
.m-how{margin-top:20px;font-size:11px;line-height:2;color:#a89878;text-align:center;letter-spacing:.06em}
.m-how b{color:#f0e2bc;font-weight:600}
.m-best{margin-top:18px;font-size:12px;color:#d9c690;letter-spacing:.18em}
.m-best b{color:#fff;font-size:15px;font-weight:700}
.m-foot{position:absolute;bottom:calc(var(--sab,0px) + 16px);left:0;right:0;text-align:center;color:#a08c68;font-size:11px;letter-spacing:.14em}
.panel{width:min(330px,86%);padding:26px 22px 22px;border-radius:18px;text-align:center;position:relative;
  background:linear-gradient(180deg,#211709,#120d08);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.panel.celebrate{border-color:rgba(217,154,85,.6);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 34px rgba(217,154,85,.22)}
.panel h3{font-size:19px;letter-spacing:.22em;color:#f4ecda;margin-bottom:8px}
.ov.on .panel{animation:popin .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{from{transform:scale(.9) translateY(10px);opacity:1}to{transform:scale(1) translateY(0);opacity:1}}
.p-sub{font-size:12.5px;color:#a89878;line-height:2;margin-bottom:6px}
.p-sub b{color:#d99a55;font-weight:600}
.p-stats{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}
.p-stats div{flex:1;padding:8px 2px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.p-stats b{display:block;font-size:17px;color:#f2c98a;font-weight:700}
.p-stats i{font-style:normal;font-size:9px;color:#a89878;letter-spacing:.1em}
.p-btns{display:flex;gap:10px;margin-top:16px}
.p-btn{flex:1;padding:11px 0;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13.5px;letter-spacing:.14em}
.p-btn.gold{border:none;background:linear-gradient(180deg,#eec27c,#a86e28);color:#241604;font-weight:700}
.p-btn.line{background:none;border:1px solid rgba(255,255,255,.22);color:#e8dfc8}
#banner{position:absolute;top:26%;left:0;right:0;text-align:center;z-index:12;pointer-events:none;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#banner b{display:block;font-size:30px;font-weight:800;letter-spacing:.42em;padding-left:.42em;color:#f2c98a;
  text-shadow:0 0 26px rgba(217,154,85,.7),0 4px 14px rgba(0,0,0,.7)}
#banner.on b{animation:bannerIn .45s ease-out}
@keyframes bannerIn{from{transform:scale(.86);letter-spacing:.14em}}
#banner i{display:block;margin-top:6px;font-style:normal;font-size:11.5px;letter-spacing:.3em;color:#d8cba8}
#score.pop{animation:scorepop .18s ease-out}
@keyframes scorepop{from{transform:scale(1.25)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-score"><b id="score">0</b><i>得 分</i></div>
    <div class="hud-mid"><b id="wave-i">第 1 波</b><i>WAVE</i></div>
    <div class="hud-right">
      <div class="hud-lives" id="lives-i"></div>
      <button id="btn-pause" aria-label="暂停">Ⅱ</button>
      <button id="btn-snd" aria-label="声音">♪̶</button>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div id="banner"><b id="banner-b"></b><i id="banner-i"></i></div>

  <div id="menu" class="on">
    <div class="m-kicker">PLATE SPINNING · 夜 市 杂 耍 摊</div>
    <div class="m-title">转碟艺人</div>
    <div class="m-sub">一 竿 一 碟 · 手 眼 不 停</div>
    <button class="m-go" id="btn-go">开 转</button>
    <div class="m-best" id="m-best">最佳 <b>0</b></div>
    <div class="m-how"><b>按住竹竿</b>，艺人就给那竿的瓷盘续转，不抬手横扫可连着伺候几竿<br><b>盘越转越慢</b>，慢到垂危就红闪急晃，转停了当场摔碎<br><b>碎三只收摊</b>；撑过一波加一盘，夜越深转得越急，稳住别慌</div>
    <div class="m-foot">转 碟 艺 人 · 眼 观 六 路</div>
  </div>

  <div class="ov" id="pause-ov">
    <div class="panel">
      <h3>暂 停</h3>
      <div class="p-sub" id="pause-sub">碟还在竿上打着转</div>
      <div class="p-btns">
        <button class="p-btn gold" id="btn-resume">接着转</button>
        <button class="p-btn line" id="btn-restart">重新开摊</button>
        <button class="p-btn line" id="btn-quit">收摊回座</button>
      </div>
    </div>
  </div>

  <div class="ov" id="end-ov">
    <div class="panel" id="end-panel">
      <h3 id="end-title">收 摊 了</h3>
      <div class="p-sub" id="end-sub"></div>
      <div class="p-stats" id="end-stats"></div>
      <div class="p-btns">
        <button class="p-btn gold" id="btn-retry">再开一场</button>
        <button class="p-btn line" id="btn-menu">回杂耍摊</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ===== 常量（规则层单源，全确定性——无逻辑随机；D2 冻结 2026-09-12） ===== */
var CFG={W:390,H:780,STEP:1/120,
  K0:2.6,KR:1.09,KCAP:5.2,R:24,                 /* 衰减/续转 */
  WAVE_T:18,NW:5,NEW_E:80,START_E:100,           /* 波结构：N(w)=min(1+w,5) 波末补满 */
  DANGER:15,LIVES:3,TOP:60,FALL:.35,             /* 垂危带/命/稳转线/落体时长 */
  POLE_TOP:190,POLE_BOT:690};
function kOf(w){return Math.min(CFG.K0*Math.pow(CFG.KR,w-1),CFG.KCAP)}
function nOf(w){return Math.min(1+w,CFG.NW)}
function cheerOf(w){return w<=7?1:Math.min(1.3,1+.05*(w-7))}
/* ===== 状态 ===== */
var S={mode:'menu',score:0,best:0,wave:1,waveT:0,lives:CFG.LIVES,t:0,
  plates:[],hold:-1,heldOnce:false,parts:[],floats:[],flash:0,flashTxt:'',bannerT:0,
  smashes:0,man:{x:195,arm:0},muted:true,_fz:0};
var el={};
function $(i){return document.getElementById(i)}
function init(){
  ['cv','hud','score','wave-i','lives-i','btn-snd','btn-pause','menu','btn-go','m-best',
   'banner','banner-b','banner-i','pause-ov','pause-sub','btn-resume','btn-restart','btn-quit',
   'end-ov','end-panel','end-title','end-sub','end-stats','btn-retry','btn-menu'].forEach(function(k){el[k]=$(k)});
  S.best=+load('g101_best',0)||0;
  S.muted=String(load('g101_mute',1))==='1';
  el['m-best'].innerHTML='最佳 <b>'+S.best+'</b>';
  el['btn-snd'].textContent=S.muted?'♪̶':'♪';
  bind();resize();
  document.getElementById('app').classList.add('menu-on');
  requestAnimationFrame(loop);
}
var store={};
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return k in store?store[k]:d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){store[k]=v}}
/* ===== 局程 ===== */
function newPlate(slot,e){return{slot:slot,e:e,ph:slot*1.7,fall:0}}
function startGame(){
  S.mode='play';S.score=0;S.wave=1;S.waveT=0;S.lives=CFG.LIVES;S.t=0;
  S.plates=[newPlate(0,CFG.START_E),newPlate(1,CFG.START_E)];
  S.hold=-1;S.heldOnce=false;S.parts=[];S.floats=[];S.flash=0;S.bannerT=0;S.smashes=0;
  S.man={x:195,arm:0};
  document.getElementById('app').classList.remove('menu-on');
  el.menu.classList.remove('on');el['end-ov'].classList.remove('on');el['pause-ov'].classList.remove('on');
  updHUD();
}
function endGame(){
  if(S.mode==='over')return;
  S.mode='over';S.hold=-1;
  var sc=Math.floor(S.score),nb=sc>S.best&&sc>0;
  if(nb){S.best=sc;save('g101_best',sc);el['m-best'].innerHTML='最佳 <b>'+S.best+'</b>'}
  el['end-panel'].classList.toggle('celebrate',nb||S.wave>=15);
  el['end-title'].textContent=S.wave>=15?'名 震 夜 市':(nb?'手 快 眼 尖':'收 摊 了');
  el['end-sub'].innerHTML=S.wave>=15?'撑到第 <b>'+S.wave+'</b> 波 · 满堂喝彩':'碎满三只 · 转到第 <b>'+S.wave+'</b> 波'+(nb?' · 新纪录':' · 纪录 '+S.best);
  el['end-stats'].innerHTML=
    '<div><b>'+sc+'</b><i>总分</i></div>'+
    '<div><b>'+S.wave+'</b><i>波次</i></div>'+
    '<div><b>'+S.smashes+'</b><i>碎盘</i></div>';
  el['end-ov'].classList.add('on');SND.end(nb);
}
function toMenu(){
  S.mode='menu';S.plates=[];S.parts=[];S.floats=[];S.hold=-1;
  document.getElementById('app').classList.add('menu-on');
  el['pause-ov'].classList.remove('on');el['end-ov'].classList.remove('on');el.menu.classList.add('on');
}
/* ===== 物理与规则（确定性；vm 可 tick） ===== */
function step(dt){
  var i,k=kOf(S.wave),ch=cheerOf(S.wave);
  S.t+=dt;
  /* 盘：衰减/续转（fall 期不再变 e） */
  for(i=0;i<S.plates.length;i++){
    var p=S.plates[i];
    if(p.fall>0)continue;
    p.e+=(-k+(S.hold===p.slot?CFG.R:0))*dt;
    if(p.e>100)p.e=100;
    if(p.e<=0){p.e=0;p.fall=CFG.FALL;SND.fall()}
  }
  /* 垂危急促音（任一盘 0<E≤15 且未落体 → 节流 0.4s 一响） */
  S._dgr=(S._dgr||0)+dt;
  if(S._dgr>=.4){
    for(i=0;i<S.plates.length;i++){var dp=S.plates[i];
      if(dp.fall<=0&&dp.e>0&&dp.e<=CFG.DANGER){SND.danger();break}}
    S._dgr=0;
  }
  /* 得分：活盘+稳转加成（fall 期不算稳转但盘还在竿上——按 SPEC「活盘」含下落中，权重 1） */
  var alive=0,steady=0;
  for(i=0;i<S.plates.length;i++){var q=S.plates[i];alive++;if(q.fall<=0&&q.e>CFG.TOP)steady++}
  S.score+=(alive+steady)*dt*ch;
  /* 落体→碎 */
  for(i=S.plates.length-1;i>=0;i--){
    var f=S.plates[i];
    if(f.fall>0){
      f.fall-=dt;
      if(f.fall<=0){
        S.plates.splice(i,1);S.lives--;S.smashes++;
        smashFx(f.slot);addFloat('碎了！',slotX(f.slot),CFG.POLE_TOP+40,'#e86a5a');
        S.flashTxt='瓷盘碎了 · 还剩 '+S.lives+' 只';S.flash=1.4;
        SND.smash();
        if(S.lives<=0){updHUD();endGame();return}
      }
    }
  }
  /* 波末补满制 */
  S.waveT+=dt;
  if(S.waveT>=CFG.WAVE_T){
    S.waveT-=CFG.WAVE_T;
    var bonus=40*S.wave;S.score+=bonus;
    S.wave++;SND.wave(S.wave);
    var tgt=nOf(S.wave),used={},addn=0;
    for(i=0;i<S.plates.length;i++)used[S.plates[i].slot]=1;
    for(i=0;i<CFG.NW&&S.plates.length<tgt;i++){if(!(i in used)){S.plates.push(newPlate(i,CFG.NEW_E));addn++}}
    /* 横幅按实际加盘数报（满盘过波不加盘——不再误报「加一盘」） */
    if(addn>0)showBanner('第 '+S.wave+' 波',S.wave>7?'加一盘 · 喝彩得分 ×'+cheerOf(S.wave).toFixed(2).replace(/0+$/,'').replace(/\.$/,''):'加一盘 · 转 +'+bonus+' 分');
    else if(S.wave>7)showBanner('第 '+S.wave+' 波','喝彩声起 · 得分 ×'+cheerOf(S.wave).toFixed(2).replace(/0+$/,'').replace(/\.$/,''));
    else showBanner('第 '+S.wave+' 波','盘已满座 · 转 +'+bonus+' 分');
    updHUD();
  }
  /* 艺人跑位 */
  var tx=S.hold>=0?slotX(S.hold):195;
  S.man.x+=(tx-S.man.x)*Math.min(1,dt*10);
  S.man.arm=S.hold>=0?Math.min(1,S.man.arm+dt*6):Math.max(0,S.man.arm-dt*6);
  /* 特效 */
  for(i=S.parts.length-1;i>=0;i--){var qq=S.parts[i];
    qq.t+=dt;qq.x+=qq.vx*dt;qq.y+=qq.vy*dt;qq.vy+=(qq.grav||300)*dt;qq.rot+=qq.vr*dt;
    if(qq.t>(qq.life||.9))S.parts.splice(i,1)}
  for(i=S.floats.length-1;i>=0;i--){var fl=S.floats[i];fl.t+=dt;fl.y-=26*dt;if(fl.t>1.1)S.floats.splice(i,1)}
  if(S.flash>0)S.flash=Math.max(0,S.flash-dt);
  if(S.bannerT>0){S.bannerT-=dt;if(S.bannerT<=0)el.banner.className=''}
  updHUD();
}
function slotX(i){return CFG.W/CFG.NW*(i+.5)}
var _hudWave='',_hudLives=-1;
function updHUD(){
  var sc=Math.floor(S.score);
  if(el.score.textContent!=String(sc)){el.score.textContent=sc;
    el.score.classList.remove('pop');void el.score.offsetWidth;el.score.classList.add('pop')}
  var wv='第 '+S.wave+' 波';
  if(_hudWave!==wv){el['wave-i'].textContent=wv;_hudWave=wv}
  if(_hudLives!==S.lives){
    _hudLives=S.lives;
    var s='',i;
    for(i=0;i<CFG.LIVES;i++)s+='<span class="'+(i<S.lives?'':'off')+'"></span>';
    el['lives-i'].innerHTML=s;
  }
}
function showBanner(b,t){el['banner-b'].textContent=b;el['banner-i'].textContent=t;el.banner.className='on';S.bannerT=1.5}
function addFloat(txt,x,y,c){S.floats.push({txt:txt,x:x,y:y,t:0,c:c||'#f0e6d2'})}
function smashFx(slot){
  var x=slotX(slot),y=CFG.POLE_TOP,i;
  for(i=0;i<10;i++){
    var a=-Math.PI/2+(i/10-.5)*2.2;
    S.parts.push({x:x,y:y+60,vx:Math.cos(a)*(60+Math.random()*120),vy:Math.sin(a)*(80+Math.random()*140),
      c:i%2?'#f0e0b0':'#c8a860',s:4+Math.random()*4,t:0,life:.8,grav:420,rot:Math.random()*3,vr:(Math.random()-.5)*8});
  }
}
/* ===== 渲染 ===== */
var ctx=null,dpr=1,cvW=390,cvH=780;
function resize(){
  var cv=el.cv;if(!cv)return;
  var rect=cv.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);
  cvW=rect.width;cvH=rect.height;
  cv.width=cvW*dpr;cv.height=cvH*dpr;
  ctx=cv.getContext('2d');if(ctx)ctx.setTransform(dpr,0,0,dpr,0,0);
}
function sx(x){return x*cvW/CFG.W}
function sy(y){return y*cvH/CFG.H}
var LAMPS=[46,88,132,178,224,270,316,356];
var _acc=0;
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,(t-(loop.t||t))/1000);loop.t=t;
  if(S.mode==='play'&&!S._fz){
    _acc+=dt;var n2=0;
    while(_acc>=CFG.STEP&&n2++<6){step(CFG.STEP);_acc-=CFG.STEP}
  }else{
    var i;
    for(i=S.parts.length-1;i>=0;i--){var q=S.parts[i];
      q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.grav||300)*dt;
      if(q.t>(q.life||.9))S.parts.splice(i,1)}
    for(i=S.floats.length-1;i>=0;i--){var f=S.floats[i];f.t+=dt;f.y-=26*dt;if(f.t>1.1)S.floats.splice(i,1)}
    if(S.flash>0)S.flash=Math.max(0,S.flash-dt);
    if(S.bannerT>0){S.bannerT-=dt;if(S.bannerT<=0)el.banner.className=''}
  }
  if(ctx)render(t);
}
function render(t){
  var W=cvW,H=cvH,i;
  ctx.clearRect(0,0,W,H);
  /* 夜空（顶部带） */
  var g0=ctx.createLinearGradient(0,0,0,sy(120));
  g0.addColorStop(0,'#1a1208');g0.addColorStop(1,'#141009');
  ctx.fillStyle=g0;ctx.fillRect(0,0,W,sy(120));
  /* 远处夜市灯牌剪影 */
  ctx.fillStyle='#0c0906';
  ctx.beginPath();ctx.moveTo(0,sy(150));
  ctx.quadraticCurveTo(sx(60),sy(96),sx(130),sy(140));
  ctx.quadraticCurveTo(sx(220),sy(180),sx(300),sy(120));
  ctx.quadraticCurveTo(sx(350),sy(96),W,sy(130));
  ctx.lineTo(W,sy(240));ctx.lineTo(0,sy(240));ctx.closePath();ctx.fill();
  /* 灯串（垂弧） */
  ctx.strokeStyle='rgba(216,176,120,.3)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(0,sy(56));ctx.quadraticCurveTo(sx(195),sy(110),W,sy(56));ctx.stroke();
  for(i=0;i<LAMPS.length;i++){
    var lx=sx(LAMPS[i]),ly=sy(56+40*Math.sin(Math.PI*LAMPS[i]/390)+((i%2)*4));
    var tw=.7+.3*Math.sin(t/650+i*1.7);
    ctx.fillStyle='rgba(255,224,160,'+(.75*tw+.2)+')';
    ctx.beginPath();ctx.arc(lx,ly,sx(2.6),0,7);ctx.fill();
    ctx.fillStyle='rgba(255,224,160,'+(.13*tw)+')';
    ctx.beginPath();ctx.arc(lx,ly,sx(8),0,7);ctx.fill();
  }
  /* 舞台木板（暖米） */
  var gg=ctx.createLinearGradient(0,sy(240),0,H);
  gg.addColorStop(0,'#4a3820');gg.addColorStop(.12,'#6a5230');gg.addColorStop(.5,'#54401f');gg.addColorStop(1,'#33260f');
  ctx.fillStyle=gg;ctx.fillRect(0,sy(240),W,H-sy(240));
  ctx.strokeStyle='rgba(20,14,6,.35)';ctx.lineWidth=1;
  for(i=0;i<7;i++){var by=sy(250+i*82);ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(W,by);ctx.stroke()}
  ctx.strokeStyle='rgba(232,207,154,.12)';
  ctx.beginPath();ctx.moveTo(0,sy(244));ctx.lineTo(W,sy(244));ctx.stroke();
  /* 台前垂布+观众剪影 */
  ctx.fillStyle='rgba(20,12,4,.5)';
  ctx.beginPath();ctx.moveTo(0,sy(240));ctx.quadraticCurveTo(sx(40),sy(232),sx(52),sy(240));
  ctx.lineTo(sx(52),sy(252));ctx.quadraticCurveTo(sx(40),sy(244),0,sy(252));ctx.closePath();ctx.fill();
  for(i=0;i<9;i++){
    var ax=sx(20+i*44);
    ctx.fillStyle='rgba(10,7,3,.55)';
    ctx.beginPath();ctx.arc(ax,sy(258),sx(6),0,7);ctx.fill();
    ctx.fillRect(ax-sx(5),sy(260),sx(10),sy(14));
  }
  /* 竿 */
  var used={};
  for(i=0;i<S.plates.length;i++)used[S.plates[i].slot]=1;
  for(i=0;i<CFG.NW;i++){
    var px=sx(slotX(i));
    ctx.strokeStyle='#7a5a2e';ctx.lineWidth=sx(6);
    ctx.beginPath();ctx.moveTo(px,sy(CFG.POLE_BOT));ctx.lineTo(px,sy(CFG.POLE_TOP+14));ctx.stroke();
    ctx.strokeStyle='rgba(232,207,154,.25)';ctx.lineWidth=sx(1.4);
    ctx.beginPath();ctx.moveTo(px-sx(1.6),sy(CFG.POLE_BOT-6));ctx.lineTo(px-sx(1.6),sy(CFG.POLE_TOP+18));ctx.stroke();
    /* 竿顶托头 */
    ctx.fillStyle='#8a6a3a';
    ctx.beginPath();ctx.arc(px,sy(CFG.POLE_TOP+12),sx(4),0,7);ctx.fill();
    /* 死竿残留碎片痕（本波内碎的——波末即复活，碎痕只保留到波末） */
  }
  /* 盘（含垂危红闪/倾摆/落体） */
  for(i=0;i<S.plates.length;i++)drawPlate(S.plates[i],t);
  /* 艺人 */
  drawMan(t);
  /* 粒子 */
  for(i=0;i<S.parts.length;i++){
    var q2=S.parts[i],al=Math.max(0,1-Math.pow(q2.t/(q2.life||.9),1.5));
    ctx.globalAlpha=al;ctx.fillStyle=q2.c;
    ctx.save();ctx.translate(sx(q2.x),sy(q2.y));ctx.rotate(q2.rot||0);
    ctx.fillRect(-q2.s/2,-q2.s/2,q2.s,q2.s*.5);ctx.restore();ctx.globalAlpha=1;
  }
  /* 飘字 */
  ctx.textAlign='center';
  for(i=0;i<S.floats.length;i++){
    var fl=S.floats[i],fa=1-fl.t/1.1;
    ctx.globalAlpha=Math.max(0,fa);
    ctx.font='700 14px system-ui';ctx.fillStyle=fl.c;
    ctx.fillText(fl.txt,sx(fl.x),sy(fl.y));ctx.globalAlpha=1;
  }
  /* 稳转光带（每盘 e>60 盘下微光）与垂危警示线在 drawPlate 内 */
  /* flash 提示条 y612-644（与 DOM 钮零相交——钮全在 y<64 HUD） */
  if(S.flash>0){
    var fa2=Math.min(1,S.flash);
    ctx.fillStyle='rgba(18,10,6,'+(.82*fa2)+')';
    rr(sx(30),sy(612),sx(330),sy(32),8);ctx.fill();
    ctx.fillStyle='rgba(242,201,138,'+fa2+')';
    ctx.font='700 13px system-ui';ctx.textAlign='center';
    ctx.fillText(S.flashTxt,sx(195),sy(633));
  }
  /* 首按引导 */
  if(S.mode==='play'&&!S.heldOnce){
    var br=.7+.2*Math.sin(t/380);
    ctx.globalAlpha=br;ctx.textAlign='center';
    ctx.font='13px system-ui';ctx.fillStyle='#f0e6d2';
    ctx.fillText('按住竹竿 · 给瓷盘续转',sx(195),sy(560));
    ctx.globalAlpha=1;
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawPlate(p,t){
  var x=slotX(p.slot),topY=CFG.POLE_TOP+8;
  var y=topY,ang=0,r=sx(27);
  if(p.fall>0){
    var f=1-p.fall/CFG.FALL;
    y=topY+f*f*(CFG.POLE_BOT-topY-70);ang=f*2.2;
  }else{
    var e=p.e;
    var amp=e>CFG.TOP?2:e>CFG.DANGER?2+(1-(e-CFG.DANGER)/(CFG.TOP-CFG.DANGER))*9:13+2*Math.sin(t/60);
    ang=amp*Math.PI/180*Math.sin(t/(e>CFG.TOP?520:300)+p.ph);
    y=topY+(1-Math.min(1,e/40))*6;
  }
  var px=sx(x),py=sy(y);
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  /* 托尖 */
  ctx.fillStyle='#b09468';
  ctx.beginPath();ctx.moveTo(0,sy(2));ctx.lineTo(-sx(4),sy(13));ctx.lineTo(sx(4),sy(13));ctx.closePath();ctx.fill();
  /* 盘体：暖白渐变+青花缘 */
  var pg=ctx.createRadialGradient(-r*.3,-r*.28,r*.15,0,0,r*1.02);
  pg.addColorStop(0,'#faf2dc');pg.addColorStop(.62,'#ecdfbe');pg.addColorStop(1,'#c2ab78');
  ctx.fillStyle=pg;
  ctx.beginPath();ctx.ellipse(0,0,r,r*.34,0,0,7);ctx.fill();
  ctx.strokeStyle=p.e<=CFG.DANGER&&(t/130%1<.5)?'#e86a5a':'#6a5426';
  ctx.lineWidth=sx(1.6);
  ctx.beginPath();ctx.ellipse(0,0,r,r*.34,0,0,7);ctx.stroke();
  /* 青花缘纹 */
  ctx.strokeStyle='rgba(70,96,140,.75)';ctx.lineWidth=sx(1.2);
  ctx.beginPath();ctx.ellipse(0,0,r*.8,r*.8*.34,0,0,7);ctx.stroke();
  /* 转速纹：稳转时弧光，弱转时转慢 */
  if(p.fall<=0&&p.e>0){
    var sp=.4+Math.min(1.6,p.e/60),a0=t/300*sp+p.ph;
    ctx.strokeStyle='rgba(255,244,214,'+(p.e>CFG.TOP?.55:.3)+')';ctx.lineWidth=sx(2);
    ctx.beginPath();ctx.ellipse(0,0,r*.62,r*.62*.34,0,a0,a0+1.9);ctx.stroke();
  }
  /* 垂危红晕 */
  if(p.fall<=0&&p.e<=CFG.DANGER){
    ctx.fillStyle='rgba(232,106,90,'+(.16+.12*Math.sin(t/90))+')';
    ctx.beginPath();ctx.ellipse(0,0,r*1.5,r*.62,0,0,7);ctx.fill();
  }
  ctx.restore();
}
function drawMan(t){
  var x=S.man.x,y=676,r=sx(13);
  var px=sx(x),py=sy(y);
  var walk=S.hold>=0?Math.sin(t/90)*sx(3):0;
  ctx.save();ctx.translate(px+walk,py);
  /* 影 */
  ctx.fillStyle='rgba(10,6,2,.4)';
  ctx.beginPath();ctx.ellipse(0,sy(6),sx(16),sx(5),0,0,7);ctx.fill();
  /* 褂 */
  var bg=ctx.createLinearGradient(0,-r*2,0,0);
  bg.addColorStop(0,'#c89858');bg.addColorStop(1,'#8a5c26');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(-r*.7,-r*1.1);ctx.lineTo(r*.7,-r*1.1);
  ctx.lineTo(r*.95,sy(2));ctx.lineTo(-r*.95,sy(2));ctx.closePath();ctx.fill();
  /* 臂：举竿姿态（按住时上举） */
  ctx.strokeStyle='#8a5c26';ctx.lineWidth=sx(4);ctx.lineCap='round';
  var up=S.man.arm;
  ctx.beginPath();
  ctx.moveTo(-r*.5,-r*.7);ctx.lineTo(-r*.5-r*.9*(1-up),-r*.7-sy(26)*up-r*.2);
  ctx.moveTo(r*.5,-r*.7);ctx.lineTo(r*.5+r*.9*(1-up),-r*.7-sy(26)*up-r*.2);
  ctx.stroke();
  /* 头+巾 */
  ctx.fillStyle='#e8c894';
  ctx.beginPath();ctx.arc(0,-r*1.5,r*.52,0,7);ctx.fill();
  ctx.fillStyle='#c04a3a';
  ctx.beginPath();ctx.arc(0,-r*1.62,r*.5,Math.PI,0);ctx.fill();
  ctx.beginPath();ctx.moveTo(r*.46,-r*1.62);ctx.lineTo(r*.95,-r*1.3);ctx.lineTo(r*.42,-r*1.42);ctx.closePath();ctx.fill();
  ctx.restore();
}
/* ===== 音效（J2 家族范式：手势内建 AC+恢复态一次性 wake 自摘） ===== */
var SND=(function(){
  var ac=null;
  function ctxA(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(ac&&ac.state==='suspended')ac.resume();return ac}
  function tone(f,d,type,vol,slide){
    if(S.muted)return;var a=ctxA();if(!a)return;
    var o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
    g.gain.value=vol||.15;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
  }
  return{spin:function(){tone(320,.1,'sawtooth',.035,520)},
    fall:function(){tone(600,.18,'sine',.04,180)},
    danger:function(){tone(880,.06,'square',.05)},
    smash:function(){tone(160,.22,'square',.09,60);tone(2400,.05,'triangle',.05,900)},
    wave:function(w){[392,494,587].forEach(function(f,i){setTimeout(function(){tone(f,.16,'triangle',.09)},i*90)});
      if(w>7)setTimeout(function(){tone(784,.2,'triangle',.1)},300)},
    end:function(nb){[330,262,196].forEach(function(f,i){setTimeout(function(){tone(f,.28,'triangle',.09)},i*140)});
      if(nb)setTimeout(function(){tone(880,.32,'triangle',.11)},440)},
    ui:function(){tone(760,.05,'square',.05)},
    resume:function(){ctxA()}};
})();
function wake(){SND.resume();if(document.removeEventListener)document.removeEventListener('pointerdown',wake)}
if(!S.muted&&document.addEventListener)document.addEventListener('pointerdown',wake);
/* ===== 输入（M1 家族范式：capture+window 级 up/cancel/blur/hidden+幂等清） ===== */
function poleAt(cx,cy){
  var r=el.cv.getBoundingClientRect();
  var x=(cx-r.left)/r.width*CFG.W;
  return Math.max(0,Math.min(CFG.NW-1,Math.floor(x/CFG.W*CFG.NW)));
}
function bind(){
  el.cv.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    SND.resume();
    if(S.mode!=='play')return;
    S.hold=poleAt(e.clientX,e.clientY);
    S.heldOnce=true;SND.spin();
    if(el.cv.setPointerCapture&&e.pointerId!=null){try{el.cv.setPointerCapture(e.pointerId)}catch(_){}}
  });
  el.cv.addEventListener('pointermove',function(e){
    if(S.hold<0||S.mode!=='play')return;
    var p=poleAt(e.clientX,e.clientY);
    if(p!==S.hold){S.hold=p;SND.spin()}
  });
  var release=function(){if(S.hold>=0){S.hold=-1}};
  el.cv.addEventListener('pointerup',release);
  el.cv.addEventListener('pointercancel',release);
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  window.addEventListener('blur',release);
  if(document.addEventListener)document.addEventListener('visibilitychange',function(){
    if(document.hidden){release();if(S.mode==='play')doPause()}});
  el['btn-go'].addEventListener('click',function(){SND.resume();startGame();SND.ui()});
  el['btn-snd'].addEventListener('click',function(){
    S.muted=!S.muted;save('g101_mute',S.muted?1:0);
    el['btn-snd'].textContent=S.muted?'♪̶':'♪';
    if(!S.muted){SND.resume();SND.ui()}
  });
  el['btn-pause'].addEventListener('click',function(){
    if(S.mode==='play')doPause();
  });
  function doPause(){
    S.mode='pause';S.hold=-1;                       /* M1：打断即清 hold */
    el['pause-ov'].classList.add('on');
    el['pause-sub'].textContent='第 '+S.wave+' 波 · 竿上还剩 '+S.plates.length+' 只盘';
    SND.ui();
  }
  el['btn-resume'].addEventListener('click',function(){
    if(S.mode==='pause'){S.mode='play';el['pause-ov'].classList.remove('on');SND.ui()}
  });
  el['btn-restart'].addEventListener('click',function(){
    if(S.mode==='pause'){el['pause-ov'].classList.remove('on');startGame();SND.ui()}
  });
  el['btn-quit'].addEventListener('click',function(){toMenu();SND.ui()});
  el['btn-menu'].addEventListener('click',function(){toMenu();SND.ui()});
  el['btn-retry'].addEventListener('click',function(){SND.resume();startGame();SND.ui()});
  window.addEventListener('resize',function(){resize()});
}
init();

</script>
