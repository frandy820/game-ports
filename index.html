<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="口袋游戏">
<title>口袋游戏机 · 六合一</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0d1322; --bg2:#111a2e; --card:#141d33; --card2:#182342;
  --line:rgba(140,160,220,.14); --txt:#e8ecf8; --sub:#8d99b8;
  --acc1:#ffb347; --acc2:#7ec8ff; --acc3:#c58bff; --acc4:#ff8fb8; --acc5:#8be8c0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, #1a2444 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 26px);
  min-height:100vh; overflow-x:hidden;
  touch-action:manipulation;
}
.wrap{max-width:520px;margin:0 auto}
header{margin:6px 2px 18px}
.kicker{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.kicker::before{content:"";width:22px;height:2px;background:linear-gradient(90deg,var(--acc1),transparent)}
h1{font-size:30px;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(100deg,#fff 30%,#ffd9a0 55%,#a8d4ff 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:var(--sub);font-size:13.5px;margin-top:8px;line-height:1.7}
.tagline b{color:#c9d4ee;font-weight:600}

/* 引导条 */
.guide{margin:0 0 16px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.75;
  background:linear-gradient(135deg,rgba(255,179,71,.10),rgba(126,200,255,.08));
  border:1px solid rgba(255,179,71,.28); color:#e8d9c2; position:relative; display:none}
.guide.show{display:block;animation:rise .5s ease both}
.guide .x{position:absolute;top:6px;right:10px;color:var(--sub);font-size:16px;padding:4px 8px;cursor:pointer;user-select:none}
.guide b{color:var(--acc1)}

/* 游戏网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  position:relative;display:block;text-decoration:none;color:var(--txt);
  background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:14px 14px 15px;
  transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease;
  overflow:hidden;
  animation:rise .55s ease both;
}
.card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.09s}
.card:nth-child(3){animation-delay:.15s}.card:nth-child(4){animation-delay:.21s}
.card:nth-child(5){animation-delay:.27s}.card:nth-child(6){animation-delay:.33s}
.card:active{transform:scale(.96)}
.card:hover{border-color:rgba(160,180,255,.35);box-shadow:0 6px 26px rgba(60,110,255,.16)}
.card::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:radial-gradient(140px 90px at 85% -10%,rgba(255,255,255,.07),transparent)}
.thumb{height:86px;border-radius:12px;margin-bottom:11px;display:flex;align-items:center;justify-content:center;
  background:#0a0f1d;border:1px solid rgba(255,255,255,.05)}
.gname{font-size:15.5px;font-weight:700;letter-spacing:.02em}
.gplay{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.55;min-height:34px}
.gtag{display:inline-block;margin-top:8px;font-size:10.5px;padding:2.5px 9px;border-radius:99px;letter-spacing:.06em}
.t1{color:var(--acc1);background:rgba(255,179,71,.12)}
.t2{color:var(--acc2);background:rgba(126,200,255,.12)}
.t3{color:var(--acc3);background:rgba(197,139,255,.12)}
.t4{color:var(--acc4);background:rgba(255,143,184,.12)}
.t5{color:var(--acc5);background:rgba(139,232,192,.12)}
.t6{color:#ffd97e;background:rgba(255,217,126,.12)}

footer{margin-top:22px;color:#5c688a;font-size:11.5px;text-align:center;letter-spacing:.05em;line-height:1.9}
footer .dot{margin:0 8px;opacity:.5}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-24}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">OFFLINE · 6 GAMES</div>
    <h1>口袋游戏机</h1>
    <p class="tagline">六款离线小游戏，<b>装到手机桌面</b>，地铁里、被窝里、没网也能随时开玩。分数和进度只存在你自己的手机里。</p>
  </header>

  <div class="guide" id="guide"></div>

  <nav class="grid" id="grid"></nav>

  <footer>
    完全离线运行<span class="dot">·</span>零网络请求<span class="dot">·</span>存档仅存本机
  </footer>
</div>

<script>
/* ---------- 游戏数据：缩略图为内联 SVG，各取游戏标志性视觉 ---------- */
const GAMES = [
 {u:'./game01/index.html', n:'引力合星', p:'投放星球，同种相碰合成更大，从陨石一路合到太阳', t:'合成', tc:'t1',
  svg:`<svg width="118" height="70" viewBox="0 0 118 70"><ellipse cx="59" cy="38" rx="52" ry="15" fill="none" stroke="rgba(255,179,71,.25)" stroke-width="1.5" stroke-dasharray="4 5" style="animation:dash 2.6s linear infinite"/><circle cx="59" cy="36" r="19" fill="#ffb347"/><circle cx="52" cy="29" r="6" fill="rgba(255,255,255,.5)"/><circle cx="98" cy="30" r="6.5" fill="#7ec8ff" style="animation:floaty 2.4s ease-in-out infinite"/><circle cx="22" cy="48" r="4.5" fill="#c58bff"/><path d="M88 55 l7 12 7-12z" fill="#ff8fb8" opacity=".85"/></svg>`},
 {u:'./game02/index.html', n:'元素方阵', p:'滑动合并同元素，2氢起步，一路点到2048钠', t:'滑块', tc:'t2',
  svg:`<svg width="80" height="70" viewBox="0 0 80 70"><g stroke="rgba(126,200,255,.22)" stroke-width="1">${[0,1,2,3].map(y=>[0,1,2,3].map(x=>`<rect x="${8+x*17}" y="${4+y*16}" width="15" height="15" rx="3" fill="none"/>`).join('')).join('')}</g><rect x="25" y="20" width="15" height="15" rx="3" fill="#2c5f9e"/><text x="32.5" y="30.5" font-size="8" fill="#dcecff" text-anchor="middle" font-weight="700">2</text><rect x="42" y="36" width="15" height="15" rx="3" fill="#7ec8ff"/><text x="49.5" y="46.5" font-size="8" fill="#0d1322" text-anchor="middle" font-weight="700">4</text></svg>`},
 {u:'./game03/index.html', n:'几何狂奔', p:'单键跑酷：点击跳跃、长按高跳，躲开几何障碍', t:'跑酷', tc:'t3',
  svg:`<svg width="118" height="70" viewBox="0 0 118 70"><line x1="6" y1="56" x2="112" y2="56" stroke="#b28bff" stroke-width="2.5" stroke-linecap="round" style="animation:breathe 1.8s ease-in-out infinite"/><rect x="24" y="40" width="16" height="16" rx="3" fill="#c58bff"/><circle cx="30" cy="45" r="2" fill="#fff"/><path d="M70 56 l0 -18 14 6z" fill="#ff8fb8"/><path d="M94 56 l0 -26 10 13z" fill="#ffb347"/><path d="M8 30 h14" stroke="#7ec8ff" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>`},
 {u:'./game04/index.html', n:'霓虹贪吃蛇', p:'滑动转向，吃菱形光点变长，别撞墙别咬自己', t:'贪吃蛇', tc:'t4',
  svg:`<svg width="118" height="70" viewBox="0 0 118 70"><path d="M20 50 H46 V26 H72 V50 H92" fill="none" stroke="url(#sn)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="sn" x1="0" x2="1"><stop offset="0" stop-color="#ff8fb8"/><stop offset="1" stop-color="#c58bff"/></linearGradient></defs><circle cx="94" cy="50" r="6" fill="#eafaff"/><circle cx="96" cy="48" r="1.8" fill="#c58bff"/><path d="M108 28 l5 6 -5 6 -5-6z" fill="#8be8c0" style="animation:floaty 2s ease-in-out infinite"/></svg>`},
 {u:'./game05/index.html', n:'炼丹炉', p:'点击炼丹的修仙放置：凝丹、渡劫、升境界、集图鉴', t:'放置', tc:'t5',
  svg:`<svg width="80" height="70" viewBox="0 0 80 70"><path d="M28 22 Q40 8 52 22 Z" fill="#3a2f22"/><path d="M22 24 H58 L50 48 H30 Z" fill="#5a4632"/><ellipse cx="40" cy="24" rx="18" ry="5" fill="#2b2118"/><path d="M40 40 Q34 50 40 58 Q46 50 40 40" fill="#ffb347" style="animation:breathe 1.2s ease-in-out infinite"/><path d="M36 54 Q33 60 37 64" stroke="#ff8c5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M44 54 Q47 60 43 64" stroke="#ff8c5a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="66" cy="18" r="5" fill="#ffd97e" style="animation:floaty 2.6s ease-in-out infinite"/></svg>`},
 {u:'./game06/index.html', n:'满格消除', p:'拖三格骨牌入 8×8 棋盘，行列填满即消，同消翻倍', t:'拼图', tc:'t6',
  svg:`<svg width="112" height="70" viewBox="0 0 112 70"><g stroke="rgba(255,217,126,.2)" stroke-width="1">${[0,1,2,3].map(y=>[0,1,2,3,4].map(x=>`<rect x="${14+x*17}" y="${4+y*16}" width="15" height="15" rx="3" fill="none"/>`).join('')).join('')}</g><rect x="31" y="20" width="15" height="15" rx="3" fill="#ffd97e"/><rect x="48" y="20" width="15" height="15" rx="3" fill="#ffd97e"/><rect x="65" y="36" width="15" height="15" rx="3" fill="#ff8fb8" style="animation:floaty 2.2s ease-in-out infinite"/></svg>`},
];

/* ---------- 渲染 ---------- */
document.getElementById('grid').innerHTML = GAMES.map(g =>
  `<a class="card" href="${g.u}">
     <div class="thumb">${g.svg}</div>
     <div class="gname">${g.n}</div>
     <div class="gplay">${g.p}</div>
     <span class="gtag ${g.tc}">${g.t}</span>
   </a>`).join('');

/* ---------- 引导条：微信 / 安装 ---------- */
const UA = navigator.userAgent;
const guide = document.getElementById('guide');
function showGuide(html){ guide.innerHTML = html + '<span class="x" onclick="hideGuide()">✕</span>'; guide.classList.add('show'); }
window.hideGuide = () => { try{localStorage.setItem('pg_guide_done','1')}catch(e){} guide.classList.remove('show'); };
let guideDone = false; try{ guideDone = !!localStorage.getItem('pg_guide_done') }catch(e){}

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if(/MicroMessenger/i.test(UA)){
  showGuide('当前在<b>微信内</b>，无法安装到桌面。<br>请点右上角 <b>···</b> → 选择「在浏览器打开」，再按下方指引安装。');
}else if(!standalone && !guideDone){
  if(/iphone|ipad|ipod/i.test(UA)){
    showGuide('把游戏机装到桌面：点底部 <b>分享</b> ⬆️ → 「添加到主屏幕」→ 添加。<br>之后从桌面图标进入，<b>全屏且离线可玩</b>。');
  }else if(/android/i.test(UA)){
    showGuide('把游戏机装到桌面：点浏览器 <b>菜单 ⋮</b> →「安装应用」/「添加到主屏幕」。<br>之后从桌面图标进入，<b>全屏且离线可玩</b>。');
  }
}

/* ---------- ServiceWorker ---------- */
if('serviceWorker' in navigator){
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
