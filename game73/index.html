<script>
/* ============ 飞花令 · 曲水诗笺（game73） ============ */
/* 公版名句库（每句 {t,p,n,k}）+ 按字索引 + 与 AI 轮流接句 */
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let AC=null, SND=false;
function ensureAC(){ if(AC||!(window.AudioContext||window.webkitAudioContext)) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f,d,t,v){ if(!SND||!AC) return; try{
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=t||'sine'; o.frequency.value=f;
  gn.gain.setValueAtTime(v||.08, AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+d);
  o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
}catch(e){} }
function snd(k){ if(k==='sel')beep(660,.08,'triangle',.05);
  else if(k==='ok')beep(880,.3,'sine',.07);
  else if(k==='bell'){beep(1046,.25,'sine',.06);setTimeout(()=>beep(1318,.3,'sine',.05),120);}
  else if(k==='qin')beep(440,.2,'triangle',.06);
  else if(k==='bad')beep(150,.25,'square',.05);
  else if(k==='tick')beep(300,.04,'triangle',.04); }

/* ---- 确定 rng（家族 LCG） ---- */
let RS=1;
function srand(seed){ RS=(seed>>>0)||1; }
function rnd(){ RS=(Math.imul(RS,1103515245)+12345)>>>0; return (RS>>>9)/8388608; }

/* ---- 诗词库（公版名句，k=主令字；同诗不同句可分属不同令字） ---- */

const POEMS=[
 /* 花 */

 /* 雪 */
 {t:'窗含西岭千秋雪',p:'杜甫',n:'绝句',k:'雪'},

 /* 夜 */
 {t:'夜半钟声到客船',p:'张继',n:'枫桥夜泊',k:'夜'},
 {t:'夜吟应觉月光寒',p:'李商隐',n:'无题',k:'夜'},

 {t:'小楼一夜听春雨',p:'陆游',n:'临安春雨初霁',k:'夜'},
 /* 山 */

 /* 水 */
 {t:'曾经沧海难为水',p:'元稹',n:'离思',k:'水'},

 /* 酒 */

 {t:'金樽清酒斗十千',p:'李白',n:'行路难',k:'酒'},
 {t:'莫笑农家腊酒浑',p:'陆游',n:'游山西村',k:'酒'},
 {t:'一壶浊酒喜相逢',p:'杨慎',n:'临江仙',k:'酒'},
 {t:'把酒问青天',p:'苏轼',n:'水调歌头',k:'酒'},
 {t:'浊酒一杯家万里',p:'范仲淹',n:'渔家傲·秋思',k:'酒'},
 {t:'东篱把酒黄昏后',p:'李清照',n:'醉花阴',k:'酒'}

/* 索引 + 一致性 throw（构建即校验：主字必含/无重复句） */
const IDX={};
for(let i=0;i<POEMS.length;i++){
  const pm=POEMS[i];
  if(typeof pm.t!=='string'||!pm.t.includes(pm.k))
    throw new Error('poem idx broken @'+i+':'+pm.t);
  (IDX[pm.k]=IDX[pm.k]||[]).push(i);
}
for(let a=0;a<POEMS.length;a++) for(let b=a+1;b<POEMS.length;b++)
  if(POEMS[a].t===POEMS[b].t) throw new Error('poem dup:'+POEMS[a].t);

/* ============ 状态 ============ */
const BEST_KEY='g73_best';
const TURN_TIME=10, AI_TIME=1.2, START_LIVES=3;
let S=null, G=null;
/* G={keyIdx, used:Set, options:[i×4], correct, isAI, aiIdx, aiShown, aiT} */
let HIT={opts:[]};
let flashT=0, shakeT=0;
const BEST_STASH={v:0};
function loadBest(){ try{ return +(localStorage.getItem(BEST_KEY)||0); }catch(e){ return 0; } }
function saveBestNow(){ if(S && S.score>S.best){ S.best=S.score; try{ localStorage.setItem(BEST_KEY,String(S.best)); }catch(e){} } }
let tipTO=null;
function flash(msg){ const f=$('flashtx'); f.textContent=msg; f.classList.add('show');
  clearTimeout(tipTO); tipTO=setTimeout(()=>f.classList.remove('show'),1600); }

function curKey(){ return KEY_ORDER[S.keyOrd]; }
/* 令字序：开局按 seed 打乱一次（KEY_ORDER 局内固定，换令循环推进） */
let KEY_ORDER=KEYS.slice();
function shuffleKeys(){ KEY_ORDER=KEYS.slice();
  for(let i=KEY_ORDER.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1));
    const t=KEY_ORDER[i]; KEY_ORDER[i]=KEY_ORDER[j]; KEY_ORDER[j]=t; } }

function unusedOf(k){ return (IDX[k]||[]).filter(i=>!G.used.has(i)); }
function allUnused(){ let n=0; for(const k of KEY_ORDER) n+=unusedOf(k).length; return n; }

function newGame(){
  S={phase:'menu',time:TURN_TIME,score:0,best:loadBest(),streak:0,maxStreak:0,
     lives:START_LIVES,roundN:1,swaps:0,keyOrd:0,picked:0,paused:false,_lt:-1};
  G=null; KEY_ORDER=KEYS.slice();
}
function startRound(){ clearTimeout(tipTO);
  RS=RS>>>0; shuffleKeys();
  S.time=TURN_TIME; S.score=0; S.streak=0; S.maxStreak=0; S.lives=START_LIVES;
  S.roundN=1; S.swaps=0; S.keyOrd=0; S.picked=0;
  G={keyOrd:0, used:new Set(), options:[], correct:-1, isAI:false, aiIdx:-1, aiShown:0, aiT:0};
  /* 开局若首令字耗尽（不可能，但守卫）→ 换令 */
  if(unusedOf(curKey()).length===0) swapKey(false);
  buildOptions(); S.phase='play'; updHUD(); }

/* ---- 换令（notify=是否提示/奖励；false=静默初始化） ---- */
function swapKey(notify){
  S.keyOrd=(S.keyOrd+1)%KEY_ORDER.length; G.keyOrd=S.keyOrd;
  G.options=[]; G.correct=-1;
  if(notify){ S.swaps++; S.score+=200; snd('bell');
    flash('换令 · 「'+KEY_ORDER[(S.keyOrd+KEY_ORDER.length-1)%KEY_ORDER.length]+'」尽 → 「'+curKey()+'」 +200'); }
}
/* ---- 玩家轮：1 正确（未用含字）+3 干扰（不含字） ---- */
function buildOptions(){
  if(allUnused()===0){ gameOver(); return; }   /* 百句全尽=完美收官终局 */
  const k=curKey();
  let pool=unusedOf(k);
  if(pool.length===0){ swapKey(true); return buildOptions(); }
  const ci=pool[Math.floor(rnd()*pool.length)];
  /* 干扰池：不含 k 的句（可含已用——见过≠错，可辨性=策略） */
  const dis=[]; const disPool=[];
  for(let i=0;i<POEMS.length;i++) if(!POEMS[i].t.includes(k)) disPool.push(i);
  for(let n=0;n<3 && disPool.length;n++){
    const j=Math.floor(rnd()*disPool.length);
    dis.push(disPool.splice(j,1)[0]);
  }
  while(dis.length<3) dis.push((ci+dis.length+1)%POEMS.length);   /* 理论不可达兜底 */
  const opts=[ci].concat(dis);
  /* 洗位置（确定性） */
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1));
    const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
  G.options=opts; G.correct=opts.indexOf(ci);
  G.isAI=false; S.time=TURN_TIME; S._lt=-1;
}
/* ---- 判卷 ---- */
function pick(i){
  if(S.phase!=='play'||!G||G.isAI) return false;
  if(i<0||i>=4||G.correct<0) return false;
  const isRight=(i===G.correct);
  const idx=G.options[i], pm=POEMS[idx];
  /* 双保险：正确性以「句含令字且未用」为准（非仅位置） */
  const right2=pm.t.includes(curKey()) && !G.used.has(idx);
  if(isRight!==right2) return false;                       /* 内态不一致：拒绝（防错位） */
  if(isRight){
    G.used.add(idx); S.picked++;
    S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak);
    const mult=1+.5*Math.min(S.streak-1,6);
    S.score+=Math.floor(100*mult);
    snd('ok'); flash(pm.p+'·'+pm.n);
    startAITurn(); updHUD(); return true;
  } else {
    loseLife('此句无「'+curKey()+'」字'); return true;
  }
}
function loseLife(why){
  S.streak=0; S.lives--; snd('bad'); shakeT=.4;
  if(S.lives<=0){ S.lives=0; flash(why); gameOver(); }
  else { flash(why+' · 熄一灯'); buildOptions(); }
  updHUD();
}
function gameOver(){
  S.phase='over'; saveBestNow(); clearTimeout(tipTO);
  $('overscore').textContent=S.score;
  $('overstat').textContent='接句 '+S.picked+' · 换令 '+S.swaps+' · 最长连 ×'+S.maxStreak;
  $('overlay').classList.remove('hide');
}
/* ---- AI 轮 ---- */
function startAITurn(){
  if(allUnused()===0){ gameOver(); return; }
  const k=curKey();
  const pool=unusedOf(k);
  if(pool.length===0){ swapKey(true); }
  const pool2=unusedOf(curKey());
  if(pool2.length===0){ startAITurn(); return; }          /* 全字尽（理论不可达） */
  const idx=pool2[Math.floor(rnd()*pool2.length)];
  G.isAI=true; G.aiIdx=idx; G.aiShown=0; G.aiT=0;
  snd('qin');
}
function aiStep(dt){
  G.aiT+=dt;
  const total=POEMS[G.aiIdx].t.length;
  G.aiShown=Math.min(total,Math.floor(G.aiT/(AI_TIME/total)*0.999)+ (G.aiT>0?1:0));
  if(G.aiT>=AI_TIME+.6){                                   /* 念毕：入池，回到玩家 */
    G.used.add(G.aiIdx);
    S.roundN++;
    buildOptions(); updHUD();
  }
}

/* ---- HUD ---- */
function updHUD(){
  $('scv').textContent=S.score; $('rnv').textContent=S.roundN;
  $('tmv').textContent=(G&&G.isAI)?'—':Math.max(0,Math.ceil(S.time));
  for(let i=0;i<3;i++) $('lf'+i).className='lamp'+(i<S.lives?'':' off');
}

/* ---- 绘制 ---- */
function draw(){
  ctx.clearRect(0,0,390,780);
  const bg=ctx.createLinearGradient(0,0,0,780);
  bg.addColorStop(0,'#131a1e'); bg.addColorStop(1,'#0d1316');
  ctx.fillStyle=bg; ctx.fillRect(0,0,390,780);
  /* 曲水纹 */
  ctx.strokeStyle='rgba(127,184,164,.07)'; ctx.lineWidth=1;
  for(let r=0;r<3;r++){ ctx.beginPath();
    for(let x=0;x<=390;x+=6){ const y=40+r*14+Math.sin(x/46+r)*7;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); }
  if(S.phase==='menu'){ drawMenuIdle(); return; }

  /* 令字大章 */
  const k=curKey();
  ctx.save(); ctx.translate(195,86);
  ctx.rotate(-.06);
  ctx.strokeStyle='rgba(216,84,74,.8)'; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#d8544a'; ctx.font='800 32px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(k,0,2); ctx.restore();
  ctx.fillStyle='rgba(244,236,216,.55)'; ctx.font='600 12px system-ui'; ctx.textAlign='center';
  ctx.fillText('以「'+k+'」行令', 195, 132);

  if(!G){ return; }
  const shake=shakeT>0?Math.sin(shakeT*40)*3*shakeT:0;
  if(G.isAI){
    /* AI 念诗：曲水横幅逐字浮现 */
    const pm=POEMS[G.aiIdx];
    ctx.textAlign='center';
    ctx.fillStyle='rgba(244,236,216,.9)'; ctx.font='700 15px system-ui';
    ctx.fillText('诗翁接曰', 195, 176);
    ctx.font='800 26px system-ui';
    const full=pm.t; const shown=full.slice(0,G.aiShown);
    ctx.fillStyle='#f4ecd8';
    ctx.fillText(shown||'　', 195, 214);
    /* 曲水底笺 */
    ctx.strokeStyle='rgba(127,184,164,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(70,236); ctx.quadraticCurveTo(195,246,320,236); ctx.stroke();
    if(G.aiT>AI_TIME){ ctx.fillStyle='rgba(244,236,216,.5)'; ctx.font='600 12px system-ui';
      ctx.fillText('—— '+pm.p+'《'+pm.n+'》', 195, 262); }
    HIT.opts=[];
  } else {
    /* 四选一句牌 */
    HIT.opts=[];
    const w=310, h=76, x0=40, y0=316, gap=16;
    for(let i=0;i<4;i++){
      const y=y0+i*(h+gap), pm=POEMS[G.options[i]];
      ctx.save(); ctx.translate(shake,0);
      const cg=ctx.createLinearGradient(0,y,0,y+h);
      cg.addColorStop(0,'#f4ecd8'); cg.addColorStop(1,'#e8dcc0');
      ctx.fillStyle=cg; roundRect(x0,y,w,h,10); ctx.fill();
      ctx.strokeStyle='rgba(60,70,60,.35)'; ctx.lineWidth=1; roundRect(x0,y,w,h,10); ctx.stroke();
      /* 句（含令字描红） */
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='800 20px system-ui';
      const t=pm.t, kx=t.indexOf(curKey());
      if(kx>=0){                                     /* 含字（正确项）：三段分别原位绘制，令字朱砂 */
        const pre=t.slice(0,kx), mid=t.slice(kx,kx+1), post=t.slice(kx+1);
        const cw=ctx.measureText(t).width, mx=195-cw/2;
        const wp=ctx.measureText(pre).width, wm=ctx.measureText(mid).width;
        ctx.fillStyle='#d8544a';
        ctx.fillText(mid, mx+wp+wm/2, y+30);
        ctx.fillStyle='#2c2c28';
        if(pre) ctx.fillText(pre, mx+wp/2, y+30);
        if(post) ctx.fillText(post, mx+wp+wm+ctx.measureText(post).width/2, y+30);
      } else {                                       /* 干扰项：乌字 */
        ctx.fillStyle='#2c2c28'; ctx.fillText(t, 195, y+30);
      }
      ctx.fillStyle='rgba(90,90,80,.75)'; ctx.font='600 11px system-ui';
      ctx.fillText('—— '+pm.p+'《'+pm.n+'》', 195, y+57);
      ctx.restore();
      HIT.opts.push({x:x0,y,w,h});
    }
    /* 限时水线 */
    const tp=Math.max(0,S.time/TURN_TIME);
    ctx.fillStyle='rgba(127,184,164,.15)'; ctx.fillRect(40,288,310,6);
    ctx.fillStyle=tp>.3?'#7fb8a4':'#d8544a'; ctx.fillRect(40,288,310*tp,6);
  }
  /* 连对章 */
  if(S.streak>1){ ctx.save(); ctx.translate(330,180); ctx.rotate(.1);
    ctx.strokeStyle='rgba(216,84,74,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#d8544a'; ctx.font='800 15px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('连×'+S.streak,0,1); ctx.restore(); }
}
function drawMenuIdle(){
  ctx.fillStyle='rgba(244,236,216,.45)'; ctx.font='600 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('曲水流觞 · 以字行令', 195, 620);
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- 输入 ---- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!S||S.phase!=='play') return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(390/r.width), y=(e.clientY-r.top)*(780/r.height);
  for(let i=0;i<HIT.opts.length;i++){ const o=HIT.opts[i];
    if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h){ pick(i); return; } }
});

/* ---- 主循环 ---- */
let lastT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(S){
    if(S.phase==='play'&&G){
      if(!G.isAI){
        S.time-=dt;
        if(S.time<=0){ S.time=0; loseLife('限时到'); }
        else if(Math.ceil(S.time)!==S._lt){ S._lt=Math.ceil(S.time); if(S.time<=5) snd('tick'); updHUD(); }
      } else { aiStep(dt); }
    }
    if(shakeT>0) shakeT-=dt;
    draw();
  }
  requestAnimationFrame(loop);
}

/* ---- 按钮 ---- */
$('btn-go').addEventListener('click',()=>{ ensureAC(); $('menu').classList.add('hide'); startRound(); });
$('btn-again').addEventListener('click',()=>{ $('overlay').classList.add('hide'); ensureAC(); startRound(); });
$('btn-snd').addEventListener('click',()=>{ SND=!SND; ensureAC(); $('btn-snd').textContent=SND?'🔊':'🔇'; });
$('btn-pause').addEventListener('click',()=>{ if(S&&S.phase==='play'){S.phase='pause';$('pauselay').classList.remove('hide');} });
$('btn-resume').addEventListener('click',()=>{ if(S&&S.phase==='pause'){S.phase='play';$('pauselay').classList.add('hide');} });
$('btn-home').addEventListener('click',()=>{ $('pauselay').classList.add('hide'); $('menu').classList.remove('hide');
  $('bestline').textContent='最高累计 '+loadBest(); S.phase='menu'; saveBestNow(); });

function onHidden(){ if(document.hidden) saveBestNow(); }
document.addEventListener('visibilitychange',onHidden);
window.addEventListener('pagehide',()=>saveBestNow());

newGame();
$('bestline').textContent='最高累计 '+S.best;
requestAnimationFrame(loop);

/* ============ DEV 钩子（构建剥离） ============ */
</script>
