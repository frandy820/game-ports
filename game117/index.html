var PAIR_TABLE=[4,9,14,19,0,5,10,15,1,6];
var R_HIT=26,MISS_PEN=5.0,SWAP_T=1.2;
function timeFor(dn){return dn*10+15;}
var KNAME=['cloud','moon','pavilion','bird','flower','rock','vase','fish','hill','seal'];
var K_BEST='g117_best',K_MUTE='g117_mute';

/* ===== 状态 ===== */
var S={phase:'play',pi:0,score:0,combo:0,found:[],tLeft:0,tMax:1,swapT:0,
  missMark:null,wonT:0,over:false,best:0,muted:false,floats:[]};

function curPair(){return LIB[PAIR_TABLE[Math.min(S.pi,PAIR_TABLE.length-1)]];}   /* 终演期 pi=10 钳回末对防越界 */
function loadPair(){
  var p=curPair();
  S.found=[];S.combo=0;
  S.tMax=timeFor(p.d.length);S.tLeft=S.tMax;
}
function newGame(){
  S.phase='play';S.pi=0;S.score=0;S.swapT=0;S.missMark=null;S.wonT=0;S.over=false;S.floats=[];
  loadPair();
  document.getElementById('overLay').style.display='none';
  document.getElementById('hud').style.opacity='1';
  document.getElementById('pauseBtn').style.display='block';
  document.getElementById('muteBtn').style.display='block';
  snd('start');
  updHUD();
}

/* ===== tick（SPEC §3 顺序） ===== */
function tick(dt,raw){
  if(!raw&&dt>1/30)dt=1/30;
  if(S.phase!=='play')return;
  if(S.wonT>0){                      /* 通关终演 2s */
    S.wonT-=dt;stepFx(dt);
    if(S.wonT<=0){gameOver(true);}
    return;
  }
  if(S.swapT>0){                     /* 换画演出 */
    S.swapT-=dt;
    if(S.swapT<=0){
      S.pi++;
      if(S.pi>=PAIR_TABLE.length){S.wonT=2.0;addFloat(170,316,'神目完卷','#e8c96a');}
      else{loadPair();snd('swap');}
    }
    stepFx(dt);
    return;
  }
  S.tLeft-=dt;
  if(S.tLeft<=0){S.tLeft=0;stepFx(dt);gameOver(false);return;}
  stepFx(dt);
}
function stepFx(dt){
  for(var i=S.floats.length-1;i>=0;i--){
    S.floats[i].t-=dt;S.floats[i].y-=18*dt;
    if(S.floats[i].t<=0)S.floats.splice(i,1);
  }
  if(S.missMark){S.missMark.t-=dt;if(S.missMark.t<=0)S.missMark=null;}
}
function addFloat(x,y,txt,c){S.floats.push({x:x,y:y,t:1.0,txt:txt,c:c});}
function gameOver(won){
  S.phase='over';
  if(S.score>S.best){S.best=S.score;try{localStorage.setItem(K_BEST,String(S.best));}catch(e){}}
  document.getElementById('ovt').textContent=won?'完 卷':'灯 尽';
  document.getElementById('ovtxt').textContent=(won?'十对摹本尽数勘破':'守到第 '+(S.pi+1)+' 对')+' · '+S.score+' 分 · 最佳 '+S.best+' 分';
  document.getElementById('overLay').style.display='flex';
  document.getElementById('hud').style.opacity='0';           /* over 层下不再透出 HUD 残影 */
  document.getElementById('pauseBtn').style.display='none';
  document.getElementById('muteBtn').style.display='none';
  snd(won?'win':'over');
  updHUD();
}

/* ===== tap（两画共用逻辑坐标系） ===== */
function tapAt(lx,ly){
  if(S.phase!=='play'||S.swapT>0||S.wonT>0)return null;
  var p=curPair();
  for(var i=0;i<p.d.length;i++){
    if(S.found.indexOf(i)>=0)continue;
    var e=p.e[p.d[i][0]];
    var dx=lx-e[2],dy=ly-e[3];
    if(dx*dx+dy*dy<=R_HIT*R_HIT){
      S.found.push(i);
      S.combo=Math.min(S.combo+1,5);
      var gain=100*S.combo;
      S.score+=gain;
      addFloat(e[2]+25,e[3]-14,'+'+gain,'#7fc9a8');
      snd('hit');
      if(S.found.length===p.d.length){
        var bonus=Math.floor(S.tLeft)*2;
        S.score+=bonus;
        addFloat(170,316,'+'+bonus+' 神目','#e8c96a');
        S.swapT=SWAP_T;
        snd('clear');
      }
      return true;
    }
  }
  S.combo=0;
  S.tLeft=Math.max(0,S.tLeft-MISS_PEN);
  S.missMark={x:lx,y:ly,t:0.8};
  snd('miss');
  return false;
}

/* ===== HUD ===== */
var CNUM=['零','一','二','三','四','五','六','七','八','九','十'];
function updHUD(){
  document.getElementById('hsc').textContent=S.score;
  document.getElementById('hbest').textContent=S.best;
  document.getElementById('hpair').textContent=(S.pi>=PAIR_TABLE.length?'完卷 · 十对尽数勘破':'第'+CNUM[S.pi+1]+'对 · 寻 '+curPair().d.length+' 瑕 · 命 '+Math.max(0,S.tLeft).toFixed(0)+'s');
}

/* ===== 音效（WebAudio 短合成） ===== */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{var p=AC.resume();if(p&&p.catch)p.catch(function(){});}catch(e){}}return AC;}
function tone(f,d1,vol,dur,type){
  var c=ac();if(!c||S.muted)return;
  var o=c.createOscillator(),gn=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,d1),c.currentTime+dur);
  gn.gain.setValueAtTime(vol,c.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.connect(gn);gn.connect(c.destination);o.start();o.stop(c.currentTime+dur+0.02);
}
function snd(k){
  if(k==='hit'){tone(1180,880,0.09,0.28);}                                        /* 磬 */
  else if(k==='miss'){tone(190,150,0.13,0.09,'square');}                          /* 木鱼闷 */
  else if(k==='clear'){tone(523,659,0.09,0.16);setTimeout(function(){tone(784,659,0.08,0.3);},150);}  /* 古琴双音 */
  else if(k==='swap'){tone(300,420,0.05,0.12,'triangle');}
  else if(k==='start'){tone(392,392,0.07,0.2,'triangle');}
  else if(k==='win'){tone(659,784,0.09,0.25);setTimeout(function(){tone(784,1046,0.08,0.25);},180);setTimeout(function(){tone(1046,1318,0.07,0.5);},380);}
  else if(k==='over'){tone(220,110,0.14,0.9,'triangle');}                          /* 钟 */
}

/* ===== 工笔元素绘制器（SPEC §2：10 kind × 2-4 variant，墨线+矿物色） ===== */
var cv=document.getElementById('cv'),g=cv.getContext('2d');
var AX=25,AY=84,BY=434;                 /* 两画画心原点（逻辑 340×330 */
function hsl(h,s,l){return 'hsl('+(((h%360)+360)%360)+','+s+'%,'+l+'%)';}
var INK='#43392c';
function drawElem(e,df){                 /* e=[kind,variant,x,y,size,hue,flip]; df=差异或 null */
  var kind=e[0],v=e[1],x=e[2],y=e[3],sz=e[4],hue=e[5],fl=e[6];
  if(df&&df[1]===4)return;               /* missing：B 侧不画 */
  if(df&&df[1]===0)hue+=df[2];
  if(df&&df[1]===1)sz=sz*(1+df[2]/100);
  if(df&&df[1]===2)fl=1-fl;
  if(df&&df[1]===3)v=df[2];
  g.save();g.translate(x,y);if(fl)g.scale(-1,1);
  g.lineWidth=1.4;g.strokeStyle=INK;
  var c1=hsl(hue,42,46),c2=hsl(hue,36,62),c3=hsl(hue,30,76);
  if(kind===0){                          /* 云 */
    if(v===0){                           /* 如意云：三团 */
      g.fillStyle=c2;
      for(var i=-1;i<=1;i++){g.beginPath();g.arc(i*sz*0.42,0,sz*(0.5-Math.abs(i)*0.13),0,7);g.fill();g.stroke();}

/* ===== 场景绘制（baseY=画心全局 y 原点：上画 AY/下画 BY；元素逻辑坐标→(AX+x, baseY+y)） ===== */
function drawScene(baseY,isB){
  var p=curPair();
  /* 绢底 */
  var gg=g.createLinearGradient(0,baseY,0,baseY+330);
  gg.addColorStop(0,'#eee2ca');gg.addColorStop(.5,'#ece0c8');gg.addColorStop(1,'#e6d8bc');
  g.fillStyle=gg;g.fillRect(AX-9,baseY-9,358,348);
  /* 绢纹噪点（确定性：坐标取模） */
  g.fillStyle='rgba(120,100,70,.05)';
  for(var i=0;i<130;i++){
    var nx=(i*61+(isB?17:0))%338+1,ny=(i*97+(isB?31:0))%328+1;
    g.fillRect(AX+nx,baseY+ny,1.4,1.4);
  }
  /* 画心元素（drawElem 自带 save/translate/restore，此处补画心原点偏移） */
  g.save();g.translate(AX,baseY);
  for(var j=0;j<p.e.length;j++){
    var df=null;
    if(isB){for(var k=0;k<p.d.length;k++){if(p.d[k][0]===j){df=p.d[k];break;}}}
    drawElem(p.e[j],df);
  }
  g.restore();
  /* 裱绫边框 */
  g.strokeStyle='#8a744e';g.lineWidth=3;g.strokeRect(AX-9,baseY-9,358,348);
  g.strokeStyle='rgba(138,116,78,.4)';g.lineWidth=1;g.strokeRect(AX-14,baseY-14,368,358);
  g.fillStyle='rgba(138,116,78,.16)';
  for(var m=0;m<26;m++){g.fillRect(AX-14+m*14,baseY-14,7,3);g.fillRect(AX-7+m*14,baseY+349,7,3);}
}

function draw(){
  /* 堂底 */
  g.fillStyle='#171310';g.fillRect(0,0,390,844);
  /* 两画（swap 演出=透明度渐变） */
  var alpha=1;
  if(S.swapT>0)alpha=Math.min(1,(SWAP_T-S.swapT)/0.6);
  g.save();g.globalAlpha=alpha;
  drawScene(AY,false);
  drawScene(BY,true);
  g.restore();
  /* 卷轴分隔带 */
  g.fillStyle='#23301f';
  g.fillRect(0,414,390,20);
  g.fillStyle='#8a744e';g.fillRect(0,414,390,4);g.fillRect(0,430,390,4);
  g.fillStyle='#c9a86a';g.font='bold 11px system-ui';g.textAlign='center';g.textBaseline='middle';
  g.fillText('原 作 · 上',60,424);g.fillText('摹 本 · 下',330,424);
  g.fillStyle='rgba(201,168,106,.7)';g.fillText('鉴',195,424);
  /* 命中金圈（两画同位） */
  var p=curPair();
  g.strokeStyle='#c9962e';g.lineWidth=2.4;
  for(var mi=0;mi<S.found.length;mi++){
    var e2=p.e[p.d[S.found[mi]][0]];
    for(var b2=0;b2<2;b2++){
      var by2=b2?BY:AY;
      g.beginPath();g.arc(AX+e2[2],by2+e2[3],20,0,7);g.stroke();
      g.beginPath();g.arc(AX+e2[2],by2+e2[3],25,0,7);g.globalAlpha=0.4;g.stroke();g.globalAlpha=1;
    }
  }
  /* 误触红圈 */
  if(S.missMark){
    g.globalAlpha=Math.min(1,S.missMark.t*2.5);
    g.strokeStyle='#c8452f';g.lineWidth=2.2;
    g.beginPath();g.arc(AX+S.missMark.x,AY+S.missMark.y,16,0,7);g.stroke();
    g.beginPath();g.arc(AX+S.missMark.x,BY+S.missMark.y,16,0,7);g.stroke();
    g.globalAlpha=1;
  }
  /* 飘字（逻辑坐标→两画同位（与金圈/红圈一致的反馈画幅）；深色描边保证暗化演出期可读） */
  g.textAlign='center';g.font='bold 13px system-ui';
  for(var fi=0;fi<S.floats.length;fi++){
    var fl=S.floats[fi];
    g.globalAlpha=Math.min(1,fl.t*2);
    for(var fb=0;fb<2;fb++){
      var fby=fb?BY:AY;
      g.lineWidth=3;g.strokeStyle='rgba(23,19,16,.7)';g.strokeText(fl.txt,AX+fl.x,fby+fl.y);
      g.fillStyle=fl.c;g.fillText(fl.txt,AX+fl.x,fby+fl.y);
    }
    g.globalAlpha=1;
  }
  /* 底栏：瑕点+计时条 */
  g.fillStyle='#1d1813';g.fillRect(0,764,390,80);
  var dn=p.d.length;
  for(var di=0;di<dn;di++){
    var cx=195-(dn-1)*11+di*22;
    g.beginPath();g.arc(cx,786,7,0,7);
    if(S.found.indexOf(di)>=0){g.fillStyle='#c9962e';g.fill();}
    else{g.strokeStyle='#6e6148';g.lineWidth=1.6;g.stroke();}
  }
  var frac=Math.max(0,S.tLeft/S.tMax);
  g.fillStyle='rgba(232,201,106,.14)';g.fillRect(35,808,320,10);
  g.fillStyle=frac>0.3?'#c9962e':'#c8452f';g.fillRect(35,808,320*frac,10);
  g.strokeStyle='rgba(138,116,78,.5)';g.lineWidth=1;g.strokeRect(35,808,320,10);
  /* 换画横披 */
  if(S.swapT>0&&S.pi<9){
    g.fillStyle='rgba(23,19,16,.75)';g.fillRect(0,380,390,54);
    g.fillStyle='#e8c96a';g.font='900 22px system-ui';g.textAlign='center';
    g.fillText('第 '+CNUM[S.pi+2]+' 对',195,412);
  }
  /* 暂停徽 */
  if(S.phase==='pause'){
    g.fillStyle='rgba(15,12,9,.6)';g.fillRect(0,84,390,680);
    g.fillStyle='#e8c96a';g.font='900 26px system-ui';g.textAlign='center';
    g.fillText('鉴画小憩',195,400);
    g.font='12px system-ui';g.fillStyle='#a89a7c';
    g.fillText('点 ▶ 继续',195,424);
  }
  updHUD();   /* 计时秒数随帧刷新 */
}

/* ===== 主循环 ===== */
var lastT=0;
function loop(ts){
  var dt=lastT?(ts-lastT)/1000:0.016;lastT=ts;
  if(S.phase==='play')tick(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ===== 输入 ===== */
(function(){
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();ac();
    if(S.phase!=='play')return;
    var r=cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    var lx=x-AX,ly;
    if(y>=AY&&y<AY+330)ly=y-AY;
    else if(y>=BY&&y<BY+330)ly=y-BY;
    else return;
    if(lx<0||lx>340)return;
    tapAt(lx,ly);
    updHUD();
  });
})();
document.getElementById('bre').addEventListener('click',function(){ac();newGame();});
document.getElementById('pauseBtn').addEventListener('click',function(){
  if(S.phase==='play'){S.phase='pause';this.textContent='▶';}
  else if(S.phase==='pause'){S.phase='play';this.textContent='Ⅱ';}
});
document.getElementById('muteBtn').addEventListener('click',function(){
  S.muted=!S.muted;this.textContent=S.muted?'✕':'♪';
  try{localStorage.setItem(K_MUTE,S.muted?'1':'0');}catch(e){}
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.phase==='play'){S.phase='pause';document.getElementById('pauseBtn').textContent='▶';}
});

/* ===== boot ===== */
(function(){
  try{
    var b=localStorage.getItem(K_BEST);if(b)S.best=parseInt(b,10)||0;
    var m=localStorage.getItem(K_MUTE);if(m==='1'){S.muted=true;document.getElementById('muteBtn').textContent='✕';}
  }catch(e){}
  newGame();
  requestAnimationFrame(loop);
})();



</script>
<script src="../shell.js" defer></script>
</body>
