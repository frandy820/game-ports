  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f,d,t,v){ if(!SND||!AC) return; try{
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=t||'sine'; o.frequency.value=f;
  gn.gain.setValueAtTime(v||.08, AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+d);
  o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
}catch(e){} }
function snd(k){ if(k==='sel')beep(520,.06,'triangle',.05);
  else if(k==='ok'){beep(720,.12,'triangle',.07);setTimeout(()=>beep(1080,.16,'triangle',.05),90);}
  else if(k==='drum')beep(140,.22,'square',.05);
  else if(k==='win'){beep(523,.15,'sine',.06);setTimeout(()=>beep(659,.15,'sine',.06),150);
    setTimeout(()=>beep(784,.3,'sine',.06),300);}
  else if(k==='bell')beep(1046,.22,'sine',.05);

  for(let j=0;j<i;j++) if(CHARS[j].ch===c.ch) throw new Error('char dup @'+i);
}

let flashT=0, shakeT=0;
function loadBest(){ try{ return +(localStorage.getItem(BEST_KEY)||0); }catch(e){ return 0; } }
function saveBestNow(){ if(S && S.score>S.best){ S.best=S.score; try{ localStorage.setItem(BEST_KEY,String(S.best)); }catch(e){} } }
let tipTO=null;
function flash(msg){ const f=$('flashtx'); f.textContent=msg; f.classList.add('show');
  clearTimeout(tipTO); tipTO=setTimeout(()=>f.classList.remove('show'),1600); }
function killFlash(){ clearTimeout(tipTO); $('flashtx').classList.remove('show'); }

/* 难度档：连对<3→lv1；3-5→lv2；≥6→lv3 */
function tierOf(streak){ return streak>=6?3:(streak>=3?2:1); }
function pickCharIdx(){
  const t=tierOf(S.streak);
  /* 出题永不与当前题相同（家族 M-3 范式） */
  let pool=CHARS.map((_,i)=>i).filter(i=>!G.used.has(i)&&i!==G.cIdx&&CHARS[i].lv===t);
  if(pool.length===0)                      /* 档位池空→全库档（正常局不可达，防极长局/restore） */
    pool=CHARS.map((_,i)=>i).filter(i=>!G.used.has(i)&&i!==G.cIdx);
  if(pool.length===0){                     /* 全库尽→循环重用不计分 */
    G.used.clear();
    pool=CHARS.map((_,i)=>i).filter(i=>i!==G.cIdx&&CHARS[i].lv===t);
    if(pool.length===0) pool=CHARS.map((_,i)=>i).filter(i=>i!==G.cIdx);
  }
  return pool[Math.floor(rnd()*pool.length)];
}
function buildPool(){
  const ci=pickCharIdx();
  const c=CHARS[ci];
  /* 干扰：全库部件集中抽（≠本题部件、≠目标字、互异），补足池至 6 */
  const banned=new Set([...c.parts,c.ch]);
  const decoys=[];
  let guard=0;
  while(decoys.length<6-c.parts.length&&guard<500){
    guard++;
    const p=PARTS_SET[Math.floor(rnd()*PARTS_SET.length)];
    if(!banned.has(p)&&decoys.indexOf(p)<0) decoys.push(p);
  }
  const pool=c.parts.map(p=>({t:p,ok:1})).concat(decoys.map(p=>({t:p,ok:0})));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1));
    const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  G.cIdx=ci; G.pool=pool; G.slots=[]; G.usedCells=[]; G.reveal=false; S._lt=-1; updHUD();
}
function newGame(){
  S={phase:'menu',time:TOTAL_TIME,score:0,best:loadBest(),streak:0,maxStreak:0,
     spelt:0,paused:false,_lt:-1};
  G=null;
}
function startRound(){ killFlash();
  RS=RS>>>0;
  S.time=TOTAL_TIME; S.score=0; S.streak=0; S.maxStreak=0;
  S.spelt=0; S.bonus=0; S.penN=0;
  G={cIdx:-1, used:new Set(), pool:[], slots:[], usedCells:[], reveal:false};
  buildPool(); S.phase='play'; updHUD(); }

function pick(i){
  if(S.phase!=='play'||!G||G.reveal) return false;
  if(i<0||i>=G.pool.length) return false;
  if(G.usedCells.indexOf(i)>=0) return false;      /* 已用块拒点（叠部件块独立计） */
  const cell=G.pool[i];
  const want=CHARS[G.cIdx].parts[G.slots.length];
  if(cell.t===want&&cell.ok===1){
    /* 同帧双保险：文字=期望部件 且 ok 标记一致（防 restore 错位） */
    G.slots.push(cell.t); G.usedCells.push(i);
    snd('sel');
    if(G.slots.length===CHARS[G.cIdx].parts.length){   /* 槽满=拼成 */
      G.used.add(G.cIdx);
      S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak);
      const base=100+50*(CHARS[G.cIdx].lv-1);
      S.score+=Math.floor(base*(1+.5*Math.min(S.streak-1,6)));
      S.spelt++;
      if(S.spelt>=NEED){                               /* 大成 */
        S.bonus=500; S.score+=500;
        winGame(); updHUD(); return true;
      }
      snd('ok');
      flash(CHARS[G.cIdx].ch+' = '+CHARS[G.cIdx].parts.join(''));
      buildPool(); updHUD(); return true;
    }
    updHUD(); return true;
  } else {
    /* 点错：揭正确序 1.6s，断连 −3s 换字 */
    S.streak=0; S.time=Math.max(0,S.time-WRONG_PEN); S.penN++;
    G.reveal=true; snd('drum'); shakeT=.4;
    const c=CHARS[G.cIdx];
    /* 池中标记正确序号（同部件叠字按位匹配首个未标者） */
    const used={};
    c.parts.forEach((p,pi)=>{
      for(let k=0;k<G.pool.length;k++){
        if(G.pool[k].t===p&&G.pool[k].ok===1&&!used[k]){ used[k]=1; G.pool[k].mark=pi+1; break; }
      }
    });
    flash(c.ch+' = '+c.parts.join('')+' · −'+WRONG_PEN+'s');
    setTimeout(()=>{ if(S&&G&&G.reveal&&(S.phase==='play'||S.phase==='pause')){ buildPool(); } },1600);
    updHUD(); return true;
  }
}
function winGame(){
  S.phase='win'; saveBestNow(); snd('win');
  $('overttl').textContent='大 成';
  $('overscore').textContent=S.score;
  $('overstat').textContent='十五字功成 · 奖励 +'+(S.bonus||0)+' · 最长连 ×'+S.maxStreak;
  $('overlay').classList.remove('hide');
}
function gameOver(){
  S.phase='over'; saveBestNow();
  $('overttl').textContent='收 工';
  $('overscore').textContent=S.score;
  $('overstat').textContent='拼字 '+S.spelt+'/'+NEED+' · 最长连 ×'+S.maxStreak;
  updHUD(); $('overlay').classList.remove('hide');
}
/* ---- HUD ---- */
function updHUD(){
  $('scv').textContent=S.score; $('stv').textContent=S.streak;
  $('tmv').textContent=Math.max(0,Math.ceil(S.time));
  const cb=$('cubes');
  if(cb.childElementCount!==NEED){ cb.innerHTML='';
    for(let i=0;i<NEED;i++){ const d=document.createElement('span'); d.className='cube'; cb.appendChild(d); } }
  for(let i=0;i<NEED;i++) cb.children[i].className='cube'+(i<S.spelt?' on':'');
}

/* ---- 绘制 ---- */
function draw(){
  ctx.clearRect(0,0,390,780);
  const bg=ctx.createLinearGradient(0,0,0,780);
  bg.addColorStop(0,'#261d14'); bg.addColorStop(1,'#1a140e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,390,780);
  /* 木纹（固定伪随机横纹，不吃 LCG） */
  ctx.strokeStyle='rgba(180,140,90,.05)';
  for(let i=0;i<14;i++){ const y=(i*131)%760+8;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(390,y+(i%3-1)*3); ctx.stroke(); }
  if(S.phase==='menu'){ drawMenuIdle(); return; }
  if(!G){ return; }
  const shake=shakeT>0?Math.sin(shakeT*40)*3*shakeT:0;
  const c=CHARS[G.cIdx];
  if(c){
    /* 目标字卷轴卡 */
    const x=95,y=96,w=200,h=120;
    ctx.save(); ctx.translate(shake,0);
    const cg=ctx.createLinearGradient(0,y,0,y+h);
    cg.addColorStop(0,'#f6ecd4'); cg.addColorStop(1,'#eadfc4');
    ctx.fillStyle=cg; roundRect(x,y,w,h,10); ctx.fill();
    ctx.strokeStyle='rgba(120,80,60,.45)'; ctx.lineWidth=1; roundRect(x,y,w,h,10); ctx.stroke();
    /* 卷轴杆 */
    ctx.fillStyle='#8a6a3f'; ctx.fillRect(x-8,y-4,6,h+8); ctx.fillRect(x+w+2,y-4,6,h+8);
    ctx.fillStyle='#33261f'; ctx.font='800 64px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(c.ch,195,y+62);
    /* 结构提示章（右上角） */
    ctx.save(); ctx.translate(x+w-4,y+18); ctx.rotate(.08);
    ctx.strokeStyle='rgba(201,68,54,.8)'; ctx.lineWidth=1.4;
    ctx.strokeRect(-26,-12,52,24);
    ctx.fillStyle='#c94436'; ctx.font='700 11px system-ui';
    ctx.fillText(c.lv+' 段',0,1); ctx.restore();
    ctx.restore();
    /* 答题槽 */
    const pn=c.parts.length, sw=52, sh=44, sgap=10;
    const sx0=195-(pn*sw+(pn-1)*sgap)/2, sy=252;
    for(let i=0;i<pn;i++){
      const sx=sx0+i*(sw+sgap);
      const filled=i<G.slots.length;
      ctx.fillStyle=filled?'#c9a35a':'rgba(246,236,212,.08)';
      roundRect(sx,sy,sw,sh,8); ctx.fill();
      ctx.strokeStyle=filled?'#ecd9a8':'rgba(246,236,212,.3)';
      ctx.lineWidth=1; roundRect(sx,sy,sw,sh,8); ctx.stroke();
      if(filled){ ctx.fillStyle='#2b2118'; ctx.font='800 22px system-ui';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(G.slots[i],sx+sw/2,sy+sh/2+1); }
      else{ ctx.fillStyle='rgba(246,236,212,.18)'; ctx.font='700 15px system-ui';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(String(i+1),sx+sw/2,sy+sh/2+1); }
    }
  }
  /* 部件池 6 块 2×3 */
  HIT.parts=[];
  const pw=112,ph=64,pgap=12,px0=29,py0=330;
  for(let i=0;i<G.pool.length;i++){
    const x=px0+(i%2)*(pw+pgap), y=py0+Math.floor(i/2)*(ph+pgap);
    const cell=G.pool[i];
    const usedUp=G.usedCells.indexOf(i)>=0;
    ctx.save(); ctx.translate(shake,0);
    const g2=ctx.createLinearGradient(0,y,0,y+ph);
    if(cell.mark){ g2.addColorStop(0,'#e8b98a'); g2.addColorStop(1,'#c98a4a'); }
    else if(usedUp){ g2.addColorStop(0,'#8a7a5f'); g2.addColorStop(1,'#6f6350'); }
    else{ g2.addColorStop(0,'#f6ecd4'); g2.addColorStop(1,'#e9dcc0'); }
    ctx.fillStyle=g2; roundRect(x,y,pw,ph,10); ctx.fill();
    ctx.strokeStyle=cell.mark?'#8a4a1f':(usedUp?'rgba(120,100,80,.5)':'rgba(80,60,50,.45)');
    ctx.lineWidth=cell.mark?2:1; roundRect(x,y,pw,ph,10); ctx.stroke();
    ctx.fillStyle=usedUp?'rgba(60,48,38,.5)':'#33261f';
    ctx.font='800 30px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(cell.t,x+pw/2,y+ph/2+1);
    if(cell.mark){ ctx.fillStyle='#7a2f14'; ctx.font='800 15px system-ui';
      ctx.fillText('①②③④⑤'.charAt(cell.mark-1),x+pw-16,y+15); }
    ctx.restore();
    HIT.parts.push({x,y,w:pw,h:ph});
  }
  /* 底部印纹装饰 */
  ctx.fillStyle='rgba(201,68,54,.06)';
  ctx.beginPath(); ctx.ellipse(195,700,150,55,0,0,Math.PI*2); ctx.fill();
  if(S.streak>1){ ctx.save(); ctx.translate(338,316); ctx.rotate(.1);
    ctx.strokeStyle='rgba(201,68,54,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#c94436'; ctx.font='800 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('连×'+S.streak,0,1); ctx.restore(); }
}
function drawMenuIdle(){
  ctx.fillStyle='rgba(246,236,212,.45)'; ctx.font='600 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('一字一世界 · 拆合见功夫', 195, 620);
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- 输入 ---- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!S||S.phase!=='play'||!G||G.reveal) return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(390/r.width), y=(e.clientY-r.top)*(780/r.height);
  for(let i=0;i<HIT.parts.length;i++){ const o=HIT.parts[i];
    if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h){ HIT.parts=[]; pick(i); return; } }
});

/* ---- 主循环 ---- */
let lastT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(S){
    if(S.phase==='play'&&G){
      S.time-=dt;
      if(S.time<=0){ S.time=0; gameOver(); }
      else if(Math.ceil(S.time)!==S._lt){ S._lt=Math.ceil(S.time); if(S.time<=10) snd('tick'); updHUD(); }
    }
    if(shakeT>0) shakeT-=dt;
    draw();
  }
  requestAnimationFrame(loop);
}

/* ---- 按钮 ---- */
$('btn-go').addEventListener('click',()=>{ ensureAC(); $('menu').classList.add('hide'); startRound(); });
$('btn-again').addEventListener('click',()=>{ $('overlay').classList.add('hide'); ensureAC(); startRound(); });
$('btn-snd').addEventListener('click',()=>{ SND=!SND; ensureAC(); $('btn-snd').textContent=SND?'🔊':'🔇'; });
$('btn-pause').addEventListener('click',()=>{ if(S&&S.phase==='play'){S.phase='pause';$('pauselay').classList.remove('hide');} });
$('btn-resume').addEventListener('click',()=>{ if(S&&S.phase==='pause'){S.phase='play';$('pauselay').classList.add('hide');} });
$('btn-home').addEventListener('click',()=>{ $('pauselay').classList.add('hide'); $('menu').classList.remove('hide');
  $('bestline').textContent='最高累计 '+loadBest(); S.phase='menu'; saveBestNow(); });

function onHidden(){ if(document.hidden) saveBestNow(); }
document.addEventListener('visibilitychange',onHidden);
window.addEventListener('pagehide',()=>saveBestNow());

newGame();
$('bestline').textContent='最高累计 '+S.best;
requestAnimationFrame(loop);


</script>
