/* ==== 主循环 ==== */

}

/* ==== 输入 ==== */
function evXY(e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function qFromPx(px, py) { return [(px - FX) / QPX, (py - FY) / QPX]; }   // 浮点 q（吸附用）
function snapHalf(v) { return Math.round(v / 2) * 2; }                    // 半格吸附（块原点基准）
cv.addEventListener('pointerdown', function (e) {
  if (S.phase === 'winT' || S.phase === 'win' || S.phase === 'menu' || S.paused) return;
  if (S.pid !== null) return;
  var xy = evXY(e);
  S.pid = e.pointerId;
  var b = hitBlock(xy[0], xy[1]);
  if (b < 0) { S.pid = null; return; }
  S.sel = b;
  var wasPlaced = !!S.placed[b];
  var cur = wasPlaced ? [S.placed[b][0], S.placed[b][1], S.placed[b][2], S.placed[b][3]]
                      : [0, 0, (S.trayPose[b] || [0, 0])[0], (S.trayPose[b] || [0, 0])[1]];
  unplace(b);
  var q = qFromPx(xy[0], xy[1]);
  var bb = bboxOf(b, cur[2], cur[3]);
  var cxq = (bb[0] + bb[2]) / 2, cyq = (bb[1] + bb[3]) / 2;   // 拾起=块中心对齐手指（托盘缩放→全尺寸的自然过渡）
  var nx = snapHalf(q[0] - cxq), ny = snapHalf(q[1] - cyq);
  S.drag = { bi: b, ox: nx, oy: ny, rot: cur[2], flip: cur[3], grabDx: nx - q[0], grabDy: ny - q[1],
    px0: xy[0], py0: xy[1], wasPlaced: wasPlaced, was: [cur[0], cur[1], cur[2], cur[3]] };
  if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }   // M1：出 canvas 松手不软锁
  sndPick();
  e.preventDefault();
});
cv.addEventListener('pointermove', function (e) {
  if (e.pointerId !== S.pid || !S.drag) return;
  var xy = evXY(e);
  var q = qFromPx(xy[0], xy[1]);
  S.drag.ox = snapHalf(q[0] + S.drag.grabDx);   // 块与手指相对位移不变，原点半格吸附
  S.drag.oy = snapHalf(q[1] + S.drag.grabDy);
  e.preventDefault();
});
function endDrag(e) {
  if (e.pointerId !== S.pid || !S.drag) return;
  var d = S.drag, bi = d.bi;
  S.drag = null; S.pid = null;
  if (S.phase !== 'play' || S.paused) return;
  var xy = evXY(e);
  var moved = Math.abs(xy[0] - d.px0) + Math.abs(xy[1] - d.py0);
  if (moved < 6) {   // M2：tap=只选中不放置——已放置块原位放回，托盘块记姿态（原实现 tap 也走 tryPlace→必越界红闪+拒绝音）
    if (d.wasPlaced) { if (!tryPlace(bi, d.was[0], d.was[1], d.was[2], d.was[3])) S.trayPose[bi] = [d.was[2], d.was[3]]; }   // m-E：回放失败兜底带回托盘
    else S.trayPose[bi] = [d.rot, d.flip];
    return;
  }
  var ok = tryPlace(bi, d.ox, d.oy, d.rot, d.flip);
  if (!ok) {
    S.rejectT = 1; S.rejectXY = xy;
    S.trayPose[bi] = [d.rot, d.flip];   // 回托盘保留当前姿态
    sndReject();
    updHud();
  } else sndDrop();
}
cv.addEventListener('pointerup', endDrag);
window.addEventListener('pointerup', endDrag);   // M1 兜底：无 pointer capture 的环境 up 落 canvas 外也能终结
cv.addEventListener('pointercancel', function (e) {
  if (e.pointerId !== S.pid) return;
  if (S.drag) S.trayPose[S.drag.bi] = [S.drag.rot, S.drag.flip];   /* 姿态带回托盘 */
  S.drag = null; S.pid = null;   /* 系统打断只清态不放置（g121 教训） */
});
window.addEventListener('blur', function () {
  if (S.drag) S.trayPose[S.drag.bi] = [S.drag.rot, S.drag.flip];
  S.drag = null; S.pid = null;
});
el('rotBtn').addEventListener('pointerdown', function (e) {
  e.stopPropagation();
  if (S.phase !== 'play' || S.sel < 0 || S.drag) return;   // m-D：拖拽中钮拒（防 ≤16ms 显示窗口内第二指写 trayPose）
  var p = S.placed[S.sel];
  if (p) { var ox = p[0], oy = p[1], or = p[2]; unplace(S.sel); p[2] = (p[2] + 1) % 4; if (!tryPlace(S.sel, p[0], p[1], p[2], p[3])) { p[2] = or; tryPlace(S.sel, ox, oy, or, p[3]); } }
  else {   // M2：托盘待定姿态原地旋转（无越界约束，先转好再拖）
    var tp = S.trayPose[S.sel] || [0, 0];
    S.trayPose[S.sel] = [(tp[0] + 1) % 4, tp[1]];
  }
  sndRot();
});
el('flipBtn').addEventListener('pointerdown', function (e) {
  e.stopPropagation();
  if (S.phase !== 'play' || S.sel < 0 || S.drag) return;   // m-D 同上
  var p = S.placed[S.sel];
  if (p && S.sel === 6) {
    var ox = p[0], oy = p[1], or = p[2];
    unplace(S.sel);
    p[3] = 1 - p[3];
    if (!tryPlace(S.sel, p[0], p[1], p[2], p[3])) { p[3] = 1 - p[3]; tryPlace(S.sel, ox, oy, or, p[3]); }
  } else if (!p && S.sel === 6) {   // M2：托盘 P 待定翻面
    var tp2 = S.trayPose[S.sel] || [0, 0];
    S.trayPose[S.sel] = [tp2[0], 1 - tp2[1]];
  }
  sndRot();
});

/* ==== 按钮 ==== */
el('startBtn').onclick = function () { wake(); hideLay('menu'); loadLv(1); };
el('nextBtn').onclick = function () { if (S.lv < 24) { hideLay('winlay'); loadLv(S.lv + 1); } };
el('replayBtn').onclick = function () { hideLay('winlay'); loadLv(S.lv); };
el('homeBtn').onclick = function () { hideLay('winlay'); S.phase = 'menu'; showLay('menu'); updHud(); };
el('pauseBtn').onclick = function () {
  if (S.phase === 'play') { S.paused = true; S.drag = null; S.pid = null; showLay('pauselay'); updHud(); }
};
el('resumeBtn').onclick = function () { S.paused = false; hideLay('pauselay'); updHud(); };
el('restartBtn').onclick = function () { S.paused = false; hideLay('pauselay'); loadLv(S.lv); };
el('quitBtn').onclick = function () { S.paused = false; hideLay('pauselay'); S.phase = 'menu'; showLay('menu'); updHud(); };
el('hintBtn').onclick = doHint;
el('muteBtn').onclick = function () {
  S.muted = !S.muted;
  localStorage.setItem(K_MUTE, S.muted ? '1' : '0');
  el('muteBtn').style.opacity = S.muted ? .4 : 1;
};
document.addEventListener('visibilitychange', function () {
  if (document.hidden && S.phase === 'play' && !S.paused) {
    S.paused = true;
    if (S.drag) S.trayPose[S.drag.bi] = [S.drag.rot, S.drag.flip];   /* m-B：与 blur 行为一致（姿态带回+HUD 同步） */
    S.drag = null; S.pid = null;   /* 拖拽残留会使该块 hitBlock 永久跳过 */
    showLay('pauselay'); updHud();
  }
});

/* ==== 音效（WebAudio 短合成；手势内建+resume） ==== */
var AC = null;
function wake() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
document.addEventListener('pointerdown', function once() { wake(); document.removeEventListener('pointerdown', once); }, { once: true });
function tone(f, dur, type, vol, slide) {
  if (S.muted || !AC) return;
  try {
    var o = AC.createOscillator(), gn = AC.createGain(), t0 = AC.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    gn.gain.setValueAtTime(vol || 0.06, t0);
    gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function sndPick() { tone(240, 0.07, 'triangle', 0.05); }
function sndDrop() { tone(660, 0.1, 'sine', 0.06); tone(990, 0.08, 'sine', 0.03); }
function sndReject() { tone(160, 0.1, 'square', 0.04); tone(140, 0.12, 'square', 0.04); }
function sndRot() { tone(380, 0.05, 'triangle', 0.05); }
function sndHint() { tone(880, 0.12, 'sine', 0.05); tone(1320, 0.18, 'sine', 0.04); }
function sndWin(st) {
  var grand = true;   // 巧圣=七音（m3：finishWin 已先更新 BEST，此处可判全 3★）
  for (var g = 1; g <= 24; g++) if (!(BEST[g] && BEST[g].stars === 3)) { grand = false; break; }
  var seq = grand ? [523, 587, 659, 784, 880, 1046, 1318] : [523, 587, 659, 784, 880];
  var n = grand ? 7 : 2 + st;
  for (var i = 0; i < n; i++) setTimeout(function (f) { return function () { tone(f, 0.22, 'sine', 0.07); }; }(seq[i % seq.length]), i * 130);
}

/* ==== boot ==== */
el('muteBtn').style.opacity = S.muted ? .4 : 1;
updHud();
requestAnimationFrame(loop);

</script>
<script src="../shell.js" defer></script>
</body>
