function ensureAC(){ if(AC||!(window.AudioContext||window.webkitAudioContext)) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f,d,t,v){ if(!SND||!AC) return; try{
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=t||'sine'; o.frequency.value=f;
  gn.gain.setValueAtTime(v||.08, AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+d);
  o.connect(gn); gn.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
}catch(e){} }
function snd(k){ if(k==='sel')beep(660,.08,'triangle',.05);
  else if(k==='ok'){beep(880,.2,'sine',.07);setTimeout(()=>beep(1318,.25,'sine',.05),110);}

  else if(k==='win'){beep(523,.15,'sine',.06);setTimeout(()=>beep(659,.15,'sine',.06),150);
    setTimeout(()=>beep(784,.3,'sine',.06),300);}
  else if(k==='bell')beep(1046,.25,'sine',.06);
  else if(k==='tick')beep(300,.04,'triangle',.04); }

/* 索引 + 一致性 throw（构建即校验：谜面唯一/答案≠干扰/干扰互异/类别难度合法） */
for(let i=0;i<RIDDLES.length;i++){
  const r=RIDDLES[i];
  if(!r.q||!r.a||r.w.length!==3) throw new Error('riddle broken @'+i);
  if(CATS.indexOf(r.c)<0||r.lv<1||r.lv>3) throw new Error('riddle cat/lv @'+i);
  if(r.w.indexOf(r.a)>=0) throw new Error('riddle ans in distr @'+i);
  if(r.w[0]===r.w[1]||r.w[0]===r.w[2]||r.w[1]===r.w[2]) throw new Error('riddle dup distr @'+i);
  for(let j=0;j<i;j++) if(RIDDLES[j].q===r.q) throw new Error('riddle dup q @'+i);
}

/* ============ 状态 ============ */
const BEST_KEY='g74_best';
const TURN_TIME=12, START_LIVES=3, NEED=8, REUSE_BONUS=100;
let S=null, G=null;
/* G={qIdx, used:Set, options:[i×4], correct, reuse} */
let HIT={opts:[]};
let flashT=0, shakeT=0;
function loadBest(){ try{ return +(localStorage.getItem(BEST_KEY)||0); }catch(e){ return 0; } }
function saveBestNow(){ if(S && S.score>S.best){ S.best=S.score; try{ localStorage.setItem(BEST_KEY,String(S.best)); }catch(e){} } }
let tipTO=null;
function flash(msg){ const f=$('flashtx'); f.textContent=msg; f.classList.add('show');
  clearTimeout(tipTO); tipTO=setTimeout(()=>f.classList.remove('show'),1600); }
function killFlash(){ clearTimeout(tipTO); $('flashtx').classList.remove('show'); }

/* 难度档：连对<3→[1]；≥3→[1,2]；≥6→[2,3] */
function tierOf(streak){ return streak>=6?[2,3]:(streak>=3?[1,2]:[1]); }
function pickIdx(){
  const t=tierOf(S.streak);
  /* 出题永不与当前题相同（揭底后原题重出=白送一题，SPEC「重出新题」语义） */
  let pool=RIDDLES.map((_,i)=>i).filter(i=>!G.used.has(i)&&i!==G.qIdx&&t.indexOf(RIDDLES[i].lv)>=0);
  if(pool.length===0)                      /* 档位池空→全库档（正常局不可达，防极长局/restore） */
    pool=RIDDLES.map((_,i)=>i).filter(i=>!G.used.has(i)&&i!==G.qIdx);
  if(pool.length===0){                     /* 全库尽→循环重用 +100 */
    G.used.clear(); S.score+=REUSE_BONUS; S.reuse++;
    flash('谜库重温 · +'+REUSE_BONUS);
    pool=RIDDLES.map((_,i)=>i).filter(i=>i!==G.qIdx&&t.indexOf(RIDDLES[i].lv)>=0);
    if(pool.length===0) pool=RIDDLES.map((_,i)=>i).filter(i=>i!==G.qIdx);
  }
  return pool[Math.floor(rnd()*pool.length)];
}
function buildOptions(){
  const qi=pickIdx();
  const r=RIDDLES[qi];
  /* options=文字牌：1 正确+3 干扰（自带 w），与库索引解耦（同答案多题不互撞） */
  const opts=[{t:r.a,ok:1},{t:r.w[0],ok:0},{t:r.w[1],ok:0},{t:r.w[2],ok:0}];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1));
    const t=opts[i]; opts[i]=opts[j]; opts[j]=t; }
  G.qIdx=qi; G.options=opts; G.correct=opts.findIndex(o=>o.ok===1);
  S.time=TURN_TIME; S._lt=-1; updHUD();
}
function newGame(){
  S={phase:'menu',time:TURN_TIME,score:0,best:loadBest(),streak:0,maxStreak:0,
     lives:START_LIVES,lit:0,reuse:0,paused:false,_lt:-1};
  G=null;
}
function startRound(){ killFlash();
  RS=RS>>>0;
  S.time=TURN_TIME; S.score=0; S.streak=0; S.maxStreak=0; S.lives=START_LIVES;
  S.lit=0; S.reuse=0; S.bonus=0;
  G={qIdx:-1, used:new Set(), options:[], correct:-1};
  buildOptions(); S.phase='play'; updHUD(); }

function pick(i){
  if(S.phase!=='play'||!G) return false;
  if(i<0||i>=4||G.correct<0) return false;
  const r=RIDDLES[G.qIdx];
  const right=(i===G.correct);
  /* 双保险：位置与 ok 标记一致（防 restore 错位） */
  const right2=(G.options[i].ok===1);
  if(right!==right2){ try{console.warn('g74 pick mismatch');}catch(e){} return false; }
  if(right){
    G.used.add(G.qIdx);
    S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak);
    const mult=1+.5*Math.min(S.streak-1,6);
    S.score+=Math.floor(100*mult);
    S.lit++;
    if(S.lit>=NEED){                     /* 满堂彩 */
      const bonus=500+Math.ceil(Math.max(0,S.time))*10;
      S.score+=bonus; S.bonus=bonus;
      winGame(); updHUD(); return true;
    }
    snd('ok');
    flash('打一'+r.c+' · '+r.a);
    buildOptions(); updHUD(); return true;
  } else {
    loseLife('谜底是「'+RIDDLES[G.qIdx].a+'」'); return true;
  }
}
function loseLife(why){
  S.streak=0; S.lives--; snd('drum'); shakeT=.4;
  if(S.lives<=0){ S.lives=0; flash(why); gameOver(); }
  else { flash(why+' · 熄一灯'); buildOptions(); }
  updHUD();
}
function winGame(){
  S.phase='win'; saveBestNow(); snd('win');
  $('overttl').textContent='满 堂 彩';
  $('overscore').textContent=S.score;
  $('overstat').textContent='八灯齐明 · 奖励 +'+(S.bonus||0)+' · 最长连 ×'+S.maxStreak;
  $('overlay').classList.remove('hide');
}
function gameOver(){
  S.phase='over'; saveBestNow();
  $('overttl').textContent='散 场';
  $('overscore').textContent=S.score;
  $('overstat').textContent='点灯 '+S.lit+'/'+NEED+' · 最长连 ×'+S.maxStreak;
  $('overlay').classList.remove('hide');
}
/* ---- HUD ---- */
function updHUD(){
  $('scv').textContent=S.score; $('stv').textContent=S.streak;
  $('tmv').textContent=Math.max(0,Math.ceil(S.time));
  for(let i=0;i<3;i++) $('lf'+i).className='lamp'+(i<S.lives?'':' off');
}

/* ---- 绘制 ---- */
function draw(){
  ctx.clearRect(0,0,390,780);
  const bg=ctx.createLinearGradient(0,0,0,780);
  bg.addColorStop(0,'#1b1317'); bg.addColorStop(1,'#120d10');
  ctx.fillStyle=bg; ctx.fillRect(0,0,390,780);
  /* 夜空星点（固定伪随机，不吃 LCG） */
  ctx.fillStyle='rgba(246,236,212,.25)';
  for(let i=0;i<24;i++){ const x=(i*167)%390, y=(i*97)%760;
    if((i*7)%3===0) ctx.fillRect(x,y,2,2); else ctx.fillRect(x,y,1,1); }
  if(S.phase==='menu'){ drawMenuIdle(); return; }
  drawLanterns();
  if(!G){ return; }
  const shake=shakeT>0?Math.sin(shakeT*40)*3*shakeT:0;
  /* 谜笺 */
  drawRiddleCard(shake);
  /* 香柱倒计时 */
  const tp=Math.max(0,S.time/TURN_TIME);
  ctx.fillStyle='rgba(246,236,212,.12)'; roundRect(40,246,310,8,4); ctx.fill();
  ctx.fillStyle=tp>.3?'#e0512f':'#ffb090'; roundRect(40,246,310*tp,8,4); ctx.fill();
  if(tp>0){ ctx.fillStyle='#ffd890'; ctx.beginPath();
    ctx.arc(40+310*tp,250,2.6,0,Math.PI*2); ctx.fill(); }
  /* 答案牌 2×2 */
  HIT.opts=[];
  const w=155,h=72,gap=10,x0=20,y0=282;
  for(let i=0;i<4;i++){
    const x=x0+(i%2)*(w+gap), y=y0+Math.floor(i/2)*(h+gap);
    const ans=G.options[i].t;
    ctx.save(); ctx.translate(shake,0);
    const cg=ctx.createLinearGradient(0,y,0,y+h);
    cg.addColorStop(0,'#f6ecd4'); cg.addColorStop(1,'#e9dcc0');
    ctx.fillStyle=cg; roundRect(x,y,w,h,12); ctx.fill();
    ctx.strokeStyle='rgba(80,60,50,.4)'; ctx.lineWidth=1; roundRect(x,y,w,h,12); ctx.stroke();
    ctx.fillStyle='#33261f'; ctx.font='800 21px system-ui';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(ans,x+w/2,y+h/2);
    ctx.fillStyle='rgba(224,81,47,.5)'; ctx.font='700 10px system-ui';
    ctx.fillText('打一'+RIDDLES[G.qIdx].c,x+w/2,y+h-12);
    ctx.restore();
    HIT.opts.push({x,y,w,h});
  }
  /* 底部灯影装饰 */
  ctx.fillStyle='rgba(224,81,47,.06)';
  ctx.beginPath(); ctx.ellipse(195,690,150,60,0,0,Math.PI*2); ctx.fill();
  if(S.streak>1){ ctx.save(); ctx.translate(330,258); ctx.rotate(.1);
    ctx.strokeStyle='rgba(224,81,47,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#e0512f'; ctx.font='800 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('连×'+S.streak,0,1); ctx.restore(); }
}
function drawLanterns(){
  const lw=38,lh=46,gap=10,x0=8;
  for(let i=0;i<NEED;i++){
    const x=x0+i*(lw+gap), on=i<S.lit;
    const cx=x+lw/2, cy=38;
    /* 挂绳 */
    ctx.strokeStyle='rgba(246,236,212,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,cy-lh/2-4); ctx.stroke();
    if(on){
      const glow=ctx.createRadialGradient(cx,cy,4,cx,cy,lw*.9);
      glow.addColorStop(0,'rgba(255,150,90,.5)'); glow.addColorStop(1,'rgba(255,120,60,0)');
      ctx.fillStyle=glow; ctx.fillRect(cx-lw,cy-lh,lw*2,lh*2);
    }
    const g=ctx.createLinearGradient(0,cy-lh/2,0,cy+lh/2);
    if(on){ g.addColorStop(0,'#ff7a4d'); g.addColorStop(1,'#c93a18'); }
    else{ g.addColorStop(0,'#5a3230'); g.addColorStop(1,'#3d2322'); }
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(cx,cy,lw/2,lh/2,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=on?'rgba(255,200,150,.8)':'rgba(150,110,100,.35)';
    ctx.lineWidth=1.2; ctx.stroke();
    /* 竹骨线 */
    ctx.strokeStyle=on?'rgba(255,220,180,.35)':'rgba(150,110,100,.2)';
    ctx.beginPath(); ctx.ellipse(cx,cy,lw/6,lh/2,0,0,Math.PI*2); ctx.stroke();
    /* 上下盖+流苏 */
    ctx.fillStyle=on?'#f2c86a':'rgba(150,130,110,.5)';
    ctx.fillRect(cx-7,cy-lh/2-3,14,5); ctx.fillRect(cx-7,cy+lh/2-2,14,5);
    if(on){ ctx.strokeStyle='rgba(242,200,106,.8)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(cx,cy+lh/2+3); ctx.lineTo(cx,cy+lh/2+12); ctx.stroke(); }
  }
}
function drawRiddleCard(shake){
  const r=RIDDLES[G.qIdx];
  if(!r) return;                              /* restore qIdx=-1 防崩 */
  const x=40,y=96,w=310,h=132;
  ctx.save(); ctx.translate(shake,0);
  const cg=ctx.createLinearGradient(0,y,0,y+h);
  cg.addColorStop(0,'#f6ecd4'); cg.addColorStop(1,'#eadfc4');
  ctx.fillStyle=cg; roundRect(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle='rgba(120,80,60,.4)'; ctx.lineWidth=1; roundRect(x,y,w,h,10); ctx.stroke();
  /* 红绳结 */
  ctx.strokeStyle='rgba(224,81,47,.8)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(195,y-14); ctx.lineTo(195,y); ctx.stroke();
  ctx.fillStyle='#e0512f'; ctx.beginPath(); ctx.arc(195,y-14,4,0,Math.PI*2); ctx.fill();
  /* 类别章（右上角） */
  ctx.save(); ctx.translate(x+w-38,y+22); ctx.rotate(.08);
  ctx.strokeStyle='rgba(224,81,47,.75)'; ctx.lineWidth=1.4;
  ctx.strokeRect(-26,-13,52,26);
  ctx.fillStyle='#e0512f'; ctx.font='700 12px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('打一'+r.c,0,1); ctx.restore();
  /* 谜面（自动折行 ≤14 字/行） */
  ctx.fillStyle='#33261f'; ctx.font='700 17px system-ui';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const q=r.q; const per=14;
  const lines=[];
  for(let i=0;i<q.length;i+=per) lines.push(q.slice(i,i+per));
  /* 标点避让：行首标点并回上一行尾（VLM 目验排版瑕疵修复） */
  const PUNC='，。、！？；：';
  for(let li=1;li<lines.length;li++){
    while(lines[li].length&&PUNC.indexOf(lines[li][0])>=0&&lines[li-1].length<per+2){
      lines[li-1]+=lines[li][0]; lines[li]=lines[li].slice(1); } }
  const lh=26, y0=y+62-(lines.length-1)*lh/2+(lines.length>=3?10:0); /* 3 行首行下移避右上类别章（R2 m-2） */
  lines.forEach((ln,i)=>ctx.fillText(ln,195,y0+i*lh));
  /* 难度点 */
  for(let d=0;d<r.lv;d++){ ctx.fillStyle='rgba(224,81,47,.6)';
    ctx.beginPath(); ctx.arc(x+18+d*12,y+h-14,3.4,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawMenuIdle(){
  drawLanterns();
  ctx.fillStyle='rgba(246,236,212,.45)'; ctx.font='600 15px system-ui'; ctx.textAlign='center';
  ctx.fillText('花灯如昼 · 以谜会友', 195, 620);
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- 输入 ---- */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!S||S.phase!=='play') return;
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(390/r.width), y=(e.clientY-r.top)*(780/r.height);
  for(let i=0;i<HIT.opts.length;i++){ const o=HIT.opts[i];
    if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h){ HIT.opts=[]; pick(i); return; } }
});

/* ---- 主循环 ---- */
let lastT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(S){
    if(S.phase==='play'&&G){
      S.time-=dt;
      if(S.time<=0){ S.time=0; loseLife('时间到'); }
      else if(Math.ceil(S.time)!==S._lt){ S._lt=Math.ceil(S.time); if(S.time<=5) snd('tick'); updHUD(); }
    }
    if(shakeT>0) shakeT-=dt;
    draw();
  }
  requestAnimationFrame(loop);
}

/* ---- 按钮 ---- */
$('btn-go').addEventListener('click',()=>{ ensureAC(); $('menu').classList.add('hide'); startRound(); });
$('btn-again').addEventListener('click',()=>{ $('overlay').classList.add('hide'); ensureAC(); startRound(); });
$('btn-snd').addEventListener('click',()=>{ SND=!SND; ensureAC(); $('btn-snd').textContent=SND?'🔊':'🔇'; });
$('btn-pause').addEventListener('click',()=>{ if(S&&S.phase==='play'){S.phase='pause';$('pauselay').classList.remove('hide');} });
$('btn-resume').addEventListener('click',()=>{ if(S&&S.phase==='pause'){S.phase='play';$('pauselay').classList.add('hide');} });
$('btn-home').addEventListener('click',()=>{ $('pauselay').classList.add('hide'); $('menu').classList.remove('hide');
  $('bestline').textContent='最高累计 '+loadBest(); S.phase='menu'; saveBestNow(); });

function onHidden(){ if(document.hidden) saveBestNow(); }
document.addEventListener('visibilitychange',onHidden);
window.addEventListener('pagehide',()=>saveBestNow());

newGame();
$('bestline').textContent='最高累计 '+S.best;
requestAnimationFrame(loop);


</script>
