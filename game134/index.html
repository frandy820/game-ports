      dropChk(c);
      if(c.fall>0)continue;   /* 同构白名单①：js 跳过已标记掉落币的推板检测，py 侧仍过——掉落币 x<51 距推板≥110px 分支不可达，数值等价（G3 m-2） */
      var qx=c.x<px?px:(c.x>px+PB_W?px+PB_W:c.x);
      var qy=c.y<PB_TOP?PB_TOP:(c.y>DESK_Y?DESK_Y:c.y);
      var dx=c.x-qx,dy=c.y-qy,d2=dx*dx+dy*dy;
      if(d2<R*R){S.hits++;c.sleep=false;
        if(dy<-1e-9&&Math.abs(dx)<1e-9&&c.y<PB_TOP){
          c.y=PB_TOP-R;if(c.vy>0)c.vy=0;
          if(pv<=0){c.vx=c.vx*0.5+pv*0.5}else{c.vx=c.vx*0.9+pv*0.1}
        }else if(dx>1e-9&&Math.abs(dy)<1e-9&&c.x>px+PB_W){
          c.x=px+PB_W+R;if((c.vx-pv)<0)c.vx=pv+(c.vx-pv)*-E_PB;
        }else if(dx<-1e-9&&Math.abs(dy)<1e-9&&c.x<px){
          c.x=px-R;if((c.vx-pv)<0)c.vx=pv;
        }else{
          var d=Math.sqrt(d2);
          if(d>1e-9){var nx=dx/d,ny=dy/d;c.x=qx+nx*R;c.y=qy+ny*R;
            var rvx=c.vx-pv,vn=rvx*nx+c.vy*ny;
            if(vn<0){var j=-(1+E_PB)*vn;c.vx+=j*nx;c.vy+=j*ny}
          }else{c.x=px-R}
        }
      }
    }
    var cs=S.coins;
    for(var i=0;i<cs.length;i++){
      var a=cs[i];
      for(var j2=i+1;j2<cs.length;j2++){
        var b=cs[j2];
        var ddx=b.x-a.x,ddy=b.y-a.y,rr=2*R;
        if(ddx*ddx+ddy*ddy<rr*rr){S.hits++;
          var dd2=ddx*ddx+ddy*ddy,d=Math.sqrt(dd2);
          if(d<1e-9){ddx=1e-9;ddy=0;d=1e-9}
          var nx=ddx/d,ny=ddy/d,ov=(rr-d)/2;
          a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
          var va=a.sleep?0:a.vx,vya=a.sleep?0:a.vy,vb=b.sleep?0:b.vx,vyb=b.sleep?0:b.vy;
          var rvn=(vb-va)*nx+(vyb-vya)*ny;
          if(rvn<0){var jj=-(1+E_COIN)*rvn/2;
            if(!a.sleep){a.vx-=jj*nx;a.vy-=jj*ny}
            if(!b.sleep){b.vx+=jj*nx;b.vy+=jj*ny}}
          if(rvn<-0.3){a.sleep=false;b.sleep=false}
        }
      }
      if(a.x+R<DROP_X)dropChk(a);
    }
    var keep=[];
    for(var k=0;k<cs.length;k++){if(cs[k].fall>0){S.falling.push(cs[k])}else{keep.push(cs[k])}}
    S.coins=keep;
  }
  /* 同构白名单②：js 倒序 vs py 正序遍历坠槽——dropped 顺序无消费方（仅 length/整数累加），等价（G3 m-2） */
  for(var fi=S.falling.length-1;fi>=0;fi--){
    S.falling[fi].fall++;
    if(S.falling[fi].fall>30){
      var tp=S.falling[fi].tp;
      S.falling.splice(fi,1);S.dropped.push(tp);S.score+=VAL[tp];
      if(tp>0&&!S.collected[tp]){S.collected[tp]=1;flashMsg(PNAMES[tp]+' 入谱！');saveMain()}   /* 入谱即落盘（G3 M-R1）：败局/中途回菜单/达标窗口离开均不丢泉谱 */
    }
  }
  S.f++;
}
function dropCoin(x,tp){S.lastDropF=S.f;S.coins.push(mkC(x,120.0,tp||0))}

/* ===== 关卡/UI ===== */
var els={};
function $(id){return document.getElementById(id)}
function updHUD(){
  var L=LVDATA[S.lv-1];
  els.hInfo.textContent='第 '+S.lv+' 摊 · '+S.score+'/'+L.target+' 文';
  var done=S.score>=L.target;
  els.hSub.textContent='投 '+S.thrown+'/'+L.N+(done?' · 已达标':'');
  els.hSub.style.color=done?'#e8c96a':'#8fa0c0';
}
function loadLv(lv){
  S.lv=lv;var L=LVDATA[lv-1];
  S.coins=[];S.falling=[];S.f=0;S.dropped=[];S.score=0;S.thrown=0;S.hints=0;S.pend=[];S.winT=0;S.loseT=0;S.reached=0;S.reachT=0;S.parts=[];
  for(var i=0;i<L.coins.length;i++)S.coins.push(mkC(L.coins[i][0],L.coins[i][1],L.coins[i][2]));
  for(var t=0;t<STAB;t++)stepW();
  S.lastDropF=S.f;S.lastActF=S.f;   /* 落定钟归零：STAB 后起算（G3 F-1） */
  updHUD();
}
function starsOf(){
  var L=LVDATA[S.lv-1];
  var used=S.reachT||S.thrown;   /* 达标时刻用投数（续投刷分不改星级，SPEC §1.9） */
  if(used<=L.par&&S.hints===0)return 3;
  if(used<=L.par+3&&S.hints<=1)return 2;
  return 1;
}
function finishWin(){
  var st=starsOf();
  S.winT=1;S.ph='over';
  S.best[S.lv]=Math.max(S.best[S.lv]||0,S.score);
  if(S.lv>=S.unlocked&&S.lv<24)S.unlocked=S.lv+1;
  saveMain();
  els.oTitle.textContent='钱 潮 落 定';els.oTitle.style.color='#e8c96a';
  els.oStars.textContent=st===3?'★★★':(st===2?'★★☆':'★☆☆');
  els.oSub.textContent=S.score+' 文 · 用 '+S.thrown+' 投（par '+LVDATA[S.lv-1].par+'）';
  els.oNext.style.display=S.lv<24?'block':'none';
  $('over').classList.remove('hide');
  snd('win');
}
function finishLose(){
  S.loseT=1;S.ph='over';
  els.oTitle.textContent='潮 落 未 及';els.oTitle.style.color='#a8b4cc';
  els.oStars.textContent='';
  els.oSub.textContent=S.score+' 文 · 差 '+(LVDATA[S.lv-1].target-S.score)+' 文';
  els.oNext.style.display='none';
  $('over').classList.remove('hide');
  snd('lose');
}
function newGame(lv){loadLv(lv);S.ph='play';$('menu').classList.add('hide');$('over').classList.add('hide');$('lvbar').classList.remove('show');$('trophy').classList.add('hide')}
function home(){$('menu').classList.remove('hide');$('over').classList.add('hide');$('pause').classList.add('hide');$('lvbar').classList.remove('show');$('trophy').classList.add('hide');S.ph='menu';els.hInfo.textContent='钱潮';els.hSub.textContent=''}
function flashMsg(t){els.flash.textContent=t;S.flashT=90}
/* 存档 */
var KEY='g134_coin';
function saveMain(){try{localStorage.setItem(KEY,JSON.stringify({best:S.best,unlocked:S.unlocked,collected:Object.keys(S.collected).map(Number),snd:S.snd}))}catch(e){}}
function loadSave(){
  try{
    var v=localStorage.getItem(KEY);if(!v)return;
    var d=JSON.parse(v);
    if(typeof d!=='object'||!d)return;
    if(typeof d.unlocked!=='number'||!isFinite(d.unlocked)||Math.floor(d.unlocked)!==d.unlocked||d.unlocked<1||d.unlocked>24)return;   /* 整数门禁（G3 m-1：1.5 过旧校验→LVDATA[0.5] 崩） */
    if(!d.best||typeof d.best!=='object'||Array.isArray(d.best))return;
    for(var k in d.best){var vv=d.best[k];if(typeof k!=='string'||!/^[0-9]+$/.test(k)||+k<1||+k>24||typeof vv!=='number'||!isFinite(vv)||Math.floor(vv)!==vv||vv<0||vv>9999)return}   /* 键关窗+值整数非负有界（G3 m-R4 卫生） */
    if(d.collected&&!Array.isArray(d.collected))return;
    S.best={};
    for(var k2 in d.best){S.best[+k2]=d.best[k2]}
    S.unlocked=d.unlocked;
    if(d.collected&&d.collected.length){for(var i=0;i<d.collected.length;i++){var t=d.collected[i];if(typeof t==='number'&&Math.floor(t)===t&&t>=1&&t<=5)S.collected[t]=1}}   /* 项整数门禁（G3 m-R4） */
    if(typeof d.snd==='number')S.snd=d.snd;
  }catch(e){}
}
/* 音效 */
var AC=null;
function ensureAC(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,dur,dly,vol){if(!AC||!S.snd)return;var t0=AC.currentTime+(dly||0);var o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.value=f;gn.gain.setValueAtTime(vol||0.12,t0);gn.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+dur)}
function snd(k){
  if(k==='drop')tone(660,0.08,0,0.08);
  else if(k==='clink')tone(880,0.05,0,0.05);
  else if(k==='fall')tone(520,0.12,0,0.1);
  else if(k==='coin_special'){tone(660,0.1,0,0.1);tone(990,0.14,0.09,0.1)}
  else if(k==='win'){tone(523,0.12,0);tone(659,0.12,0.1);tone(784,0.2,0.2)}
  else if(k==='lose')tone(330,0.25,0,0.1);
}
/* 输入 */
function tryThrow(x){
  if(S.ph!=='play')return false;
  var L=LVDATA[S.lv-1];
  if(S.thrown>=L.N)return false;
  x=Math.round(x/3)*3;if(x<80)x=80;if(x>252)x=252;
  S.pend.push(x);S.thrown++;S.lastActF=S.f;
  updHUD();snd('drop');
  return true;
}
/* 提示（拨泉）*/
function doHint(){
  if(S.ph!=='play'||S.hints>=3)return;
  var L=LVDATA[S.lv-1];
  var x=L.sol[Math.min(S.thrown,L.sol.length-1)];
  S.hintX=x;S.hintT=90;S.hints++;
  updHUD();
}
/* ===== 渲染 ===== */
var cv,ctx;
function draw(){
  ctx.clearRect(0,0,390,780);
  /* 背景夜市 */
  var g=ctx.createLinearGradient(0,0,0,780);g.addColorStop(0,'#1a2237');g.addColorStop(1,'#12182a');
  ctx.fillStyle=g;ctx.fillRect(0,0,390,780);
  /* 远景灯笼串 */
  ctx.globalAlpha=0.25;
  for(var i=0;i<6;i++){var lx=30+i*66,ly=40+((i%2)*14);
    ctx.fillStyle='#8a4a3a';ctx.beginPath();ctx.arc(lx,ly+420,8,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  /* 槽（左缘）*/
  ctx.fillStyle='#3a2a22';ctx.fillRect(0,DESK_Y-70,EDGE_L,150);
  ctx.fillStyle='#5a3a2a';ctx.fillRect(6,DESK_Y+50,44,10);
  ctx.fillStyle='#c05a3a';ctx.fillRect(EDGE_L-6,DESK_Y-64,4,128);
  /* 台面 */
  ctx.fillStyle='#3d3226';ctx.fillRect(EDGE_L,DESK_Y,WALL_R-EDGE_L,12);
  ctx.fillStyle='#4a3c2e';ctx.fillRect(EDGE_L,DESK_Y,WALL_R-EDGE_L,3);
  /* 右壁 */
  ctx.fillStyle='#332a20';ctx.fillRect(WALL_R,DESK_Y-90,10,102);
  /* 掉落中的币（坠槽）*/
  for(var fi=0;fi<S.falling.length;fi++){
    var c=S.falling[fi];var p=Math.min(1,c.fall/30);
    var fx=c.x-(c.x-28)*p,fy=c.y+(700-c.y)*p;
    drawCoin(fx,fy,c.tp,0.9-p*0.3);
  }
  /* 台上币 */
  for(var i2=0;i2<S.coins.length;i2++){drawCoin(S.coins[i2].x,S.coins[i2].y,S.coins[i2].tp,1)}
  /* 推板 */
  var px=SIN134[S.f%PERIOD];
  ctx.fillStyle='#6a5238';ctx.fillRect(px,PB_TOP,PB_W,PB_H);
  ctx.fillStyle='#7d6244';ctx.fillRect(px,PB_TOP,PB_W,6);
  ctx.strokeStyle='#4a3a28';ctx.lineWidth=2;ctx.strokeRect(px+1,PB_TOP+1,PB_W-2,PB_H-2);
  ctx.fillStyle='#c8a05a';ctx.fillRect(px,PB_TOP,PB_W,2);
  /* 投币轨道 */
  ctx.fillStyle='#2a3552';ctx.fillRect(78,90,178,8);
  ctx.fillStyle='#c8a05a';ctx.fillRect(84,94,166,2);
  /* 提示箭头 */
  if(S.hintT>0){S.hintT--;
    ctx.fillStyle='rgba(232,201,106,'+(S.hintT/90*0.9)+')';
    ctx.beginPath();ctx.moveTo(S.hintX,110);ctx.lineTo(S.hintX-8,96);ctx.lineTo(S.hintX+8,96);ctx.closePath();ctx.fill();
  }
  /* 彩带粒子 */
  for(var pi=S.parts.length-1;pi>=0;pi--){var p2=S.parts[pi];p2.y+=p2.vy;p2.vy+=0.08;p2.x+=p2.vx;p2.life--;
    if(p2.life<=0){S.parts.splice(pi,1);continue}
    ctx.globalAlpha=Math.min(1,p2.life/30);
    ctx.fillStyle=p2.col;ctx.fillRect(p2.x,p2.y,4,8);ctx.globalAlpha=1;
  }
  if(S.flashT>0){S.flashT--;els.flash.style.opacity=Math.min(1,S.flashT/30)}else{els.flash.style.opacity=0}
}
function drawCoin(x,y,tp,alpha){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=PCOLS[tp];
  ctx.beginPath();ctx.arc(x,y,R,0,6.283);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#1a2237';ctx.fillRect(x-2.5,y-2.5,5,5); /* 方孔 */
  if(tp>0){ctx.fillStyle='#2a2016';ctx.font='7px sans-serif';ctx.textAlign='center';
    ctx.fillText(['','五','開','乾','觀','永'][tp],x,y+13)}
  ctx.globalAlpha=1;
}
/* ===== 主循环（固定帧步）===== */
var last=0,acc=0;
function loop(ts){
  var dt=Math.min(50,ts-last);last=ts;acc+=dt;
  while(acc>=1000/60){
    acc-=1000/60;
    if(S.ph==='play'){
      while(S.pend.length){dropCoin(S.pend.shift(),0)}
      stepW();
      if(S.score>=LVDATA[S.lv-1].target&&!S.reached){
        S.reached=1;S.reachT=S.thrown;
        for(var i=0;i<40;i++)S.parts.push({x:20+Math.random()*350,y:-10,vx:(Math.random()-0.5)*2,vy:1+Math.random()*2,life:60+Math.random()*40,col:['#e8c96a','#c05a3a','#7ab8a0','#d8b45a'][i%4]});
        snd('coin_special');
      }
      updHUD();   /* 每帧刷新（G3 M-1：掉落计分/达标态不得陈旧——g128 教训复发防线） */
      var L=LVDATA[S.lv-1];
      /* 落定结算（G3 F-1/M-3）：须静默 600 帧（自末次投放/操作起）且坠槽空——防投尽当帧空中误判；
         投尽→胜负裁定；达标未投尽→闲置自动胜结算（600 帧=10s 续投刷分窗口，每次投币重置时钟） */
      if(S.winT===0&&S.loseT===0&&S.falling.length===0&&S.f-Math.max(S.lastDropF,S.lastActF)>=600){
        if(S.thrown>=L.N){if(S.score>=L.target){finishWin()}else{finishLose()}}
        else if(S.reached===1){finishWin()}
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}
/* ===== boot ===== */
function buildLvbar(){
  var bar=$('lvbar');bar.innerHTML='';
  for(var i=1;i<=24;i++){
    var d=document.createElement('div');d.className='lvcell'+(i<=S.unlocked?'':' lock')+(i===S.lv?' cur':'');d.textContent=i;
    d.onclick=(function(k){return function(){newGame(k)}})(i);
    bar.appendChild(d);
  }
}
function boot(){
  ['hInfo','hSub','sndbtn','pausebtn','menu','over','pause','trophy','lvbar','flash','oTitle','oStars','oSub','oNext'].forEach(function(id){els[id]=$(id)});
  cv=$('cv');ctx=cv.getContext('2d');
  loadSave();
  $('mGo').onclick=function(){ensureAC();newGame(S.unlocked>1?S.unlocked:1)};
  $('mLvs').onclick=function(){buildLvbar();$('menu').classList.add('hide');$('lvbar').classList.add('show')};
  $('mTrophy').onclick=function(){renderTrophy();$('trophy').classList.remove('hide');S.ph='trophy'};
  $('tHome').onclick=home;
  $('bAgain').onclick=function(){if(S.ph==='play'){newGame(S.lv)}};
  $('bHome').onclick=home;
  $('bHint').onclick=function(){ensureAC();doHint()};
  $('oAgain').onclick=function(){newGame(S.lv)};
  $('oNext').onclick=function(){if(S.lv<24)newGame(S.lv+1)};
  $('oHome').onclick=home;
  $('pausebtn').onclick=function(){if(S.ph==='play'){S.ph='pause';$('pause').classList.remove('hide')}};
  $('pRes').onclick=function(){if(S.ph==='pause'){S.ph='play';$('pause').classList.add('hide')}};
  $('pHome2').onclick=home;
  $('sndbtn').onclick=function(){S.snd=S.snd?0:1;els.sndbtn.textContent=S.snd?'♪':'✕';saveMain();ensureAC()};
  els.sndbtn.textContent=S.snd?'♪':'✕';
  cv.addEventListener('pointerdown',function(e){
    ensureAC();
    if(S.ph!=='play')return;
    var r=cv.getBoundingClientRect();
    tryThrow((e.clientX-r.left)*390/r.width);
  });
  window.addEventListener('keydown',function(e){
    var k=e.key;
    if(S.ph!=='play')return;
    if(k==='ArrowLeft'||k==='a'){if(S.aimX===undefined)S.aimX=160;S.aimX=Math.max(80,S.aimX-9);flashMsg('投点 '+S.aimX)}
    else if(k==='ArrowRight'||k==='d'){if(S.aimX===undefined)S.aimX=160;S.aimX=Math.min(252,S.aimX+9);flashMsg('投点 '+S.aimX)}
    else if(k===' '||k==='ArrowDown'||k==='s'){tryThrow(S.aimX===undefined?166:S.aimX)}
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&S.ph==='play'){S.ph='pause';$('pause').classList.remove('hide')}});
  requestAnimationFrame(loop);
}
function renderTrophy(){
  var pr=$('prow');pr.innerHTML='';
  for(var t=1;t<=5;t++){
    var d=document.createElement('div');d.className='pcell'+(S.collected[t]?' on':'');
    d.innerHTML='<div class="pc">'+(S.collected[t]?'○':'？')+'</div><div class="pn">'+PNAMES[t]+' '+VAL[t]+'文</div>';
    d.firstChild.style.color=PCOLS[t];
    pr.appendChild(d);
  }
}

boot();
</script>
