/* ============ 基础 ============ */
var M214 = 2147483647;
function LCG(x){this.x=(x%M214)||1;}
LCG.prototype.next=function(){this.x=this.x*48271%M214;return this.x;};
function U(r,m){r.next();return (r.x*m-r.x*m%M214)/M214;} /* 整数精确式（r.x*m<2^53 商≤m 恒整），与 py // 同构 */
var DIRS=['E','W','S','N'];
var DIRV={E:[1,0],W:[-1,0],S:[0,1],N:[0,-1]};
/* ============ 存档 ============ */
var KEY='g133_seal';
function loadSave(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return {best:{},unlocked:1,snd:1};
    var d=JSON.parse(raw);
    if(!d||typeof d!=='object'||typeof d.unlocked!=='number'||!isFinite(d.unlocked)||d.unlocked<1||d.unlocked>24||d.unlocked%1!==0)return {best:{},unlocked:1,snd:1};
    if(typeof d.best!=='object'||d.best===null)return {best:{},unlocked:1,snd:1};
    for(var k in d.best){var v=d.best[k];if(typeof v!=='number'||!isFinite(v)||v<1||v>3||v%1!==0)return {best:{},unlocked:1,snd:1};}
    return {best:d.best,unlocked:d.unlocked,snd:d.snd?1:0};
  }catch(e){return {best:{},unlocked:1,snd:1};}
}
function saveMain(){
  try{localStorage.setItem(KEY,JSON.stringify({best:S.best,unlocked:S.unlocked,snd:S.snd}));}catch(e){}
}
/* ============ 音效 ============ */
var AC=null;
function ensureAC(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){AC.resume();}
}
function tone(f,dur,dly,type){
  if(!S.snd||!AC)return;
  var t=AC.currentTime+(dly||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.12,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
var SND={roll:function(){tone(180,0.08,0,'triangle');},stamp:function(){tone(520,0.18,0);tone(780,0.22,0.04);},
  fall:function(){tone(220,0.3,0,'sawtooth');tone(140,0.4,0.12,'sawtooth');},switch:function(){tone(660,0.1,0,'square');tone(880,0.12,0.06,'square');},
  win:function(){[523,659,784,1046].forEach(function(f,i){tone(f,0.25,i*0.13);});},
  lose:function(){tone(330,0.3,0);tone(247,0.35,0.16);tone(165,0.5,0.34);}};
/* ============ 状态 ============ */
var S={ph:'boot',lv:1,cells:null,n:0,bstate:null,steps:0,hints:0,hist:[],fell:0,
  anim:null,winT:0,loseT:0,hintDir:null,hintT:0,dead:false,best:{},unlocked:1,snd:1,
  seed:0,r1:null,botMode:null,botPath:null,botBstate:null,tut:0,tutShown:0};
var els={};
function $(id){return document.getElementById(id);}
/* ============ 关卡 ============ */
function parseLv(d){
  var g=[];
  for(var y=0;y<d.H;y++){var row=[];for(var x=0;x<d.W;x++)row.push(+d.g[y*d.W+x]);g.push(row);}
  var br={};
  for(var k in d.br){var arr=[];for(var i=0;i<d.br[k].length;i+=2)arr.push([+d.br[k][i],+d.br[k][i+1]]);br[+k]=arr;}
  return {W:d.W,H:d.H,g:g,s:d.s,h:d.h,hd:d.hd,sf:d.sf,br:br,par:d.par,sol:d.sol};
}
function initBstate(L){
  var bs={};
  for(var gid in L.br){var c=L.br[gid][0];bs[gid]=L.g[c[1]][c[0]]===4?1:0;}
  return bs;
}
function ground(L,cells,bs,n){
  var softOn={};
  for(var i=0;i<L.sf.length;i++){var sb=L.sf[i];if(hasCell(cells,sb))softOn[sb[2]]=1;}
  for(var j=0;j<cells.length;j++){
    var x=cells[j][0],y=cells[j][1];
    if(x<0||x>=L.W||y<0||y>=L.H)return 'bad';
    var t=L.g[y][x];
    if(t===1)return 'bad';
    if(t===3||t===4){
      var gid=null;
      for(var g2 in L.br){if(hasCell(L.br[g2],cells[j])){gid=+g2;break;}}
      if(gid===null)return 'bad';
      var on=bs[gid]||0;
      if(softOn[gid])on=1;
      if(!on)return 'bad';
    }
  }
  if(cells.length===2){
    for(var j2=0;j2<2;j2++){var c2=cells[j2];if(L.g[c2[1]][c2[0]]===2)return 'fall';}
  }
  if(cells.length===1){
    var cc=cells[0];
    if(L.g[cc[1]][cc[0]]===5)return n===0?'hole_up':'hole_down';
  }
  return 'ok';
}
function hasCell(cells,c){
  for(var i=0;i<cells.length;i++){if(cells[i][0]===c[0]&&cells[i][1]===c[1])return true;}
  return false;
}
function toggleHard(L,cells,bs){
  for(var i=0;i<L.hd.length;i++){var hb=L.hd[i];if(hasCell(cells,hb)){bs[hb[2]]=1-(bs[hb[2]]||0);}}
}
/* ROLL 真表（cells 已是数组 [x,y] 或 [[x,y],[x,y]]） */
function rollJ(cells,n,d){
  var cs=cells.slice().sort(function(a,b){return a[1]===b[1]?a[0]-b[0]:a[1]-b[1];});
  if(cs.length===1){
    var x=cs[0][0],y=cs[0][1];
    if(d==='E')return {c:[[x+1,y],[x+2,y]],n:(n===0?2:3)};
    if(d==='W')return {c:[[x-2,y],[x-1,y]],n:(n===0?3:2)};
    if(d==='S')return {c:[[x,y+1],[x,y+2]],n:(n===0?4:5)};
    return {c:[[x,y-2],[x,y-1]],n:(n===0?5:4)};
  }
  var x1=cs[0][0],y1=cs[0][1],x2=cs[1][0],y2=cs[1][1];
  if(y1===y2){ /* HZ（枢轴侧端面滚后朝下，与 VT 一致；G3 审查 M1 修正） */
    if(d==='E')return {c:[[x2+1,y1]],n:(n===2?1:0)};
    if(d==='W')return {c:[[x1-1,y1]],n:(n===2?0:1)};
    var dy=(d==='S')?1:-1;
    return {c:[[x1,y1+dy],[x2,y2+dy]],n:n};
  }else{ /* VT */
    if(d==='S')return {c:[[x1,y2+1]],n:(n===4?1:0)};
    if(d==='N')return {c:[[x1,y1-1]],n:(n===4?0:1)};
    var dx=(d==='E')?1:-1;
    return {c:[[x1+dx,y1],[x2+dx,y2]],n:n};
  }
}
/* ============ 游戏流 ============ */
function curLv(){return parseLv(LVDATA[S.lv-1]);}
function loadLv(lv){
  S.lv=lv;var L=curLv();
  S.cells=[[L.s[0],L.s[1]]];S.n=0;
  S.bstate=initBstate(L);
  S.steps=0;S.hints=0;S.hist=[];S.fell=0;S.dead=false;
  S.anim=null;S.winT=0;S.loseT=0;S.hintDir=null;S.hintT=0;S.overShown=false;
  updHUD();
}
function newGame(lv){
  loadLv(lv||1);
  S.ph='play';
  els.menu.classList.add('hide');
  els.over.classList.add('hide');
  els.lvbar.classList.remove('show');
  updHUD();
  maybeTut();
}
function updHUD(){
  if(S.ph!=='play'&&S.ph!=='over'){els.hInfo.textContent='—— 待 拓 ——';els.hSub.textContent='';els.hHint.textContent='';return;}
  var L=curLv();
  els.hInfo.textContent='第 '+S.lv+' 碑 · '+S.steps+'/'+L.par+' 步';
  els.hSub.textContent='印面'+(['上','下','东','西','南','北'][S.n]);
  els.hHint.textContent=S.hints?('✦'+S.hints):'';
}
function tryMove(d){
  if(S.ph!=='play'||S.winT>0||S.loseT>0)return false;
  if(S.anim){S.anim=null;} /* 快速连滑：旧动画视为完成（逻辑本已原子，动画纯视觉） */
  var L=curLv();
  var r=rollJ(S.cells,S.n,d);
  if(!r)return false;
  var nbs=cloneBs(S.bstate);
  var gd=ground(L,r.c,nbs,r.n);
  if(gd==='bad'||gd==='hole_down'){
    if(gd==='bad')flash('此向滚不过去 · 撞石/出界/断笺');
    if(gd==='hole_down'){flash('印背朝上 · 卡穴退回');tone(160,0.12,0,'triangle');}
    return false;
  }
  if(gd==='fall'){
    S.fell++;
    S.dead=true;
    S.anim={from:S.cells,to:r.c,n:S.n,nn:r.n,t:0,fell:true};
    SND.fall();
    S.loseT=0.001; /* 演出起步（draw 中计时，归 1.2 后 over） */
    return true;
  }
  S.hist.push({cells:S.cells,n:S.n,bs:cloneBs(S.bstate)});
  toggleHard(L,r.c,nbs);
  S.cells=r.c;S.n=r.n;S.bstate=nbs;
  S.steps++;
  var bridged=false;
  for(var gid in L.br){if((nbs[gid]||0)!==(S.hist[S.hist.length-1].bs[gid]||0)){bridged=true;}}
  if(bridged)SND.switch();
  S.anim={from:S.hist[S.hist.length-1].cells,to:r.c,n:S.hist[S.hist.length-1].n,nn:r.n,t:0};
  SND.roll();
  if(gd==='hole_up'){
    S.winT=0.001;
    SND.stamp();

/* BFS（援手+bot 共用；返回首向） */
function solveFrom(cells,n,bs){
  var L=curLv();
  var key0=stKey(cells,n,bs);
  var q=[[cells,n,cloneBs(bs),null]];
  var seen={};seen[key0]=1;
  var head=0;
  while(head<q.length){
    var it=q[head++];
    if(it[0].length===1&&it[0][0][0]===L.h[0]&&it[0][0][1]===L.h[1]&&it[1]===0){
      var p=it[3];
      return p?p[0]:null;
    }
    for(var di=0;di<4;di++){
      var d=DIRS[di];
      var r=rollJ(it[0],it[1],d);
      if(!r)continue;
      var nbs=cloneBs(it[2]);
      var gd=ground(L,r.c,nbs,r.n);
      if(gd==='bad'||gd==='fall'||gd==='hole_down')continue;
      if(gd==='hole_up'){
        var path=(it[3]||[]).concat([d]);
        return path[0];
      }
      toggleHard(L,r.c,nbs);
      var k2=stKey(r.c,r.n,nbs);
      if(seen[k2])continue;
      seen[k2]=1;
      q.push([r.c,r.n,nbs,(it[3]||[]).concat([d])]);
    }
  }
  return null;
}
function stKey(cells,n,bs){
  var cs=cells.slice().sort(function(a,b){return a[1]===b[1]?a[0]-b[0]:a[1]-b[1];});
  var s=cs.map(function(c){return c[0]+','+c[1];}).join('|')+'#'+n+'#';
  var ks=Object.keys(bs).sort();
  for(var i=0;i<ks.length;i++)s+=ks[i]+':'+bs[ks[i]];
  return s;
}

  ctx.fillStyle='#a04a3a';ctx.font='12px sans-serif';ctx.fillText('穴',177,gy+14);
  /* 开始按钮（视觉锚，任意点/任意键均可关） */
  var by=T.Y0+368;
  rr(195-T.BTN.w/2,by,T.BTN.w,T.BTN.h,T.BTN.r);
  ctx.fillStyle=T.BTN.bg;ctx.fill();ctx.strokeStyle=T.BTN.bd;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=T.BTN.fg;ctx.font='16px sans-serif';ctx.fillText('开 始 拓 印',195,by+T.BTN.h/2+1);
  ctx.fillStyle=T.HINT;ctx.font='12px sans-serif';
  ctx.fillText('触屏任意处 / 任意键 即可开始',195,by+T.BTN.h+26);
}
/* ============ 菜单 ============ */
function buildLvbar(){
  var g=$('lvgrid');g.innerHTML='';
  $('lvbar').querySelector('.lt').textContent='选 碑 · 已拓 '+countBest()+' 碑';
  for(var i=1;i<=24;i++){
    var c=document.createElement('div');
    c.className='lvcell'+(i>S.unlocked?' lock':'');
    c.innerHTML=i+'<span class="st">'+(S.best[i]?'★'.repeat(S.best[i]):'')+'</span>';
    (function(lv,cell){cell.addEventListener('click',function(){
      $('lvbar').classList.remove('show');
      els.menu.classList.add('hide');
      newGame(lv);
    });})(i,c);
    g.appendChild(c);
  }
}
function countBest(){var n=0;for(var k in S.best)n++;return n;}
function bindMenu(){
  els.mGo.addEventListener('click',function(){ensureAC();newGame(S.unlocked>24?24:S.unlocked);});
  els.mLvs.addEventListener('click',function(){
    buildLvbar();
    var open=els.lvbar.classList.toggle('show');
    els.menu.classList.toggle('hide',open);
  });
  els.lvbar.addEventListener('click',function(e){
    if(e.target===els.lvbar){els.lvbar.classList.remove('show');els.menu.classList.remove('hide');}
  });
  els.mBest.addEventListener('click',function(){
    var tot=0,st=0;
    for(var k in S.best){st+=S.best[k];tot++;}
    flash(tot?('已拓 '+tot+' 碑 · ★'+st):'尚无战绩');
  });
  els.oAgain.addEventListener('click',function(){S.overShown=false;newGame(S.lv);});
  els.oNext.addEventListener('click',function(){S.overShown=false;newGame(Math.min(24,S.lv+1));});
  function home(){S.overShown=false;S.ph='menu';S.winT=0;S.loseT=0;
    els.over.classList.add('hide');els.pause.classList.add('hide');els.menu.classList.remove('hide');els.lvbar.classList.remove('show');updHUD();}
  els.pHome.addEventListener('click',home);
  els.pHome2.addEventListener('click',home);
}
/* ============ boot ============ */
function boot(){
  ['hInfo','hSub','hHint','menu','over','pause','mGo','mLvs','mBest','oAgain','oNext','oTitle','oStars','oSub','pHome','pHome2','lvbar'].forEach(function(id){els[id]=$(id);});
  cv=$('cv');ctx=cv.getContext('2d');
  var sv=loadSave();
  S.best=sv.best;S.unlocked=sv.unlocked;S.snd=sv.snd;
  $('sndbtn').textContent=S.snd?'♪':'✕';
  loadLv(1);
  S.ph='menu';
  bindInput();bindMenu();
  document.addEventListener('pointerdown',ensureAC,{once:false});
  requestAnimationFrame(loop);
}
boot();

</script>
<script src="../shell.js" defer></script>
