<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>叠匣</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#141210;overflow:hidden;font-family:"Songti SC","STSong","SimSun",serif;user-select:none;-webkit-user-select:none}
#app{position:relative;width:390px;height:844px;margin:0 auto;background:linear-gradient(180deg,#26211b 0%,#2d2620 64px,#1b1713 64px)}
#hud{position:absolute;top:0;left:0;width:100%;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#e5d8b4;z-index:5;box-sizing:border-box}
#hInfo{font-size:15px;letter-spacing:1px}
#hSub{font-size:11px;color:#a9986f}
#cv{position:absolute;top:64px;left:0}
.btnrow{position:absolute;bottom:0;left:0;width:100%;height:64px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}
.hbtn{min-width:72px;padding:8px 12px;border:1px solid #6b5a44;border-radius:8px;background:#382f24;color:#d6c294;font-size:14px;text-align:center;cursor:pointer}
.hbtn:active{background:#4a3d2c}
.hbtn.dis{opacity:.4}
.lay{position:absolute;inset:0;background:rgba(16,13,10,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.mtitle{font-size:34px;color:#e5d8b4;letter-spacing:14px;margin:6px 0 2px;text-indent:14px}
.msub{font-size:12px;color:#a9986f;letter-spacing:3px;margin-bottom:28px}
.mbtn{min-width:200px;padding:11px 0;margin:7px;border:1px solid #8a795a;border-radius:10px;background:#332b21;color:#d6c294;font-size:16px;text-align:center;cursor:pointer;letter-spacing:6px;text-indent:6px}
.mbtn:active{background:#463a2b}
.mbtn.hide{display:none}
.mnote{font-size:10px;color:#6f6349;margin-top:16px;letter-spacing:1px}
.otitle{font-size:26px;color:#e8c96a;margin-bottom:8px;letter-spacing:8px;text-indent:8px}
.ostat{font-size:14px;color:#d6c294;margin:4px;letter-spacing:2px}
.stars{font-size:26px;color:#ffd97a;letter-spacing:6px;margin:8px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,86px);gap:8px;margin:14px 0}
.pcell{width:86px;height:64px;border:1px solid #6b5a44;border-radius:8px;background:#241e16;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8a795a;font-size:12px}
.pcell.lit{color:#e8c96a;border-color:#a8823e;background:#2d2519}
.lvwrap{width:330px;max-height:430px;overflow-y:auto}
.lvrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lvcell{width:58px;height:46px;border:1px solid #6b5a44;border-radius:8px;background:#332b21;color:#d6c294;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lvcell.lock{opacity:.35}
.hide{display:none!important}
</style>
</head>

var offX=8;

function cardXY(c){return [offX+c.cc*CX,offY+c.cr*CY-c.l*CL]}
function calcOffY(){
  var m=0,mnc=1e9,mxc=-1e9;
  for(var i=0;i<cards.length;i++){
    m=Math.min(m,cards[i].cr*CY-cards[i].l*CL);
    mnc=Math.min(mnc,cards[i].cc);mxc=Math.max(mxc,cards[i].cc);
  }
  offY=70-m;   /* 顶牌不越 HUD */
  /* x 居中校准：菱形 R5 宽 11 列超 390（2026-09-20 C1 抓获）——列距 34px 后 376<390，窄盘同享居中 */
  offX=Math.max(8,Math.floor((390-((mxc-mnc)*CX+CW))/2)-mnc*CX);
}

/* ============ 内核（与 sim138.py 逐行同构） ============ */
function buildOcc(){
  occ={};
  for(var i=0;i<cards.length;i++)occ[cards[i].l+':'+cards[i].cr+':'+cards[i].cc]=i;
}
function freeOf(i){
  /* 左或右无同层贴邻（OR 语义）且 l+1 无压（cc±1 且 cr±1——编码半格邻域） */
  var me=cards[i];
  if(!me.face)return false;
  var j=occ[me.l+':'+me.cr+':'+(me.cc-2)];
  var lft=j!==undefined&&cards[j].face;
  j=occ[me.l+':'+me.cr+':'+(me.cc+2)];
  var rgt=j!==undefined&&cards[j].face;
  if(lft&&rgt)return false;
  for(var dr=-1;dr<=1;dr+=2)for(var dc=-1;dc<=1;dc+=2){
    j=occ[(me.l+1)+':'+(me.cr+dr)+':'+(me.cc+dc)];
    if(j!==undefined&&cards[j].face)return false;
  }
  return true;
}
function freeSet(){
  var o=[];
  for(var i=0;i<cards.length;i++)if(freeOf(i))o.push(i);
  return o;
}
function stuck(){
  var seenK={};
  var fs=freeSet();
  for(var i=0;i<fs.length;i++){
    var k=cards[fs[i]].kind;
    if(seenK[k]!==undefined)return false;
    seenK[k]=1;
  }
  return true;
}
function snapAll(){
  /* resh 不入快照：undo 可回退局面（faces/kinds）但不返还重排消耗——
     防「洗→看→undo→再洗」刷穿 3 次限额与星级（M3） */
  return {score:S.score,moves:S.moves,combo:S.combo,
          faces:cards.map(function(c){return c.face}),
          kinds:cards.map(function(c){return c.kind})};
}
function restoreAll(sn){
  S.score=sn.score;S.moves=sn.moves;S.combo=sn.combo;
  for(var i=0;i<cards.length;i++){cards[i].face=sn.faces[i];cards[i].kind=sn.kinds[i]}
}
function pick(i,j,live){
  if(i===j)return false;
  var a=cards[i],b=cards[j];
  if(!a.face||!b.face||a.kind!==b.kind)return false;
  if(!freeOf(i)||!freeOf(j))return false;
  S.undoStack.push(snapAll());
  if(S.undoStack.length>400)S.undoStack.shift();
  a.face=0;b.face=0;
  if(live){
    /* 1.2s 连击窗自判（先窗后增——pick 自包含，不依赖 loop 清零时序） */
    if(Date.now()-S.lastT>1200)S.combo=0;
    S.combo++;S.score+=10+2*Math.min(S.combo,5);S.lastT=Date.now();
  }else S.score+=10;
  S.moves++;
  return true;
}
function allClear(){
  for(var i=0;i<cards.length;i++)if(cards[i].face)return false;
  return true;
}
function doUndo(){
  if(!S.undoStack.length)return false;
  restoreAll(S.undoStack.pop());
  return true;
}
function reshuffle(rnd){
  S.undoStack.push(snapAll());
  if(S.undoStack.length>400)S.undoStack.shift();
  var live=[];
  for(var i=0;i<cards.length;i++)if(cards[i].face)live.push(i);
  var ks=live.map(function(i){return cards[i].kind});
  for(var i=ks.length-1;i>0;i--){
    var j=rnd.u(i+1);
    var t=ks[i];ks[i]=ks[j];ks[j]=t;
  }
  for(var k=0;k<live.length;k++)cards[live[k]].kind=ks[k];
  S.resh++;
  return true;
}

var AC=null;
function ensureAC(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

}
function tone(f,d){
  if(!S.snd)return;
  ensureAC();
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(.09,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);
  o.start();o.stop(AC.currentTime+d);
}

  rr(x+2,y+2,CW-4,CH-4,2);ctx.stroke();
  /* 花色 */
  var n=(k%9)+1;
  if(k<9)drawDots(x,y,n,kindColor(k));
  else if(k<18)drawSticks(x,y,n,kindColor(k));
  else drawWan(x,y,n,kindColor(k));
  if(sel){
    ctx.strokeStyle='rgba(255,196,90,.95)';ctx.lineWidth=2;
    rr(x-1,y-3,CW+2,CH+2,4);ctx.stroke();
  }
}
function drawBack(x,y,dep){
  /* 层影（dep=层深 0 起，越深影越重——立体感） */
  ctx.fillStyle='rgba(0,0,0,'+(0.13+dep*0.06)+')';
  rr(x+2,y+3,CW,CH,3);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,390,780);
  /* 底纹：妆台木纹 */
  ctx.fillStyle='#1e1913';ctx.fillRect(0,0,390,780);
  ctx.strokeStyle='rgba(255,255,240,.03)';ctx.lineWidth=1;
  for(var gy=90;gy<780;gy+=46){
    ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(390,gy);ctx.stroke();
  }
  if(S.ph!=='play'&&S.ph!=='pause')return;
  /* 绘制序：层升序→层内 cr 升序→cc 升序（hitTest 逆序同源） */
  var order=cards.map(function(c,i){return i});
  order.sort(function(a,b){
    if(cards[a].l!==cards[b].l)return cards[a].l-cards[b].l;
    if(cards[a].cr!==cards[b].cr)return cards[a].cr-cards[b].cr;
    return cards[a].cc-cards[b].cc;
  });
  for(var oi=0;oi<order.length;oi++){
    var i=order[oi],c=cards[i];
    if(!c.face)continue;
    var p=cardXY(c);
    drawBack(p[0],p[1],c.l);
    var isFree=freeOf(i);
    drawFace(p[0],p[1],c.kind,S.from===i);
    if(!isFree){
      ctx.fillStyle='rgba(20,15,8,.17)';
      rr(p[0],p[1],CW,CH,3);ctx.fill();
    }
    if(S.from===i){
      ctx.fillStyle='rgba(255,196,90,.08)';
      rr(p[0],p[1],CW,CH,3);ctx.fill();
    }
  }
  /* 提示对：绿框双闪（被收走的牌不再画框——hint 余晖不落空位） */
  if(S.hintT>0&&S.hintPair){
    var hp=S.hintPair;
    ctx.strokeStyle='rgba(120,220,140,'+(S.hintT%30<15?'.95':'.4')+')';
    ctx.lineWidth=2;
    for(var hi=0;hi<2;hi++){
      if(!cards[hp[hi]].face)continue;
      var pp=cardXY(cards[hp[hi]]);
      rr(pp[0]-2,pp[1]-2,CW+4,CH+4,4);ctx.stroke();
    }
  }
  if(S.flashT>0)drawFlash();
}
function flashMsg(t){S.flashTxt=t;S.flashT=90}
function drawFlash(){
  ctx.fillStyle='rgba(20,14,8,.82)';
  rr(45,356,300,40,8);ctx.fill();
  ctx.fillStyle='#e8c96a';
  ctx.font='13px "Songti SC","SimSun",serif';
  ctx.textAlign='center';
  ctx.fillText(S.flashTxt,195,381);
  ctx.textAlign='left';
}

/* ============ HUD ============ */
function updHUD(){
  var left=0;
  for(var i=0;i<cards.length;i++)if(cards[i].face)left++;
  document.getElementById('hInfo').textContent='第 '+S.lv+' 局 · '+S.score+' 分';
  document.getElementById('hSub').textContent='余 '+(left/2)+' 对 · 重排 '+S.resh+'/3 · 连 '+S.combo;
  document.getElementById('bResh').classList.toggle('dis',S.resh>=3);
  document.getElementById('bHint').classList.toggle('dis',S.hintN<=0);
  document.getElementById('bUndo').classList.toggle('dis',!S.undoStack.length);
}

/* ============ 交互 ============ */
function hitTest(px,py){
  /* 逆绘制序=视觉顶牌优先 */
  var order=cards.map(function(c,i){return i});
  order.sort(function(a,b){
    if(cards[a].l!==cards[b].l)return cards[a].l-cards[b].l;
    if(cards[a].cr!==cards[b].cr)return cards[a].cr-cards[b].cr;
    return cards[a].cc-cards[b].cc;
  });
  for(var oi=order.length-1;oi>=0;oi--){
    var i=order[oi],c=cards[i];
    if(!c.face)continue;
    var p=cardXY(c);
    if(px>=p[0]&&px<p[0]+CW&&py>=p[1]&&py<p[1]+CH)return i;
  }
  return -1;
}
function onTap(px,py){
  if(S.ph!=='play')return;
  var i=hitTest(px,py);
  if(i<0)return;
  var c=cards[i];
  if(!freeOf(i)){
    flashMsg('此匣被压着 · 摆不动');
    tone(200,.05);
    S.from=-1;
    return;
  }
  if(S.from===i){S.from=-1;tone(340,.04);return}   /* 再点同张=取消 */
  if(S.from>=0&&cards[S.from].kind===c.kind){
    var j=S.from;S.from=-1;
    if(pick(j,i,true)){
      seen[cards[j].kind]=1;   /* 图匣点亮（玩家路径——bot 不走此处） */
      saveMain();              /* 即时落盘：中途关浏览器不丢图匣进度 */
      tone(620,.07);tone(880,.05);
      updHUD();checkWin();checkStuck();   /* win 先于 stuck：空盘=赢非卡壳 */
    }
    return;
  }
  S.from=i;tone(480,.05);
  flashMsg(cards[S.from].kind<9?'筒 · '+NUMC[cards[S.from].kind%9]:(cards[S.from].kind<18?'索 · '+NUMC[(cards[S.from].kind-9)%9]:'万 · '+NUMC[(cards[S.from].kind-18)%9]));
}
cv=document.getElementById('cv');
ctx=cv.getContext('2d');
cv.addEventListener('pointerdown',function(e){
  var r=cv.getBoundingClientRect();
  onTap(e.clientX-r.left,e.clientY-r.top);
});

/* ============ 局流程 ============ */
function newGame(lv){
  var L=LVDATA[lv-1];
  if(!L)return;
  S.lv=lv;S.moves=0;S.score=0;S.combo=0;S.resh=0;S.hintN=3;S.from=-1;S.over=0;
  S.undoStack=[];S.hintT=0;S.hintPair=null;
  cards=[];
  for(var i=0;i<L.cards.length;i++){
    cards.push({cc:L.cards[i][0],cr:L.cards[i][1],l:L.cards[i][2],
                kind:L.kinds[i],face:1});
  }
  buildOcc();calcOffY();
  GRS=new LCG((Date.now()%M214)||1);
  S.ph='play';
  document.getElementById('menu').classList.add('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('stucklay').classList.add('hide');
  document.getElementById('pause').classList.add('hide');
  document.getElementById('lvbar').classList.add('hide');
  updHUD();draw();
}
function starsOf(){return S.resh===0?3:(S.resh===1?2:1)}
function checkWin(){
  if(!allClear())return;
  S.over=1;S.ph='over';
  var st=starsOf();
  if(S.lv+1>unlocked&&S.lv<24)unlocked=S.lv+1;
  var pb=best[S.lv];
  if(!pb||S.score>pb[0]||(S.score===pb[0]&&S.resh<pb[1]))best[S.lv]=[S.score,S.resh];
  saveMain();
  document.getElementById('oStars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  document.getElementById('oScore').textContent='收 '+S.moves+' 对 · '+S.score+' 分 · 重排 '+S.resh+' 次';
  var b=best[S.lv];
  document.getElementById('oBest').textContent='此局最好：'+b[0]+' 分 · 重排 '+b[1];
  document.getElementById('bNext').classList.toggle('hide',S.lv>=24);
  document.getElementById('over').classList.remove('hide');
  tone(523,.1);setTimeout(function(){tone(659,.1)},120);setTimeout(function(){tone(784,.16)},240);
}
function checkStuck(){
  if(S.over)return;
  if(allClear())return;   /* 空盘=赢非卡壳（checkWin 已先行——双保险） */
  if(!stuck())return;
  if(S.resh<3){
    document.getElementById('sInfo').textContent='无对可收 · 还可重排 '+(3-S.resh)+' 次';
    document.getElementById('bSResh').classList.remove('hide');
    S.ph='stuck';saveMain();
    document.getElementById('stucklay').classList.remove('hide');
  }else{
    document.getElementById('sInfo').textContent='重排已用尽 · 此局僵了';
    document.getElementById('bSResh').classList.add('hide');
    S.ph='stuck';
    document.getElementById('stucklay').classList.remove('hide');
  }
}
function doReshuffle(){
  if(S.resh>=3)return;
  /* 洗至有对（SPEC §1.5）：洗后仍无同款 free 对则重摇，≤20 摇兜底。
     内核 reshuffle=单洗+计数+入栈（对拍域原语）——重摇的中间洗不计次不入栈
     （resh--/栈截回补偿），玩家一次重排=一次消耗+一个快照 */
  var depth=S.undoStack.length;
  reshuffle(GRS);
  var g=0;
  while(stuck()&&g<20){
    reshuffle(GRS);
    S.resh--;S.undoStack.length=depth;g++;
  }
  S.from=-1;S.hintT=0;   /* 重排即作废照牌余晖（kind 已洗变） */
  tone(320,.12);
  document.getElementById('stucklay').classList.add('hide');
  S.ph='play';
  updHUD();draw();
  checkStuck();   /* 20 摇兜底仍无对（极小概率）→如实走僵局 */
}
function doHint(){
  if(S.hintN<=0)return;
  var fs=freeSet(),byk={};
  for(var i=0;i<fs.length;i++){
    var k=cards[fs[i]].kind;
    if(byk[k]!==undefined){
      S.hintPair=[byk[k],fs[i]];S.hintT=60;S.hintN--;
      tone(700,.06);updHUD();
      return;
    }
    byk[k]=fs[i];
  }
  flashMsg('眼下无对 · 考虑重排');
}
function home(){
  S.ph='menu';saveMain();
  document.getElementById('menu').classList.remove('hide');
  document.getElementById('over').classList.add('hide');
  document.getElementById('stucklay').classList.add('hide');
  document.getElementById('pause').classList.add('hide');
  document.getElementById('trophy').classList.add('hide');
  document.getElementById('lvbar').classList.add('hide');
}

/* ============ 面板接线 ============ */

};

document.getElementById('bUndo').onclick=function(){if(doUndo()){S.from=-1;tone(300,.05);updHUD();draw()}};
document.getElementById('bResh').onclick=function(){
  if(S.resh>=3){flashMsg('重排已用尽');return}
  if(stuck()){doReshuffle();return}
  doReshuffle();   /* 未卡也可主动重排（战略用） */
};
document.getElementById('bHint').onclick=function(){doHint()};
document.getElementById('pausebtn').onclick=function(){
  if(S.ph!=='play')return;
  S.ph='pause';
  document.getElementById('pause').classList.remove('hide');
};
document.getElementById('pRes').onclick=function(){
  S.ph='play';
  document.getElementById('pause').classList.add('hide');
};
document.getElementById('pRestart').onclick=function(){newGame(S.lv);flashMsg('重开此局 · 同局再来')};
document.getElementById('pSnd').onclick=function(){S.snd=S.snd?0:1;this.textContent=S.snd?'音 效':'静 音';saveMain()};
document.getElementById('pHome').onclick=home;
document.getElementById('bNext').onclick=function(){newGame(Math.min(S.lv+1,24))};
document.getElementById('bAgain').onclick=function(){newGame(S.lv)};
document.getElementById('bHome').onclick=home;
document.getElementById('bSResh').onclick=function(){doReshuffle()};
document.getElementById('bSRe').onclick=function(){newGame(S.lv)};
document.getElementById('bSHome').onclick=home;

/* ============ 主循环 ============ */
function loop(){
  if(S.flashT>0)S.flashT--;
  if(S.hintT>0)S.hintT--;
  if(S.combo>0&&Date.now()-S.lastT>1200)S.combo=0;
  if(S.ph==='play'||S.ph==='stuck'||S.ph==='pause')draw();
  requestAnimationFrame(loop);
}
