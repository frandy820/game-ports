<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1322">
<title>市集连连看 · 口袋游戏机</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;position:fixed}
body{
  background:radial-gradient(1100px 640px at 70% -8%,#1a2444 0%,#0d1322 55%),#0d1322;
  color:#e8ecf8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#app{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-24}}
/* ---------- 菜单 ---------- */
#menu{display:none;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(130% 55% at 50% -4%,#1a2444 0%,rgba(26,36,68,0) 60%),
    radial-gradient(120% 34% at 50% 106%,rgba(232,180,90,.32) 0%,rgba(232,180,90,0) 72%)}
#menu::after{content:'';position:absolute;left:10%;right:10%;bottom:calc(var(--sab) + 42px);height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,217,126,.75),transparent);box-shadow:0 0 22px 4px rgba(232,180,90,.28)}
#menu.on{display:flex}
.m-kicker{font-size:11.5px;letter-spacing:.42em;color:#8d99b8;margin-bottom:14px;padding-left:.42em}
.m-title{font-size:44px;font-weight:800;letter-spacing:.06em;
  background:linear-gradient(105deg,#fff 18%,#ffd9a0 52%,#a8d4ff 88%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 12px rgba(168,212,255,.18))}
.m-sub{margin-top:12px;color:#8d99b8;font-size:13.5px;letter-spacing:.18em;padding-left:.18em}
#m-art{width:210px;height:140px;margin:22px 0 4px}
.lv-row{display:flex;gap:10px;margin-top:22px}
.lv-btn{position:relative;border:none;cursor:pointer;font-family:inherit;color:#c9d4ee;
  width:92px;padding:13px 0 11px;border-radius:14px;font-size:15px;font-weight:700;letter-spacing:.1em;
  background:linear-gradient(168deg,rgba(126,200,255,.09),rgba(126,200,255,.03));
  box-shadow:inset 0 0 0 1.6px rgba(140,180,240,.4)}
.lv-btn small{display:block;font-size:10px;font-weight:400;letter-spacing:.06em;color:#8d99b8;margin-top:3px}
.lv-btn:active{transform:scale(.96)}
.lv-btn.locked{filter:grayscale(.8) brightness(.6);cursor:default}
.lv-btn .star{position:absolute;top:-7px;right:-5px;font-size:17px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
#m-rec{margin-top:20px;color:#8d99b8;font-size:12.5px;letter-spacing:.1em}
#m-rec b{color:#ffd9a0;font-weight:700}
.m-foot{position:absolute;bottom:calc(var(--sab) + 16px);left:0;right:0;text-align:center;color:#aab6d8;font-size:11px;letter-spacing:.14em}
/* ---------- 对局 ---------- */
#game{padding-top:calc(var(--sat) + 4px)}
#hud{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:4px 14px}
.hud-title{font-size:18px;font-weight:800;letter-spacing:.08em;line-height:1.15}
.hud-title .hud-k{display:block;font-size:8.5px;letter-spacing:.34em;color:#8d99b8;font-weight:600}
.hud-score{flex:1;text-align:right;font-size:11.5px;color:#8d99b8;line-height:1.25}
.hud-score b{display:block;font-size:18px;color:#f2f6ff;font-weight:800;font-variant-numeric:tabular-nums}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1.4px solid rgba(140,180,240,.35);
  background:rgba(13,19,34,.72);color:#c9d4ee;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:active{transform:scale(.94)}
.icon-btn.off{color:#4a5470}
#time-wrap{margin:6px 14px 0;height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
#time-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#ffe9b0,#e8b45a);transition:width .25s linear}
#time-bar.low{background:linear-gradient(90deg,#ff8a76,#ffb26b)}
#time-txt{position:absolute;right:6px;top:-1px;font-size:8.5px;color:rgba(255,255,255,.55);letter-spacing:.08em}
#board-wrap{position:relative;margin:10px 14px 0}
#board{display:grid;gap:4px}
.tile{position:relative;aspect-ratio:3/4;border-radius:9px;cursor:pointer;
  background:linear-gradient(168deg,#f4ecd8 0%,#e8d9bc 60%,#dcc9a4 100%);
  box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease,opacity .18s ease}
.tile svg{width:78%;height:78%;pointer-events:none}
.tile:active{transform:scale(.93)}
.tile.sel{transform:translateY(-3px) scale(1.05);
  box-shadow:0 0 0 2.4px #ffd97e,0 6px 16px rgba(255,217,126,.35),inset 0 1px 0 rgba(255,255,255,.7);
  animation:selpulse 1.1s ease-in-out infinite}
@keyframes selpulse{0%,100%{box-shadow:0 0 0 2.4px #ffd97e,0 6px 16px rgba(255,217,126,.3),inset 0 1px 0 rgba(255,255,255,.7)}
  50%{box-shadow:0 0 0 2.4px #f2e2b0,0 6px 22px rgba(255,217,126,.55),inset 0 1px 0 rgba(255,255,255,.7)}}
.tile.hint{box-shadow:0 0 0 2.6px #7ec8ff,0 0 14px rgba(126,200,255,.55);animation:hintblink .9s ease-in-out 4}
@keyframes hintblink{0%,100%{box-shadow:0 0 0 2.6px #7ec8ff,0 0 10px rgba(126,200,255,.4)}50%{box-shadow:0 0 0 3.2px #a8d8ff,0 0 20px rgba(126,200,255,.85)}}
.tile.out{animation:tout .3s ease forwards}
@keyframes tout{to{transform:scale(.35) rotate(8deg);opacity:0}}
#lines{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:visible}
#lines path{fill:none;stroke:#ffd97e;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 5px rgba(255,217,126,.75));stroke-dasharray:600;stroke-dashoffset:600;
  animation:ldraw .32s ease-out forwards}
@keyframes ldraw{to{stroke-dashoffset:0}}
#dock{display:flex;gap:10px;margin:12px 14px calc(var(--sab) + 10px)}
.dock-btn{flex:1;position:relative;border:none;cursor:pointer;font-family:inherit;color:#c9d4ee;
  padding:12px 0 11px;border-radius:13px;font-size:14px;font-weight:700;letter-spacing:.2em;
  background:linear-gradient(168deg,rgba(126,200,255,.1),rgba(126,200,255,.03));
  box-shadow:inset 0 0 0 1.6px rgba(140,180,240,.4)}
.dock-btn:active{transform:scale(.97)}
.dock-btn:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
.dock-btn .cnt{position:absolute;top:-8px;right:-4px;min-width:21px;height:21px;border-radius:99px;
  background:linear-gradient(168deg,#ffd97e,#ffb347);color:#1c1812;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#msg{height:20px;margin:6px 14px 0;text-align:center;font-size:12.5px;letter-spacing:.12em;color:#8d99b8;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg.win{color:#ffd97e}
/* ---------- 弹层 ---------- */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:rgba(5,8,16,.62);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center}
.ov.on{display:flex}
.panel{position:relative;width:80%;max-width:320px;border-radius:18px;padding:24px 20px 20px;text-align:center;
  background:linear-gradient(172deg,#1a2444,#121a30);border:1.4px solid rgba(140,180,240,.4);
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.panel h3{font-size:19px;letter-spacing:.22em;color:#f2f6ff;margin-bottom:8px}
.panel.celebrate{border-color:rgba(255,217,126,.6);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 34px rgba(255,217,126,.16)}
.panel.celebrate h3::before{content:'\2726 \2727 \2726';display:block;font-size:14px;letter-spacing:.5em;color:#ffd97e;margin-bottom:7px;text-shadow:0 0 12px rgba(255,217,126,.6)}
.ov.on .panel{animation:popin .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.panel .psub{color:#8d99b8;font-size:12.5px;line-height:1.7;margin-bottom:14px}
.panel .psub b{color:#ffd97e}
.pbtn{display:block;width:100%;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;
  letter-spacing:.28em;padding:13px 0 13px .28em;color:#10182c;border-radius:13px;margin-top:10px;
  background:linear-gradient(168deg,#f2e2b0 0%,#d8b878 60%,#c8a45a 100%);
  box-shadow:0 6px 20px rgba(255,217,126,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.pbtn:active{transform:translateY(2px)}
.pbtn.ghost{background:linear-gradient(168deg,rgba(126,200,255,.1),rgba(126,200,255,.03));color:#c9d4ee;
  box-shadow:inset 0 0 0 1.6px rgba(140,180,240,.4);font-size:13.5px;letter-spacing:.18em;font-weight:600}
@media (max-height:700px){
  .m-title{font-size:36px}
  #m-art{width:160px;height:106px;margin:16px 0 2px}
  .tile{border-radius:7px}
  #dock{margin-top:9px}
}
</style>
</head>

<script>
"use strict";
/* ================= 市集连连看 · 夜市摊牌对对碰 ================= */
var LVS=[
  {rows:4,cols:8,time:180,name:'一'},
  {rows:6,cols:8,time:240,name:'二'},
  {rows:6,cols:10,time:300,name:'三'}
];
var NSYM=10;
var COMBO_WIN=3000, MULTS=[1,1.2,1.5,2,2,2,2,2];
var store={ok:true,m:{}};
function sGet(k){try{return localStorage.getItem(k)}catch(e){store.ok=false;return store.m[k]||null}}
function sSet(k,v){try{localStorage.setItem(k,v)}catch(e){store.ok=false;store.m[k]=v}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var S={
  lv:1,best:0,maxLv:1,
  score:0,combo:0,lastClear:0,
  board:null,rows:0,cols:0,pairsLeft:0,
  timeLeft:0,timeTotal:0,
  sel:null,           /* {r,c} */
  hints:3,shufs:3,
  busy:false,gen:0,over:false,
  sndOn:false,timerIv:null
};
function loadS(){
  S.best=+sGet('g51_best')||0;
  S.maxLv=Math.min(3,Math.max(1,+sGet('g51_maxlv')||1));
}
function saveBest(){
  if(S.score>S.best){S.best=S.score;sSet('g51_best',String(S.best))}
}
/* ---------- 音效 ---------- */
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)}catch(e){}}return AC}
function beep(f,d,type,vol,slide){
  if(!S.sndOn)return;var a=ac();if(!a)return;
  try{
    var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.1,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
var SND={
  sel:function(){beep(480,.05,'sine',.08)},
  link:function(n){beep(520+Math.min(n,6)*70,.13,'triangle',.11)},
  bad:function(){beep(180,.08,'sine',.06)},
  swish:function(){beep(300,.18,'sine',.08,140)},
  win:function(){[520,640,830,1040].forEach(function(f,i){setTimeout(function(){beep(f,.16,'triangle',.12)},i*110)})},
  fail:function(){beep(220,.3,'sine',.1,90)},
  ui:function(){beep(500,.06,'sine',.09)}
};
/* ---------- 棋盘数据层 ---------- */
function at(r,c){if(r<0||r>=S.rows||c<0||c>=S.cols)return null;return S.board[r][c]}
function clearRow(r,ca,cb){for(var c=Math.min(ca,cb)+1;c<Math.max(ca,cb);c++)if(at(r,c)!==null)return false;return true}
function clearCol(c,ra,rb){for(var r=Math.min(ra,rb)+1;r<Math.max(ra,rb);r++)if(at(r,c)!==null)return false;return true}
function canLink(r1,c1,r2,c2){
  if(r1===r2&&c1===c2)return null;
  var a=at(r1,c1),b=at(r2,c2);
  if(a===null||b===null||a!==b)return null;
  if(r1===r2&&clearRow(r1,c1,c2))return[[r1,c1],[r2,c2]];
  if(c1===c2&&clearCol(c1,r1,r2))return[[r1,c1],[r2,c2]];
  if(at(r1,c2)===null&&clearRow(r1,c1,c2)&&clearCol(c2,r1,r2))return[[r1,c1],[r1,c2],[r2,c2]];
  if(at(r2,c1)===null&&clearCol(c1,r1,r2)&&clearRow(r2,c1,c2))return[[r1,c1],[r2,c1],[r2,c2]];
  var cc,rr;
  for(cc=-1;cc<=S.cols;cc++){
    if(cc===c1||cc===c2)continue;
    if(at(r1,cc)!==null||at(r2,cc)!==null)continue;
    if(clearRow(r1,c1,cc)&&clearRow(r2,c2,cc)&&clearCol(cc,r1,r2))
      return[[r1,c1],[r1,cc],[r2,cc],[r2,c2]];
  }
  for(rr=-1;rr<=S.rows;rr++){
    if(rr===r1||rr===r2)continue;
    if(at(rr,c1)!==null||at(rr,c2)!==null)continue;
    if(clearCol(c1,r1,rr)&&clearCol(c2,r2,rr)&&clearRow(rr,c1,c2))
      return[[r1,c1],[rr,c1],[rr,c2],[r2,c2]];
  }
  return null;
}
function tilesLeft(){var out=[],r,c;for(r=0;r<S.rows;r++)for(c=0;c<S.cols;c++)if(S.board[r][c]!==null)out.push([r,c]);return out}
function findAnyLink(){
  var ts=tilesLeft(),i,j;
  for(i=0;i<ts.length;i++)for(j=i+1;j<ts.length;j++){
    var p=canLink(ts[i][0],ts[i][1],ts[j][0],ts[j][1]);
    if(p)return{a:ts[i],b:ts[j],path:p};
  }
  return null;
}
function makeBoard(rows,cols,rng){
  var n=rows*cols,arr=[],i;
  for(i=0;i<n;i++)arr.push((i>>1)%NSYM);
  var tries=0,brd;
  do{
    for(i=n-1;i>0;i--){var j=(rng()* (i+1))|0,t=arr[i];arr[i]=arr[j];arr[j]=t}
    brd=[];for(var r=0;r<rows;r++){brd.push(arr.slice(r*cols,(r+1)*cols))}
    S.board=brd;S.rows=rows;S.cols=cols;   /* findAnyLink 依赖 S */
    tries++;
  }while(!findAnyLink()&&tries<50);
  return brd;
}
function shuffleRemaining(rng){
  var pos=tilesLeft(),vals=pos.map(function(p){return S.board[p[0]][p[1]]}),i;
  var tries=0;
  do{
    for(i=vals.length-1;i>0;i--){var j=(rng()*(i+1))|0,t=vals[i];vals[i]=vals[j];vals[j]=t}
    for(i=0;i<pos.length;i++)S.board[pos[i][0]][pos[i][1]]=vals[i];
    tries++;
  }while(!findAnyLink()&&tries<50);
}
/* ---------- DOM ---------- */
var el={
  menu:document.getElementById('menu'),game:document.getElementById('game'),
  board:document.getElementById('board'),lines:document.getElementById('lines'),
  score:document.getElementById('score'),msg:document.getElementById('msg'),
  timeBar:document.getElementById('time-bar'),timeTxt:document.getElementById('time-txt'),
  hintBtn:document.getElementById('btn-hint'),shufBtn:document.getElementById('btn-shuffle'),
  hintCnt:document.getElementById('hint-cnt'),shufCnt:document.getElementById('shuf-cnt'),
  mRec:document.getElementById('m-rec'),
  endOv:document.getElementById('end-ov'),endTitle:document.getElementById('end-title'),endSub:document.getElementById('end-sub'),
  panel:document.getElementById('end-panel'),
  lvBtns:[document.getElementById('lv1'),document.getElementById('lv2'),document.getElementById('lv3')]
};
function updScore(){el.score.textContent=S.score}
function updMsg(t,cls){el.msg.textContent=t;el.msg.className=cls||''}
function updCnts(){
  el.hintCnt.textContent=S.hints;el.shufCnt.textContent=S.shufs;
  el.hintBtn.disabled=S.hints<=0||S.over;el.shufBtn.disabled=S.shufs<=0||S.over;
}
function renderBoard(){
  var html='',r,c;
  for(r=0;r<S.rows;r++)for(c=0;c<S.cols;c++){
    var v=S.board[r][c];
    if(v===null){html+='<div class="tile ghost" style="visibility:hidden"></div>';continue}
    html+='<div class="tile" data-r="'+r+'" data-c="'+c+'"><svg viewBox="0 0 40 40"><use href="#s51-'+v+'"/></svg></div>';
  }
  el.board.style.gridTemplateColumns='repeat('+S.cols+',1fr)';
  el.board.innerHTML=html;
}
function tileDom(r,c){
  var tiles=el.board.children,i;
  for(i=0;i<tiles.length;i++){
    if(+tiles[i].getAttribute('data-r')===r&&+tiles[i].getAttribute('data-c')===c)return tiles[i];
  }
  return null;
}
function cellMetrics(){
  var w=el.board.clientWidth||(el.board.parentNode?el.board.parentNode.clientWidth:0)||300;
  var gap=4,cw=(w-gap*(S.cols-1))/S.cols,ch=cw*4/3;
  return{w:w,gap:gap,cw:cw,ch:ch};
}
function drawPath(path){
  var m=cellMetrics(),pts=path.map(function(p){
    return((p[1]*(m.cw+m.gap)+m.cw/2).toFixed(1)+','+(p[0]*(m.ch+m.gap)+m.ch/2).toFixed(1));
  });
  var d=document.createElementNS('http://www.w3.org/2000/svg','path');
  d.setAttribute('d','M'+pts.join(' L'));
  el.lines.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},480);
}
/* ---------- 流程 ---------- */
function startGame(lv){
  S.gen++;S.over=false;S.busy=false;S.sel=null;
  S.lv=lv;S.score=0;S.combo=0;S.lastClear=0;S.hints=3;S.shufs=3;
  var def=LVS[lv-1];
  makeBoard(def.rows,def.cols,mulberry(Date.now()&0x7fffffff));
  S.pairsLeft=(def.rows*def.cols)/2;
  S.timeTotal=def.time;S.timeLeft=def.time;
  clearInterval(S.timerIv);
  S.timerIv=setInterval(tick,250);
  el.menu.classList.remove('on');el.game.classList.add('on');
  renderBoard();updScore();updCnts();
  updMsg('同物两折线内 · 一线牵走','');
  updTime();
}
function tick(){
  if(S.over)return;
  S.timeLeft=Math.max(0,S.timeLeft-0.25);
  updTime();
  if(S.timeLeft<=0)endGame(false,'time');
}
function updTime(){
  var pct=Math.max(0,S.timeLeft/S.timeTotal*100);
  el.timeBar.style.width=pct+'%';
  el.timeBar.classList.toggle('low',pct<25);
  el.timeTxt.textContent=Math.ceil(S.timeLeft)+'s';
}
function clickTile(r,c){
  if(S.over)return;
  var v=at(r,c);
  if(v===null)return;
  if(S.sel&&S.sel.r===r&&S.sel.c===c){    /* 再点自己=取消 */
    var old=tileDom(r,c);if(old)old.classList.remove('sel');
    S.sel=null;SND.sel();return;
  }
  if(!S.sel){
    S.sel={r:r,c:c};
    var d0=tileDom(r,c);if(d0)d0.classList.add('sel');
    SND.sel();return;
  }
  var path=canLink(S.sel.r,S.sel.c,r,c);
  if(!path){                               /* 不可连：转移选中 */
    var pd=tileDom(S.sel.r,S.sel.c);if(pd)pd.classList.remove('sel');
    S.sel={r:r,c:c};
    var nd=tileDom(r,c);if(nd)nd.classList.add('sel');
    SND.bad();updMsg('两折线内不通 · 换一张试试','');
    return;
  }
  var r1=S.sel.r,c1=S.sel.c;
  S.sel=null;S.busy=true;
  doClear(r1,c1,r,c,path);
}
function doClear(r1,c1,r2,c2,path){
  var d1=tileDom(r1,c1),d2=tileDom(r2,c2);
  if(d1){d1.classList.remove('sel');d1.classList.add('out')}
  if(d2){d2.classList.remove('sel');d2.classList.add('out')}
  drawPath(path);
  S.board[r1][c1]=null;S.board[r2][c2]=null;
  S.pairsLeft--;
  var now=Date.now();
  if(now-S.lastClear<=COMBO_WIN&&S.lastClear>0)S.combo++;else S.combo=0;
  S.lastClear=now;
  var mult=MULTS[Math.min(S.combo,MULTS.length-1)];
  var gain=Math.round(10*mult);
  S.score+=gain;updScore();
  if(mult>1)updMsg('连击 x'+mult.toFixed(1).replace(/\.0$/,'')+' · +'+gain,'win');
  else updMsg('一对牵走 · +'+gain,'win');
  SND.link(S.combo);
  var myGen=S.gen;
  setTimeout(function(){
    if(myGen!==S.gen)return;
    S.busy=false;
    if(S.pairsLeft<=0){endGame(true,'clear');return}
    var sol=findAnyLink();
    if(!sol){                              /* 死局：免费自动洗牌 */
      shuffleRemaining(mulberry(Date.now()&0x7fffffff));
      renderBoard();updMsg('无路可走 · 免费重摆','');
      SND.swish();
    }
  },300);
}
function doHint(){
  if(S.over||S.hints<=0)return;
  var sol=findAnyLink();
  if(!sol)return;
  S.hints--;updCnts();
  var a=tileDom(sol.a[0],sol.a[1]),b=tileDom(sol.b[0],sol.b[1]);
  if(a)a.classList.add('hint');if(b)b.classList.add('hint');
  var myGen=S.gen;
  setTimeout(function(){
    if(myGen!==S.gen)return;
    if(a)a.classList.remove('hint');if(b)b.classList.remove('hint');
  },3400);
  SND.ui();
}
function doShuffle(free){
  if(!free&&(S.over||S.shufs<=0))return;
  if(!free){S.shufs--;updCnts()}
  shuffleRemaining(mulberry(Date.now()&0x7fffffff));
  if(S.sel){var sd=tileDom(S.sel.r,S.sel.c);if(sd)sd.classList.remove('sel');S.sel=null}
  renderBoard();SND.swish();
  updMsg(free?'免费重摆':'摊牌重摆','');
}
function endGame(win,why){
  if(S.over)return;
  S.over=true;S.busy=true;clearInterval(S.timerIv);
  var myGen=S.gen;
  setTimeout(function(){
    if(myGen!==S.gen)return;
    if(win){
      SND.win();
      el.panel.classList.add('celebrate');
      if(S.lv>=3){
        saveBest();
        if(S.maxLv<3){S.maxLv=3;sSet('g51_maxlv','3')}
        el.endTitle.textContent='市集通逛';
        el.endSub.innerHTML='三关全清！本局总分 <b>'+S.score+'</b>'+(S.score>=S.best?' · 新纪录':' · 最佳 '+S.best);
      }else{
        if(S.maxLv<S.lv+1){S.maxLv=S.lv+1;sSet('g51_maxlv',String(S.maxLv))}
        el.endTitle.textContent='第'+LVS[S.lv-1].name+'关 · 清摊';
        el.endSub.innerHTML='剩余时间 <b>'+Math.ceil(S.timeLeft)+'s</b> 加成 +<b>'+Math.round(S.timeLeft)*2+'</b>，总分 <b>'+(S.score+Math.round(S.timeLeft)*2)+'</b>';
        S.score+=Math.round(S.timeLeft)*2;updScore();saveBest();
      }
    }else{
      SND.fail();saveBest();
      el.panel.classList.remove('celebrate');
      el.endTitle.textContent='时间到';
      el.endSub.innerHTML='还剩 <b>'+S.pairsLeft+'</b> 对未牵 · 本关得分 <b>'+S.score+'</b>（最佳 '+S.best+'）';
    }
    el.endOv.classList.add('on');
  },win?600:200);
}
function goMenu(){
  S.gen++;S.over=true;clearInterval(S.timerIv);
  el.game.classList.remove('on');el.menu.classList.add('on');
  el.endOv.classList.remove('on');
  showMenuRec();refreshLvBtns();
}
function showMenuRec(){
  el.mRec.innerHTML='最佳总分 <b>'+S.best+'</b> · 已解锁 <b>'+S.maxLv+'</b>/3 关';
}
var DIMT=['4\u00d78 \u00b7 180\u79d2','6\u00d78 \u00b7 240\u79d2','6\u00d710 \u00b7 300\u79d2'];
function refreshLvBtns(){
  for(var i=0;i<3;i++){
    var locked=(i+1)>S.maxLv;
    el.lvBtns[i].classList.toggle('locked',locked);
    var sm=el.lvBtns[i].querySelector('small');
    if(sm)sm.textContent=locked?'\u901a\u5173\u89e3\u9501':DIMT[i];
    var st=el.lvBtns[i].querySelector('.star');
    if(st)st.parentNode.removeChild(st);
    if(!locked&&i+1<S.maxLv){
      var sp=document.createElement('span');sp.className='star';sp.textContent='★';
      el.lvBtns[i].appendChild(sp);
    }
  }
}
/* ---------- 事件 ---------- */
el.board.addEventListener('click',function(e){
  var t=e.target;
  if(t&&t.closest)t=t.closest('.tile');
  if(!t||!t.getAttribute)return;
  var r=t.getAttribute('data-r'),c=t.getAttribute('data-c');
  if(r===null||c===null)return;
  clickTile(+r,+c);
});
document.getElementById('btn-home').addEventListener('click',function(){if(!S.busy||S.over){SND.ui();goMenu()}});
document.getElementById('btn-snd').addEventListener('click',function(){
  S.sndOn=!S.sndOn;this.classList.toggle('off',!S.sndOn);this.textContent=S.sndOn?'♪':'♪̶';
  if(S.sndOn){var a=ac();if(a&&a.state==='suspended')a.resume();SND.ui()}
});
el.hintBtn.addEventListener('click',function(){doHint()});
el.shufBtn.addEventListener('click',function(){doShuffle(false)});
for(var _i=0;_i<3;_i++)(function(i){
  el.lvBtns[i].addEventListener('click',function(){
    if((i+1)>S.maxLv)return;
    SND.ui();startGame(i+1);
  });
})(_i);
document.getElementById('end-again').addEventListener('click',function(){SND.ui();el.endOv.classList.remove('on');startGame(S.lv)});
document.getElementById('end-menu').addEventListener('click',function(){SND.ui();goMenu()});


</script>
