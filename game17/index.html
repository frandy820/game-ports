  /* ═══ 索引与出题（seeded 预生成） ═══ */
  var BY_FIRST = {};
  WORDS.forEach(function (wd, i) {
    var c = wd.w.charAt(0);
    (BY_FIRST[c] = BY_FIRST[c] || []).push(i);
  });

  function chainOf(seed, lv) {
    var rnd = mulberry((seed ^ (lv * 0x9e3779b9)) >>> 0);
    var CHAIN = 8;               /* 出题数；链长 = CHAIN+1（每题答案=下一词，末题也有解） */
    for (var attempt = 0; attempt < 60; attempt++) {
      var used = {}, chain = [];
      var startIdx = Math.floor(rnd() * WORDS.length);
      chain.push(startIdx); used[startIdx] = 1;
      var ok = true;
      for (var s = 1; s <= CHAIN; s++) {
        var tail = WORDS[chain[chain.length - 1]].w.charAt(3);
        var pool = (BY_FIRST[tail] || []).filter(function (i) { return !used[i]; });
        if (!pool.length) { ok = false; break; }
        var nxt = pool[Math.floor(rnd() * pool.length)];
        chain.push(nxt); used[nxt] = 1;
      }
      if (!ok) continue;
      /* 组题：每题=当前词+4选项（1 正确+3 干扰） */
      var qs = [];
      for (var q = 0; q < CHAIN; q++) {
        var cur = chain[q], ans = chain[q + 1];
        var opts = [];
        opts.push(ans);
        var needTail = WORDS[cur].w.charAt(3);
        /* 梯度：lv>=7 每题先注入 1 个同音干扰（首字与尾字同音不同字，可用则必在） */
        if (lv >= 7) {
          var homos = Object.keys(HOMOMAP[needTail] || {});
          for (var hi = 0; hi < homos.length && opts.length < 2; hi++) {
            var hc = homos[Math.floor(rnd() * homos.length)];
            var hpool = (BY_FIRST[hc] || []).filter(function (i) { return opts.indexOf(i) < 0 && i !== cur; });
            if (hpool.length) { opts.push(hpool[Math.floor(rnd() * hpool.length)]); break; }
          }
        }
        var guard = 0;
        while (opts.length < 4 && guard < 500) {
          guard++;
          var d = Math.floor(rnd() * WORDS.length);
          if (opts.indexOf(d) >= 0 || d === cur) continue;
          var dw = WORDS[d].w;
          if (dw.charAt(0) === needTail) continue;   /* 干扰不可接 */
          opts.push(d);
        }
        if (opts.length < 4) { ok = false; break; }
        /* 洗牌 */
        for (var sh = opts.length - 1; sh > 0; sh--) {
          var r3 = Math.floor(rnd() * (sh + 1));
          var tmp = opts[sh]; opts[sh] = opts[r3]; opts[r3] = tmp;
        }
        qs.push({ cur: cur, opts: opts, ans: opts.indexOf(ans) });
      }
      if (ok) return { chain: chain, qs: qs, lv: lv };
    }
    return null;   /* 词表连通性兜底失败（verify 会暴露） */
  }

  }

  function T(fn, ms) { var id = setTimeout(fn, ms); S.timers.push(id); return id; }
  function clearTimers() { S.timers.forEach(clearTimeout); S.timers = []; }

  function to(p) { clearTimers(); S.phase = p; }

  function updateHUD() {
    el.ctLv.textContent = S.lv;
    el.ctProg.textContent = Math.min(S.qi, CHAIN_LEN) + '/' + CHAIN_LEN;
    var h = '';
    for (var i = 0; i < 3; i++) h += '<span class="h' + (i < S.lives ? '' : ' dead') + '">♥</span>';
    el.lives.innerHTML = h;
    el.combo.textContent = '连击 ×' + S.combo;
    el.combo.classList.toggle('hot', S.combo >= 3);
    el.score.textContent = S.score;
    el.btnHint.innerHTML = '提示 <em>×' + S.hintLeft + '</em>';
    el.btnHint.disabled = S.hintLeft <= 0 || S.phase !== 'PLAY';
  }

  function renderQ() {
    var q = S.qs[S.qi];
    var wd = WORDS[q.cur];
    el.curw.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var c = document.createElement('span');
      c.className = 'c' + (i === 3 ? ' tail' : '');
      c.textContent = wd.w.charAt(i);
      el.curw.appendChild(c);
    }
    el.curm.textContent = '「' + wd.w + '」' + wd.m;
    var tail = wd.w.charAt(3);
    el.linkhint.innerHTML = '接「<b>' + tail + '</b>」—— 选首字是「' + tail + '」的成语';
    el.opts.innerHTML = '';
    q.opts.forEach(function (oi, idx) {
      var b = document.createElement('div');
      b.className = 'opt';
      var t = WORDS[oi].w;
      b.innerHTML = '<span class="fst">' + t.charAt(0) + '</span>' + t.slice(1);
      (function (ii) {
        b.addEventListener('pointerdown', function (e) { e.preventDefault(); pick(ii); });
      })(idx);
      el.opts.appendChild(b);
    });
    updateHUD();
  }

  function startLevel(seed, lv) {
    var g = chainOf(seed, lv);
    if (!g) return false;
    S.seed = seed; S.lv = lv;
    S.qs = g.qs; S.qi = 0;
    S.lives = 3; S.combo = 0; S.maxCombo = 0;
    S.lvScore = 0; S.wrongs = 0; S.hintUsed = false; S.hintLeft = 1;
    S.lock = false;
    el.menu.hidden = true; el.win.hidden = true; el.lose.hidden = true;
    to('PLAY');
    renderQ();
    return true;
  }

  /* 选择 */
  function pick(idx) {
    if (S.phase !== 'PLAY' || S.lock) return null;
    var q = S.qs[S.qi];
    var optEls = el.opts.children;
    if (idx === q.ans) {
      S.lock = true;
      var mult = Math.min(S.combo, 20) * 0.1 + 1;
      var pts = Math.round(100 * mult);
      S.score += pts; S.lvScore += pts;
      S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      SFX.right(S.combo);
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      optEls[idx].classList.add('right');
      T(function () {
        S.qi++;
        if (S.qi >= CHAIN_LEN) { winLevel(); return; }
        /* 翻页动画 */
        el.curbox.className = 'paper swapA';
        T(function () {
          renderQ();
          el.curbox.className = 'paper swapB';
          T(function () { el.curbox.className = 'paper'; S.lock = false; }, 280);
        }, 220);
      }, 340);
      return 'right';
    } else {
      S.wrongs++;
      S.lives--;
      S.combo = 0;
      SFX.wrong();
      if (navigator.vibrate) { try { navigator.vibrate([30, 30, 30]); } catch (e) {} }
      optEls[idx].classList.add('wrong');
      T(function () { optEls[idx].classList.remove('wrong'); }, 420);
      updateHUD();                       /* 先重建心心，再给新熄灭的心挂 pop（先挂会被 innerHTML 重建抹掉） */
      var hs = el.lives.querySelectorAll('.h');
      if (hs[S.lives]) { hs[S.lives].classList.add('pop'); }
      if (S.lives <= 0) {
        S.lock = true;
        T(loseLevel, 700);
      }
      return 'wrong';
    }
  }

  function hint() {
    if (S.phase !== 'PLAY' || S.hintLeft <= 0) return false;
    S.hintLeft--; S.hintUsed = true;
    SFX.hint();
    var q = S.qs[S.qi];
    el.opts.children[q.ans].classList.add('hintglow');
    T(function () {
      var c = el.opts.children[q.ans];
      if (c) c.classList.remove('hintglow');
    }, 3000);
    updateHUD();
    return true;
  }

  function starsOf() {
    if (S.wrongs === 0 && !S.hintUsed) return 3;
    if (S.wrongs <= 1 || S.hintUsed) return 2;
    return 1;
  }

  function winLevel() {
    to('WIN');
    var st = starsOf();
    if (S.score > S.best) { S.best = S.score; safeStorage.set('mq_g17_best', S.best); }
    if (S.lv + 1 > S.maxLv) { S.maxLv = S.lv + 1; safeStorage.set('mq_g17_lv', S.maxLv); }
    el.winStar.textContent = '★★★☆☆☆'.slice(3 - st, 6 - st);
    el.winScore.textContent = S.lvScore;
    el.winMax.textContent = '×' + S.maxCombo;
    el.win.hidden = false;
    SFX.winArp();
    if (navigator.vibrate) { try { navigator.vibrate([20, 50, 20]); } catch (e) {} }
    updateHUD();
  }

  function loseLevel() {
    to('LOSE');
    el.loseN.textContent = S.qi;
    el.lose.hidden = false;
    SFX.lose();
    updateHUD();
  }

  function showMenu() {
    to('MENU');
    el.win.hidden = true; el.lose.hidden = true;
    el.menuLv.textContent = 'Lv ' + S.maxLv;
    el.menuBest.textContent = S.best;
    if (S.maxLv > 1) {
      el.menuGo.style.display = '';
      el.menuGo.textContent = '继续第 ' + S.maxLv + ' 关';
    }
    el.menu.hidden = false;
    updateHUD();
  }

  /* ═══ 事件 ═══ */
  el.menuOk.addEventListener('click', function () { SFX.unlock(); S.score = 0; startLevel((Math.random() * 1e9) | 0, 1); });
  el.menuGo.addEventListener('click', function () { SFX.unlock(); S.score = 0; startLevel((Math.random() * 1e9) | 0, S.maxLv); });
  el.winOk.addEventListener('click', function () { startLevel((Math.random() * 1e9) | 0, S.lv + 1); });
  el.winMenu.addEventListener('click', showMenu);
  el.loseOk.addEventListener('click', function () { S.score -= S.lvScore; startLevel((Math.random() * 1e9) | 0, S.lv); });
  el.loseMenu.addEventListener('click', showMenu);
  el.btnHint.addEventListener('click', function () { hint(); });
  el.btnSnd.addEventListener('click', function () { SFX.toggle(); sndIcon(); });

  /* ═══ dev 钩子 ═══ */
  

  /* ═══ 启动 ═══ */
  sndIcon();
  showMenu();
})();
</script>
</body>
</html>
