<script>
'use strict';
/* ================= 核心纯函数（与 sim150.py 逐位同构） ================= */
var MOD = 2147483647;
function LCG(seed){ this.x = ((seed % MOD) + MOD) % MOD || (MOD - 1); }
LCG.prototype.next = function(){ this.x = (this.x * 48271) % MOD; return this.x; };
LCG.prototype.u = function(n){ return this.next() % n; };

/* 合法操作统一序列（SPEC §9.6）：垂直 k 升序（L 先 R 后）→ 水平 k 升序（U 先 D 后）
   操作=[o,k,s]：o='V'/'H'，s='L'/'R'/'U'/'D'；合法性 §9.2（2k≤w↔L；2k≥w↔R） */
function legalOps(w, h){
  var r = [], k;
  for (k = 1; k < w; k++) {
    if (2 * k <= w) r.push(['V', k, 'L']);
    if (2 * k >= w) r.push(['V', k, 'R']);
  }
  for (k = 1; k < h; k++) {
    if (2 * k <= h) r.push(['H', k, 'U']);
    if (2 * k >= h) r.push(['H', k, 'D']);
  }
  return r;
}
/* 执行一折（单源：演出层与自动对拍通道共用；SPEC §9.3 镜像公式+§9.4 基底平移）
   返回 [nw,nh,dox,doy,nc] */
function foldCells(cells, w, h, op){
  var o = op[0], k = op[1], s = op[2], nw, nh, dox, doy, nc, y, j, x, i, a, b;
  if (o === 'V') {
    nw = s === 'L' ? w - k : k; nh = h;
    dox = s === 'L' ? k : 0; doy = 0;
    nc = new Array(nw * nh);
    for (y = 0; y < h; y++) {
      for (j = 0; j < nw; j++) {
        if (s === 'L') {
          a = y * w + k + j;
          var mc = k - 1 - j;               /* 镜像列坐标（域判定用坐标，禁用扁平索引——负列可映射到上一行格） */
          b = y * w + mc;
          nc[y * nw + j] = cells[a] | (mc >= 0 ? cells[b] : 0n);
        } else {
          a = y * w + j;
          var mc2 = 2 * k - 1 - j;
          b = y * w + mc2;
          nc[y * nw + j] = cells[a] | (k <= mc2 && mc2 < w ? cells[b] : 0n);
        }
      }
    }
  } else {
    nw = w; nh = s === 'U' ? h - k : k;
    dox = 0; doy = s === 'U' ? k : 0;
    nc = new Array(nw * nh);
    for (i = 0; i < nh; i++) {
      for (x = 0; x < w; x++) {
        if (s === 'U') {
          a = (k + i) * w + x;
          var mr = k - 1 - i;               /* 镜像行坐标（同上） */
          b = mr * w + x;
          nc[i * w + x] = cells[a] | (mr >= 0 ? cells[b] : 0n);
        } else {
          a = i * w + x;
          var mr2 = 2 * k - 1 - i;
          b = mr2 * w + x;
          nc[i * w + x] = cells[a] | (k <= mr2 && mr2 < h ? cells[b] : 0n);
        }
      }
    }
  }
  return [nw, nh, dox, doy, nc];
}
/* 位掩码=BigInt（36 格=36 位；Number 位运算 32 位截断：1<<32==1、& | 截断、>>保号死循环
   ——与 py 无限位整数逐位一致；v1.1 修订自抓 bug #3） */
function marksMask(marks){
  var m = 0n, i;
  for (i = 0; i < marks.length; i++) m |= (1n << BigInt(marks[i]));
  return m;
}
function popcnt(v){ var n = 0; while (v) { n += (v & 1n) === 1n ? 1 : 0; v >>= 1n; } return n; }
/* 胜利=裎位（花心初始绝对格位）层集合 ⊇ M_ALL 且在范围内（SPEC §1.3） */
function isWin(w, h, ox, oy, cells, M, tx, ty){
  var lx = tx - ox, ly = ty - oy;
  if (!(lx >= 0 && lx < w && ly >= 0 && ly < h)) return false;
  return (cells[ly * w + lx] & M) === M;
}
function maxGather(cells, M){
  var best = 0, i, n;
  for (i = 0; i < cells.length; i++) {
    n = popcnt(cells[i] & M);
    if (n > best) best = n;
  }
  return best;
}
/* BFS 求解器（SPEC §2 par；与 py solve_bfs 同构；human1 感知共用）
   缓存容器=Map（值语义与 py dict 等价；普通对象在超大键量下进字典模式有性能悬崖） */
var _distCache = new Map();
function distAfter(w, h, ox, oy, cells, M, tx, ty){
  /* 缓存键含判定上下文 M,tx,ty（胜利判据依赖；跨关同构型距离不同——与 sim150 v1.1 同修） */
  var key = w + ',' + h + ',' + ox + ',' + oy + ',' + M + ',' + tx + ',' + ty + ',' + cells.join(',');
  if (_distCache.has(key)) return _distCache.get(key);
  if (isWin(w, h, ox, oy, cells, M, tx, ty)) { _distCache.set(key, 0); return 0; }
  var start = key;
  var dist = new Map(); dist.set(start, 0);
  var q = [[w, h, ox, oy, M, tx, ty, cells]];
  var head = 0;
  while (head < q.length) {
    var st = q[head++]; var sw = st[0], sh = st[1], sox = st[2], soy = st[3], sM = st[4], stx = st[5], sty = st[6], sc = st[7];
    var d = dist.get(sw + ',' + sh + ',' + sox + ',' + soy + ',' + sM + ',' + stx + ',' + sty + ',' + sc.join(','));
    var oo = legalOps(sw, sh), i, op;
    for (i = 0; i < oo.length; i++) {
      op = oo[i];
      var r = foldCells(sc, sw, sh, op);
      var nw = r[0], nh = r[1], nox = sox + r[2], noy = soy + r[3], nc = r[4];
      var nk = nw + ',' + nh + ',' + nox + ',' + noy + ',' + sM + ',' + stx + ',' + sty + ',' + nc.join(',');
      if (dist.has(nk)) continue;
      dist.set(nk, d + 1);
      if (isWin(nw, nh, nox, noy, nc, M, tx, ty)) {
        _distCache.set(start, d + 1); _distCache.set(nk, 0);
        return d + 1;
      }
      q.push([nw, nh, nox, noy, sM, stx, sty, nc]);
    }
  }
  _distCache.set(start, -1);
  return -1;
}
function runOps(W, H, ops){
  var w = W, h = H, ox = 0, oy = 0, cells = [], i;
  for (i = 0; i < W * H; i++) cells.push(1n << BigInt(i));
  var steps = 0;
  for (i = 0; i < ops.length; i++) {
    var r = foldCells(cells, w, h, ops[i]);
    ox += r[2]; oy += r[3]; w = r[0]; h = r[1]; cells = r[4];
    steps++;
  }
  return [w, h, ox, oy, cells, steps];
}
var CAP_TOL = 4;
function winScore(M, par, steps){ return 500 + 80 * M + Math.max(0, par + CAP_TOL - steps) * 50; }
function failScore(mx){ return 100 * mx; }
function starsOf(steps, par){
  if (steps === par) return 3;
  if (steps <= par + 1) return 2;
  return 1;
}
var ERR = [22, 26, 30];   /* human1 失误 %（浅/中/深） */
var ATT_MAX = 3;
/* 三 bot（对拍域，与 sim150.bot_run 同构；六元组 [over,score,steps,mx,att,0]） */
function botRun(mode, lv, seed){
  var L = LVL[lv - 1];
  var band = lv <= 8 ? 0 : (lv <= 16 ? 1 : 2);
  var W = L.W, H = L.H, M = L.M, marks = L.marks;
  var MALL = marksMask(marks);
  var tx = marks[0] % W, ty = Math.floor(marks[0] / W);
  var r = new LCG(seed);
  if (mode === 'optimal') {
    var ops = solParse(L.sol);
    var rr = runOps(W, H, ops);
    if (!(rr[5] === L.par && isWin(rr[0], rr[1], rr[2], rr[3], rr[4], MALL, tx, ty))) return [-1, 0, 0, 0, 1, 0];
    return [1, winScore(M, L.par, rr[5]), rr[5], M, 1, 0];
  }
  if (mode === 'random') {
    var w = W, h = H, ox = 0, oy = 0, cells = [], i0;
    for (i0 = 0; i0 < W * H; i0++) cells.push(1n << BigInt(i0));
    var steps = 0;
    while (true) {
      var oo = legalOps(w, h);
      var op = oo[r.u(oo.length)];
      var f = foldCells(cells, w, h, op);
      ox += f[2]; oy += f[3]; w = f[0]; h = f[1]; cells = f[4];
      steps++;
      if (isWin(w, h, ox, oy, cells, MALL, tx, ty)) return [1, winScore(M, L.par, steps), steps, M, 1, 0];
      if (w === 1 && h === 1) {
        var mx = maxGather(cells, MALL);
        return [2, failScore(mx), steps, mx, 1, 0];
      }
    }
  }
  /* human1 */
  var err = ERR[band];
  var att, steps2 = 0, cells2 = null;
  for (att = 1; att <= ATT_MAX; att++) {
    var w1 = W, h1 = H, ox1 = 0, oy1 = 0;
    var c1 = [], j1;
    for (j1 = 0; j1 < W * H; j1++) c1.push(1n << BigInt(j1));
    steps2 = 0;
    var dead = false;
    while (true) {
      var oo1 = legalOps(w1, h1);
      var pick;
      if (r.u(100) < err) {
        pick = oo1[r.u(oo1.length)];
      } else {
        var best = null, bestops = [], i2;
        for (i2 = 0; i2 < oo1.length; i2++) {
          var o2 = oo1[i2];
          var f2 = foldCells(c1.slice(), w1, h1, o2);
          var dd = distAfter(f2[0], f2[1], ox1 + f2[2], oy1 + f2[3], f2[4], MALL, tx, ty);
          if (dd < 0) continue;
          if (best === null || dd < best) { best = dd; bestops = [o2]; }
          else if (dd === best) bestops.push(o2);
        }
        pick = bestops.length ? bestops[r.u(bestops.length)] : oo1[r.u(oo1.length)];
      }
      var f3 = foldCells(c1, w1, h1, pick);
      ox1 += f3[2]; oy1 += f3[3]; w1 = f3[0]; h1 = f3[1]; c1 = f3[4];
      steps2++;
      if (isWin(w1, h1, ox1, oy1, c1, MALL, tx, ty)) {
        return [1, winScore(M, L.par, steps2), steps2, M, att, 0];
      }
      if (w1 === 1 && h1 === 1) { dead = true; break; }
    }
    if (dead) { cells2 = c1; continue; }
  }
  var mx2 = maxGather(cells2, MALL);
  return [2, failScore(mx2), steps2, mx2, ATT_MAX, 0];
}
function solParse(s){
  var ops = [], i = 0;
  while (i < s.length) { ops.push([s.charAt(i), parseInt(s.charAt(i + 2), 10), s.charAt(i + 1)]); i += 3; }
  return ops;
}

/* ================= 关卡表（lvdata150.json 冻结谱内嵌） ================= */
/* 行格式 [lv,W,H,M,marks[],par,sol]；marks[0]=花心（裎位） */
var LVLRAW = [[1,4,4,4,[4,2,15,5],4,"VR2VR1HD2HU1"],[2,4,4,4,[5,1,3,13],4,"VR2VL1HD2HU1"],[3,4,4,4,[0,12,1,11],4,"VR2VR1HD2HD1"],[4,4,4,4,[10,7,13,9],4,"VL2VR1HU2HD1"],[5,4,4,4,[2,11,8,10],4,"VL2VR1HD2HD1"],[6,4,4,4,[10,15,3,11],3,"VR3HU2HD1"],[7,4,4,4,[11,14,7,3],4,"VL2VL1HU2HD1"],[8,4,4,4,[12,13,11,14],4,"VR2VR1HU2HU1"],[9,5,5,5,[3,19,14,13,1],6,"VL1VL2VR1HD3HD2HD1"],[10,5,5,5,[5,24,12,0,1],6,"VR3VR2VR1HU1HD2HD1"],[11,5,5,5,[4,5,7,10,2],6,"VL1VL2VL1HD3HD2HD1"],[12,5,5,5,[3,12,2,18,1],5,"VL2VL1HD3HD2HD1"],[13,5,5,5,[2,17,22,4,0],5,"VL1VR2VL1HD4HD2"],[14,5,5,5,[1,0,17,15,24],5,"VL1VR2VR1HD4HD2"],[15,5,5,5,[3,5,12,23,24],6,"VL1VL2VR1HD3HD2HD1"],[16,5,5,5,[2,10,7,9,0],6,"VL1VR2VL1HD3HD2HD1"],[17,6,6,6,[31,32,28,29,1,27],6,"VR3VL1VR1HU2HU2HU1"],[18,6,6,6,[0,19,12,11,33,14],6,"VR3VR2VR1HD3HD2HD1"],[19,6,6,6,[5,6,13,11,29,1],6,"VL1VL1VL2HD3HD2HD1"],[20,6,6,6,[0,9,30,29,8,1],6,"VR3VR2VR1HD3HD2HD1"],[21,6,6,6,[32,33,17,30,2,11],6,"VL2VR2VR1HU1HU1HU2"],[22,6,6,6,[18,14,25,28,6,15],6,"VR3VR2VR1HU2HD2HU1"],[23,6,6,6,[6,24,21,30,31,22],6,"VR3VR2VR1HD3HU1HD1"],[24,6,6,6,[11,12,5,13,7,25],6,"VL1VL1VL2HD3HU1HD1"]];
var LVL = LVLRAW.map(function(r){
  return { lv: r[0], W: r[1], H: r[2], M: r[3], marks: r[4], par: r[5], sol: r[6] };
});

/* ================= 游戏状态与 UI ================= */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var FR = 0;
var S = {
  ph: 'menu', lv: 1, over: 0, score: 0, stars: 0, winT: 0, loseT: 0,
  w: 4, h: 4, ox: 0, oy: 0, cells: [], steps: 0,
  hist: [],                  /* 撤销栈（含初始态） */
  focusIdx: 0, pick: null,   /* pick=等宽两向选择浮层 {orient,k,ops:[a,b],T} */
  foldFx: 0, fxT: 0, flashT: 0, flashMsg: '',
  unlocked: 1, best: {}, starsSave: {}, mute: 0
};
function curL(){ return LVL[S.lv - 1]; }
function MALL(){ return marksMask(curL().marks); }
function anchor(){ var L = curL(); return [L.marks[0] % L.W, Math.floor(L.marks[0] / L.W)]; }

/* ---------- 存档（SPEC §5：{unlocked,best,stars} 毒丸拒坏档） ---------- */
function validSave(o){
  if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
  var k;
  if (!Number.isInteger(o.unlocked) || o.unlocked < 1 || o.unlocked > 24) return null;
  if (o.best === null || typeof o.best !== 'object' || Array.isArray(o.best)) return null;
  if (o.stars === null || typeof o.stars !== 'object' || Array.isArray(o.stars)) return null;
  for (k in o.best) {
    if (!Object.prototype.hasOwnProperty.call(o.best, k)) continue;
    var lv = parseInt(k, 10);   /* v1.5：位算取整改 parseInt（语义等价） */
    if (!(lv >= 1 && lv <= 24) || String(lv) !== k) return null;
    if (!Number.isInteger(o.best[k]) || o.best[k] < 0 || o.best[k] > 999999) return null;
  }
  for (k in o.stars) {
    if (!Object.prototype.hasOwnProperty.call(o.stars, k)) continue;
    var lv2 = parseInt(k, 10);
    if (!(lv2 >= 1 && lv2 <= 24) || String(lv2) !== k) return null;
    if (!Number.isInteger(o.stars[k]) || o.stars[k] < 0 || o.stars[k] > 3) return null;
  }
  return o;
}
function loadSave(){
  var o = null, m = 0;
  try {
    var t = localStorage.getItem('g150_save');
    if (t) o = validSave(JSON.parse(t));
  } catch (e) { o = null; }
  try {
    var tm = parseInt(localStorage.getItem('g150_mute'), 10);
    if (tm === 0 || tm === 1) m = tm;
  } catch (e) { m = 0; }
  if (o) { S.unlocked = o.unlocked; S.best = o.best; S.starsSave = o.stars; }
  else { S.unlocked = 1; S.best = {}; S.starsSave = {}; }
  S.mute = m;
}
function saveMain(){
  try {
    localStorage.setItem('g150_save', JSON.stringify({ unlocked: S.unlocked, best: S.best, stars: S.starsSave }));
    localStorage.setItem('g150_mute', String(S.mute));
  } catch (e) {}
}

/* ---------- 音效 ---------- */
var AC = null;
function ensureAC(){
  if (S.mute) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(fq, ms, vol, dly){
  if (S.mute || !AC) return;
  try {
    var t0 = AC.currentTime + (dly || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + ms / 1000);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + ms / 1000 + 0.02);
  } catch (e) {}
}
function snd(kind){

  else if (kind === 'lose') tone(98, 500, 0.1);
  else if (kind === 'fill') tone(330, 50, 0.06);
}

/* ---------- 折叠执行（单源 doFold：演出层/键盘/触屏共用；SPEC §2 积分顺序） ---------- */
function canFold(){ return S.ph === 'play' && !S.over; }
function doFold(op){
  if (!canFold()) return false;
  S.hist.push({ w: S.w, h: S.h, ox: S.ox, oy: S.oy, cells: S.cells.slice(), steps: S.steps });
  var r = foldCells(S.cells, S.w, S.h, op);
  S.ox += r[2]; S.oy += r[3]; S.w = r[0]; S.h = r[1]; S.cells = r[4];
  S.steps++;
  S.pick = null;
  S.fxT = 18; snd('fold');
  updHUD();   /* §11 v1.4：折中 HUD 步数须随折刷新（pixcheck 实测不更新——产品级 bug） */
  var L = curL(), an = anchor();
  if (isWin(S.w, S.h, S.ox, S.oy, S.cells, MALL(), an[0], an[1])) { doWin(); return true; }
  if (S.w === 1 && S.h === 1) { doLose(); return true; }   /* §9.7 胜先于折尽 */
  return true;
}
function doWin(){
  var L = curL();
  S.over = 1; S.winT = 72;
  S.stars = starsOf(S.steps, L.par);
  S.score = winScore(L.M, L.par, S.steps);
  if (!S.best[S.lv] || S.score > S.best[S.lv]) S.best[S.lv] = S.score;
  if (!S.starsSave[S.lv] || S.stars > S.starsSave[S.lv]) S.starsSave[S.lv] = S.stars;
  if (S.lv < 24 && S.unlocked < S.lv + 1) S.unlocked = S.lv + 1;
  saveMain();
  snd('win');
  updHUD();
}
function doLose(){
  S.over = 2; S.loseT = 60;
  S.stars = 0; S.score = failScore(maxGather(S.cells, MALL()));
  snd('lose');
  updHUD();
}
function undo(){
  if (S.ph !== 'play' || S.over) return false;
  if (S.hist.length === 0) { flash('已在初始笺面'); return false; }
  var p = S.hist.pop();
  S.w = p.w; S.h = p.h; S.ox = p.ox; S.oy = p.oy; S.cells = p.cells; S.steps = p.steps;
  S.pick = null;
  snd('undo');
  updHUD();
  return true;
}
function softReset(){
  if (S.ph !== 'play') return;
  S.over = 0; S.score = 0; S.stars = 0; S.winT = 0; S.loseT = 0;

function initPaper(){
  var L = curL();

  S.cells = [];
  var i;
  for (i = 0; i < L.W * L.H; i++) S.cells.push(1n << BigInt(i));

}
function newGame(lv){

/* ---------- 触屏（画布坐标路由；SPEC §1.9/§9.6 统一序列） ---------- */
/* 几何（v1.5 修纸面溢出画布）：纸整体恒居中 px=(390-w·cs)/2、py=(780-h·cs)/2（w/h=当前折后尺寸），
   全谱恒满足纸界 ⊆[30,360]×[225,555]（cs 按初始 W/H 定恒定，W·cs≤330）；裎印=花心当前格中心
   ax=px+lx·cs, ay=py+ly·cs（lx<0 或 ≥w 时花心在纸外，裎印随格位悬于纸侧/画布外由 canvas 裁剪） */
function geo(){
  var L0 = LVL[S.lv - 1];
  var cs = Math.min(56, Math.floor(330 / Math.max(L0.W, L0.H)));
  var an = anchor();
  var lx = an[0] - S.ox, ly = an[1] - S.oy;
  var px = (390 - S.w * cs) / 2, py = (780 - S.h * cs) / 2;
  return { cs: cs, ax: px + lx * cs, ay: py + ly * cs, px: px, py: py };
}
/* 折线命中：返回统一序列索引或 -1；pick 热区命中=直接执行该向并返回 -2（禁二次弹选） */
function hitFold(x, y){
  if (!canFold()) return -1;
  var g = geo(), i;
  var oo = legalOps(S.w, S.h);
  /* 先查 pick 浮层热区（等宽两向选择）：命中即折 */
  if (S.pick) {
    var hit = pickHit(x, y);
    if (hit !== -1) { doFold(oo[hit]); return -2; }
  }
  for (i = 0; i < oo.length; i++) {
    var op = oo[i];
    if (op[0] === 'V') {
      var lx = g.px + op[1] * g.cs;
      if (Math.abs(x - lx) <= 12 && y >= g.py - 6 && y <= g.py + S.h * g.cs + 6) {
        return i;
      }
    } else {
      var ly2 = g.py + op[1] * g.cs;
      if (Math.abs(y - ly2) <= 12 && x >= g.px - 6 && x <= g.px + S.w * g.cs + 6) {
        return i;
      }
    }
  }
  return -1;
}
/* 折线命中索引 i：等宽两向（同 (o,k) 两操作相邻）→ 弹选择；否则直折 */
function tapFoldIdx(i){
  var oo = legalOps(S.w, S.h);
  if (i < 0 || i >= oo.length) return false;
  var op = oo[i];
  var twin = -1, j;
  for (j = 0; j < oo.length; j++) {
    if (j !== i && oo[j][0] === op[0] && oo[j][1] === op[1]) { twin = j; break; }
  }
  if (twin >= 0) {
    S.pick = { a: i, b: twin, T: 120 };
    snd('fill');
    return true;
  }
  return doFold(op);
}
function pickHit(x, y){
  /* 两枚箭头钮画在裎印上方两侧（绘制处同坐标）；返回统一序列索引或 -1 */
  if (!S.pick) return -1;
  if (Math.abs(x - 155) <= 26 && Math.abs(y - 210) <= 20) return S.pick.a;
  if (Math.abs(x - 235) <= 26 && Math.abs(y - 210) <= 20) return S.pick.b;
  return -1;
}
function handleTap(x, y){
  if (S.ph !== 'play') return;
  if (S.over) return;
  var i = hitFold(x, y);
  if (i === -1) {
    if (S.pick) { S.pick = null; }
    return;
  }
  if (i === -2) return;             /* pick 热区已执行折叠 */
  /* pick 激活时命中折线=重置 pick 到新线（hitFold 已先查浮层） */
  tapFoldIdx(i);
}
function keyAct(code){
  if (S.ph !== 'play' || S.over) return;
  var oo = legalOps(S.w, S.h);
  if (code === 'ArrowLeft' || code === 'ArrowUp') {
    S.focusIdx = (S.focusIdx - 1 + oo.length) % Math.max(1, oo.length);
    if (S.pick) S.pick = null;
    return;
  }
  if (code === 'ArrowRight' || code === 'ArrowDown') {
    S.focusIdx = (S.focusIdx + 1) % Math.max(1, oo.length);
    if (S.pick) S.pick = null;
    return;
  }
  if (code === 'Enter' || code === 'Space') {
    if (oo.length === 0) return;
    if (S.focusIdx >= oo.length) S.focusIdx = 0;
    /* 焦点操作含等宽两向：Enter 直折焦点项（键盘通道=完整统一序列，§9.6） */
    doFold(oo[S.focusIdx]);
    return;
  }
  if (code === 'Backspace') { undo(); return; }
}

/* ---------- 主循环（rAF 60Hz 归一） ---------- */
var lastTs = 0, acc = 0;
function step(){
  FR++;
  if (S.flashT > 0) S.flashT--;
  if (S.fxT > 0) S.fxT--;
  if (S.pick && S.pick.T > 0) { S.pick.T--; if (!S.pick.T) S.pick = null; }
  if (S.over === 1 && S.winT > 0) { S.winT--; if (!S.winT) showPanel(); }
  if (S.over === 2 && S.loseT > 0) { S.loseT--; if (!S.loseT) showPanel(); }
}
function mainLoop(ts){
  requestAnimationFrame(mainLoop);
  if (!lastTs) lastTs = ts;
  var dt = ts - lastTs; lastTs = ts;
  if (dt > 200) dt = 200;
  acc += dt;
  while (acc >= 16.6667) { step(); acc -= 16.6667; }
  draw();
}

/* ---------- 渲染（江南纸坊夜案；SPEC §6） ---------- */
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.lineTo(x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.closePath();
}
function drawBG(){
  var g = ctx.createLinearGradient(0, 0, 0, 780);

  ctx.fillRect(0, 0, 390, 780);

  var rg = ctx.createRadialGradient(195, 300, 20, 195, 300, 260);
  rg.addColorStop(0, 'rgba(240,220,170,0.07)');
  rg.addColorStop(1, 'rgba(240,220,170,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 64, 390, 560);
  /* 飘尘 */
  var i;
  ctx.fillStyle = 'rgba(216,205,184,0.35)';
  var dust = [[50, 120], [330, 90], [80, 470], [320, 430], [200, 70], [140, 540]];
  for (i = 0; i < dust.length; i++) {
    if (Math.floor(FR / 32) % dust.length !== i) continue;   /* v1.5：位移相位改除法 */
    var dy = (FR / 3 + i * 40) % 40;
    ctx.fillRect(dust[i][0], dust[i][1] - dy / 2, 2, 2);

}
function drawAnchor(){

  /* 花心纹 */
  ctx.strokeStyle = 'rgba(201,86,74,0.8)'; ctx.lineWidth = 1.5;
  var an = anchor();
  var lx = an[0] - S.ox, ly = an[1] - S.oy;
  if (lx >= 0 && lx < S.w && ly >= 0 && ly < S.h && S.ph === 'play' && !S.over) {
    /* 裎位在纸内：花心由纸层承载（drawPaper 画） */
  }
}
function drawPaper(){
  if (S.ph !== 'play') return;
  var g = geo(), L = curL(), i, x, y;
  var pw = S.w * g.cs, ph2 = S.h * g.cs;
  /* 纸底影 */
  ctx.fillStyle = 'rgba(10,8,14,0.45)';
  rrect(g.px + 5, g.py + 7, pw, ph2, 8); ctx.fill();
  for (y = 0; y < S.h; y++) {
    for (x = 0; x < S.w; x++) {
      var cx = g.px + x * g.cs, cy = g.py + y * g.cs;
      var stack = S.cells[y * S.w + x];
      var depth = popcnt(stack);
      /* 纸面（层深=叠影） */
      ctx.fillStyle = '#ece2c8';
      ctx.fillRect(cx + 1, cy + 1, g.cs - 2, g.cs - 2);
      if (depth > 1) {
        ctx.fillStyle = 'rgba(120,100,70,' + Math.min(0.35, 0.09 * depth) + ')';
        ctx.fillRect(cx + 1, cy + 1, g.cs - 2, g.cs - 2);
        /* 层深徽记 */
        ctx.fillStyle = '#8a7455';
        ctx.font = 'bold 10px "Microsoft YaHei",sans-serif';
        ctx.textAlign = 'right'; ctx.textBaseline = 'top';
        ctx.fillText(String(depth), cx + g.cs - 5, cy + 4);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
      ctx.strokeStyle = 'rgba(150,130,95,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(cx + 1, cy + 1, g.cs - 2, g.cs - 2);
      /* 标记层：蝶（marks[1..]）/花心（marks[0]） */
      var mc = g.cs / 2, ccx = cx + mc, ccy = cy + mc;
      var mk;
      for (mk = 0; mk < L.marks.length; mk++) {
        if ((stack & (1n << BigInt(L.marks[mk]))) === 0n) continue;
        if (mk === 0) {
          /* 花心=朱红小印 */
          ctx.fillStyle = '#c9564a';
          ctx.beginPath(); ctx.arc(ccx, ccy, g.cs * 0.22, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f2d8c0';
          ctx.beginPath(); ctx.arc(ccx, ccy, g.cs * 0.08, 0, Math.PI * 2); ctx.fill();
        } else {
          /* 墨蝶=双翅剪影（确定性微颤） */
          var flap = ((FR + mk * 13) % 24 < 12) ? 1 : 0.8;
          ctx.fillStyle = '#3a3244';
          ctx.beginPath();
          ctx.ellipse(ccx - g.cs * 0.11, ccy - 2, g.cs * 0.11 * flap, g.cs * 0.07, -0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(ccx + g.cs * 0.11, ccy - 2, g.cs * 0.11 * flap, g.cs * 0.07, 0.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(ccx - 1, ccy - 1, 2, 5);
        }
      }
    }
  }
  /* 折线（合法线虚线；焦点线亮） */
  if (!S.over) {
    var oo = legalOps(S.w, S.h);
    for (i = 0; i < oo.length; i++) {
      var op = oo[i];
      var hot = i === S.focusIdx;
      ctx.strokeStyle = hot ? '#e8b4a0' : 'rgba(154,122,181,0.55)';
      ctx.lineWidth = hot ? 2.5 : 1.5;
      ctx.setLineDash(hot ? [] : [5, 4]);
      ctx.beginPath();
      if (op[0] === 'V') {
        var vx = g.px + op[1] * g.cs;
        ctx.moveTo(vx, g.py - 5);
        ctx.lineTo(vx, g.py + ph2 + 5);
      } else {
        var hy = g.py + op[1] * g.cs;
        ctx.moveTo(g.px - 5, hy);
        ctx.lineTo(g.px + pw + 5, hy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    /* 焦点折向箭头（非等宽唯一向） */
    if (oo.length && S.focusIdx < oo.length) {
      var fop = oo[S.focusIdx];
      var ax = 0, ay2 = 0;
      if (fop[0] === 'V') { ax = g.px + fop[1] * g.cs; ay2 = g.py - 14; }
      else { ax = g.px - 16; ay2 = g.py + fop[1] * g.cs; }
      ctx.fillStyle = '#e8b4a0';
      ctx.beginPath();
      if (fop[2] === 'L') { ctx.moveTo(ax - 6, ay2 - 5); ctx.lineTo(ax + 5, ay2); ctx.lineTo(ax - 6, ay2 + 5); }
      else if (fop[2] === 'R') { ctx.moveTo(ax + 6, ay2 - 5); ctx.lineTo(ax - 5, ay2); ctx.lineTo(ax + 6, ay2 + 5); }
      else if (fop[2] === 'U') { ctx.moveTo(ax - 5, ay2 - 6); ctx.lineTo(ax, ay2 + 5); ctx.lineTo(ax + 5, ay2 - 6); }
      else { ctx.moveTo(ax - 5, ay2 + 6); ctx.lineTo(ax, ay2 - 5); ctx.lineTo(ax + 5, ay2 + 6); }
      ctx.closePath(); ctx.fill();
    }
  }
  /* 折后闪光 */
  if (S.fxT > 0) {
    ctx.strokeStyle = 'rgba(232,180,160,' + (0.5 * S.fxT / 18) + ')';
    ctx.lineWidth = 3;
    ctx.strokeRect(g.px - 4, g.py - 4, pw + 8, ph2 + 8);
  }
}

  ctx.clearRect(0, 0, 390, 780);
  drawBG();
  if (S.ph === 'play') {
    drawAnchor();
    drawPaper();
    drawPick();
    drawHud2();
  }
  drawWinFx();
  drawFlash();
}

/* ---------- 接线 ---------- */
function boot(){
  loadSave();
  document.getElementById('btnStart').addEventListener('click', function(){
    ensureAC();
    newGame(Math.min(S.unlocked, 24));
  });
  document.getElementById('btnLvs').addEventListener('click', function(){
    if (S.over === 1 && S.winT > 0) return;
    if (S.over === 2 && S.loseT > 0) return;
    home();
  });
  document.getElementById('btnUndo').addEventListener('click', function(){
    ensureAC();
    if (!undo()) { flash(S.hist.length === 0 ? '已在初始笺面' : '终局后不可撤销'); }
  });
  document.getElementById('btnRe').addEventListener('click', function(){
    if (S.over === 1 && S.winT > 0) return;
    if (S.over === 2 && S.loseT > 0) return;
    softReset();
  });
  document.getElementById('btnHelp').addEventListener('click', function(){
    flash('点折线翻折·←→选线 Enter 折·Backspace 撤销');
  });
  document.getElementById('btnMute').addEventListener('click', function(){
    S.mute = S.mute ? 0 : 1;
    this.textContent = S.mute ? '×' : '♪';
    saveMain();
    if (!S.mute) { ensureAC(); tone(440, 60, 0.06); }
  });
  document.getElementById('btnMute').textContent = S.mute ? '×' : '♪';
  document.getElementById('pNext').addEventListener('click', function(){
    if (S.lv < 24) newGame(S.lv + 1);
  });
  document.getElementById('pAgain').addEventListener('click', function(){ softReset(); });
  document.getElementById('pHome').addEventListener('click', function(){ home(); });
  document.getElementById('menu').addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  document.getElementById('panel').addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  cv.addEventListener('pointerdown', function(e){
    ensureAC();
    if (S.ph !== 'play') return;
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) * 390 / r.width;
    var y = (e.clientY - r.top) * 780 / r.height;
    handleTap(x, y);
  });
  document.addEventListener('keydown', function(e){
    ensureAC();
    keyAct(e.code);
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter', 'Backspace'].indexOf(e.code) >= 0) e.preventDefault();
  });
  home();
  requestAnimationFrame(mainLoop);
}
document.addEventListener('DOMContentLoaded', boot);


</script>
<script src="../shell.js" defer></script>
</body>
